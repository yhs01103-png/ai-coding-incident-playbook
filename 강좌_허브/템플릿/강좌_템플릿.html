<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 코딩 사고 플레이북</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📘%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* 기초 강좌(강좌_v2.html)·3월 교재와 같은 톤: 어두운 배경 + 보라/분홍/민트/주황 */
:root{
  --bg:#08080a;--panel:#111115;--soft:#18181f;--soft2:#1f1f28;--line:#2c2c3e;--line2:#3a3a52;
  --ink:#f2f2f8;--body:#dcdce8;--sub:#b4b4cc;--dim:#9a9ab8;
  --accent:#7c6cfc;--link:#b3a8ff;--accent-soft:rgba(124,108,252,.16);--code:#14141b;
  --problem:#fc6c8f;--problem-soft:rgba(252,108,143,.12);--solution:#6cfcb8;--solution-soft:rgba(108,252,184,.1);
  --case:#a99cff;--case-soft:rgba(124,108,252,.14);--checklist:#fcb86c;--checklist-soft:rgba(252,184,108,.12);
  --muted:#9a9ab8;--muted-soft:#1f1f28;--ok:#6cfcb8;--bad:#fc6c8f;
  --head:'Noto Sans KR','Malgun Gothic',sans-serif;--mono:'JetBrains Mono',Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.8 'Noto Sans KR','Malgun Gothic',system-ui,sans-serif;-webkit-font-smoothing:antialiased;word-break:keep-all}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse at 15% 10%,rgba(124,108,252,.13) 0%,transparent 45%),
             radial-gradient(ellipse at 85% 85%,rgba(252,108,143,.09) 0%,transparent 45%)}
header,main{position:relative;z-index:1}
a{color:var(--link);text-decoration:none}a:hover{text-decoration:underline}
/* 가독성: 본문은 한 줄 72자 안팎, 문단 색은 제목보다 한 단계 낮게, 강조는 더 밝게 */
.md{color:var(--body);max-width:76ch}.md b{color:#fff}.intro{max-width:76ch}
.md p,.md li{font-size:16px}.md li::marker{color:var(--dim)}
header{position:sticky;top:0;z-index:5;background:rgba(17,17,21,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line2)}
.bar{max-width:1280px;margin:0 auto;padding:14px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.brand{font-family:var(--head);font-weight:700;font-size:17px}
.brand small{display:block;font-family:'Noto Sans KR',sans-serif;font-weight:700;font-size:10px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--accent);margin-bottom:2px;order:-1}
.brand{display:flex;flex-direction:column}
nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav a{padding:7px 14px;border-radius:999px;color:var(--sub);font-weight:500;font-size:14px;border:1px solid transparent}
nav a.on{background:var(--accent-soft);color:var(--accent);border-color:rgba(124,108,252,.35)}
nav a:hover{text-decoration:none;color:var(--ink)}
main{max-width:1280px;margin:0 auto;padding:20px}
/* minmax(0,1fr): 본문의 긴 코드가 칸 폭을 밀어 화면이 옆으로 넘치지 않게 */
.layout{display:grid;grid-template-columns:320px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:minmax(0,1fr)}}
.side{position:sticky;top:76px;background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:14px;max-height:calc(100vh - 96px);display:flex;flex-direction:column}
@media (max-width:860px){.side{position:static;max-height:none}}
.side input,.side select{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;
  background:var(--soft);color:var(--ink);font:inherit;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--sub);border-radius:999px;
  padding:3px 10px;font-size:12px;cursor:pointer;font-weight:600}
.chip.on{background:var(--accent-soft);color:var(--accent);border-color:rgba(124,108,252,.45)}
.list{overflow:auto;margin:6px -6px 0;padding:0 6px}
.item{display:block;padding:9px 10px;border-radius:10px;color:var(--ink);font-size:14px;line-height:1.4}
.item:hover{background:var(--soft);text-decoration:none}.item.on{background:var(--accent-soft)}
.item .m{display:flex;gap:6px;margin-top:3px;font-size:11px;color:var(--sub)}
.count{font-size:12px;color:var(--sub);margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.side-head{padding:4px 4px 14px;margin-bottom:12px;border-bottom:1px solid var(--line2)}
.eyebrow{font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
.side-title{font-family:var(--head);font-size:17px;font-weight:700;color:var(--ink);margin-top:4px}
.side-desc{font-size:12.5px;color:var(--sub);line-height:1.6;margin-top:4px}
.flabel{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--dim);margin:10px 2px 6px}
.chips{margin-top:0!important}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px 30px}
@media (max-width:600px){.card{padding:18px}}
h1.t{font-family:var(--head);font-size:24px;line-height:1.4;margin:0 0 12px}
section.s>h2,.hero h2,.pc h3{font-family:var(--head)}
.card{box-shadow:0 1px 0 rgba(255,255,255,.02) inset}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:16px}
.tag{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--soft);color:var(--sub);font-weight:600}
.tag.warn{background:var(--problem-soft);color:var(--problem)}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:10px;padding:9px 16px;font:inherit;
  font-weight:700;font-size:14px;cursor:pointer;background:linear-gradient(135deg,#7c6cfc,#9a6cfc);color:#fff}
.btn:hover{text-decoration:none;filter:brightness(1.1)}
.btn.ghost{background:var(--soft);color:var(--ink)}.btn:disabled{opacity:.45;cursor:default}
.intro{color:var(--body);background:var(--soft);border-left:3px solid var(--accent);padding:12px 16px;border-radius:0 10px 10px 0;margin:6px 0 10px}
section.s{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
section.s>h2{font-size:19px;line-height:1.45;margin:0 0 10px;color:var(--ink);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
/* 절 종류 배지: 채운 색 + 어두운 글자로 대비를 크게 */
.k{font-size:12px;font-weight:800;padding:3px 9px;border-radius:6px;letter-spacing:.3px;color:#14121c}
.k.problem{background:var(--problem)}.k.solution{background:var(--solution)}
.k.case{background:var(--case)}.k.checklist{background:var(--checklist)}
.k.context,.k.related,.k.other{background:#3a3a52;color:#e4e4f0}
section.s{border-left:3px solid transparent;margin-left:-16px;padding-left:13px}
section.s:has(.k.problem){border-left-color:rgba(252,108,143,.55)}section.s:has(.k.solution){border-left-color:rgba(108,252,184,.5)}
section.s:has(.k.case){border-left-color:rgba(169,156,255,.55)}section.s:has(.k.checklist){border-left-color:rgba(252,184,108,.55)}
.md h3,.md h4{font-size:15px;margin:16px 0 6px}
.md p{margin:8px 0}.md ul,.md ol{margin:8px 0;padding-left:22px}.md li{margin:3px 0}
.md code{background:var(--soft2);color:#d6d0ff;padding:1px 6px;border-radius:5px;font:13px/1.5 var(--mono)}
.md pre{background:var(--code);border:1px solid var(--line);padding:14px 16px;border-radius:10px;overflow:auto;margin:10px 0}
.md pre code{color:var(--ink)}
.md pre code{background:none;padding:0;font-size:13px}
.md blockquote{margin:10px 0;padding:6px 14px;border-left:3px solid var(--accent);background:var(--soft);border-radius:0 8px 8px 0}
.md table{border-collapse:collapse;margin:10px 0;font-size:14px;display:block;overflow:auto}
.md th,.md td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.md th{background:var(--soft)}
.q{border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0;background:var(--panel)}
.q .qh{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--sub);font-weight:700;margin-bottom:6px}
.q .sit{font-weight:600;margin:0 0 12px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--soft);color:var(--ink);
  border-radius:10px;padding:10px 14px;margin:6px 0;font:inherit;font-size:14px;cursor:pointer}
.opt:hover{border-color:var(--accent)}.opt.ok{border-color:var(--ok);background:var(--solution-soft)}
.opt.bad{border-color:var(--bad);background:var(--problem-soft)}
.code{background:var(--code);border:1px solid var(--line);border-radius:10px;padding:8px 0;overflow:auto;font:13px/1.6 var(--mono)}
.ln{display:flex;cursor:pointer;padding:0 14px;white-space:pre}.ln:hover{background:var(--accent-soft)}
.ln i{font-style:normal;color:var(--sub);width:28px;flex:none;user-select:none}
.ln.pick{background:var(--accent-soft);box-shadow:inset 3px 0 var(--accent)}
.ln.ok{background:var(--solution-soft);box-shadow:inset 3px 0 var(--ok)}.ln.bad{background:var(--problem-soft);box-shadow:inset 3px 0 var(--bad)}
textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--soft);
  color:var(--ink);font:inherit;font-size:14px;resize:vertical}
.rub label{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:14px;cursor:pointer}
.exp{margin-top:12px;padding:12px 14px;border-radius:10px;background:var(--soft);font-size:14px}
.exp b.ok{color:var(--ok)}.exp b.bad{color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.pc h3{margin:0 0 4px;font-size:17px}.pc .n{color:var(--sub);font-size:13px;margin-bottom:10px}
.pc ul{margin:0;padding-left:18px;font-size:14px}.pc li{margin:3px 0}
.bars{display:flex;height:6px;border-radius:99px;overflow:hidden;background:var(--soft);margin:8px 0 12px}
.bars span{display:block}
.empty{color:var(--sub);text-align:center;padding:60px 20px}
/* 프로젝트 */
.tag.ghost{background:transparent;border:1px solid var(--line2);color:var(--dim)}
.method summary{cursor:pointer;list-style:none;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.method summary::-webkit-details-marker{display:none}.method summary b{font-family:var(--head);font-size:16px}
.method .more{margin-left:auto;font-size:12px;color:var(--link)}.method[open] .more{display:none}
.method .md{margin-top:14px}.method{margin-bottom:18px}
.pfilter{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;margin:0 0 16px}
.pfilter .flabel{margin:0}.pfilter .chips{margin:0 14px 0 0}
.pcard{display:flex;flex-direction:column;color:var(--ink);transition:border-color .15s,transform .15s}
.pcard:hover{text-decoration:none;border-color:rgba(124,108,252,.6);transform:translateY(-2px)}
.pg{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--sub);font-weight:600}
.pg.big{font-size:14px;margin-bottom:6px}.stars{color:var(--checklist);letter-spacing:2px;font-size:14px}
.pc .sum{color:var(--body);font-size:14px;line-height:1.7;margin:4px 0 12px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.stack{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.pfoot{margin-top:auto;display:flex;gap:14px;font-size:12px;color:var(--sub);border-top:1px solid var(--line);padding-top:10px}
.pfoot b{color:var(--ink);font-size:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0}@media (max-width:760px){.two{grid-template-columns:1fr}}
.box{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.box ul{margin:8px 0 0;padding-left:18px;color:var(--body);font-size:14.5px}.box li{margin:5px 0}
section.s.plain{border-left:0;margin-left:0;padding-left:0}
.hint{font-family:'Noto Sans KR',sans-serif;font-size:12px;font-weight:500;color:var(--dim)}
.tl{list-style:none;margin:6px 0 0;padding:0 0 0 18px;border-left:2px solid var(--line2)}
.tl li{position:relative;margin:0 0 18px;padding-left:6px}
.tl li::before{content:'';position:absolute;left:-25px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--bg)}
.tlh{display:flex;gap:8px;align-items:center}.ref{font:700 12px var(--mono);color:var(--accent);background:var(--accent-soft);padding:1px 8px;border-radius:6px}
.date{font-size:12px;color:var(--dim)}.tlt{font-weight:700;font-size:16px;margin:4px 0 6px;color:var(--ink)}
.tlr{color:var(--body);font-size:14.5px;margin:3px 0}.tlr .lbl{display:inline-block;min-width:58px;font-size:12px;font-weight:700;color:var(--dim)}
.rev{font-size:12px;font-weight:700;color:var(--checklist);border:1px solid currentColor;padding:0 7px;border-radius:6px}
.tld{margin:8px 0 2px;border:1px solid var(--line2);border-radius:10px;padding:2px 12px;background:var(--soft)}
.tld summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--accent);padding:6px 0}
.tld ul{margin:2px 0 6px;padding-left:18px}.tld li{margin:2px 0;padding:0}.tld li::before{display:none}
.rl{margin:6px 0;padding-left:18px}.rl li{margin:6px 0}.rl .tag{margin-left:4px}.rl .fold{display:none}
.hero{margin-bottom:18px}.hero h2{margin:0;font-size:22px}.hero p{margin:4px 0 0;color:var(--sub)}
.prog{font-size:12px;color:var(--sub)}
/* 가독성 2차: 한 줄을 짧게, 줄·문단 간격 넓게, 절 사이 여백 크게 */
.md{max-width:68ch;line-height:1.9}.intro{max-width:68ch}
.md p{margin:12px 0}.md li{margin:7px 0}.md ul,.md ol{margin:12px 0}
section.s{margin-top:30px;padding-top:24px}
section.s>h2{font-size:20px;margin-bottom:14px}
h1.t{font-size:27px;margin-bottom:4px}
.full{color:var(--dim);font-size:14px;line-height:1.6;margin:0 0 14px;max-width:80ch}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}
.toc a{font-size:12.5px;padding:4px 10px;border-radius:8px;background:var(--soft);color:var(--sub);border:1px solid var(--line)}
.toc a:hover{color:var(--ink);border-color:var(--line2);text-decoration:none}
.toc a i{font-style:normal;display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
/* 목록: 짧은 제목 한 줄 + 회색 메타 한 줄, 항목 사이 구분선 */
.item{padding:10px 10px;border-bottom:1px solid var(--line);border-radius:0;font-size:14.5px;font-weight:600}
.item.on{border-radius:10px;border-bottom-color:transparent}
.item .m{font-weight:500;font-size:11.5px;color:var(--dim);flex-wrap:wrap}
.item .m span+span::before{content:"·";margin-right:6px;color:var(--line2)}
a.tag{color:var(--sub)}a.tag:hover{color:var(--ink);text-decoration:none;background:var(--soft2)}
/* 용어: 본문 첫 등장에 점선 밑줄, 올리면 뜻 */
.term{color:inherit;border-bottom:1.5px dotted var(--link);position:relative;cursor:help}
.term:hover{text-decoration:none;color:var(--link)}
.term:hover::after,.term.tip::after{content:attr(data-tip);position:absolute;left:0;top:calc(100% + 6px);z-index:9;width:max-content;max-width:320px;
  background:#22222e;color:var(--ink);border:1px solid var(--line2);border-radius:8px;padding:8px 12px;font-size:13px;line-height:1.6;
  font-weight:500;white-space:normal;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.tc h3{margin:0;font-size:18px;font-family:var(--head)}.tc .ts{color:var(--link);font-weight:600;margin:6px 0 8px;font-size:14.5px}
.tc p{color:var(--body);font-size:14.5px;margin:0 0 10px}.tc .al{font-size:12px;color:var(--dim)}
.tc.hit{border-color:var(--accent);box-shadow:0 0 0 2px rgba(124,108,252,.35)}
.tc ul{margin:6px 0 0;padding-left:18px;font-size:13.5px}
/* 1단계 점검: 찾기 패널은 넓은 화면에선 늘 펼침, 좁은 화면에선 접어서 본문이 먼저 보이게 */
.finder{display:flex;flex-direction:column;min-height:0;flex:1}
.ftoggle{display:none}
@media (max-width:860px){
  .ftoggle{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:none;color:var(--ink);
    font:inherit;font-weight:700;font-size:15px;padding:2px;cursor:pointer}
  .ftoggle .fa{font-size:12px;font-weight:600;color:var(--link)}
  .finder.closed>:not(.ftoggle){display:none}
  .finder:not(.closed)>.ftoggle{margin-bottom:6px}
  .side .side-head{display:none}
  .list{max-height:60vh}
}
/* 공백 없는 긴 글자(경로·식별자·URL)가 좁은 화면 밖으로 밀려나지 않게 — 줄 안에 들어갈 수 없을 때만 끊긴다 */
main{overflow-wrap:anywhere}
[hidden]{display:none!important}
/* 2단계: 칩은 버튼(키보드로 고를 수 있게), 포커스 테두리 */
button.chip{font-family:inherit;line-height:1.6}
.chip:focus-visible,.ln:focus-visible,.opt:focus-visible,.btn:focus-visible,.ftoggle:focus-visible{outline:2px solid var(--link);outline-offset:2px}
/* 휴대폰: 용어 뜻은 화면 아래에 고정된 띠로(단어 위치에 따라 화면 밖으로 나가지 않게) */
@media (hover:none){.term.tip::after{position:fixed;left:16px;right:16px;bottom:16px;top:auto;width:auto;max-width:none}}
/* 퀴즈 점수 요약·끝 버튼 */
.qsum{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;font-size:13px;color:var(--sub);margin:0 0 6px}
.qsum .bars{flex:1 0 100%;margin:4px 0 6px}.qsum b{color:var(--ink)}
.qend{justify-content:space-between;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
/* 용어 검색·분야 묶음 */
.tbar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin:0 0 18px}
.tbar input{flex:1 1 260px;max-width:420px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--soft);color:var(--ink);font:inherit;font-size:14px}
.tbar .chips{margin:0}
.tgroup{margin-bottom:26px}.tgh{font-size:16px;color:var(--sub);margin:0 0 10px;font-weight:700}
.rhead{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.rhead h1.t{flex:1 1 320px}
.rhead .btn{flex:none;margin-top:4px}
.meta.p{margin-bottom:6px}
.meta .ml{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--dim);margin-right:2px}
</style>
</head>
<body>
<header><div class="bar">
  <div class="brand"><small>Incident → Rule → Code → Effect</small>AI 코딩 사고 플레이북</div>
  <nav id="nav">
    <a href="#rules" data-v="rules">규칙</a>
    <a href="#quiz" data-v="quiz">퀴즈</a>
    <a href="#projects" data-v="projects">프로젝트</a>
    <a href="#decisions" data-v="decisions">결정</a>
    <a href="#terms" data-v="terms">용어</a>
    <a id="course" href="#" target="_blank" rel="noopener" hidden>기초 강좌 ↗</a>
  </nav>
</div></header>
<main id="app"></main>
<script>
const DATA = /*__DATA__*/;
const KIND = {problem:"문제",solution:"해법",case:"사례",checklist:"점검",context:"언제",related:"함께 볼 것",other:"기타"};
const KIND_COLOR = {problem:"var(--problem)",solution:"var(--solution)",case:"var(--case)",checklist:"var(--checklist)"};
const byId = Object.fromEntries(DATA.rules.map(r => [r.id, r]));
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const state = {q:"", kind:"", project:"", tag:"", qf:""};
const short = r => r.short || r.title;
const enc = encodeURIComponent;

// ---------- 진도 저장 (브라우저에만, 실패해도 화면은 동작) ----------
function loadProg(){ try { return JSON.parse(localStorage.getItem("playbook-progress") || "{}"); } catch { return {}; } }
function saveProg(p){ try { localStorage.setItem("playbook-progress", JSON.stringify(p)); } catch {} }
let PROG = loadProg();
function mark(ruleId, qid, val){ (PROG[ruleId] ||= {})[qid] = val; saveProg(PROG); }

// ---------- 마크다운 (본문을 먼저 이스케이프한 뒤 최소 문법만) ----------
function inline(s){
  const codes = [];
  s = esc(s).replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return "\u0000" + (codes.length - 1) + "\u0000"; });
  s = s.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
       .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/\u0000(\d+)\u0000/g, (_, i) => {
    const c = codes[+i], id = c.replace(/^.*[\/\\]/, "").replace(/\.md$/, "");
    return byId[id] && id !== c ? `<a href="#rule/${encodeURIComponent(id)}"><code>${c}</code></a>` : `<code>${c}</code>`;
  });
  return s.replace(/([^\s<>`"/\\(]+)\.md\b/g, (m, id) => byId[id] ? `<a href="#rule/${encodeURIComponent(id)}">${m}</a>` : m);
}
function md(src){
  const L = String(src || "").replace(/\r/g, "").split("\n"); let out = "", i = 0;
  while (i < L.length){
    const l = L[i];
    if (/^\s*```/.test(l)){ const b = []; i++; while (i < L.length && !/^\s*```/.test(L[i])) b.push(L[i++]); i++;
      out += `<pre><code>${esc(b.join("\n"))}</code></pre>`; continue; }
    if (/^\s*\|/.test(l)){ const rows = []; while (i < L.length && /^\s*\|/.test(L[i])) rows.push(L[i++]);
      const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      const body = rows.filter(r => !/^\s*\|[\s:|-]+\|\s*$/.test(r));
      out += "<table>" + body.map((r, n) => "<tr>" + cells(r).map(c => n ? `<td>${inline(c)}</td>` : `<th>${inline(c)}</th>`).join("") + "</tr>").join("") + "</table>"; continue; }
    let h = l.match(/^(#{3,6})\s+(.*)/); if (h){ out += `<h${Math.min(h[1].length, 4)}>${inline(h[2])}</h${Math.min(h[1].length, 4)}>`; i++; continue; }
    if (/^\s*>/.test(l)){ const b = []; while (i < L.length && /^\s*>/.test(L[i])) b.push(L[i++].replace(/^\s*>\s?/, ""));
      out += `<blockquote>${inline(b.join(" "))}</blockquote>`; continue; }
    if (/^\s*([-*]|\d+\.)\s+/.test(l)){ const ord = /^\s*\d+\./.test(l); const items = [];
      while (i < L.length && (/^\s*([-*]|\d+\.)\s+/.test(L[i]) || (/^\s{2,}\S/.test(L[i]) && items.length))){
        if (/^\s*([-*]|\d+\.)\s+/.test(L[i])) items.push(L[i].replace(/^\s*([-*]|\d+\.)\s+/, "")); else items[items.length - 1] += " " + L[i].trim(); i++; }
      out += (ord ? "<ol>" : "<ul>") + items.map(t => `<li>${inline(t)}</li>`).join("") + (ord ? "</ol>" : "</ul>"); continue; }
    if (!l.trim()){ i++; continue; }
    const p = []; while (i < L.length && L[i].trim() && !/^\s*(```|\||#{3,}|>|[-*]\s|\d+\.\s)/.test(L[i])) p.push(L[i++]);
    if (!p.length) p.push(L[i++]);
    out += `<p>${inline(p.join(" "))}</p>`;
  }
  return out;
}

// ---------- 화면 ----------
function nav(v){ document.querySelectorAll("#nav a[data-v]").forEach(a => a.classList.toggle("on", a.dataset.v === v)); }
function quizState(id){ const qs = (DATA.quizzes[id] || {}).questions || []; const p = PROG[id] || {};
  const ok = qs.filter(q => p[q.id] === "ok").length, no = qs.filter(q => p[q.id] === "no").length;
  return {ok, no, n: qs.length, left: qs.length - ok - no}; }
function quizDone(id){ const s = quizState(id); return [s.ok, s.n]; }
// 퀴즈 화면 필터: 안 푼 문제가 있음 / 틀린 문제가 있음 / 다 맞힘
const QF = {"": "전체", todo: "안 푼 문제", wrong: "틀린 문제", done: "다 맞힘"};
const qfPass = id => { const s = quizState(id);
  return !state.qf || (state.qf === "todo" ? s.left > 0 : state.qf === "wrong" ? s.no > 0 : s.ok === s.n); };
function filtered(mode){
  const q = state.q.trim().toLowerCase();
  return DATA.rules.filter(r => (!q || (short(r) + " " + r.title + " " + r.id + " " + r.intro).toLowerCase().includes(q))
    && (mode === "quiz" ? DATA.quizzes[r.id] && qfPass(r.id) : !state.kind || r.sections.some(s => s.kind === state.kind))
    && (!state.project || r.projects.includes(state.project))
    && (!state.tag || (r.tags || []).includes(state.tag)))
    .sort((a, b) => short(a).localeCompare(short(b), "ko"));
}
// 좁은 화면에서 찾기 패널을 사용자가 직접 펼치거나 접었으면 그 상태를 화면을 옮겨도 유지한다(null = 아직 안 건드림).
let finderOpen = null, sideCtx = {cur: "", mode: "rules"};
const filtering = () => !!(state.q || state.kind || state.project || state.tag || state.qf);
function listItems(cur, mode){
  const rows = filtered(mode);
  return [rows.length, rows.map(r => { const [d, n] = quizDone(r.id); return `<a class="item ${r.id === cur ? "on" : ""}"
      href="#${mode === "quiz" ? "quiz" : "rule"}/${enc(r.id)}" title="${esc(r.title)}">${esc(short(r))}
      <div class="m">${(r.tags || []).slice(0, 2).map(t => `<span>${esc(t)}</span>`).join("")}${n ? `<span>퀴즈 ${d}/${n}</span>` : ""}${r.public ? "" : "<span>비공개</span>"}</div></a>`; }).join("")];
}
function sidebar(cur, mode){

  const projects = [...new Set(DATA.rules.flatMap(r => r.projects))].sort();
  const tags = [...new Set(DATA.rules.flatMap(r => r.tags || []))].sort((a, b) => a.localeCompare(b, "ko"));
  const [count, items] = listItems(cur, mode);

  const allQ = DATA.rules.filter(r => DATA.quizzes[r.id]), mastered = allQ.filter(r => { const s = quizState(r.id); return s.ok === s.n; }).length;
  const head = mode === "quiz"
    ? ["QUIZ · 문제 풀기", "규칙별 퀴즈", `다 맞힌 규칙 <b>${mastered}</b> / ${allQ.length}개 · 기록은 이 브라우저에만 저장돼요.`]
    : ["RULES · 규칙 찾기", "범용 규칙 목록", "검색하거나 기술 태그·절 종류·프로젝트로 좁혀요."];
  return `<aside class="side">
    <div class="side-head"><div class="eyebrow">${head[0]}</div><div class="side-title">${head[1]}</div>
      <div class="side-desc">${head[2]}</div></div>
    <div class="finder ${open ? "" : "closed"}">
    <button class="ftoggle" type="button" aria-expanded="${open}"><span>${mode === "quiz" ? "퀴즈 고르기" : "규칙 찾기"} · <b class="fcount">${count}</b>개</span><span class="fa">${open ? "접기 ▴" : "펼치기 ▾"}</span></button>
    <label class="flabel" for="q">검색</label>
    <input id="q" placeholder="예: 게이트, Hive, 동시 요청" value="${esc(state.q)}">
    <label class="flabel" for="tagsel">기술 태그</label>
    <select id="tagsel"><option value="">모든 태그</option>${tags.map(t =>
      `<option ${state.tag === t ? "selected" : ""}>${esc(t)}</option>`).join("")}</select>
    ${mode === "quiz" ? `<div class="flabel">푼 상태</div>
    <div class="chips">${Object.entries(QF).map(([k, v]) =>
      `<button type="button" class="chip ${(state.qf || "") === k ? "on" : ""}" data-qf="${k}" aria-pressed="${(state.qf || "") === k}">${v}</button>`).join("")}</div>`
    : `<div class="flabel">절 종류</div>
    <div class="chips">${["", "problem", "solution", "case", "checklist"].map(k =>
      `<button type="button" class="chip ${state.kind === k ? "on" : ""}" data-k="${k}" aria-pressed="${state.kind === k}">${k ? KIND[k] + " 있음" : "전체"}</button>`).join("")}</div>`}
    <label class="flabel" for="proj">프로젝트</label>
    <select id="proj"><option value="">모든 프로젝트</option>${projects.map(p =>
      `<option ${state.project === p ? "selected" : ""}>${esc(p)}</option>`).join("")}</select>
    <div class="count"><span class="fcount">${count}</span>개</div>
    <div class="list">${items}</div>

  </aside>`;

function bindSide(){
  // 검색은 글자마다 화면 전체가 아니라 목록만 다시 그린다(본문 변환·용어 표시를 매번 다시 돌리지 않게).
  $("#q").oninput = e => { state.q = e.target.value;
    const [count, items] = listItems(sideCtx.cur, sideCtx.mode);
    $(".list").innerHTML = items; document.querySelectorAll(".fcount").forEach(x => x.textContent = count); };
  const f = $(".finder"), t = $(".ftoggle");
  t.onclick = () => { const open = f.classList.toggle("closed") === false; finderOpen = open;
    t.setAttribute("aria-expanded", open); t.querySelector(".fa").textContent = open ? "접기 ▴" : "펼치기 ▾"; };
  document.querySelectorAll(".side .chip").forEach(c => c.onclick = () => {
    if (c.dataset.qf !== undefined) state.qf = c.dataset.qf; else state.kind = c.dataset.k; route(); });
  $("#proj").onchange = e => { state.project = e.target.value; route(); };
  $("#tagsel").onchange = e => { state.tag = e.target.value; route(); };
}
// ---------- 용어: 본문에서 처음 나오는 곳에 점선 밑줄 + 뜻 ----------
const TERMS = DATA.terms || [];
const termById = Object.fromEntries(TERMS.map(t => [t.id, t]));
const TERM_WORDS = TERMS.flatMap(t => [t.term, ...t.aliases].map(w => [w, t])).sort((a, b) => b[0].length - a[0].length);
function glossify(root){
  const used = new Set(), skip = "code,pre,a,h1,h2,h3,button,textarea,.term";
  for (const [word, t] of TERM_WORDS){
    if (used.has(t.id)) continue;
    const ascii = /^[\x00-\x7f]+$/.test(word), lw = word.toLowerCase();
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {acceptNode: n =>
      n.parentElement.closest(skip) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT});
    let node;
    while ((node = walker.nextNode())){
      const text = ascii ? node.data.toLowerCase() : node.data;
      let i = text.indexOf(ascii ? lw : word);
      // 영문 용어는 단어 경계에서만(BOM이 BOMB 안에서 잡히지 않게)
      while (i >= 0 && ascii && (/\w/.test(text[i - 1] || "") || /\w/.test(text[i + word.length] || ""))) i = text.indexOf(lw, i + 1);
      if (i < 0) continue;
      const mid = node.splitText(i); mid.splitText(word.length);
      const a = document.createElement("a");
      a.className = "term"; a.href = "#term/" + enc(t.id); a.dataset.tip = `${t.term} — ${t.short}`;
      mid.replaceWith(a); a.appendChild(mid); used.add(t.id); break;
    }
  }
}
// 마우스가 없는 기기: 첫 번째 누름은 뜻만 보여 주고, 같은 단어를 한 번 더 누르면 용어 페이지로 간다.
document.addEventListener("click", e => {
  const a = e.target.closest && e.target.closest("a.term");
  document.querySelectorAll("a.term.tip").forEach(x => { if (x !== a) x.classList.remove("tip"); });
  if (!a || !matchMedia("(hover: none)").matches) return;
  if (!a.classList.contains("tip")){ e.preventDefault(); a.classList.add("tip"); }
});
function termsView(id){

  $("#app").innerHTML = `<div class="hero"><div class="eyebrow">GLOSSARY · 단어 뜻</div><h2>용어 모음</h2>

    ${TERMS.length ? `<div class="tbar"><input id="tq" placeholder="용어·다른 이름·뜻으로 찾기" aria-label="용어 검색">
      <div class="chips">${["", ...cats].map(c => `<button type="button" class="chip ${c ? "" : "on"}" data-tc="${esc(c)}" aria-pressed="${!c}">${c ? esc(c) : "전체"}</button>`).join("")}</div>
      <span class="prog" id="tn"></span></div>` : ""}
    ${cats.map(c => `<section class="tgroup" data-cat="${esc(c)}"><h2 class="tgh">${esc(c)}</h2><div class="tgrid">${sorted.filter(t => t.category === c).map(card).join("")}</div></section>`).join("")

    document.querySelectorAll(".tgroup").forEach(g => { let n = 0;

        el.hidden = !ok; n += ok; });
      g.hidden = !n; shown += n; });
    $("#tn").textContent = `${shown}개`; $("#tnone").hidden = shown > 0; };
  if ($("#tq")){ $("#tq").oninput = apply;
    document.querySelectorAll(".tbar .chip").forEach(c => c.onclick = () => { cat = c.dataset.tc;
      document.querySelectorAll(".tbar .chip").forEach(x => { x.classList.toggle("on", x === c); x.setAttribute("aria-pressed", x === c); }); apply(); });
    apply(); }
  const hit = id && document.getElementById("t-" + id);
  if (hit) hit.scrollIntoView({block: "center"}); else window.scrollTo(0, 0);
}
function tocLabel(h, max = 22){
  const s = h.replace(/\*\*/g, "").replace(/^\d+(-\d+)?\.\s*/, "").split(" — ")[0].trim();
  if (s.length <= max) return s;
  const cut = s.lastIndexOf(" ", max);
  return (cut > max / 2 ? s.slice(0, cut) : s.slice(0, max)).replace(/[\s,·(]+$/, "") + "…";
}

function question(r, q, n){
  const done = (PROG[r.id] || {})[q.id];
  const head = `<div class="qh">Q${n + 1} · ${{choice: "보기 고르기", spot: "틀린 줄 찾기", scenario: "서술 · 기준표 자기 채점"}[q.type]}
    ${done === "ok" ? "· ✓ 맞힘" : done === "no" ? "· 다시 풀어 보기" : ""}</div><p class="sit">${inline(q.situation)}</p>`;
  if (q.type === "choice") return `<div class="q" data-q="${q.id}">${head}${q.options.map((o, i) =>
    `<button class="opt" data-i="${i}">${inline(o)}</button>`).join("")}<div class="out"></div></div>`;
  if (q.type === "spot") return `<div class="q" data-q="${q.id}">${head}<div class="code">${q.code.split("\n").map((l, i) =>
    `<div class="ln" data-l="${i + 1}" tabindex="0" role="button" aria-pressed="false"><i>${i + 1}</i>${esc(l) || " "}</div>`).join("")}</div>
    <div class="row"><button class="btn chk">고른 줄 확인</button><span class="prog">줄을 눌러 고르세요</span></div><div class="out"></div></div>`;
  return `<div class="q" data-q="${q.id}">${head}<textarea placeholder="먼저 직접 답을 적어 보세요"></textarea>
    <div class="row"><button class="btn show">기준표 보기</button></div><div class="out"></div></div>`;
}

      <a class="btn" id="nextq" href="#quiz">다음 퀴즈 →</a></div></article></div>`;
  bindSide();
  // 점수 요약 + 왼쪽 목록의 "퀴즈 n/m"을 답할 때마다 갱신(화면 전체는 다시 그리지 않는다)
  const paint = () => { const s = quizState(r.id);
    $("#qsum").innerHTML = `<div class="bars"><span style="width:${s.ok / s.n * 100}%;background:var(--ok)"></span><span style="width:${s.no / s.n * 100}%;background:var(--bad)"></span></div>
      <span>맞힘 <b>${s.ok}</b></span><span>틀림 <b>${s.no}</b></span><span>남음 <b>${s.left}</b></span><span>/ ${s.n}문제</span>`;
    $(".list").innerHTML = listItems(r.id, "quiz")[1]; };
  const answer = (qid, val) => { mark(r.id, qid, val); paint(); };
  const order = filtered("quiz"), at = order.findIndex(x => x.id === r.id), nx = order[(at + 1) % order.length];
  if (nx && nx.id !== r.id) $("#nextq").href = "#quiz/" + enc(nx.id); else $("#nextq").remove();
  $("#retry").onclick = () => { delete PROG[r.id]; saveProg(PROG); quizView(r.id); };
  paint();
  qs.forEach(q => {
    const box = document.querySelector(`.q[data-q="${q.id}"]`), out = box.querySelector(".out");
    const explain = ok => `<div class="exp">${ok === null ? "" : ok ? '<b class="ok">맞았습니다.</b> ' : '<b class="bad">아닙니다.</b> '}${inline(q.explain)}
      ${q.section ? `<div class="prog" style="margin-top:6px">근거: ${inline(q.section)}</div>` : ""}</div>`;
    if (q.type === "choice") box.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      const ok = +b.dataset.i === q.answer;
      box.querySelectorAll(".opt").forEach(x => x.classList.remove("ok", "bad"));
      b.classList.add(ok ? "ok" : "bad"); if (!ok) box.querySelector(`.opt[data-i="${q.answer}"]`).classList.add("ok");
      out.innerHTML = explain(ok); answer(q.id, ok ? "ok" : "no");
    });
    if (q.type === "spot"){
      box.querySelectorAll(".ln").forEach(l => {
        l.onclick = () => l.setAttribute("aria-pressed", l.classList.toggle("pick"));
        l.onkeydown = e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); l.click(); } }; });
      box.querySelector(".chk").onclick = () => {
        const picked = [...box.querySelectorAll(".ln.pick")].map(l => +l.dataset.l).sort((a, b) => a - b);
        const ans = [...q.answer_lines].sort((a, b) => a - b), ok = JSON.stringify(picked) === JSON.stringify(ans);
        box.querySelectorAll(".ln").forEach(l => { l.classList.remove("ok", "bad");
          if (ans.includes(+l.dataset.l)) l.classList.add("ok"); else if (l.classList.contains("pick")) l.classList.add("bad"); });
        out.innerHTML = explain(ok); answer(q.id, ok ? "ok" : "no");
      };
    }
    if (q.type === "scenario") box.querySelector(".show").onclick = () => {
      out.innerHTML = `<div class="exp rub"><b>내 답이 이 기준을 채웠나요?</b>${q.rubric.map((c, i) =>
        `<label><input type="checkbox" data-i="${i}"> ${inline(c)}</label>`).join("")}<div class="tail"></div></div>`;
      const boxes = out.querySelectorAll("input"), tail = out.querySelector(".tail");
      const upd = () => { const n = [...boxes].filter(b => b.checked).length; const ok = n === boxes.length;
        tail.innerHTML = `<div class="prog" style="margin:8px 0">${n}/${boxes.length} 충족</div>${inline(q.explain)}`;
        answer(q.id, ok ? "ok" : "no"); };
      boxes.forEach(b => b.onchange = upd); upd();
    };
  });
  window.scrollTo(0, 0);
}
// ---------- 프로젝트 (강좌_v2 "만들어본 것들"과 같은 등급제) ----------
const GRADE = {1: "입문", 2: "초중급", 3: "중급", 4: "고급", 5: "운영 설계"};
const stars = g => "★".repeat(g) + "☆".repeat(5 - g);
const GRADE_WHY = [
  "흐름 하나(A → B)에 기억할 상태가 없다. 실패해도 다시 돌리면 끝난다.",
  "조건 분기와 자기 상태(설정·이력, 중복 실행 방지)가 생긴다. 상태를 기억하는 순간 꼬일 곳이 생긴다.",
  "독립된 부분 둘 이상(워커·스케줄·스레드·다른 앱 조작)이 협력하고 사람 없이 돈다. 경계와 안전장치를 설계해야 한다.",
  "클라이언트·서버·워커·저장까지 전체 시스템에 동시성과 테스트 체계가 붙는다. 한 곳을 고치면 다른 진입점이 흔들린다.",
  "고급에 더해 배포 · 클라이언트 2종 이상이 같은 서버 규칙 공유 · 돈과 한도 · 인증과 개인정보 · 되돌리기 어려운 변경(DB 이전·롤아웃) 중 셋 이상을 설계로 다룬다. 틀리면 남의 데이터나 돈이 상한다."
];
const projById = Object.fromEntries((DATA.projects || []).map(p => [p.id, p]));
const pstate = {cat: "", grade: 0};
const ruleLink = id => byId[id] ? `<a href="#rule/${enc(id)}" title="${esc(byId[id].title)}">${esc(short(byId[id]))}</a>` : "";
function projectsView(cat){
  nav("projects");
  if (cat !== undefined) pstate.cat = cat;
  const P = DATA.projects || [];
  // 카테고리는 "AI 응용 · 서버"처럼 두 단계 — 필터는 앞 단계(큰 묶음)로만 고른다.
  const group = c => c.split(" · ")[0];
  const cats = [...new Set(P.map(p => group(p.category)))].sort();
  const shown = P.filter(p => (!pstate.cat || group(p.category) === pstate.cat) && (!pstate.grade || p.grade === pstate.grade))
    .sort((a, b) => b.grade - a.grade || a.name.localeCompare(b.name));
  const carded = new Set(P.map(p => p.id));
  const others = {}; DATA.rules.forEach(r => r.projects.forEach(p => { if (!carded.has(p)) (others[p] ||= []).push(r); }));
  $("#app").innerHTML = `<div class="hero"><div class="eyebrow">PROJECTS · 만들어본 것들</div><h2>프로젝트와 설계 판단</h2>
      <p>카테고리와 설계 난이도로 좁히고, 카드를 누르면 전환점(큰 결정)과 이 프로젝트에 걸리는 규칙을 볼 수 있어요.</p></div>
    ${DATA.method ? `<details class="card method"><summary><span class="eyebrow">HOW · 결정 기록 방식</span>
      <b>모든 결정은 D·H·P·O 번호로 남깁니다</b><span class="more">펼치기</span></summary><div class="md">${md(DATA.method)}</div></details>` : ""}
    <div class="pfilter"><span class="flabel">카테고리</span><div class="chips">${["", ...cats].map(c =>
      `<button type="button" class="chip ${pstate.cat === c ? "on" : ""}" data-c="${esc(c)}" aria-pressed="${pstate.cat === c}">${c ? esc(c) : "전체"}</button>`).join("")}</div>
      <span class="flabel">설계 난이도</span><div class="chips">${[0, 1, 2, 3, 4, 5].map(g =>
      `<button type="button" class="chip ${pstate.grade === g ? "on" : ""}" data-g="${g}" aria-pressed="${pstate.grade === g}">${g ? stars(g) + " " + GRADE[g] : "전체"}</button>`).join("")}</div></div>
    <details class="card method"><summary><span class="eyebrow">HOW · 설계 난이도 기준</span>
      <b>줄 수나 기술 이름이 아니라, 설계할 때 동시에 다뤄야 하는 것으로 잽니다</b><span class="more">펼치기</span></summary>
      <ol class="md glv">${GRADE_WHY.map((w, i) => `<li><b>${stars(i + 1)} ${GRADE[i + 1]}</b> — ${w}</li>`).join("")}</ol></details>
    <div class="grid">${shown.map(p => `<a class="card pc pcard" href="#project/${encodeURIComponent(p.id)}">
      <div class="pg"><span class="stars">${stars(p.grade)}</span><span>${GRADE[p.grade]}</span>${p.public ? "" : `<span class="tag warn">비공개</span>`}</div>
      <h3>${esc(p.name)}</h3><div class="n">${esc(p.category)} · ${esc(p.status)}</div>
      <p class="sum">${esc(p.summary)}</p>
      <div class="stack">${p.stack.slice(0, 6).map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
      <div class="pfoot"><span><b>${p.milestones.length}</b> 전환점</span><span><b>${p.rules_real.length}</b> 실측 규칙</span>
        <span><b>${p.rules_applicable.length}</b> 적용 가능</span></div></a>`).join("") || `<div class="empty">조건에 맞는 프로젝트가 없어요.</div>`}</div>
    ${Object.keys(others).length ? `<div class="hero" style="margin-top:28px"><div class="eyebrow">ALSO · 카드 준비 중</div>
      <h2 style="font-size:18px">규칙에만 등장하는 프로젝트</h2></div><div class="grid">${Object.keys(others).sort().map(p =>
      `<div class="card pc"><h3>${esc(p)}</h3><div class="n">실측 규칙 ${others[p].length}개</div>
      <ul>${others[p].map(r => `<li>${ruleLink(r.id)}</li>`).join("")}</ul></div>`).join("")}</div>` : ""}`;
  document.querySelectorAll(".pfilter .chip").forEach(c => c.onclick = () => {
    if (c.dataset.c !== undefined) pstate.cat = c.dataset.c; else pstate.grade = +c.dataset.g; projectsView(); });
  window.scrollTo(0, 0);
}
// 전환점 하나 — 프로젝트 화면과 결정 화면이 같이 쓴다. p를 주면 프로젝트 이름을 머리에 붙인다.
function msItem(m, p){
  const rej = m.rejected || [];
  return `<li><div class="tlh"><span class="ref">${esc(m.ref)}</span><span class="date">${esc(m.date || "")}</span>${m.reverses ? `<span class="rev" title="예전 결정을 고치지 않고 새 번호로 뒤집음">${esc(m.reverses)} 뒤집음</span>` : ""}
      ${p ? `<a class="tag" href="#project/${enc(p.id)}">${esc(p.name)}</a>` : ""}</div>
    <div class="tlt">${inline(m.title)}</div>
    <div class="tlr"><span class="lbl">왜</span>${inline(m.why)}</div>
    <div class="tlr"><span class="lbl">바뀐 것</span>${inline(m.changed)}</div>
    ${rej.length || m.verified ? `<details class="tld"><summary>어떻게 정했나 — ${[rej.length ? `버린 대안 ${rej.length}개` : "", m.verified ? "검증" : ""].filter(Boolean).join(" · ")}</summary>
      ${rej.length ? `<div class="tlr"><span class="lbl">버린 대안</span></div><ul>${rej.map(x => `<li>${inline(x)}</li>`).join("")}</ul>` : ""}
      ${m.verified ? `<div class="tlr"><span class="lbl">검증</span>${inline(m.verified)}</div>` : ""}</details>` : ""}
    ${m.rules.length ? `<div class="tlr"><span class="lbl">관련 규칙</span>${m.rules.map(ruleLink).join(" · ")}</div>` : ""}</li>`;
}
// ---------- 결정 (모든 프로젝트의 전환점을 날짜순으로) ----------
const DF = {"": "전체", rev: "뒤집은 결정", rej: "버린 대안 있음", ver: "검증 있음"};
const dstate = {f: "", p: ""};
function decisionsView(){
  nav("decisions");
  const all = (DATA.projects || []).flatMap(p => p.milestones.map(m => ({m, p})));
  const pass = ({m, p}) => (!dstate.p || p.id === dstate.p) &&
    (dstate.f === "rev" ? !!m.reverses : dstate.f === "rej" ? (m.rejected || []).length > 0 : dstate.f === "ver" ? !!m.verified : true);
  const shown = all.filter(pass).sort((a, b) => (b.m.date || "").localeCompare(a.m.date || ""));
  const cnt = f => all.filter(x => f === "rev" ? x.m.reverses : f === "rej" ? (x.m.rejected || []).length : f === "ver" ? x.m.verified : true).length;
  const projs = (DATA.projects || []).filter(p => p.milestones.length);
  $("#app").innerHTML = `<div class="hero"><div class="eyebrow">DECISIONS · 결정 기록</div><h2>무엇을 왜 정했고, 무엇을 버렸나</h2>
      <p>프로젝트 ${projs.length}개의 큰 결정 ${all.length}건을 최신순으로 모았어요. 결정은 지우지 않고 새 번호로 뒤집고, 버린 대안과 검증을 같이 남깁니다.</p></div>
    <div class="pfilter"><span class="flabel">보기</span><div class="chips">${Object.entries(DF).map(([k, l]) =>
      `<button type="button" class="chip ${dstate.f === k ? "on" : ""}" data-f="${k}" aria-pressed="${dstate.f === k}">${l} <b>${cnt(k)}</b></button>`).join("")}</div>
      <span class="flabel">프로젝트</span><div class="chips">${[{id: "", name: "전체"}, ...projs].map(p =>
      `<button type="button" class="chip ${dstate.p === p.id ? "on" : ""}" data-p="${esc(p.id)}" aria-pressed="${dstate.p === p.id}">${esc(p.name)}</button>`).join("")}</div></div>
    <section class="card s plain">${shown.length ? `<ol class="tl">${shown.map(x => msItem(x.m, x.p)).join("")}</ol>` : `<p class="hint">조건에 맞는 결정이 없어요.</p>`}</section>`;
  document.querySelectorAll(".pfilter .chip").forEach(c => c.onclick = () => {
    if (c.dataset.f !== undefined) dstate.f = c.dataset.f; else dstate.p = c.dataset.p; decisionsView(); });
}
function projectView(id){
  nav("projects");
  const p = projById[id];
  if (!p){ projectsView(); return; }
  const appl = p.rules_applicable;
  $("#app").innerHTML = `<article class="card pdetail">
    <div class="meta"><a class="tag" href="#projects">← 프로젝트 목록</a>
      ${DATA.course_link && p.course_card ? `<a class="tag" href="${esc(DATA.course_link)}" target="_blank" rel="noopener">기초 강좌 샘플 카드: ${esc(p.course_card)} ↗</a>` : ""}</div>
    <div class="pg big"><span class="stars">${stars(p.grade)}</span><span>설계 난이도 · ${GRADE[p.grade]}</span>${p.public ? "" : `<span class="tag warn">비공개</span>`}</div>
    <h1 class="t">${esc(p.name)}</h1>
    <div class="meta"><a class="tag" href="#projects/${enc(p.category.split(" · ")[0])}" title="같은 분류의 프로젝트 보기">${esc(p.category)}</a><span class="tag">${esc(p.status)}</span>
      ${p.stack.map(t => `<a class="tag" href="#tag/${enc(t)}" title="이 기술 태그의 규칙 보기">${esc(t)}</a>`).join("")}</div>
    <div class="intro">${esc(p.summary)}</div>
    <div class="two"><div class="box"><div class="eyebrow">🎯 설계 포인트</div><ul>${p.design_points.map(x => `<li>${inline(x)}</li>`).join("")}</ul></div>
      <div class="box"><div class="eyebrow">✅ 확인 항목</div><ul>${p.checks.map(x => `<li>${inline(x)}</li>`).join("")}</ul></div></div>
    <section class="s plain"><h2>전환점 <span class="hint">결정 기록에서 고른 큰 결정 · 원래 번호 그대로</span></h2>
      <ol class="tl">${p.milestones.map(m => msItem(m)).join("")}</ol></section>
    <section class="s plain"><h2>실측 규칙 <span class="hint">이 프로젝트에서 실제로 겪고 정리한 규칙</span></h2>
      ${p.rules_real.length ? `<ul class="rl">${p.rules_real.map(r => `<li>${ruleLink(r)}</li>`).join("")}</ul>` : `<p class="hint">아직 없음</p>`}</section>
    <section class="s plain"><h2>적용 가능 규칙 <span class="hint">기술 스택이 겹치는 다른 프로젝트의 규칙 · 많이 겹치는 순</span></h2>
      <ul class="rl">${appl.map((r, i) => `<li class="${i >= 8 ? "fold" : ""}">${ruleLink(r.id)} ${r.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</li>`).join("")}</ul>
      ${appl.length > 8 ? `<button class="btn ghost" id="more">${appl.length - 8}개 더 보기</button>` : ""}</section>
  </article>`;
  const more = $("#more"); if (more) more.onclick = () => { document.querySelectorAll(".rl .fold").forEach(x => x.classList.remove("fold")); more.remove(); };
  window.scrollTo(0, 0);
}
function route(){
  const [v, raw] = location.hash.slice(1).split("/"); const id = raw ? decodeURIComponent(raw) : "";
  if (v === "quiz") quizView(id); else if (v === "projects") projectsView(raw === undefined ? undefined : id);
  else if (v === "project") projectView(id);
  else if (v === "decisions") decisionsView();
  else if (v === "terms" || v === "term") termsView(id);
  else if (v === "tag"){ Object.assign(state, {tag: id, q: "", kind: "", project: "", qf: ""}); ruleView(""); }
  else ruleView(id);
}
if (DATA.course_link){ const c = $("#course"); c.href = DATA.course_link; c.hidden = false; }
window.addEventListener("hashchange", () => route());
route();
</script>
</body>
