한글 출력 깨짐(인코딩)** — Windows PowerShell 5.1의 콘솔 출력과 native 명령 출력 디코딩 기본은 OEM 코드페이지라 한글 커밋 제목이 `?`로 깨진다. ① 스크립트는 BOM 있는 UTF-8로 저장, ② 시작에서 `[Console]::OutputEncoding`과 `$OutputEncoding`을 UTF-8(BOM 없음)로(출력이 파이프로 잡히면 설정이 던질 수 있어 `try`), ③ git은 `-c core.quotepath=false -c i18n.logOutputEncoding=UTF-8`로 커밋 제목을 뽑는다. 만든 뒤 제어문자(`[\\x00-\\x08\\x0b\\x0c\\x0e-\\x1f]`)가 0개인지 확인.\n22. **비대화형 실행에서 `Read-Host`는 쓸 수 없다** — 입력이 막혀 있거나 빈 값을 받아 \"취소\"로 끝난다. 대화창 유무를 `[Environment]::UserInteractive -and -not [Console]::IsInputRedirected -and -not [Console]::IsOutputRedirected`로 판정하고, 아니면 질문하지 말고 종료 코드(3)로 승인을 요청한다.\n\n### 승인 요청 절차 — AI 코딩 도구(Claude Code 등) 사용 규칙과 실제 확인 (2026-10-21 추가)\n\n- **도구가 할 일**: 푸시를 요청받으면 먼저 스크립트를 그대로 실행해 브리핑을 받는다(종료 코드 3). 그 브리핑을 **사용자에게 요약해 전한다** — 올라갈 커밋 수·핵심 변경 한두 줄·변경 규모·검증 결과(표식·테스트)·원격·승인 코드. 사용자가 승인하면 그때만 `.\\push_verified.ps1 -Approve <코드>`로 다시 실행한다.\n- **하지 않을 것**: 사용자 승인 없이 `-Approve`를 붙이기, 요청 문장에 \"푸시\"가 들어 있다는 이유로 승인을 갈음하기(요청 ≠ 승인 — 브리핑을 보고 확인받는 단계가 따로 있다), 검증 뒤 커밋이 늘었는데 옛 코드로 재시도하기(코드가 다르면 거부되니 브리핑부터 다시).\n- **프로젝트 규칙에 같이 적기**: 프로젝트 `CLAUDE.md`(세션 협업 방식)와 도구의 메모리에 같은 절차를 남긴다 — 세션이 바뀌어도 브리핑·승인 단계를 건너뛰지 않게.\n- **실제 확인(poker_app, 2026-10-20)**: 비대화형 실행 → 브리핑 + `승인 필요 — .\\push_verified.ps1 -Approve fe3b0801`, 종료 코드 3, 푸시 안 됨 / 틀린 코드(`00000000`) → 거부, 종료 코드 1, 푸시 안 됨 / 한글 커밋 제목·원격·변경 규모가 깨지지 않고 출력. 서비스용 폴더는 그대로 \"GitHub보다 N개 앞섬\" 상태로 남는다.\n\n### 스크립트가 두 폴더에 똑같이 있는 것 (질문 기록)\n\n개발 폴더와 서비스용 폴더에 승격 스크립트(`promote.ps1`·`gate_engine.ps1`·`service_gate.ps1`·`push_verified.ps1`)가 똑같이 있다. **연결에 필요해서가 아니라 스크립트가 git에 추적되기 때문**이다 — 같은 저장소이고 promote가 추적 파일을 서비스용으로 옮기므로 복사본이 생긴다. 실행은 쓰는 쪽 하나만: 개발 폴더는 `promote.ps1`(그리고 처음 한 번 엔진 Plan), 서비스용 폴더는 `service_gate.ps1`·`gate_engine.ps1`·`push_verified.ps1`. 나머지 복사본은 쓰이지 않고 그대로 놓인다. 연결은 파일 복사가 아니라 **경로**다 — `promote.ps1`이 서비스용 폴더 경로를 `-ServiceRoot`(기본: 폴더 이름의 `_개발` 접미사를 뗀 형제 폴더)로 알아내 그 안의 엔진·게이트를 부른다.\n스크립트를 고친 커밋은 이미 서비스용에 올라가 있던 **이전 버전의 엔진으로 먼저 Plan 검증**을 받고 옮겨진 뒤부터 새 버전이 실행된다(처음 한 번만 서비스용에 엔진이 없을 때 개발 복사본으로 Plan)."}, {"kind": "case", "heading": "적용 사례 3 — JudgeCal_Athe(Flutter 클라이언트 + FastAPI 서버, 형제 배치, 2026-10-19~21)", "body": "원 사례였던 이 프로젝트는 처음에 \"promote 하나\"만 있었고, 위 poker_app 방식(검증 엔진·제약 모음·라벨·푸시 승인)을 뒤늦게 이식했다. 달라진 점만 적는다.\n\n- **브랜치·remote 이름**: 서비스용 브랜치가 `main`, GitHub remote 이름이 `origin`이 아니라 `judgecal-app`이다. 엔진·푸시 스크립트는 브랜치를 상수로 두고 GitHub 쪽을 \"`dev`가 아닌 첫 remote\"로 찾는다.\n- **제약 모음**: 모은 것은 크레딧제·게스트 발급 한도 2종·힌트 쿨다운·음수 티어 해금(운영 제약 5개). 이미 `.env`로 갈리던 값(`CREDITS_ENFORCED`)은 rules가 그 값을 그대로 읽게 하고 noop은 \"끄기\"만 맡겨 기존 환경변수 방식과 충돌하지 않게 했다.\n  클라이언트에는 모을 운영 제약이 없어(광고·결제·시즌 상한 없음) 클라이언트용 제약 패키지는 만들지 않았다 — 조사해서 \"없음\"을 확인하는 것도 결과다. 위 \"엔진·안정화 로직은 제약이 아니다\" 구분은 이 사례의 사용자 지적에서 나왔다.\n- **푸시 승인**: poker_app 방식에 더해 미리보기에 **추가된 줄의 비밀값 패턴 스캔**(API 키·개인키·토큰 대입)과 원격 URL을 넣었다. 승인 코드는 해시 앞 7자리(표식은 40자리 전체 비교). 미리보기는 `.git\\push_preview.txt`(UTF-8)에도 저장.\n  종료 코드 0 성공 / 1 실패 / 3 승인 필요 / 4 취소. `promote.ps1 -Push`는 3·4를 실패가 아니라 \"푸시만 대기\"로 보고한다. 실제 확인: 서비스용 폴더에서 비대화형 실행 → 한글이 깨지지 않은 미리보기 + 코드 3 / 틀린 코드 → 코드 1 / 두 경우 모두 푸시 안 됨.\n- **서비스용 `.env`의 운영 스위치**: 서비스용 폴더 `.env`에 크레딧제가 켜져 있으면 게스트(헤더 없는) 요청의 AI 호출이 막힌다. 서비스용 코드로 실제 AI 호출을 측정할 때는 프로세스 환경변수로만 덮어쓰고(`load_dotenv`는 이미 있는 환경변수를 덮어쓰지 않는다) `.env` 파일은 건드리지 않는다.\n- **음성 테스트로 게이트를 확인**: 서비스용 폴더에 스위치 파일·dev 라벨을 일부러 넣어 게이트가 거부하는지 확인하고 되돌렸다. 게이트는 \"통과하는 것\"보다 \"막는 것\"을 한 번은 실물로 봐야 믿을 수 있다.\n\n함정 23~25 (이 사례에서 실제로 겪음):\n\n23. **범위 오타로 부분 승격이 났다 — 함정 19의 실제 사고.** `promote.ps1 \"HEAD~1..HEAD\"`로 두 커밋 중 뒤 커밋만 서비스용에 옮겼더니 게이트가 \"서비스용 main이 출처와 다르다\"로 막았다(게이트가 제 일을 한 것, 푸시 표식은 지워졌다).\n    복구 = 서비스용 폴더에서 **아직 푸시 안 된 로컬 커밋만** `git reset --hard <직전에 푸시한 커밋>`으로 되돌린 뒤 올바른 범위로 다시 승격. 먼저 `git log <remote>/main..main`으로 되돌려도 되는 커밋뿐인지 본다.\n    reset은 되돌릴 수 없는 작업이라 AI 코딩 도구의 안전 검사가 막을 수 있다 — 막히면 우회하지 말고 사용자가 `! git reset --hard …`로 직접 실행하게 한다. 예방: 범위의 시작은 \"직전에 옮긴 개발 커밋\"(그 커밋은 제외됨), 또는 스크립트가 \"서비스용에 아직 없는 개발 커밋 전부\"로 범위를 자동 계산하게 개선.\n24. **개발 폴더 이름에 한글이 있으면 Android Gradle Plugin이 빌드를 거부한다.** \"Your project path contains non-ASCII characters\" 오류로 첫 개발앱 빌드가 실패했다(서비스용은 영문 경로라 무관). 개발 폴더 `android/gradle.properties`에 `android.overridePathCheck=true`(검사만 끔)를 넣어 해결.\n    같은 파일이 승격돼 서비스용에도 가지만 영문 경로에서는 무해. 개발 폴더 이름을 `<프로젝트>_개발`로 하는 이 패턴에서는 프로젝트 이름이 한글이 아니어도 접미사 때문에 걸린다. 개발앱 빌드 후 APK의 앱 ID·이름은 `aapt2 dump badging <apk>`로 확인(`.dev`·`… DEV`·`-dev`).\n25. **문서에서도 `\\a`·`\\b`가 제어문자가 된다(함정 20의 재발).** `client_flutter\\android\\app_variant` 경로를 파이썬 일반 문자열로 문서에 쓰다 두 번 깨졌다(`\\a` = BEL). 스크립트뿐 아니라 문서·README에도 쓴 뒤 `grep -cP \"[\\x00-\\x08\\x0b\\x0c\\x0e-\\x1f]\"`가 0인지 확인.\n26. **브리핑을 본 사용자가 \"푸시하자\"고 해도 AI 도구의 자동 권한 판별기가 `-Approve` 실행을 막을 수 있다(poker_app, 2026-10-23).** 사용자는 브리핑·승인 코드를 본 뒤\n    \"테스트 후 푸시하자\"라고 했고, 테스트 뒤 `push_verified.ps1 -Approve <코드>`가 \"위험\" 판정(이유 없음)으로 거부됐다. 스크립트 자체는 일반 푸시 한 줄·강제 없음이었다 —\n    판별기는 \"사람 승인 단계를 도구가 대신 넘는 동작\"과 \"조건부 지시(테스트 후)\"를 명시적 승인으로 보지 않은 것으로 보인다(추정, 판별기는 이유를 주지 않는다).\n    - **우회하지 않는다.** 막혔다고 다른 명령 형태로 같은 푸시를 시도하지 말고, 막힌 사실과 스크립트가 하는 일(푸시 줄 번호)을 보여 준 뒤 사용자가 직접 실행하게 한다.\n    - **사용자 직접 실행의 함정**: Windows의 Claude Code에서 `!` 접두 명령은 PowerShell이 아니라 **bash**로 돈다. `! cd ..\\poker_app; .\\push_verified.ps1 -Approve …`는\n      백슬래시가 이스케이프로 먹혀 `cd: ..poker_app: No such file`·`.push_verified.ps1: command not found`로 실패했다(아무것도 실행 안 됨 — 안전).\n      안내할 형태: `! cd ../poker_app && powershell -NoProfile -ExecutionPolicy Bypass -File ./push_verified.ps1 -Approve <코드>` — 슬래시 경로, `&&`, PowerShell을 명시 호출.\n    - 이 형태는 스크립트의 대화창 판정(함정 22)에서 비대화형이지만 `-Approve`가 있어 바로 푸시한다. 결과 확인은 도구가 `git status -sb`의 `## master...origin/master`로.\n    - 도구 메모리에 \"막히면 bash 형태 명령을 바로 안내\"를 남겨 다음 세션에서 같은 왕복을 줄인다."}, {"kind": "case", "heading": "적용 사례 4 — RVS_App(JudgeCal에서 포크한 두 번째 앱, 2026-10-21~24)", "body": "JudgeCal 개발 폴더를 포크해 만든 독립 앱이라 엔진(promote·gate·push_verified·service_gate)·제약 모음·폴더 라벨·푸시 승인을 **그대로 복사**해 시작했다(`RVSU_App/RVS_App_Dev`·`RVS_App_Service`, 서비스용 브랜치 `main`/remote `origin`). 새로 겪은 것:\n\n- **서비스 폴더가 제약 값에서 앞서는 것은 정상 흐름이다.** 실사용자 로그를 바탕으로 한도 숫자를 고치는 일은 서비스 폴더에서 `[service]` 커밋으로 직접 하고(`service_only_paths.txt`에 `server/constraints/rules.py`만 허용), 함수 이름·시그니처를 바꾸는 일은 개발 폴더에서 한다(rules/noop 짝 테스트가 막는다). 개발 쪽으로 되돌려 반영하는 절차는 별도로 두지 않는다 — 두 폴더의 트리가 같은지는 `git diff dev/dev main`(서비스 폴더에서 개발 폴더를 remote `dev`로 fetch)으로 본다. 줄바꿈(CRLF) 때문에 파일 단위 `cmp`는 거짓 차이를 낸다.\n- **개발 폴더 전용 무인 작업(콘텐츠 채우기)은 헤드리스 도구를 스크립트로 부르고 푸시는 빼는 것이 안전하다**: 깨끗한 트리에서만 시작, 시작 전 해시 기록, 끝나면 새 커밋이 있는지 확인, 검증기·테스트를 통과해야 커밋, 푸시는 하지 않고 사람이 promote한다. 로테이션 설정이 도메인 카탈로그와 어긋나면(관계 종류 6개 중 4개만 적음) 일관성 테스트가 막아 주지만 그날 실행이 헛수고가 된다.\n- **서비스 폴더에 미커밋 변경이 있으면 promote가 멈춘다.** 지우지 말고 `git stash push -m \"<무엇이 왜>\"`로 보관하고(되돌릴 수 있음) 승격·푸시를 끝낸 뒤 보관본을 사용자와 정한다. 서비스 폴더에서 `stash pop`을 하면 다시 막힌다.\n\n함정 27~30 (이 사례에서 실제로 겪음):\n\n27. **무인 예약 작업이 서비스 폴더에서 돌고 있었다 — 분리를 해 놓고 작업 스케줄러는 옛 경로를 가리킨 채였다.** 분리 이전에 등록한 작업(`JudgeCal-BranchSeedDaily`, 매일 04:00)이 서비스 폴더의 스크립트를 계속 불러 콘텐츠 6,740줄을 미커밋으로 남기고 서비스 폴더의 promote를 막았다. 분리 작업의 체크리스트에 **`Get-ScheduledTask`로 옛 경로를 가리키는 예약 작업 찾기**를 넣는다. 개발/생성 작업은 개발 폴더로 옮기고(새 작업 등록 + 옛 작업은 **삭제가 아니라 Disable**), 운영 작업(백업 등)은 서비스 폴더에 남긴다. 확인은 `schtasks`가 비어 나오는 환경이 있으니 `Get-ScheduledTask | ? { $_.Actions.Execute -match '<프로젝트>' -or $_.Actions.Arguments -match '<프로젝트>' }`로 한다.\n28. **테스트 결과가 어느 폴더에서 돌렸는지에 따라 달라졌다.** 서비스 폴더 `.env`의 운영 스위치(`CREDITS_ENFORCED=1`)가 테스트 프로세스에도 적용돼 개발 폴더에서는 통과하는 테스트 3개가 서비스 폴더에서 실패했다(게스트 상태가 \"off\"). 제약 모음은 conftest가 rules로 고정했지만 `.env`로 갈리는 값은 놓쳤다. conftest에 **폴더별로 갈릴 수 있는 스위치를 기본 꺼짐으로 고정**하는 autouse 픽스처를 두고(켜는 테스트는 직접 켠다) `환경변수=1`로 켠 채 전체 스위트를 한 번 돌려 확인한다. 승격 게이트가 서비스 폴더에서 돌리는 것은 제약 짝 테스트뿐이라 이 결함이 게이트를 통과해 있었다. **같은 부류의 재발(RVS_App 2026-11-11)**: 서비스 폴더 `.env`에 공용 API 토큰(`API_AUTH_TOKEN`)을 넣자 서버 테스트 172개가 토큰 없이 요청해 401로 실패했다 — 개발 폴더엔 토큰이 없어 안 드러났고, 이번엔 게이트가 서비스 폴더에서 서버 테스트 **전체**를 돌려(31번 이후) 잡았다. 대응은 같다: conftest의 autouse 픽스처가 `config.API_AUTH_TOKEN`을 비우고(토큰 게이트를 시험하는 테스트는 직접 켠다), 환경변수 `API_AUTH_TOKEN=값`을 준 채 개발 폴더에서도 전체 스위트를 돌려 재현·확인한다(새 환경 의존 설정이 생길 때마다 같은 식으로).\n29. **포크 기준 커밋 기록이 실제와 달랐다.** README는 \"`dev@cb25476`을 포크\"라 적었지만 실제 코드는 그 다음 커밋(`bdd165e`)까지 들어와 있었다(파일을 대조해 알았다). 포크 직후 `git log` 한 줄을 믿지 말고 \"이 파일에 있는 기능이 기준 커밋에 있는가\"로 확인해 적는다. 이후 갈라짐은 `포크_앱_공유파일_갈라짐_점검_패턴.md`의 스크립트로 추적한다.\n30. **bash 도구에서 한글·따옴표가 많은 `cat > 파일 <<'EOF'` 히어독이 `unexpected EOF while looking for matching`으로 통째로 실패한다(2회; RVS 2026-11-11 세션에서 3회 더).** 파일 내용은 Write 도구로 쓰고, 실행(python/pytest)만 bash로 한다. 같은 명령 안에 히어독 둘 이상을 넣지 않는다. 실패한 히어독은 **아무것도 적용하지 않은 채** 다음 줄의 명령이 그대로 돌아 시험 결과가 엉뚱한 상태를 재게 된다 — 파일로 쓴 스크립트를 실행한 뒤에는 적용 결과(`git diff --stat`·문법 검사)를 먼저 확인하고 시험을 돌린다.\n31. **푸시 전 게이트가 테스트 전체를 돌리지 않았다(2026-10-30 발견).** 엔진 Verify는 \"넘어올 때의 관문\"(제약 짝 테스트 `test_constraints`)만 봤고 `-Full`도 `flutter analyze`까지였다 — GitHub `main`이 곧 배포 대상인데 서버 테스트 실패가 그대로 올라갈 수 있었다. Verify에 서버 pytest 전체(약 2~3분), `-Full`에 `flutter test`를 더했다. GitHub Actions CI도 같은 검사를 하되 **푸시된 뒤라 막지 못하므로 기록용 이중 확인**으로 두고, 막는 곳은 로컬 게이트로 정했다. CI는 개발 폴더(원격 없음)에서는 돌지 않고 승격 뒤에만 돈다 — 먼저 깨끗한 클론(.env·data·스위치 없음)에서 테스트가 도는지 확인해 둔다. 린트는 기존 부채 때문에 버그 규칙만 차단하고, 보관용 `_legacy`는 제외한다(남은 위반이 전부 거기였다).\n32. **같은 개발 폴더에서 다른 AI 세션이 동시에 일하면 \"내 커밋만 승격\"이 안 된다(2026-10-31, RVS_App).** 승격 게이트는 \"서비스 == 승격한 마지막 개발 커밋\"을 검사하므로 중간 커밋만 골라 올리면 앞선 남의 커밋 내용이 빠져 실패한다. 실제로 내가 승격하려던 커밋을 다른 세션이 뒤의 자기 커밋까지 묶어 먼저 승격해 두어 \"이미 옮김\"만 나왔다. 승격 전 `git log <마지막 승격>..HEAD`로 남의 커밋이 끼었는지 보고, 섞이면 사용자에게 \"함께 올릴지\"를 묻는다(서비스 폴더 `git reset`으로 남의 승격을 지우는 건 하지 않는다). 커밋은 내 파일만 add하고, 남이 고치는 중인 파일(미커밋)은 그 세션이 커밋할 때까지 건드리지 않는다 — 기능을 나눠 겹치지 않는 파일부터 한다.\n33. **시크릿 파일의 무시 패턴이 이름 변형을 놓치면 게이트도 같이 뚫린다(RVS_App 2026-11-11).** `.gitignore`가 `key.properties`만 막고 있어 `key.properties.txt`(서명 키 항목이 든 복사본)가 untracked로 남아 `git add -A` 한 번이면 커밋될 상태였고, 게이트의 추적 금지 정규식도 정확히 일치만 봐서 **커밋돼도 통과**했다. 루트·플랫폼 폴더 `.gitignore`와 게이트 정규식은 \"같은 목록\"이므로 함께 `key.properties*`로 넓히고, 이름 변형 몇 개(`.txt`·`.bak`·정상 이름 `keyboard.py`)를 정규식에 직접 넣어 막힘/통과를 확인한다(값은 열어 보지 않는다). 부작용: 같은 접두의 예시 파일(`key.properties.example`)도 막히니 예시 파일은 다른 이름으로 둔다. 발견 경로: 서비스 폴더 `git status`에 계속 untracked로 보이던 파일을 점검에서 짚었다 — **무시되지도 추적되지도 않는 파일은 규칙 누락의 신호**다.\n34. **무인 예약 작업은 더러운 개발 폴더에서 조용히 건너뛴다(RVS_App 2026-11-11).** 개발 폴더에 커밋 안 된 변경이 있으면 시드 채우기 스크립트가 시작하지 않고 상태 파일에 `dirty_skip`을 남긴 채 종료 코드 1로 끝난다 — 작업 스케줄러에는 \"결과 1\"로만 보이고 새 커밋도 알림도 없다. 저녁에 개발 중이면 예약 시각 전에 커밋(또는 정리)해 두고, 예약이 의도대로 돌았는지는 작업 스케줄러 결과 코드가 아니라 스크립트가 남기는 상태 파일(`logs/seed_fill_last.json`)과 `chore: 시드 채우기` 커밋으로 본다. 또 예약 작업의 인자(`-Pack` 같은 선택 플래그)는 등록 때 정한 그대로라, 나중에 생긴 변형 실행은 예약에 **자동으로 들어가지 않는다** — 어떤 일정이 무엇을 채우는지 한 번 읽어 둔다(RVS는 사용자 기억 \"12시\"와 실제 21:00, 그리고 팩 시드 미포함이 이 점검에서 드러났다)."}], "projects": ["JudgeCal_Athe", "RVS_App", "poker_app"], "links": ["포크_앱_공유파일_갈라짐_점검_패턴"], "updated": "2026-11-12", "tags": ["배포·운영", "Git·문서", "Flutter", "FastAPI", "Windows"], "tags_overridden": true, "public": true}, {"id": "개발자콘솔_정적셸_세션토큰_로테이션_원문비포함_패턴", "title": "개발자 콘솔 — 정적 화면 껍데기 + 로그인 뒤 요청마다 바뀌는 세션 토큰 + 사용자 원문 비포함 (범용)", "short": "개발자 콘솔 보안 구조", "source": "공용/개발자콘솔_정적셸_세션토큰_로테이션_원문비포함_패턴.md", "intro": "운영자(개발자)가 서버 상태·사용량·지표를 볼 화면을 서버에 붙일 때의 패턴. 메인 앱 UI에 탭으로 넣지 않고 \"주소를 아는 사람만\" 여는 별도 페이지로 둔다. Lazzy(Jarvis)의 `dev_console.html`, poker_app의 `/devconsole/*`, JudgeCal의 devconsole에서 반복된 구조를 RVS_App(2026-10-23)이 한 번 더 정리했다.", "sections": [{"kind": "solution", "heading": "1. 구조 — 껍데기는 공개, 데이터는 잠금", "body": "- **화면 껍데기**(`GET /dev-console`)는 정적 HTML+JS 한 장이다. DB 접근이 없고 민감한 것이 없으니 인증 없이 서빙한다. 브라우저 주소창에 URL을 치는 일반 GET에는 커스텀 헤더를 못 붙이기 때문이다. 캐시는 `no-store`.\n- **데이터 라우트**(`/devconsole/*`)는 전부 읽기 전용 GET이고, 로그인한 세션 토큰이 있어야 한다. 쓰기·삭제 라우트는 만들지 않는다 — 조회 도구가 파괴 수단이 되지 않게.\n- **꺼진 기능은 404**: 마스터 비밀 환경변수가 비어 있으면 화면·로그인·데이터가 전부 404를 돌려준다(401이 아니라). 배포 환경에서 값을 넣기 전까지는 존재 자체를 알리지 않는다. 라우터는 항상 등록하고 라우트마다 \"켜져 있는가\" 의존성을 건다(조건부 등록이면 테스트가 어렵다)."}, {"kind": "solution", "heading": "2. 토큰 — 마스터 비밀은 로그인에만, 세션 토큰은 수시로 바뀐다", "body": "고정 토큰 하나를 헤더에 싣는 방식은 유출되면 영구적이다. 아래처럼 바꾼다.\n\n- **마스터 비밀**(환경변수)은 `POST /login`에서 한 번만 쓴다. 데이터 라우트에서 마스터 비밀을 보내도 통하지 않게 한다(테스트로 고정).\n- 로그인하면 **세션 토큰**(`secrets.token_urlsafe(32)`)을 준다. 서버는 해시(sha256)만 메모리에 둔다.\n- **매 요청 교체(rotate)**: 통과한 응답마다 헤더(`X-Dev-Token-Next`)로 새 토큰을 주고, 쓴 토큰은 **유예 시간(30초)** 뒤 죽게 한다. 유예가 없으면 화면이 요청 두 개를 동시에 보낼 때 늦게 도착한 쪽이 401을 맞는다.\n- **유휴 만료**(마지막 사용 후 15분)와 **절대 수명**(로그인 후 8시간 — 계속 써도 만료)을 둘 다 둔다. 교체해도 `login` 시각은 물려받게 해야 절대 수명이 늘지 않는다.\n- **로그인 실패 제한**: 같은 IP에서 10분에 5번 틀리면 10분 잠금(429+`Retry-After`). 프록시 뒤에서는 `X-Forwarded-For`의 마지막 항목을 쓴다(앞쪽은 위조 가능).\n- **로그아웃 두 종류**: 내 세션만 / 전체. 열려 있는 콘솔 세션 수는 런타임 화면에 보여 준다(교체 직전 토큰은 세지 않는다).\n- 화면은 토큰을 `sessionStorage`에만 둔다(탭을 닫으면 사라짐, `localStorage`는 쓰지 않는다). 응답을 받을 때마다 갈아 끼우고, 401이면 로그인 화면으로.\n- 한계: 세션을 프로세스 메모리에 두면 서버 재시작 때 모두 로그아웃되고, 서버가 여러 개로 늘면 서버마다 따로다. 그때는 공유 저장소가 필요하다."}, {"kind": "solution", "heading": "3. 응답에 사용자 원문을 넣지 않는다", "body": "콘솔은 운영자 도구지만 사용자 글을 볼 이유는 없다. **건수·비율·시각·지연·분포만** 낸다.\n\n- 집계 쿼리는 원문 컬럼(상황·행동·결과 문장, 프로필, 이메일)을 SELECT하지 않는다. 계정은 개수와 티어만.\n- \"최근 사건\" 로그도 종류+숫자 필드만 받는 함수로 만든다(문자열 필드는 걸러냄).\n- **테스트로 고정**: 특이한 문자열(\"비밀스러운상황문장\")로 데이터를 만들고, 모든 콘솔 응답을 JSON으로 합쳐 그 문자열이 없는지 `assert not in`.\n- 표가 아직 없는 첫 사용 전에도 빈 값으로 열리게 한다(`no such table`이면 빈 결과) — 콘솔이 첫 장애 때 아무것도 못 보여 주면 소용없다."}, {"kind": "solution", "heading": "4. 런타임 카운터", "body": "프로세스 메모리 카운터(`Counter` + 최근 사건 `deque(maxlen=50)`)를 둔다: LLM 시도 성공/실패/429·평균 지연, 재시도·빈 응답·실패 횟수. 기존 계측 함수(요청 컨텍스트가 있어야 기록하던 것)는 **컨텍스트 앞에서** 서버 전체 카운터에도 쌓는다. 기록 함수는 예외를 삼켜 요청을 깨지 않게 한다. 재시작하면 0이라는 점을 화면에 적어 둔다."}, {"kind": "problem", "heading": "5. 함정", "body": "- 사용 기록 같은 **날짜 문자열 비교**는 형식이 같아야 한다 — SQLite `datetime('now')`는 공백 구분인데 저장값은 `T` 구분이면 문자열 비교가 어긋난다. 비교 기준값은 저장한 쪽과 같은 함수로 만들어 파라미터로 넘긴다.\n- 서로 다른 DB 파일(사용량·계정·본 DB)을 합치는 집계는 각자 열어 파이썬에서 합친다. 한 연결로 ATTACH하지 않는다.\n- 화면 JS를 만들었으면 최소한 `node --check`로 구문 검사를 하고, 가능하면 실제 브라우저로 로그인→탭 전환→토큰 교체를 눈으로 본다(RVS는 브라우저 확장이 연결되지 않아 구문 검사+로컬 서버 호출 확인까지만 했다 — 문서에 \"눈으로 못 봄\"이라고 적었다).\n- 마스터 비밀을 데이터 라우트에도 받아 주는 \"편의\" 경로를 남기지 않는다. 그러면 로테이션이 의미 없어진다."}, {"kind": "case", "heading": "구현 사례", "body": "- RVS_App: `server/routers/devconsole.py`(화면·로그인·데이터), `devtokens.py`(세션 토큰 교체·잠금), `devstats.py`(집계), `runtime_stats.py`(카운터), `static/dev_console.html`. 시험: `server/test_forecast.py` 하단 devconsole 5개(404/로그인/교체와 만료/잠금과 로그아웃/원문 비포함).\n- 원형: Lazzy_App_OS_Monorepo `server/api/static/dev_console.html`(껍데기 공개+게이팅된 API 호출), poker_app `devconsole.py`(토큰 보호 라우터)."}], "projects": ["Lazzy_App_OS_Monorepo", "RVS_App", "poker_app"], "links": [], "updated": "2026-10-23", "tags": ["보안·개인정보", "웹", "FastAPI"], "tags_overridden": true, "public": true}, {"id": "개인용_로컬도구_상용화전환_패턴", "title": "개인용 로컬도구 → 상용화/팀배포 전환 패턴", "short": "개인 도구를 상용화할 때", "source": "공용/개인용_로컬도구_상용화전환_패턴.md", "intro": "", "sections": [{"kind": "context", "heading": "상황", "body": "1인 로컬 데스크톱 도구(설정파일·정책파일을 로컬에 평문으로 자유롭게 쓰고\n읽는 구조)를 상용 제품이나 팀 배포로 전환할 때. \"코드는 이미 잘 짜여\n있으니 그대로 팔면 된다\"는 착각이 흔한 함정 — 1인 로컬 도구는 \"이 파일을\n아무도 안 본다\"와 \"이 파일을 아무도 안 고친다\"라는 암묵적 신뢰 위에서\n설계돼 있어서, 전제가 깨지는 순간 지금까지 안 보이던 두 종류 구멍이\n드러난다."}, {"kind": "solution", "heading": "핵심 원칙", "body": "상용화/팀배포는 \"제작자 = 유일한 사용자 = 유일한 신뢰주체\"라는 전제 중\n최소 하나가 깨지는 사건이다. 어느 게 깨지는지에 따라 손봐야 할 지점이\n갈린다 — 아래 2가지가 실제로 제일 먼저, 제일 조용히 걸린다(코드 리뷰로는\n안 잡히고 git/파일 감사로만 잡힘)."}, {"kind": "checklist", "heading": "체크리스트 (7가지 — 실제로 걸리는 지점)", "body": "1. **앱이 실행 중 자동으로 만들어내는 파일에 개인 경로/사용자명이 실리는가**\n   (설정파일, 사용기록, 프리셋, 최근 작업 목록 등) → `.gitignore`는 보통\n   `.env`처럼 \"알려진 시크릿 파일\"만 잡지, 앱이 알아서 채워나가는 상태\n   파일은 안 잡는다. 최초 커밋 시점엔 그 파일이 비어있거나 아예\n   없어서 아무도 gitignore에 안 넣고 넘어가고, 나중에 실사용하며 실제\n   경로/사용자명이 채워진 뒤에야 `git status`/`git log -- <파일>`로\n   뒤늦게 드러난다. 원격 저장소가 아직 없으면 히스토리 재작성은 나중으로\n   미뤄도 안전하지만(로컬에만 존재), `.gitignore` 추가는 \"지금부터\"만\n   막을 뿐 과거 커밋 속 내용은 그대로라는 점을 놓치기 쉽다 — 첫 공개\n   push 전엔 반드시 `git filter-repo` 등으로 과거 커밋까지 정리해야 함.\n2. **정책/설정 파일이 \"이 사람이 이 명령을 실행해도 되는가\"를 가르는\n   로직의 근거인가**(실행 허용/차단 규칙, 자동승인 조건 등) → 개인용일\n   땐 평문 JSON 직접 편집이 편의지만, \"팀원이 몰래 못 고친다\"는 게 제품의\n   판매 근거가 되는 순간 그 편의가 그대로 취약점이 된다. 서버 인프라 없이\n   로컬에서 완결되는 해법은 비대칭키 서명(관리자 개인키로 서명, 공개키로\n   검증) + 검증 실패 시 \"기존 관대한 설정 유지\"가 아니라 엄격한 폴백\n   (fail-closed, 전부 확인 필요 모드)으로 떨어뜨리는 것. 배포 시 흔한\n   실수 2개: (a) 공개키를 팀원마다 다르게 주는 게 아니라 전원 동일 파일\n   1개를 그대로 복사해야 함 — 개인키만 관리자가 보관, (b) 공개키만\n   배포하면 안 되고 \"서명된 정책파일 + 서명파일\" 세트까지 통째로 같이\n   배포해야 함(공개키만 넣고 팀원의 기존 정책파일을 안 바꾸면 서명\n   불일치로 즉시 폴백당해 오작동처럼 보임). 관리자가 정책을 고칠 때마다\n   재서명 + 재배포도 필요.\n\n3. **개별 데이터 항목마다 \"리터럴 경로\"를 직접 들고 있는가** (프리셋/명령어별\n   저장 경로, 즐겨찾기별 폴더 등) → 1인 사용 땐 \"이 프리셋은 항상 이\n   폴더에서\" 식으로 항목마다 경로를 박아둬도 문제가 안 드러난다. 여러\n   프로젝트를 오가며 쓰는 실사용 패턴, 또는 다른 사용자에게 배포하는\n   순간 이 방식은 깨진다 — 항목마다 제각각 경로가 박혀 있으면 \"지금\n   내가 작업 중인 프로젝트\"라는 개념 자체가 없어서 매번 수동으로\n   맞춰줘야 한다. 해법은 데이터 항목에서 리터럴 경로를 완전히 제거하고,\n   \"지금 활성화된 컨텍스트(활성 루트)\" 하나만 두는 세션형 모델로\n   전환하는 것 — 클로드 코드가 디렉터리별 세션을 관리하는 것과 같은\n   패턴. 실행 시 항목이 뭘 들고 있든 무시하고 항상 활성 컨텍스트로\n   해석하면, 배포 후에도 각 사용자가 자기 활성 루트만 바꾸면 모든\n   항목이 자동으로 맞게 동작한다. 부가로 \"자주/최근 사용\" 랭킹까지\n   붙이면(기존 사용량 카운트 모듈이 있다면 그 패턴 그대로 재사용 가능)\n   컨텍스트 전환 자체가 하나의 기능이 된다.\n4. **데모/마케팅용으로 캡처하는 화면에 실제 개인정보가 그대로 찍히는가**\n   → 1~2번을 다 조치해서 git에는 개인정보가 없어져도, 앱을 실제로\n   켜서 스크린샷을 찍는 순간 화면 자체(상태줄, 최근 목록, 프리셋 이름\n   등)에 실경로·실사용자명·다른 프로젝트명이 그대로 나온다. 이건\n   git 감사로는 절대 안 잡히고 캡처 직후 육안으로만 잡힌다 — 데모\n   자료 준비를 \"코드/데이터 정리가 끝난 뒤\"의 완전히 별개 단계로\n   취급하고, 캡처 직전에 예시용 더미 값(`C:\\projects\\demo-app` 같은)으로\n   바꾼 뒤 찍거나, 찍은 뒤 해당 부분만 잘라내는 후처리를 반드시 거친다.\n5. **판매/배포 채널 자체에 \"신규 계정 콜드스타트\" 장벽이 있는가** → 결제\n   플랫폼(스토어 생성이 계정 단위로 레이트리밋 걸릴 수 있음 — IP를\n   바꿔도 안 풀리면 계정 자체가 걸린 것이므로 네트워크 문제로 오판하지\n   말고 지원팀에 바로 문의) + 홍보 채널(Hacker News, Indie Hackers 등\n   커뮤니티형 플랫폼은 신규 계정이 계정 나이/댓글 활동 이력을 어느 정도\n   쌓기 전엔 글 작성 자체가 막힘, 스팸성 무의미한 댓글로 억지로 채우면\n   오히려 역효과) 양쪽 다 \"코드 다 준비되면 바로 노출 가능\"이 아니라\n   최소 며칠의 준비 기간이 별도로 필요하다는 걸 일정에 넣어야 한다.\n6. **가격을 감으로 정하고 있는가** → \"이 정도면 팔리겠지\" 대신, 비슷한\n   카테고리(예: 인디 개발자용 SaaS 보일러플레이트/소스코드 템플릿)의\n   실제 거래 시세를 먼저 조사한 뒤, 그 구간의 중하단에서 시작해서\n   반응 보고 올리는 순서가 안전하다. 판매 채널(예: Lemon Squeezy vs\n   Gumroad)도 수수료 구조·세금 처리 방식·개발자 도구 카테고리 적합성\n   기준으로 비교해서 고른다.\n\n7. **로컬 전용이라 인증을 생략한 컴포넌트가 있는가**(관리자 콘솔, 디버그\n   서버, 내부 API 등) → 1인용일 땐 \"같은 기기(127.0.0.1) 또는 같은\n   Wi-Fi에서만 접근 가능하니 토큰 인증까지는 과하다\"는 판단이 실제로\n   합리적이다 — 위협 모델 자체가 \"공인 도메인에 여러 기기/사용자가\n   접속하는 서버\"와 다르기 때문. 문제는 이 판단이 **원저자 본인의\n   배포 환경을 전제로 한 것**이라는 점 — 그 코드가 판매용 소스로\n   나가는 순간 전제가 깨진다: 구매자가 어떤 네트워크 토폴로지에\n   배포할지, `0.0.0.0`으로 LAN에 열지, 공유 서버에 올릴지를 원저자는\n   알 수 없다. \"로컬 전용이라 무인증\"이라는 원래 결정 자체가 틀린 게\n   아니라, **그 결정이 유효한 전제(배포 환경을 안다)가 판매 순간\n   사라진다**는 게 핵심 — 코드 리뷰로는 안 잡히고, \"이 코드를 산 사람이\n   내가 모르는 환경에 배포한다\"는 질문을 스스로 던져야만 드러난다. 해법은\n   무인증을 완전히 없애는 게 아니라 **기본값을 뒤집되 탈출구를\n   남기는 것** — 토큰 인증을 기본값으로 켜고(자동생성 토큰, 시작 시\n   출력), 원저자 본인처럼 순수 로컬 전용 용도인 걸 아는 사람만 명시적\n   플래그로 원래(무인증) 동작으로 되돌릴 수 있게 한다.\n\n8. **\"코드 틀만 먼저, 검증은 나중에 몰아서\"로 전환 작업을 쪼갤 때 — 축마다\n   위험도가 다르다는 걸 구분하는가** → 상용화/팀배포 전환은 손댈 지점이\n   많아 \"일단 파라미터 배선(코드 틀)만 해두고, 실제 검증 로직은 서비스화\n   착수 직전에 한 번에 몰아서 채운다\"는 접근이 합리적일 때가 많다(1인\n   사용 중이라 그 시점까지 미뤄도 실사용 리스크가 없다는 전제 위에서).\n   문제는 이 \"스캐폴드 후 나중에 검증\"이 **모든 축에 똑같이 안전하지\n   않다**는 것 — 축을 헷갈리면 \"나중에 잠그면 되는 줄 알았던 것\"이 아니라\n   \"선언하는 순간 이미 위험한 것\"을 방치하게 된다.\n   - **안전한 축(지금 열어놔도 됨, 나중에 잠그면 됨)**: 인증/소유권 검증—\n     함수가 `owner_user_id` 같은 파라미터를 받기만 하고 아직 `if` 검증을\n     안 걸면, 기본 동작은 \"누구나 통과\"라 스캐폴드 자체가 아무 동작도\n     안 바꾼다. `게이트_실패시_열림_패턴.md`(같은 폴더)의 fail-open\n     철학과 같은 축 — \"지금 당장 방어를 안 걸어도 기존 동작과 동일\"이\n     성립하는 종류.\n   - **위험한 축(선언하는 순간 즉시 위험해짐)**: 응답 스키마 강제(FastAPI\n     `response_model=`, 엄격한 JSON Schema validate, DB `NOT NULL`/`CHECK`\n     제약 등)는 \"선언 = 즉시 런타임에서 필터링/검증이 활성화\"라서, 필드가\n     하나라도 빠진 채로 걸면 **그 순간부터 실제 응답이 조용히 잘려나가거나\n     저장이 거부된다** — \"나중에 완성하면 되지\"가 성립하지 않는다. 이\n     축은 (a) 스키마/모델 정의 자체는 미리 작성해두되 (b) 실제로\n     \"부착\"(response_model= 지정, validate 활성화, 제약 추가)하는 단계는\n     완전히 분리해서, 부착 직전에 실제 반환값/데이터와 전수 대조부터\n     한다.\n   - **판단 기준**: \"이 스캐폴드 커밋이 지금 당장 실제 동작을 하나라도\n     바꾸는가?\"를 먼저 확인한다 — 안 바뀌면 안전한 축(그대로 진행), 이미\n     바뀐다면(선언만 했는데 필터링이 걸림) 위험한 축이니 정의와 부착을\n     반드시 분리한다.\n   - 부가 팁: 대량의 스키마/모델을 한 번에 만들어야 할 때(엔드포인트\n     50개 이상 등) 초안 작성을 서브에이전트에 위임하더라도, 전부를\n     맹신하지 말고 트래픽이 크거나 로직이 복잡한 핵심 엔드포인트 몇 개는\n     반드시 원본 코드와 직접 대조 검증한다 — \"조건부로만 붙는 필드\"\n     (예: 특정 분기에서만 응답 dict에 새 키가 생기는 경우)를 초안이\n     놓치는 게 실제로 발생하는 실패 유형이다."}, {"kind": "case", "heading": "실측 사례", "body": "`Local_APP\\터미널 단축키 모음집`(dev_shortcuts, 자연어→명령어 패키징\n데스크톱 앱)을 상용화 검토하며 위 2개 조건이 전부 실제로 걸림돌로\n확인됨(2026-08-24). 1번은 `config.json`/`presets.json`/`usage_history.json`이\n실제 Windows 사용자명 + 여러 프로젝트의 절대경로를 담은 채 git에 커밋돼\n있었음(원격 저장소가 없어 아직 외부 유출은 없었음 — `git rm --cached` +\n`.gitignore`로 조치, 히스토리 재작성은 첫 공개 push 전 필수 항목으로\n별도 기록). 2번은 `execution_policy.json`(명령어별 허용/확인/차단 규칙)이\n평문이라 \"팀 정책을 개인이 몰래 못 바꾼다\"는 주장이 성립하지 않는 문제 —\n`backend/policy_signing.py`(Ed25519 서명 검증 + 폴백) + `sign_policy.py`\n(관리자 전용 키생성/서명 CLI) 신설로 해결. 상세는 그 프로젝트 설계도의\nD-033/D-034, H-020/H-021 참고(일반화된 버전은 이 문서에만 남기고 프로젝트\n세부사항은 그쪽에만 둠 — 중복 기록 안 함).\n\n같은 프로젝트에서 3~6번도 전부 실제로 확인됨(2026-08-25~26). 3번은 프리셋/\n명령어마다 저장돼 있던 리터럴 경로를 전부 제거하고 `db/project_roots.py`\n(사용량 카운트+세션형 활성 루트, 클로드 코드 세션 전환과 동일한 발상)로\n전환 — `backend/runner.resolve_path()`가 저장된 값과 무관하게 항상 활성\n루트로 수렴하도록 변경. 4번은 스크린샷 캡처 중 런처 상태줄에 실경로가\n찍힌 걸 2번(액션바, 위험명령 확인) 발견해서 캡처 후 크롭으로 조치. 5번은\nLemon Squeezy가 계정 단위로 보이는 429(모바일 등 다른 네트워크에서도\n동일 재현 — IP 문제 아님, 지원 문의로 대응 전환) + Hacker News/Indie\nHackers 둘 다 신규 계정이라 \"계정이 너무 새로움\" 사유로 글 작성 자체가\n막힘(활동 이력 쌓일 때까지 대기, 억지 댓글 금지) 확인. 6번은 비교\n가능한 인디 보일러플레이트 시세($49~249) 조사 후 하단($59)에서 시작,\nGumroad(수수료 10%)를 1차 채널로 실제 게시까지 완료. 상세는\n그 프로젝트 설계도의 D-035, H-025~030 및 신규 `dev_shortcuts_판매전략.md`\n참고.\n\n7번은 다른 프로젝트(SSOT_Explorer, `Lazzy_App_OS_Monorepo\\productized\\\ndev_infra_tooling_kit\\ssot_explorer`)에서 확인됨(2026-08-26) —\n`dev_console_server.py`가 \"로컬 전용(127.0.0.1 기본 바인드)이라 토큰\n인증 없이 시작한다\"고 코드 docstring에 명시적으로 근거까지 남겨둔\n의도적 설계였는데, 이 모듈이 `productized/`로 나가는 판매용 소스가\n되면서 그 근거(원저자 본인 환경)가 더 이상 안 맞게 됨. `start()`/\n`serve_forever()`의 `require_auth` 기본값을 `True`로 뒤집고\n(`secrets.token_urlsafe(24)`로 토큰 자동생성, 모든 요청에\n`?token=...` 또는 `Authorization: Bearer` 요구), `require_auth=False`로\n구버전 동작 복귀 가능하게 유지 — 기존 라우팅 테스트는 이 플래그를\n명시해서 인증과 안 섞이게 격리, 인증 자체는 별도 테스트 클래스로 검증.\n\n**정정(2026-09-07~08, 재확인 필요성의 실제 사례)**: 위 수정은\n`Lazzy_App_OS_Monorepo\\productized\\dev_infra_tooling_kit\\ssot_explorer`라는\n**사본**에만 적용됐고, 그 사본은 이후 디스크에서 삭제됨(경로 자체가\n없어짐, 2026-09-07 재확인). 정작 실제로 배포되는 원본\n(`Plug_In_Global\\SSOT_Explorer\\dev_console_server.py`, `pip install\nssot-explorer[mcp]`로 나가는 그 코드)엔 이 수정이 **한 번도 이관되지\n않았다** — 2026-09-07·09-08 두 세션에 걸쳐 grep(`require_auth`/\n`token_urlsafe`/`Bearer` 전부 매치 없음)과 실제 서버 실행+무인증 curl\n요청(200 OK로 레지스트리 데이터 그대로 반환)으로 재현 확인. **이 문서가\n\"완료\"로 기록한 게 실제 배포 코드에 반영됐다는 보장이 아니라는 뜻** —\n사본/포크에 적용한 수정을 이 문서에 \"완료\"로 적을 땐 어느 경로(원본인지\n사본인지)에 적용했는지까지 명시해야 하고, 원본 코드가 여전히 취약한 채로\n2세션·11커밋 동안 방치됐다는 사실 자체가 \"문서상 완료 = 실제 반영\"이\n아니라는 걸 보여주는 실측 사례다.\n\n**같은 조사 중 발견된 인접 함정(2026-09-08, 별개 취약점)**: 같은\n\"로컬 전용이라 안전하다\"는 전제가 걸린 또 다른 지점 — `corePath`(MCP\n무인 세션 스케줄러가 여는 앱 경로)를 `cmd.exe /K \"cd /d {core_path} &&\n...\"`처럼 f-string으로 셸 명령 문자열에 직접 끼워넣고 있었다.\n`core_path`에 `\"` 한 글자만 섞여도(`C:\\proj\" & calc.exe & \"`) 뒤에\n임의 명령을 이어붙이는 명령 인젝션 — 무인 실행(사람이 매번 확인 안 함)\n이라 더 위험한 유형. 인증 누락과 달리 이건 **알려진 위험문자를 걸러내는\n게 아니라 벡터 자체를 구조적으로 없애는 해법**이 있었다: 경로를\n문자열에 끼워넣지 말고 `subprocess.Popen([...], cwd=core_path)`처럼\nOS가 셸 파싱 없이 처리하는 파라미터로 넘기면 된다(Windows\nCreateProcess의 `lpCurrentDirectory`). 교훈: \"로컬 전용/원저자만 씀\"\n전제가 깨지는 시나리오는 인증 누락 하나가 아니라, 그 전제 위에서 안전\n검증 없이 짜여진 문자열 조합(셸 명령, SQL, 경로) 전부를 의심 대상으로\n넓혀야 한다.\n\n8번은 `Local_APP\\JudgeCal_Athe`(판단보정기)에서 확인됨(2026-09-07~08) —\n\"1인앱→서비스화 전환 우선순위를 정해서, 코드 틀만 먼저 만들고 보안검증은\n서비스화 착수 직전 몰아서 채운다\"는 방향을 사용자가 명시적으로 확정하고\n`서비스화_로드맵.txt`(프로젝트 루트)를 실행 체크리스트로 신설. 안전한\n축(narrative_game/domains의 `owner_user_id` 소유자 검증)은 파라미터\n배선+`# TODO(서비스화 검증)` 주석만 걸고 실제 403 체크는 비워둔 채로 여러\n라운드 진행 — 매 커밋 `pytest` 전체 스위트로 동작 무변화를 확인. 위험한\n축(FastAPI `response_model`)은 처음엔 같은 방식으로 접근하려다, \"response_\nmodel은 필드가 불완전한 채로 걸면 즉시 응답이 잘려나간다\"는 차이를 짚고\n전략을 수정 — 응답 스키마(Pydantic 모델)는 미리 정의해두되 `response_\nmodel=` 파라미터 자체는 안 걸어 실제 라우트 동작에 전혀 영향이 없게\n분리(정의만 있고 부착은 없는 상태). 55개 엔드포인트 규모의 narrative_game\n라운드는 초안 작성을 서브에이전트(fork)에 위임한 뒤 핵심 엔드포인트만\n직접 원본 코드와 대조 검증했는데, 그 검증에서 실제로 결함을 하나 잡음 —\n`SubmitTurnResponse` 초안에 \"엔딩이 난 턴에서만 조건부로 붙는 `ending`\n필드\"가 누락돼 있었음(대량 자동생성 초안이 조건부 필드를 놓치는 전형적\n실패 유형)."}, {"kind": "related", "heading": "관련 문서와 구분", "body": "1번은 `Flutter_시크릿_에셋번들_노출_방지_패턴.md`(빌드 산출물 APK/exe에\nAPI키가 평문으로 굳는 문제)와 다르다 — 그건 \"빌드 결과물\"에 시크릿이\n번들되는 문제고, 이건 \"git 커밋 이력\"에 개인정보가 남는 문제라 발견\n경로(빌드 산출물 리버싱 vs `git log`/`git status` 감사)와 조치(빌드설정\n전환 vs `.gitignore`+히스토리 정리)가 서로 다르다. 또한 `설정경로_\n환경변수_우선순위_폴백_패턴.md`(개인 경로 하드코딩을 애초에 안 하도록\n환경변수 우선+폴백으로 설계하는 예방책)와도 다르다 — 그건 \"처음부터 안\n새게 짜는 법\"이고, 이 문서의 1번은 \"이미 개인용으로 짜여 실사용 중이던\n도구에서 사후에 무엇을 감사해야 하는가\"다."}], "projects": ["JudgeCal_Athe", "Lazzy_App_OS_Monorepo", "SSOT_Explorer"], "links": ["Flutter_시크릿_에셋번들_노출_방지_패턴", "게이트_실패시_열림_패턴"], "updated": "2026-09-08", "tags": ["Windows", "배포·운영", "보안·개인정보"], "tags_overridden": true, "public": true}, {"id": "게이트_실패시_열림_패턴", "title": "레이트리미터/게이트는 자기 자신의 실패를 fail-open으로 (범용)", "short": "게이트는 실패하면 연다", "source": "공용/게이트_실패시_열림_패턴.md", "intro": "호출 횟수 제한, 권한 체크, 어뷰징 방지 게이트 등 \"이 요청을 통과시킬지\n막을지\"를 판단하는 모든 미들웨어/게이트 로직에 적용되는 원칙.", "sections": [{"kind": "problem", "heading": "함정", "body": "레이트리미터가 \"지금까지 몇 번 호출됐는지\"를 확인하려고 DB(Firestore 등)를\n조회하는데, **그 조회 자체가 실패하면(DB 순간 장애 등)** 무엇을 해야 할까?\n아무 생각 없이 짜면 \"확인 실패 = 안전하게 막자\"는 직관으로 요청을 거부하게\n되기 쉽다."}, {"kind": "solution", "heading": "원칙 — 게이트 자신의 인프라 장애는 열림(허용) 쪽으로 넘어진다", "body": "**정상 기능이 미터링 인프라의 일시적 장애 때문에 막히는 것이, 어쩌다 한도를\n살짝 넘는 것보다 나쁘다.** 카운트 조회가 실패하면(카운트가 한도를 넘었다는\n게 확인돼서가 아니라, 확인 자체를 못 해서) 기본값은 **허용**으로 둔다:\n\n```python\ntry:\n    current_count = get_call_count_from_db(user_id)\nexcept InfraError:\n    log.warning(\"호출 카운트 조회 실패 — fail-open으로 허용\")\n    return True  # 막는 게 아니라 허용\nif current_count >= DAILY_LIMIT:\n    return False\nreturn True\n```"}, {"kind": "context", "heading": "언제 반대로(fail-closed) 가야 하는가", "body": "이 원칙은 \"과금/보안이 아니라 남용 방지용 소프트 리밋\"일 때 적용한다.\n반대로 **결제, 인증, 데이터 무결성**처럼 잘못 통과시켰을 때의 비용이 명확히\n더 크면 fail-closed(장애 시 막음)가 맞다 — 예를 들어 \"이 사용자가 유료\n구독자인지\" 확인이 실패했는데 그냥 통과시키면 매출 손실이 생긴다. **판단\n기준**: 이 게이트를 잘못 통과시켰을 때의 비용 vs 정상 요청을 잘못 막았을\n때의 비용을 비교해서, 후자가 더 크면 fail-open, 전자가 더 크면 fail-closed.\n남용 방지/속도 제한류는 대개 전자(정상 사용자 차단 비용)가 더 크다.\n\n**되돌릴 수 없는 외부 행동(메시지 전송·결제 실행 등)을 막는 게이트도 fail-closed다**\n(Market_Agent_App 실측, 2026-10-09). 앱이 사용자 대신 다른 서비스에 메시지를 보내는 경우, 하루 한도·\n전송 간격 게이트의 입력(오늘 보낸 수, 마지막 전송 시각)을 저장소에서 읽는다. 이 읽기가 실패했을 때\n\"0건/기록 없음\"으로 취급해 통과시키면 한도를 확인하지 못한 채 보낸다 — 보낸 메시지는 되돌릴 수 없고\n상대 서비스의 제재(스팸 판정, 계정 정지)로 이어질 수 있어 \"잘못 통과시킨 비용\"이 더 크다. 그래서\n(1) 읽기 실패는 예외로 새게 두지 않고 잡아서 **전송을 막고**, (2) 막은 원인을 오류 로그에 남기며,\n(3) 사용자에게 \"기록을 읽지 못해 안전을 위해 보내지 않았다\" 한 줄을 돌려준다. 읽기 함수를 주입식으로\n받으면 이 실패 경로를 테스트에서 그대로 재현할 수 있다. 같은 맥락의 한계: 기록 저장소 자체가 지워지는\n경우(앱 데이터 삭제, 손상 복구가 박스를 비움)는 읽기 실패가 아니라 \"기록 없음\"으로 보여 막을 수 없다 —\n기록 소실 시 한도가 초기화된다는 점은 알고 두거나, 소실을 감지할 별도 표식이 필요하다."}], "projects": ["Market_Agent_App"], "links": [], "updated": "2026-10-09", "tags": ["게이트", "결제·한도"], "tags_overridden": true, "public": true}, {"id": "결정성게이트_제거_숨은결정론_상실_함정", "title": "비즈니스 룰 하나를 완화/제거했더니, 그 룰과 전혀 무관해 보이는 테스트가", "short": "룰 제거로 숨은 결정론 상실", "source": "공용/결정성게이트_제거_숨은결정론_상실_함정.md", "intro": "# 간헐적으로 실패하기 시작한다면 — RNG를 \"우연히 가려주던\" 조건일 수 있다\n# (범용)\n\n시드 안 된(unseeded) 난수를 쓰는 결정 함수가 있고, 그 함수 앞에 \"조건을 못\n채우면 항상 거절\"류의 비즈니스 룰 게이트가 달려 있을 때, 그 게이트는 원래\n의도한 비즈니스 로직 역할 외에 **부수적으로 테스트 결정론을 공짜로 보장하는\n역할**도 하고 있을 수 있다. 이 게이트를 나중에 완화/제거하면(예: \"이제는 조건을\n못 채워도 다른 수단으로 보완해서 진행 가능\") 원래 로직은 의도대로 바뀌지만,\n그 공짜 결정론까지 같이 사라진다 — 그리고 이 결정론이 실제로 어디서 쓰이고\n있었는지는 그 게이트를 만든 사람도 몰랐을 수 있다(애초에 의도한 게 아니라\n우연한 부수효과이므로).", "sections": [{"kind": "problem", "heading": "왜 원인 추적이 어려운가", "body": "- 게이트를 바꾼 커밋과 실패하는 테스트가 **같은 파일도, 같은 기능 영역도\n  아니다** — 실패하는 테스트는 그 결정 함수를 직접 테스트하는 게 아니라, 그\n  함수가 내부적으로 호출되는 더 큰 흐름(예: 시즌 전환, 배치 처리)을 시드 안\n  된 RNG로 실행하면서 \"이 부분은 어차피 항상 같은 결과가 나오겠지\"라고 암묵\n  적으로 가정하고 있었을 뿐이다.\n- 실패가 **확률적**이다 — 게이트가 막던 조건이 이제는 \"가끔 통과\"로 바뀌므로,\n  같은 테스트를 10번 돌리면 9번은 통과하고 1번만 실패하는 식이 된다. 단발성\n  실행에서는 \"일시적 flaky\"로 오인하고 재시도만 하고 넘어가기 쉽다.\n- 실패 메시지 자체는 게이트와 전혀 무관한 값 불일치로 보인다(예: \"칩이\n  0이어야 하는데 다른 값이 나왔다\") — 원인이 \"그 캐릭터가 우연히 이번엔 뭔가를\n  사버렸다\"라는 걸 스택트레이스만으로는 알기 어렵다."}, {"kind": "solution", "heading": "탐지/완화 방법", "body": "1. 어떤 게이트(조건부 이른 반환)를 완화/제거할 때, 그 함수가 **RNG를 쓰는\n   시드 안 된 호출부**를 갖고 있는지 먼저 확인한다 — 있다면 그 게이트가\n   \"이 조건에서는 RNG 결과와 무관하게 항상 같은 답\"을 보장하던 자리였을\n   가능성을 의심한다.\n2. 의심되는 변경 이후, 영향받을 수 있는 테스트 파일을 **여러 번 반복 실행**해\n   본다(고정 시드가 아니라 진짜 무작위 실행으로) — 한 번 통과했다고 안전하다고\n   판단하지 않는다. 확률이 낮은 조합은 수십 번 중 한 번만 걸릴 수 있다.\n3. 실패가 재현되면, 그 무관한 테스트가 정말로 \"이 결정 함수의 결과\"까지\n   검증하려는 의도였는지, 아니면 단순히 \"다른 걸 테스트하는 동안 이 부분은\n   안 건드려지길 바랐을 뿐\"인지 구분한다. 후자라면 그 테스트 파일 범위에서만\n   해당 결정을 고정하는 격리 장치(예: 그 결정 함수를 항상 같은 값을 반환하게\n   덮어쓰는 테스트 전용 우회 픽스처)를 추가해 원래의 \"공짜 결정론\"을 명시적\n   으로 복원한다 — 실제 프로덕션 로직은 건드리지 않는다."}, {"kind": "case", "heading": "실측(poker_app, 2026-09-14)", "body": "NPC가 상점에서 아이템을 살지 결정하는 함수에 원래 \"잔액이 부족하면 항상\n거절\"(RNG 호출조차 안 함)이라는 게이트가 있었다. 이후 \"잔액이 부족해도 대출로\n충당해서 구매를 강행할 수 있다\"는 새 기능을 넣으면서 이 게이트를 제거했더니,\n전혀 다른 관심사(시즌 리셋 로직만 검증하던 테스트 파일)가 시드 안 된 RNG 때문에\n간헐적으로 실패하기 시작했다 — 그 파일이 건드리는 캐릭터가 우연히 이번엔 그\n구매 결정에서 \"예\"가 나와 버려 칩/스탯이 테스트 기대값과 어긋난 것. 같은\n테스트를 3회 반복 실행해 재현을 확인한 뒤, 그 테스트 파일 전용 자동 적용\n픽스처로 관련 결정 3개를 항상 \"거절\"로 고정해 해결했다(실제 상점 로직은\n무변경)."}], "projects": ["poker_app"], "links": [], "updated": "2026-09-14", "tags": ["게이트", "테스트"], "tags_overridden": true, "public": true}, {"id": "공유계약_오케스트레이션_경유_접근_패턴", "title": "여러 모듈이 참조하는 공유 계약(contract) 레이어는 한 경유지를 통해서만 (범용)", "short": "공유 계약은 한 경유지로", "source": "공용/공유계약_오케스트레이션_경유_접근_패턴.md", "intro": "스택/정책/폴백 설정처럼 여러 레이어가 공통으로 참조하는 \"계약\" 데이터를 가진\n프로젝트에 적용되는 접근 통제 패턴.", "sections": [{"kind": "problem", "heading": "문제", "body": "공유 계약 값(설정, 정책, 스택 선택 등)을 아무 모듈에서나 직접 import해서\n쓰게 허용하면, 시간이 지날수록 \"어디서 이 값을 쓰고 있는지\"를 추적하기\n어려워진다 — 계약을 바꿀 때 영향 범위를 사람이 전부 grep해서 찾아야 하고,\n빠뜨리면 조용히 어긋난다."}, {"kind": "solution", "heading": "해법 — 공유 계약은 오케스트레이션 레이어만 직접 참조하고, 나머지는", "body": "오케스트레이션을 거쳐서만 접근\n\n```\n전역설정/오케스트레이션 ──(직접 import)──▶ 계약(스택/정책/폴백)\n       │\n       └─(파이프라인 조립 시 전달)──▶ 로직/파이프라인 (계약을 직접 import 안 함)\n```\n\n계약 레이어를 직접 import할 수 있는 곳을 오케스트레이션 하나로 좁히면,\n\"이 계약이 실제로 어디서 쓰이는지\" 확인할 때 오케스트레이션 레이어 하나만\n보면 된다 — 계약을 바꿀 때 영향 범위 파악 비용이 \"전체 코드베이스 grep\"에서\n\"오케스트레이션 파일 하나 확인\"으로 줄어든다."}, {"kind": "solution", "heading": "부가 패턴 — 데이터플로우 로그를 에러 로그와 별도로 남긴다", "body": "런타임 에러 로그, 오류 지점 등록과는 별개로, **\"이 요청이 어느 레이어를\n거쳐갔는지\"만 기록하는 세 번째 로그**를 두면 레이어 간 의존 관계가 실제로\n꼬였는지(예: 로직이 계약을 우회해서 직접 접근했는지) 사후에 진단할 수 있다.\n에러가 안 났어도 \"설계한 경로대로 흘렀는지\"를 확인하고 싶을 때 유용 —\n평소엔 안 봐도 되지만, 레이어 위반 의심이 들 때 첫 번째로 열어보는 자료가\n된다."}], "projects": [], "links": [], "updated": "2026-08-19", "tags": ["설계·구조"], "tags_overridden": true, "public": true}, {"id": "공유상수_재사용_캐스케이드_함정", "title": "여러 시스템이 같은 상수를 재사용 중이면, 값 하나를 바꿀 때 \"그 상수를", "short": "공유 상수 변경의 연쇄", "source": "공용/공유상수_재사용_캐스케이드_함정.md", "intro": "# 참조하는 다른 계산식\"까지 전부 확인해야 한다 (범용)\n\n한 상수(가격, 배율, 임계값 등)를 처음 만들 때는 특정 용도 하나(\"이 상품의\n가격\")만 염두에 두고 만들지만, 이후 다른 기능을 추가하면서 \"이미 있는 값을\n재사용하자\"는 합리적 판단으로 그 상수를 전혀 다른 계산식(예: 주기적 유지비\n산정)에도 끌어다 쓰는 경우가 흔하다. 문제는 이 재사용 관계가 **코드베이스\n전체를 grep하기 전까지는 눈에 안 보인다**는 것 — 원래 용도만 생각하고 값을\n바꾸면, 재사용 중이던 다른 계산식이 조용히 같이 바뀐다.", "sections": [{"kind": "problem", "heading": "왜 놓치기 쉬운가", "body": "- 상수 이름 자체가 원래 용도를 가리킨다(예: `아이템_구매_가격`). 이 이름만\n  보고 \"이건 그 용도로만 쓰이겠지\"라고 가정하기 쉽다 — 실제로는 다른 함수가\n  \"어차피 같은 상품이니까\"라는 이유로 그대로 import해서 자기 계산식에 곱하고\n  있을 수 있다.\n- 값을 바꾸는 시점의 작업 맥락(예: \"상점 가격을 올리자\")은 재사용 지점의\n  맥락(예: \"회사 유지비 계산\")과 완전히 무관해 보여서, 바꾸는 사람의 머릿속\n  체크리스트에 재사용 지점이 아예 없다.\n- 타입체커/린터는 이 문제를 못 잡는다 — 상수 하나를 여러 곳에서 import해 쓰는\n  건 문법적으로 완전히 정상이라 아무 경고도 안 뜬다. 유일한 신호는 그 재사용\n  지점의 테스트가 **하드코딩된 기대값**을 갖고 있어서 실패하는 것뿐이다."}, {"kind": "solution", "heading": "탐지/완화 방법", "body": "1. **공유 상수의 값을 바꾸기 전에, 그 상수 이름으로 코드베이스 전체를 먼저\n   grep한다** — import 목록에 그 상수가 등장하는 모든 파일을 확인하고, 원래\n   의도한 용도 외에 다른 계산식에서도 쓰이고 있는지 미리 파악한다.\n2. 재사용 지점을 찾았으면, 그 지점의 로직이 **의도적으로 같은 값을 공유해야\n   하는 관계**(예: \"같은 상품이니 같은 가격이어야 함\")인지, 아니면 우연히\n   값이 같아서 재사용했을 뿐 실제로는 독립적으로 바뀌어야 하는 관계인지\n   구분한다 — 전자면 값 변경이 두 곳 모두에 전파되는 게 맞고, 후자면 재사용을\n   풀고 별도 상수로 분리해야 한다.\n3. 값을 바꾼 뒤 전체 테스트를 돌려 **하드코딩된 기대값을 가진 무관해 보이는\n   테스트가 실패하는지** 확인한다 — 이 실패가 \"재사용 지점을 못 찾았다\"는\n   가장 확실한 사후 신호다. 실패한 테스트를 그냥 새 값으로 고치기 전에, 왜\n   그 계산식이 이 상수를 쓰고 있었는지부터 읽어본다(의도적 공유였는지 재확인)."}, {"kind": "case", "heading": "실측(poker_app, 2026-09-14)", "body": "상점의 \"랜덤 박스\" 가격 상수를 올렸는데(플레이어/NPC 공용 가격), 같은 상수가\n전혀 다른 기능인 \"회사 레벨업 시 의무적으로 사야 하는 박스 개수 × 단가\" 계산\n에도 재사용되고 있었다 — 회사 레벨 유지비를 검증하는 테스트 6개가 하드코딩된\n기대값(구 가격 기준)으로 인해 일괄 실패하면서 발견. 두 계산식이 \"같은 상품이니\n같은 가격을 써야 한다\"는 의도적 공유 관계였음을 확인하고, 실패한 테스트들의\n픽스처/기대값을 새 가격 기준으로 재계산해 수정했다 — 상수 재사용 자체는 유지\n(분리하지 않음)."}], "projects": ["poker_app"], "links": [], "updated": "2026-09-14", "tags": ["설계·구조"], "tags_overridden": true, "public": true}, {"id": "공유파일_레지스트리_동시쓰기_OCC_재시도_패턴", "title": "여러 프로세스가 같은 JSON/파일 레지스트리를 쓸 때 — 원자적 쓰기만으론 안 된다", "short": "공유 파일 동시 쓰기(OCC)", "source": "공용/공유파일_레지스트리_동시쓰기_OCC_재시도_패턴.md", "intro": "", "sections": [{"kind": "problem", "heading": "문제", "body": "GUI/CLI/MCP서버/백그라운드 워치독처럼 서로 다른 프로세스 여러 개가 같은\n설정/레지스트리 파일(JSON 등) 하나를 읽고 쓸 수 있을 때, \"임시파일에 쓰고\n`os.replace()`로 교체\"하는 원자적 쓰기만 해두면 안전하다고 착각하기 쉽다.\n원자적 쓰기는 \"쓰다가 중간에 깨진 파일이 남는\" 문제만 막지, \"A가 읽은\n뒤 B가 먼저 저장하고, A가 그걸 모른 채 자기 스냅샷으로 마저 저장해서\nB의 변경을 통째로 덮어쓰는\" 손실갱신(lost update)은 전혀 못 막는다 —\n쓰기 자체는 매번 원자적으로 \"성공\"하기 때문에 에러도 안 나고 조용히\n사라진다."}, {"kind": "problem", "heading": "원인", "body": "read-modify-write(읽고 → 메모리에서 고치고 → 통째로 다시 씀) 패턴에서,\n\"쓰기 직전에 디스크가 여전히 내가 마지막으로 읽었던 그 상태인지\"를\n확인 안 하면 이 손실갱신이 구조적으로 발생한다. 특히 \"필드 하나만\n갱신\"하는 헬퍼 함수(예: `save_core_path(entry)`처럼 어떤 하위 섹션\n전체를 통째로 교체하는 함수)는 그 섹션 안의 리스트에 항목을 append하는\n용도로도 쓰이는데, 이러면 \"다른 프로세스가 그 사이 같은 섹션에 다른\n항목을 추가했는지\"를 안 보고 내 스냅샷 기준으로 섹션 전체를 덮어써서\n방금 추가된 항목이 사라진다."}, {"kind": "solution", "heading": "해법 — 두 축으로 나눠서 다르게 처리", "body": "**축 1 — 낙관적 동시성 제어(OCC)**: 프로세스가 파일을 읽을 때마다 그\n시점의 전체 파일 해시(sha256 등)를 기억해두고, 쓰기 직전에 디스크의\n현재 해시와 비교한다. 다르면(그 사이 누군가 저장했다는 뜻) 그냥\n덮어쓰지 않고 막는다 — 파일 하나를 통째로 해시 비교하므로, 그 파일\n안의 어느 섹션을 쓰든 전부 같은 매커니즘 하나로 보호된다(섹션마다\n따로 락을 만들 필요 없음).\n\n**축 2 — 충돌 시 동작을 \"덮어쓰기냐 append냐\"로 갈라라**:\n- **사람이 편집 중인 배열을 통째로 교체하는 함수**(예: \"루트 목록을\n  이걸로 바꿔줘\")는 충돌 나면 **그냥 멈추고 에러를 올린다** — 어느 쪽\n  버전이 맞는지는 사람이 판단해야 하므로 자동으로 아무거나 선택하면\n  안 된다(\"새로고침 후 다시 시도하세요\"류 메시지).\n- **append 전용 함수**(예: \"이 항목 하나만 큐에 추가해줘\")는 충돌 나도\n  **최신 상태를 다시 읽어서 자동 재시도**해도 안전하다 — 내가 추가하려는\n  항목과 다른 프로세스가 추가한 항목은 서로 무관해서 병합에 애매함이\n  없다(단, 최대 재시도 횟수는 둬서 무한루프는 방지). \"삭제 전용\" 함수\n  (예: \"이 ID만 큐에서 지워줘\")도 같은 이유로 재시도 안전.\n\n판단 기준: \"충돌했을 때 최신 상태를 다시 읽어서 내 변경을 그대로\n재적용해도 두 변경이 자동으로 합쳐지는가?\" — 그렇다면 재시도, 아니면\n사람에게 멈추고 물어본다."}, {"kind": "other", "heading": "일반화", "body": "- 원자적 쓰기(temp+replace)와 동시성 제어(OCC/락)는 **서로 다른 문제를\n  푼다** — 하나가 있다고 다른 하나가 공짜로 따라오지 않는다.\n- 파일 전체 해시 하나로 여러 섹션(예: `roots`/`labeledFolders`/\n  `corePath`)을 동시에 보호할 수 있다 — 섹션마다 별도 메커니즘을 새로\n  발명할 필요 없이, 이미 있는 OCC 인프라에 그 섹션의 로드/저장 함수만\n  참여시키면 된다.\n- \"이 헬퍼가 덮어쓰기인지 append인지\"부터 먼저 분류하면, 충돌 시\n  자동재시도(안전)와 사람에게 묻기(필요) 중 뭘 골라야 하는지가 거의\n  자동으로 정해진다.\n- 새 헬퍼 함수를 추가할 때 \"지금 이 파일을 쓰는 프로세스가 정말 하나뿐인가\"\n  를 스스로 물어보는 습관이 안전하다 — \"지금은 GUI 하나뿐\"이라도, 같은\n  파일에 쓰기용 API(MCP tool 등)가 나중에 하나만 더 생겨도 바로\n  손실갱신 시나리오가 열린다. 다만 실제로 다중 프로세스가 이미 쓰고\n  있는 게 확인된 경우(아래 실측 참고)에 우선 적용하고, 아직 단일\n  프로세스만 쓰는 헬퍼까지 미리 다 OCC로 감싸는 건 과설계일 수 있다 —\n  근거 없이 방어부터 깔지 말 것."}, {"kind": "case", "heading": "실측 사례", "body": "SSOT_Explorer(D-096, 2026-09-04) — `pendingActions`(GUI/CLI/MCP/워치독\n4개 프로세스가 전부 쓸 수 있는 append 전용 큐)에 OCC를 걸되, 충돌 시\n멈추는 대신 최신 상태를 다시 읽어 재시도하게 설계 — 무인 워치독이 매일\n스케줄러로 도는데 사람의 GUI 저장과 우연히 겹쳐 그냥 에러로 멈추면 그날\n찾은 발견사항이 로그도 없이 전부 사라지는 게 실제 위험 시나리오였음.\n`roots`(사람이 편집)는 반대로 충돌 시 그냥 멈추는 쪽 유지.\n\nSSOT_Explorer(D-112, 2026-09-08) — 코드 정밀분석 중 `corePath`(MCP\n`/shortcut`·`/snippet`이 읽는 경로+명령/문구 등록)의 저장 함수가\nD-096과 똑같은 구조(GUI 폼에서 append)인데도 OCC가 아예 빠져있는 걸\n발견 — \"developerMode 토글처럼 위험이 낮다\"고 판단해 의도적으로 뺐던\n결정이었는데, 실제로 두 프로세스가 같은 스냅샷에서 읽고 순서대로 쓰는\n경쟁조건을 직접 재현해보니 먼저 등록한 항목이 조용히 사라지는 게\n재현됐다. `pendingActions`와 동일한 OCC+재시도 패턴을 그대로 재사용해\n승격 — 새 메커니즘을 발명하지 않고 이미 검증된 것과 같은 함수(파일\n해시 추적 dict)에 새 로드/저장 함수만 참여시키는 방식이라 비용이\n거의 없었다."}, {"kind": "related", "heading": "관련 문서와 구분", "body": "`게이트_실패시_열림_패턴.md`(같은 폴더)는 \"인프라 조회 자체가 실패했을\n때\" 열지 막을지를 다룬다 — 이 문서는 \"쓰기가 성공은 했는데 순서가 꼬여서\n내용이 사라지는\" 문제라 다르다. `설정경로_환경변수_우선순위_폴백_패턴.md`\n와도 다르다 — 그건 \"경로를 어디서 찾는가\"고, 이건 \"같은 파일을 여러\n프로세스가 쓸 때 서로를 어떻게 안 덮어쓰는가\"다."}], "projects": ["SSOT_Explorer"], "links": ["게이트_실패시_열림_패턴", "설정경로_환경변수_우선순위_폴백_패턴"], "updated": "2026-09-08", "tags": ["Python", "설계·구조"], "tags_overridden": true, "public": true}, {"id": "다중클라이언트_규칙은_서버한곳_게임판정_도우미대사_패턴", "title": "앱·웹 두 클라이언트가 같은 규칙을 쓸 때 — 판정·대사는 서버 한 곳, 클라이언트는 보여 주기만", "short": "규칙 판정은 서버 한 곳에", "source": "공용/다중클라이언트_규칙은_서버한곳_게임판정_도우미대사_패턴.md", "intro": "", "sections": [{"kind": "problem", "heading": "문제", "body": "처음엔 앱 하나라 \"기록으로 계산하는 값\"(배지, 연속 기록, 체력, 콤보, 안내 문구)을 앱 로직 레이어에서 계산해도 충분하다.\n그런데 웹(다른 언어·다른 프레임워크) 클라이언트를 따로 만드는 순간 **같은 규칙이 두 벌**이 된다.\n한쪽만 고치면 같은 계정인데 앱과 웹이 다른 콤보·다른 체력·다른 안내를 보여 준다.\n\n**실측(RVS_App, 2026-11-02~06)**: 격파(오늘의 몬스터·보스 체력 3칸·콤보·도감) 판정을 앱 `logic/battle.dart`에 먼저 만들었다.\n같은 날 웹을 Flutter가 아닌 Vite+TypeScript로 따로 만들기로 하면서 판정을 서버 `battle.py`로 옮겼다(앱은 응답 읽기만).\n뒤이어 만든 도우미(규칙 기반 안내 문구)는 처음부터 서버 한 곳(`POST /helper`)에 두어 앱·웹이 같은 말을 한다."}, {"kind": "context", "heading": "언제 서버로 옮기나(판단표)", "body": "| 조건 | 서버 한 곳 | 클라이언트 계산으로 둠 |\n|---|---|---|\n| 클라이언트가 둘 이상(언어가 다르면 특히) | ✅ | |\n| 나중에 보상·과금이 붙는다(크레딧, 해금) | ✅ 부정 방지도 서버 몫 | |\n| 규칙·문구를 자주 바꾼다 | ✅ 배포 한 번으로 양쪽 반영 | |\n| 기기에만 의미가 있는 값(알림 본 여부, 연출 속도) | | ✅ 기기 저장 |\n| 오프라인에서도 바로 보여야 한다 | | ✅ (서버 결과를 캐시) |"}, {"kind": "solution", "heading": "패턴", "body": "1. **계산은 순수 함수 하나**: `compute_x(입력 목록, 기준일) -> dict`. DB·네트워크를 모르는 함수라 시험이 쉽다(클라이언트에 있던 시험 사례를 그대로 서버 시험으로 옮긴다).\n2. **엔드포인트는 읽기 전용 + 재료 수집만**: 기존 표를 읽어 재료를 모으고 `compute_x`에 넘긴다. **DB 변경 없이** 시작한다(새 표가 필요해지면 그때).\n3. **기준일은 클라이언트가 보낸다**(`?day=YYYY-MM-DD`): 서버 시각대와 사용자 시각대가 다르면 \"오늘\"이 어긋난다. 저장 시각에 시간대가 없으면 배포 서버(UTC)에서 자정~오전 9시가 하루 밀린다 — 배포 전에 `TZ`나 저장 형식을 정한다.\n4. **클라이언트 모델은 fromJson만**: 앱 로직 레이어에는 응답 모델만 남기고 계산 함수를 지운다. 클라이언트 시험은 \"응답을 읽는다\"로 바꾼다.\n5. **\"한 번만 알림\" 같은 기기 상태는 클라이언트에**: 서버는 도감 항목에 고정 id(`monster:<세션>`, `boss:<세션>`)를 주고, 클라이언트는 본 id 집합만 기기에 저장한다.\n6. **안내 문구(도우미)도 같은 원칙**: `{where, 화면 맥락}` → `{name, messages:[{id, text, action:{kind,…}}]}`. 클라이언트는 말풍선과 버튼만 그리고, `action.kind`(open_profile/memo/open_boss…)를 자기 화면 이동에 잇는다. 사용자가 쓴 글(고민 등)은 **주소(쿼리)가 아니라 본문**으로 보낸다."}, {"kind": "problem", "heading": "함정", "body": "- **규칙을 바꾸면 과거 판정도 바뀐다**: 판정이 \"그날의 몬스터 = 날짜 해시로 고른 풀 항목\"처럼 매번 다시 계산되는 구조면, 고르는 규칙(예: 직업 우선)을 바꾸는 순간 지난날 격파가 보스로 바뀐다(RVS 실측 1건). 과거를 고정하려면 그날 고른 것을 저장해야 한다 — 바꾸기 전에 감수할지 정한다.\n- **한 번 옮기고 나서 클라이언트에 계산을 다시 들이지 않는다**: \"빨리 보이게\"를 이유로 클라이언트에 규칙 복사본을 두면 원점이다. 빠르게 보이려면 서버 결과를 캐시한다.\n- **메모리·네트워크 실패에 화면이 막히지 않게**: 판정·대사 요청이 실패하면 그 줄/말풍선만 숨기고 나머지 화면은 그대로 쓴다."}, {"kind": "checklist", "heading": "체크리스트", "body": "- [ ] 계산 함수가 순수 함수이고 서버 시험이 있다(클라이언트 사례 이식)\n- [ ] 엔드포인트가 읽기 전용이고 DB 변경이 없다(필요하면 따로 승인)\n- [ ] 기준일을 클라이언트가 보내고, 서버 시각대 문제를 배포 문서에 적었다\n- [ ] 클라이언트에는 모델·표시만 남았다(계산 함수 삭제)\n- [ ] 사용자 글은 요청 본문으로만 보낸다"}], "projects": ["RVS_App"], "links": [], "updated": "2026-11-06", "tags": ["FastAPI", "Flutter", "웹", "설계·구조"], "tags_overridden": true, "public": true}, {"id": "다중클래스_유사블록_반복치환_경계혼동_함정", "title": "한 파일에 클래스가 여러 개일 때 유사 블록을 반복 치환하면 괄호가 엉뚱한 클래스로 샌다 (범용)", "short": "비슷한 블록 반복 치환 사고", "source": "공용/다중클래스_유사블록_반복치환_경계혼동_함정.md", "intro": "중괄호/괄호로 블록을 구분하는 언어(Dart/JS/Java/C++ 등, 들여쓰기만으로\n스코프를 정하는 Python은 이 함정에서 자유롭다)에서, **한 파일 안에 비슷하게\n생긴 블록이 여러 클래스에 걸쳐 여러 번 등장**할 때(예: 여러 위젯 클래스가\n각자 비슷한 구조의 콜백/빌더를 갖고 있는 UI 코드) 반복되는 편집 실수.", "sections": [{"kind": "problem", "heading": "함정", "body": "같은 패턴(예: \"GestureDetector로 감싸진 위젯을 InkWell로 교체\")을 파일 안\n여러 곳에 순서대로 적용하다 보면, 지금 편집 중인 블록이 **어느 클래스에\n속하는지**를 놓치기 쉽다. 특히 두 블록이 코드 모양은 비슷한데 실제로는 서로\n다른 클래스(예: `_ActionRowState`와 `_EVBreakdownState`)에 속해 있으면,\n\"열었으니 닫아야 할 괄호 개수\"를 세다가 실수로 **다른 블록/다른 클래스의\n끝부분에** 괄호를 추가하게 된다. 이 실수는 문법적으로는 종종 유효한 채로\n남는다(괄호 개수 자체는 맞아떨어질 수 있음) — 컴파일러/린터가 즉시 정확한\n위치를 짚어주지 않는 한, 원인이 수십~수백 줄 떨어진 곳에 있어 디버깅이\n오래 걸린다."}, {"kind": "solution", "heading": "해법", "body": "1. 한 파일에서 비슷한 블록을 여러 번 고칠 계획이면, 먼저 `grep -n \"^class \"`\n   (또는 해당 언어의 클래스/함수 선언 패턴)로 **파일 안의 클래스/함수 경계를\n   전부 나열**해두고, 지금 편집하는 줄 번호가 어느 경계 안에 있는지 항상\n   확인한다.\n2. 편집 하나를 끝낼 때마다(파일 전체를 다 고치고 나서 한 번에 검사하지 말고)\n   그 파일 하나만 즉시 정적 분석/컴파일(`flutter analyze <파일>`,\n   `tsc --noEmit <파일>` 등 파일 단위 지원 시)한다 — 실수가 있으면 다음\n   블록으로 넘어가기 전에 바로 드러나서, 원인을 그 직전 편집 하나로 좁힐 수\n   있다. 전체 프로젝트 분석은 그 다음(개별 파일들을 이미 검증한 뒤 최종\n   확인용)으로 미룬다.\n3. 실수를 발견했다면, \"어느 클래스에 몇 개 열림/닫힘이 있어야 하는지\"를 다시\n   세는 대신 방금 편집한 두 블록의 diff를 나란히 보면서 어느 쪽에 괄호가\n   잘못 갔는지부터 확인한다 — 대부분 \"가장 최근에 편집한 두 블록 중 하나\"에\n   있다."}, {"kind": "case", "heading": "실측 사례 (poker_app, ADR-123, 2026-09-14)", "body": "`hand_review_screen.dart`에서 GestureDetector 2곳을 InkWell로 바꾸는 작업\n중, 서로 다른 클래스(`_ActionRowState`의 행 전체 탭 영역, `_EVBreakdownState`\n안의 \"재생\" 버튼)에 속한 블록을 같은 함수 안이라고 착각해 첫 번째 블록을\n감싸며 추가한 닫는 괄호를 실제로는 파일 뒷부분의 `_EVBreakdownState` 클래스\n끝에 잘못 추가했다. `flutter analyze`를 파일 단위로 즉시 돌리는 습관 덕에\n전체 프로젝트 분석 전에 바로 컴파일 에러로 드러났고, `grep -n \"^class \"`로\n클래스 경계를 재확인해 올바른 위치로 옮겨 수정했다."}], "projects": ["poker_app"], "links": [], "updated": "2026-09-14", "tags": ["AI 에이전트"], "tags_overridden": true, "public": true}, {"id": "데이터이전_검증_부분문자열존재확인_거짓통과_원본삭제전_양방향대조_패턴", "title": "데이터 이전 검증 — \"값이 원본 어딘가에 있다\"는 확인은 한 글자 값도 통과시킨다 + 원본 삭제 전 양방향 대조 (범용)", "short": "데이터 이전 검증", "source": "공용/데이터이전_검증_부분문자열존재확인_거짓통과_원본삭제전_양방향대조_패턴.md", "intro": "평문 파일의 값을 새 저장소(암호화 저장소, DB 등)로 옮기고 **원본을 지우는** 작업에서, 검증이 약하면 손상된 이전을\n\"전부 일치\"로 보고하고 원본까지 지워 되돌릴 수 없게 된다. 실측에서 이전 직후 \"14개 모두 원본과 일치\"라고 보고했는데\n3개가 한 글자로 저장돼 있었고, 원본 삭제 직전의 대조에서 **이전 도중 사용자가 원본에 새로 적은 값 2개**까지 발견됐다.", "sections": [{"kind": "checklist", "heading": "함정 1 — 부분문자열 존재 확인(`Contains`)은 짧은 값을 전부 통과시킨다", "body": "```powershell\n$ok = $allSourceText.Contains($migratedValue)      # ← \"원본 어딘가에 이 문자열이 있다\"\n```\n\n이전된 값이 **한 글자**(`백`)여도, 원본 텍스트 전체에 그 글자가 어딘가 있으니 `True`다. 파싱 버그로 값이 잘리거나 비어도\n(`''.Contains` 계열은 항상 참) 이 검증은 못 잡는다.\n- 해결 ①: **길이 하한 + 전체 일치**를 같이 본다 — 값이 기대 형식의 최소 길이 이상인지, 원본의 \"라벨 뒤 부분 전체\"와 같은지.\n  원본 줄에서 구분자(`:`/`=`) 뒤를 잘라 후보 집합을 만들고 `HashSet.Contains(전체 값)`으로 **완전 일치**만 인정한다.\n- 해결 ②: 값을 출력하지 않는 대신 **길이를 표로 출력**하고 사람이 상식으로 훑는다(압축 비번 11자, 키 44자, 이메일 18자 …\n  한 자리 숫자가 보이면 즉시 이상). 길이 표는 한 글자 버그를 가장 싸게 드러낸다.\n- 해결 ③: 한 줄짜리·빈 값 같은 **경계 입력을 테스트 데이터에 일부러** 넣는다(원인이었던 PowerShell 단일 요소 배열 풀림은\n  `PowerShell_5_1_조용히_틀리는_함정_모음.md` 함정 1)."}, {"kind": "problem", "heading": "함정 2 — 정방향 대조만으로는 \"원본에 있지만 옮기지 않은 값\"을 못 찾는다", "body": "정방향(새 저장소의 값 → 원본에 있는가)이 전부 일치해도, **원본에 있는데 파서가 놓친 항목**은 영영 모른다. 원본을 지우면 그 항목이\n사라진다.\n- 역방향: 원본에서 \"비밀처럼 보이는 토큰\"(길이 ≥ 8, 숫자 포함, 영숫자+기호만, 도메인·IP·공개키·날짜 제외)을 뽑아 새 저장소의\n  값/메모 어디에도 없는 것을 센다. **값은 출력하지 않고 `파일:줄번호 (길이)`만** 낸다.\n- 의심 건은 값 대신 **모양**(글자→`a`, 숫자→`9`, 한글→`가`, 기호는 그대로)과 라벨로 정체를 가린다 — 모양 `가가가가 가가 = aaaa9999!%(`\n  만 봐도 \"라벨이 붙은 새 비번 줄\"임을 알 수 있다.\n- 라벨과 값이 붙은 토큰(`KEY=값`)은 `=` 뒤만 대조해 오탐을 줄인다. 오탐은 허용하되 **누락 의심은 0이 될 때까지** 사람이 본다."}, {"kind": "problem", "heading": "함정 3 — 원본은 읽은 뒤에도 바뀐다 (사용자가 같은 파일을 계속 편집 중일 수 있다)", "body": "이전 스크립트를 짠 시점의 스냅샷과 삭제 시점의 원본이 다를 수 있다. 실측: 첫 읽기 이후 사용자가 두 파일에 \"바꿀 예정 비번\" 줄을\n추가했고(수정 시각으로 확인), 역방향 대조가 없었다면 삭제와 함께 사라졌다.\n- 삭제 직전 **마지막으로 대조를 돌리고**, 그 대조 시점의 `LastWriteTime`을 기록해 두었다가 **삭제 순간에 다시 비교**한다 — 하나라도\n  다르면 전부 보류.\n  ```powershell\n  if ((Get-Item $f).LastWriteTime.ToString('MM-dd HH:mm') -ne $expected[$f]) { 보류 }\n  ```\n- 같은 폴더에 **내가 만들지 않은 파일**(0바이트 메모 등)이 있으면 열지도 지우지도 않는다."}, {"kind": "solution", "heading": "순서 — 원본을 지우기까지", "body": "1. 원본 → 중간 형식(JSON 등)으로 **옮긴 뒤**, 새 저장소와 중간 형식을 **사용자가 직접 실행하는 읽기 전용 대조 스크립트**로 비교한다\n   (마스터 비밀번호가 필요한 단계는 에이전트가 대신 못 한다 — 스크립트만 주고 결과를 받는다. 스크립트는 값을 출력하지 않고 `일치/불일치`만).\n2. 원본 ↔ 중간 형식을 **양방향 대조**한다(위 함정 1·2).\n3. 사용자의 **명시적 삭제 승인** + 수정 시각 가드(함정 3) 통과 시에만 삭제한다. 삭제 후에도 중간 형식 사본이 남아 있으니, 그 평문 사본은\n   새 저장소 가져오기·백업(USB) 뒤에 별도로 지운다.\n4. 어떤 단계에서든 \"전부 일치\" 보고는 **어떤 검증으로 일치를 봤는지**(길이 하한? 완전 일치? 양방향?)와 함께 한다 — 약한 검증으로\n   한 \"일치\" 보고는 사용자가 원본 삭제를 결정하는 근거가 되므로 가장 위험하다.\n\n관련: `JudgeCal_Athe/레거시_삭제전_라이브데이터_사전조사_패턴.md`(코드/폴더를 지우기 전 사전조사 — 이 문서는 \"데이터 값\"을 옮기고 원본을\n지우는 경우).\n\n**실측 출처**: 개인 보안정보 폴더(`coding_admin`) — 평문 비밀번호 txt → 암호화 저장소 이전(2026-10-20)."}], "projects": ["JudgeCal_Athe"], "links": ["PowerShell_5_1_조용히_틀리는_함정_모음"], "updated": "2026-10-20", "tags": ["로컬 저장소", "테스트"], "tags_overridden": true, "public": true}, {"id": "동시요청_인증복구_가입중복_단일실행_세션번호_패턴", "title": "동시 요청이 함께 인증 거절을 받을 때 — 복구(갱신·기기 가입)는 한 번, 세션 번호로 \"이미 바뀐 세션\"을 가린다 (범용)", "short": "동시 인증 거절 복구", "source": "공용/동시요청_인증복구_가입중복_단일실행_세션번호_패턴.md", "intro": "앱 시작을 빠르게 하려고 요청 여러 개를 동시에 보내는(`Future.wait`, `Promise.all`) 순간, \"401이면 토큰을 갱신하거나 새로 가입하고 다시 보낸다\"는\n요청 단위 복구 로직이 요청 수만큼 돈다. 토큰 갱신은 보통 한 번으로 묶어 두지만, **무계정 기기 가입 같은 다른 복구 경로는 빠지기 쉽다.**", "sections": [{"kind": "case", "heading": "1. 실측 (RVS_App 2026-10-31)", "body": "- 시작 요청 4개(프로필·사용량·동의·관계 목록)를 동시에 보내도록 바꾼 다음 날, 인증 켠 서버에서 첫 실행 → 4개가 함께 `login_required` → 각자 `/auth/device`\n  → **같은 초에 계정 4개**. 3개는 버려진 계정이고, 서버의 IP당 시간당 가입 한도(10회)를 한 번에 4회 쓴다 — 테스터 3명만 같은 와이파이로 열어도 막힌다.\n- 토큰 갱신(`/auth/refresh`)은 이미 공유 Future로 한 번만 하고 있었다. 기기 가입 경로만 그 장치가 없었다.\n- 개발 서버는 개발용 무인증 스위치(추적 안 되는 파일)로 돌아 이 경로를 한 번도 지나지 않았다 — 인증 켠 사본으로 실기기를 돌려서야 보였다\n  (`Flutter_실기기_adb_탭_스크린샷_자동검증_절차.md` \"다른 세션이 작업 중일 때\")."}, {"kind": "solution", "heading": "2. 고치는 법", "body": "1. **모든 복구 경로를 같은 방식으로 한 번만**: 진행 중인 복구 Future를 필드에 두고(`_recovering ??= _doRecover().whenComplete(() => _recovering = null)`),\n   늦게 거절받은 요청은 새로 복구하지 않고 그 Future를 기다린 뒤 다시 보낸다. 갱신·가입·재로그인 판단이 한 함수 안에 있으면 그 함수 하나를 공유한다.\n2. **세션 번호**: 세션이 바뀔 때마다 오르는 정수를 두고, 요청을 보내기 직전 값을 잡아 둔다. 거절이 왔을 때 번호가 이미 달라졌으면\n   (그 사이 다른 요청이 갱신·가입을 끝냈다) 복구하지 말고 새 세션으로 한 번 더 보낸다. 공유 Future만으로는 \"복구가 끝난 **뒤에** 도착한 옛 거절\"을 못 막는다 — 그 요청은 새 복구를 시작한다.\n3. **번호는 새 세션을 저장할 때만 올린다** ⚠️: 옛 토큰을 지울 때 올리면, 가입 요청이 아직 진행 중일 때 도착한 거절이 \"이미 바뀌었다\"로 보고\n   **토큰 없이** 재시도해 또 거절받는다(RVS 첫 수정에서 실기기로 발견 — 동의·관계 목록이 401 두 번 뒤 실패). 지운 상태는 \"바뀐 세션\"이 아니라 \"복구 중\"이다.\n4. **예외 — 다시 로그인해야 하는 사용자**(구글 연결 등 조용히 새 계정을 만들면 데이터가 사라진 것처럼 보이는 경우): 그 경로에서만 지울 때 번호를 올려,\n   뒤늦은 거절이 \"토큰 없음 → 기기 가입\"으로 새지 않게 한다. 공유 Future가 던진 재로그인 예외는 기다리던 요청 모두에 같이 전달된다.\n5. 다시 보내기는 한 번만(재귀 금지). 두 번째도 거절이면 그 응답을 그대로 올린다."}, {"kind": "checklist", "heading": "3. 시험 — 즉시 응답하는 가짜 서버로는 틈이 안 보인다", "body": "목(mock) HTTP가 바로 답하면 거절 4개가 복구 시작 전에 다 도착해 \"가입 1번\"은 통과하지만 3번의 틈은 못 잡는다. `Completer`로 응답 시점을 잡는다:\n- 동시 4개가 함께 거절 → 가입 1번, 4개 모두 성공.\n- **가입 응답을 붙잡아 둔 동안** 다른 요청의 거절을 풀어 준다 → 그 요청이 가입을 기다렸다가 새 세션으로 성공(번호를 지울 때 올리면 여기서 실패).\n- 가입이 끝난 **뒤에** 옛 거절이 도착 → 가입 없이 재시도로 성공.\n- 재로그인 대상 사용자의 동시 거절 → 아무도 가입하지 않고 모두 재로그인 예외.\n각 시험이 수정 전 코드에서 실제로 실패하는지 한 번 돌려 본다(RVS: 앞의 둘이 각각 수정 전 코드에서 실패)."}, {"kind": "checklist", "heading": "4. 함께 확인", "body": "- 서버 쪽: 기기 가입에 IP당 한도가 있으면 클라이언트 중복은 곧 한도 소진이다. 반대로 서버가 같은 기기의 중복 가입을 막아 주길 기대하지 말 것(기기 식별자가 없으면 구분 못 한다).\n- 동시 전송을 넣는 변경(`Future.wait`)을 리뷰할 때 \"이 요청들이 함께 401을 받으면?\"을 체크리스트로 둔다 — 시작 화면뿐 아니라 탭 하나가 요청 여러 개를 동시에 보내는 곳도 같다.\n\n원 소속: RVS_App(2026-10-31, `client/lib/api/api_client.dart` `_recovering`·`_session`, 시험 `client/test/api_auth_test.dart`). JudgeCal 포크 공통 클라이언트라 JudgeCal_Athe에도 같은 구조가 있다 — 동시 전송을 넣었다면 적용 대상."}], "projects": ["RVS_App"], "links": ["Flutter_실기기_adb_탭_스크린샷_자동검증_절차"], "updated": "2026-10-31", "tags": ["Flutter", "FastAPI", "보안·개인정보", "게이트"], "tags_overridden": true, "public": true}, {"id": "문서_전역화_프로젝트특정_잔재_함정", "title": "문서 전역화 프로젝트특정 잔재 함정", "short": "문서 전역화 잔재", "source": "공용/문서_전역화_프로젝트특정_잔재_함정.md", "intro": "특정 프로젝트 전용으로 쓰던 규칙/설계 문서를 여러 프로젝트에 걸친 \"전역\"\n문서로 승격할 때, 그 프로젝트에만 있던 구체적 이름/경로/기술스택 참조가\n일반화되지 않고 그대로 남는 문제.", "sections": [{"kind": "problem", "heading": "증상", "body": "- 문서 제목/취지는 \"범용\", \"전 프로젝트 적용\"이라고 돼 있는데, 본문 어딘가에\n  특정 프로젝트의 파일명·폴더 경로·기술스택(예: 특정 프레임워크 CLI 명령,\n  특정 DB 이름)이 예시가 아니라 규칙 자체인 것처럼 하드코딩돼 있음.\n- 그 문서가 원래 태어난 프로젝트와 다른 스택/구조의 프로젝트에서 열리면, 하드\n  코딩된 부분이 적용 불가능하거나(다른 언어/프레임워크라 명령어 자체가 없음)\n  헷갈리는 옛 이름을 그대로 사용자에게 되묻게 됨.\n- 문서 자체가 참조하는 다른 문서(예: \"OO 비교분석.md 참고\")가 사실은 그\n  기원 프로젝트에만 존재하는 프로젝트별 산출물이라, 승격 이후 다른 맥락에서\n  열면 존재하지 않는 파일을 찾게 됨."}, {"kind": "problem", "heading": "원인", "body": "승격 작업은 보통 \"이 좋은 규칙을 다른 프로젝트에도 쓰자\"는 동기로 이뤄지고,\n승격하는 사람(AI 포함)은 그 문서의 \"취지/구조\"만 보고 승격 여부를 판단하지,\n본문 문장 하나하나가 여전히 원래 프로젝트를 전제로 쓰여 있는지는 잘 안 봄 —\n즉 \"일반화할 가치가 있다\"는 판단과 \"실제로 문장 단위까지 일반화됐다\"는\n확인이 서로 다른 작업인데 하나만 하고 끝내는 경우가 많음."}, {"kind": "checklist", "heading": "체크리스트 (문서를 전역/공용 스코프로 승격하거나, 승격된 문서를 나중에 감사할 때)", "body": "1. 문서 안의 고유명사(프로젝트명/앱명/폴더명)를 전부 훑는다 — 예시로 표시된\n   것과 규칙 그 자체로 박힌 것을 구분한다.\n2. 특정 언어/프레임워크 전용 명령어(빌드/린트/테스트 CLI 등)가 \"이렇게\n   하라\"는 유일한 지시처럼 쓰였는지 확인 — 스택이 다른 프로젝트에서도 그대로\n   따라할 수 있는 형태(예시 나열 + \"실제 스택에 맞는 명령으로 치환\")인지 본다.\n3. 문서가 참조하는 다른 문서/경로가 \"이 승격된 스코프 어디서나 존재하는\n   것\"인지, 아니면 \"원래 기원 프로젝트에만 있는 것\"인지 구분한다 — 후자면\n   조건부 문구(\"해당 프로젝트에 그런 문서가 있다면\")로 바꾸거나 제거한다.\n4. 승격 전 문서에 있던 \"부트스트랩 단계\"(예: \"프로젝트 루트를 모른다,\n   질문해라\")처럼 온보딩 전용 문구가, 승격 후에도 매번 반복 실행되는 문구로\n   남아있지 않은지 확인한다 — 이미 세션이 알고 있는 정보를 다시 묻게 만드는\n   원인이 된다."}, {"kind": "case", "heading": "실측 사례", "body": "2026-08-25 SSOT_Coding_File `.claude` 규칙 4개 문서(설계도 이중계층 프로토콜,\n앱 정밀분석 프롬프트, 클로드 코드 답변 전역규칙, 레이어 분리 방침) 정밀분석\n중, 4개 중 3개에서 이 패턴이 각각 다른 형태로 발견됨 — 옛 프로젝트 문서명\n하드코딩(부트스트랩 절), 특정 프레임워크/DB 전용 빌드·중단 규칙, 존재하지\n않는 프로젝트별 감사문서 참조. 우연이 아니라 \"전역화 리팩터링 시 항상\n누락되는 지점\"으로 확인됨."}], "projects": [], "links": [], "updated": "2026-08-26", "tags": ["Git·문서", "AI 에이전트"], "tags_overridden": true, "public": true}, {"id": "백엔드_필드추가_클라이언트_소비누락_감사_패턴", "title": "백엔드가 응답에 필드를 추가해도, 클라이언트가 실제로 읽고 있는지는 아무것도", "short": "추가한 필드를 아무도 안 읽음", "source": "공용/백엔드_필드추가_클라이언트_소비누락_감사_패턴.md", "intro": "# 강제하지 않는다 — 주기적으로 감사할 것 (범용)\n\n클라이언트-서버로 나뉜 프로젝트에서, 서버 쪽 API 응답에 필드를 하나 추가하는\n작업과 클라이언트 쪽이 그 필드를 실제로 파싱해서 쓰는 작업은 **완전히 분리된\n두 커밋**이 되기 쉽다. 이 사이 시차가 생겨도 아무것도 안 깨지고 아무 경고도\n안 뜬다는 게 이 함정의 핵심 — 다른 프로젝트에도 그대로 재현될 수 있는 구조적\n문제라 범용으로 남긴다.", "sections": [{"kind": "problem", "heading": "왜 조용히 묻히는가", "body": "- JSON을 느슨하게 파싱하는 클라이언트 코드(`json['new_field']`를 아예 안 쓰면\n  그냥 무시되는 구조 — Dart의 `Map<String, dynamic>` 기반 `fromJson`, JS의\n  구조분해 등)는 서버가 새 필드를 추가로 보내도 **에러를 내지 않는다**. 그냥\n  그 값이 응답 어딘가에 도착했다가, 아무도 안 읽어서 버려질 뿐이다.\n- 타입체커/린터도 이 틈을 못 잡는다 — \"이 API 응답에 이 필드가 있는데 어느\n  모델도 그걸 선언 안 했다\"는 걸 감지하려면 서버 스키마와 클라이언트 모델을\n  **양쪽 다 아는** 도구가 있어야 하는데, 대부분의 프로젝트엔 그런 계약 검증\n  단계가 없다(OpenAPI 스키마 자동생성+클라이언트 코드젠 같은 걸 안 쓰는 한).\n- 그래서 \"서버는 이미 몇 릴리스 전부터 보내고 있었는데 클라이언트가 계속\n  무시하고 있었다\"는 게 기능 하나가 통째로 \"구현 중\"으로 잘못 표시된 채 며칠~\n  몇 주씩 방치될 수 있다 — 실제로는 필드 하나 배선하면 끝나는 마무리 작업인데,\n  아무도 \"다 끝났는지 확인\"을 안 해서 계속 미완료 목록에 남아있는 상태."}, {"kind": "checklist", "heading": "감사 방법", "body": "1. **API 응답을 만드는 쪽(서버) 코드에서 최근 추가된 필드를 먼저 특정**한다 —\n   결정이력/커밋 로그에서 \"응답에 필드 추가\"류 항목을 찾거나, 그 엔드포인트의\n   직렬화 코드(`return {..., \"new_field\": ...}`류)를 직접 읽는다.\n2. **그 필드 이름으로 클라이언트 코드 전체를 grep**한다. 결과가 0건이면 확정\n   — 그 필드는 서버가 보내는 순간부터 지금까지 클라이언트 어디서도 안 읽히고\n   있었다는 뜻이다.\n3. 이미 배선된 필드들과 **같은 자리**(같은 모델 클래스, 같은 UI 컴포넌트)를\n   찾아서 그 옆에 나란히 추가한다 — 이미 검증된 파싱/표시 경로가 있으면 새\n   작업이 아니라 \"이미 있는 배선에 필드 하나 잇기\" 수준으로 작아진다.\n4. 파싱 테스트가 있는 프로젝트라면, 새 필드를 포함한 샘플 JSON으로 테스트\n   케이스를 하나 추가해서 앞으로 같은 필드가 다시 조용히 빠지는 걸(리팩토링\n   중 실수로 등) 방지한다."}, {"kind": "problem", "heading": "이 문제를 구조적으로 줄이는 법 (선택, 비용 대비 판단 필요)", "body": "작은/중간 규모 프로젝트에서 OpenAPI 코드생성 같은 무거운 도구를 도입하는 건\n과할 수 있다 — 대신 저비용으로 할 수 있는 것들:\n- 서버 쪽 결정이력/커밋 메시지에 \"API 응답 필드 추가\"를 남길 때, 클라이언트\n  담당 작업을 **같은 항목의 하위 TODO로 명시**해서 \"서버 완료\"와 \"전체 완료\"를\n  섞어 표시하지 않는다(이번 실측 사례처럼 서버 D-번호 하나가 배선까지 다 끝난\n  것처럼 보였는데 실제론 절반만 끝나 있었던 경우를 방지).\n- 주기적으로(신규 기능 착수 전이나 코드 감사 시점에) 최근 N개 API 필드 추가\n  항목을 골라 위 감사 방법을 한 번씩 돌려본다 — 특정 필드 하나를 찾아서 고치는\n  것보다, \"이런 게 또 있을 수 있다\"는 걸 알고 정기적으로 스윕하는 습관이 더\n  근본적인 대응이다."}, {"kind": "case", "heading": "실측 후속 (poker_app, 2026-09-19~21) — \"클라이언트 배선\"을 끝내도 서버 안쪽 소비 지점이 남는다 (3층)", "body": "감사 리포트(2026-09-17)가 \"서버는 완성됐는데 클라이언트가 안 부르는 기능\" 5건을 가장 큰 리스크로 꼽았고,\n이틀 뒤 client 코드를 같은 방식(기능 식별자 grep)으로 재대조하니 4건이 해소돼 있었다 — 이 감사 방법은 재실행이\n싸고 결과가 즉시 나오므로 **작업 시작 때마다 돌리는 습관**이 유효하다. 같은 세션에서 새 사례가 하나 더 나왔다:\n\n- 서버가 제자 환생(ADR-142)을 로직·API까지 완성했고 클라이언트 호출부는 0건이었다(전형적 1·2층 분리). UI를\n  붙인 뒤에도 **퍼크가 개방·표시만 되고 실전 효과가 없는 상태**였다 — 서버가 퍼크를 저장하고 AI 결정 함수에\n  받을 인자(`perks`)까지 만들었지만, 실제 결정 호출부(라이브 대국/배경 시뮬레이션/토너먼트 어댑터)가 그 값을\n  조회해 넘기지 않았다. 즉 완료 판정 층이 **세 개**다: ① 서버 API/로직 ② 클라이언트 호출·UI ③ 서버 내부에서\n  그 값을 실제로 소비하는 코드가 그 값을 받는가.\n- **③ 감사법**: 새 인자/데이터의 이름(`perks`)으로 서버 코드를 grep해 *정의*만 있고 *호출부 전달*이 없는지\n  본다(`decide(` 호출 4곳 중 몇 곳이 그 인자를 넘기는가). 테스트는 결과 값이 아니라 **인자 전달 자체**를\n  관찰하도록 함수를 기록용 서브클래스로 바꿔 끼워 검증하면 확률적 결과에 흔들리지 않는다.\n- **표시만 되는 기능은 완료로 치지 않는다**: UI에 나오는 값이 실제 동작에 반영되는지가 판정 기준이다 — 새 UI를\n  붙이는 순간 \"이제 유저에게 약속한 효과가 실제로 있는가\"를 한 번 더 묻는다."}, {"kind": "other", "heading": "반대 방향 — 서버가 필드 전송을 멈춘 뒤에도 클라이언트가 계속 읽는다 (RVS_App, 2026-11-11)", "body": "설계를 바꿔 서버가 응답 필드(예: 선택지의 `users`, 평가의 `shared`)를 더는 보내지 않게 했는데, 클라이언트의 모델·화면은 그 필드를 계속 파싱하고 그리는 코드가 남았다. 필드가 **옵션**이라 컴파일도 실행도 멀쩡하고, **시험의 가짜 응답이 옛 필드를 계속 실어 주니 시험도 통과**한다 — 죽은 코드가 \"검증된 기능\"처럼 보이는 상태다.\n\n- **감사**: 서버에서 필드를 뺀 같은 커밋(또는 바로 다음)에 그 키 이름으로 클라이언트 모델·화면·시험 픽스처를 grep한다 — 읽는 코드, 그리는 코드, 그 값을 넣어 주는 시험 데이터가 **세 곳**이다.\n- **같이 지운다**: 모델 필드·표시 코드·그 표시를 확인하는 시험·픽스처를 한 번에 지운다. 시험만 남기면 사라진 기능을 계속 보증하고, 표시 코드만 남기면 영영 안 뜨는 화면이 된다.\n- **롤아웃 순서**: 이미 배포된 옛 클라이언트가 있으면 서버는 필드를 빼도 되고(옵션이라 옛 클라이언트는 그냥 안 그림), 새 클라이언트가 읽기를 지우는 쪽이 안전하다. 반대로 필수 필드를 빼면 옛 클라이언트가 깨진다."}], "projects": ["RVS_App", "poker_app"], "links": [], "updated": "2026-11-12", "tags": ["FastAPI", "Flutter", "설계·구조"], "tags_overridden": true, "public": true}, {"id": "사용자입력양식_1파일1항목_스키마검증_부분수용_가져오기_패턴", "title": "사용자 입력 양식 — 1파일 = 1항목 + 스키마 검증 + 부분 수용 가져오기 (범용)", "short": "사용자 입력 양식 가져오기", "source": "공용/사용자입력양식_1파일1항목_스키마검증_부분수용_가져오기_패턴.md", "intro": "사용자가 여러 항목(계정, 설정, 상품 등)을 대화형 프롬프트가 아니라 **파일에 써서 한꺼번에 등록**하게 할 때의 설계.\n처음엔 사람이 읽기 쉬운 txt 블록(`[이름]` + `PW:` 줄 …)으로 시작했다가, 라벨 오타가 조용히 무시되고 줄바꿈·혼합 문서에서 오파싱\n위험이 있어 **스키마 있는 JSON, 파일 하나에 항목 하나**로 바꿨다.", "sections": [{"kind": "solution", "heading": "설계 (한 줄 요약)", "body": "`양식 내보내기(빈 JSON N개, 번호 이어서)` → 사용자가 채움 → `가져오기`: 폴더의 모든 JSON을 읽어 **양식에 맞는 것만** 검증·미리보기·확인 후\n저장 → 저장본 재검증 → (선택) 원본 삭제."}, {"kind": "solution", "heading": "1. 한 파일에 여러 칸 vs 파일 1개당 1항목", "body": "| | 한 파일 여러 칸 | 1파일 1항목 (권장) |\n|---|---|---|\n| 작성 | 한 파일에서 연속 입력 | 파일마다 열어야 함 |\n| 오류 영향 | 한 칸이 틀리면 파일 전체 보류 | 틀린 파일만 빠지고 나머지는 등록 |\n| 오류 위치 | \"칸 3번\" | 파일 이름 |\n| 가져온 뒤 정리 | 안 쓴 칸이 남은 채 파일 유지 | 쓴 파일만 삭제 |\n| 평문 노출 | 모든 값이 한 파일에 | 분산 |\n\n\"한 번에 여러 개 입력하는 편의\"는 **개수를 지정해 양식을 한꺼번에 만들어** 보완한다(`template 5` → 5개 파일)."}, {"kind": "solution", "heading": "2. 양식 내보내기 — 번호를 이어서, 기존 파일은 절대 건드리지 않는다", "body": "- 파일명 `새항목_양식_N.json`, N = 폴더의 기존 최대 번호 + 1부터. 이미 있는 양식을 덮어쓰거나 \"이미 있음\"으로 거부하지 않는다\n  (작성 중인 내용 보호 + 중복 생성 가능).\n- 양식에는 `schema`(식별자+버전, 예: `vault-entry/1`)와 `_help`(사용법 한 문장)를 넣고 필드는 빈 문자열로 둔다.\n- **파일 이름은 사용자가 바꿔도 된다** — 가져오기는 이름이 아니라 내용(schema)으로 판별한다."}, {"kind": "solution", "heading": "3. 가져오기 — 파일 상태를 4가지로 분류", "body": "| 상태 | 판별 | 처리 |\n|---|---|---|\n| ok | schema 일치 + 필수값 충족 | 등록 대상(미리보기에 표시) |\n| blank | schema 일치 + 모든 필드 비어 있음 | 조용히 건너뜀, 개수만 표시 |\n| foreign | JSON이지만 schema가 없거나 다름 | \"양식이 아니라 건너뜀\" 안내 (다른 용도의 JSON·옛 버전 양식) |\n| error | schema 일치 + 검증 실패, 또는 JSON 문법 오류 | **파일 이름과 사유를 빨간색으로** 보여 주고 그 파일만 제외 |\n\nerror 검증 항목: **알 수 없는 키**(오타: `password` → 허용 키 목록을 같이 출력), **문자열이 아닌 값**(따옴표 없는 숫자 → \"따옴표로 감싼 문자열이어야 함\"),\n필수값(이름) 누락, 둘 중 하나는 필요한 필드(id/pw) 둘 다 없음. 파일 안에서는 전부 아니면 전무, **파일 사이에서는 부분 수용**."}, {"kind": "solution", "heading": "4. 저장 전·후 안전장치", "body": "1. **미리보기**: `가져올 항목 N개 (신규 a / 덮어쓰기 b)` + 항목별 `[신규|덮어쓰기] ← 파일명`. `yes`가 아니면 아무것도 저장하지 않는다(취소 시 목록이\n   그대로인지 테스트).\n2. **서로 다른 파일에 같은 이름**이 있으면 전체 거부(어느 쪽이 이길지 추측하지 않는다).\n3. **덮어쓰기 시 비워 둔 설명/키워드는 기존 값 유지** — 비밀 값은 양식 내용이 그대로 우선.\n4. **저장 후 다시 읽어** 복호화/조회한 값이 양식과 같은지 검증하고, 실패하면 양식 파일을 건드리지 않은 채 에러.\n5. 양식 원본(평문)은 **삭제 여부를 한 번 더 `yes`로** 묻는다 — 기본값은 유지."}, {"kind": "solution", "heading": "5. 대화형 메뉴와 함께 쓸 때", "body": "- 대화형 메뉴의 \"항목 추가/삭제\"를 걷어내고(프롬프트로 한 개씩 입력하는 건 불편하고 오타 위험이 크다) 양식 경로로 일원화해도 된다. 삭제처럼\n  가끔 쓰는 기능은 명령줄(`rm <번호>`)로만 남긴다.\n- **엔터는 진행/확정**에 쓰고, 이동은 메뉴에 `이전`·`홈` 번호를 따로 둔다 — 엔터를 \"돌아가기\"로 쓰면 확정과 충돌한다. 하위 입력 단계에서도\n  `이전`/`홈` 단어를 받는다(비밀 입력 단계는 가릴 수 없으니 `Ctrl+C` 안내).\n- 메뉴 번호를 바꿀 때는 **다른 스크립트·문서·안내 문구에 박힌 번호**를 같이 갱신한다(예: \"hub → 0 → 4\" 안내가 옛 번호로 남는 사고)."}, {"kind": "checklist", "heading": "체크리스트", "body": "- [ ] schema 식별자 + 버전, 알 수 없는 키/타입/필수값 검증, 오류는 파일명 + 사유\n- [ ] foreign(다른 JSON)·blank(빈 양식)는 오류가 아닌 조용한 건너뜀\n- [ ] 파일명 변경 허용, 번호 이어서 생성, 기존 양식 비침범\n- [ ] 미리보기 → 확인 → 저장 → 재검증 → 삭제 확인, 취소 시 무변화 테스트\n- [ ] 이름 중복(파일 간) 거부, 덮어쓰기 시 비어 있는 비밀 아닌 필드는 기존 값 유지\n- [ ] 여러 줄 값(키 파일 등)이 양식 왕복에서 보존되는지 테스트\n\n**실측 출처**: 개인 보안정보 폴더(`coding_admin`) 암호화 저장소 — 가져오기 양식을 txt 블록 → 다중 칸 JSON → 1파일 1항목 JSON으로 세 번\n바꾸며 확정한 설계(2026-10-20)."}], "projects": [], "links": [], "updated": "2026-10-20", "tags": ["설계·구조"], "tags_overridden": true, "public": true}, {"id": "사용자피드백_예측확률_보정루프_입력정화_사후평균_동의연동_패턴", "title": "사용자 피드백으로 예측 확률을 보정하는 루프 — 입력 정화부터, 사후 평균은 읽을 때, 동의와 안내를 일치 (범용)", "short": "피드백으로 확률 보정", "source": "공용/사용자피드백_예측확률_보정루프_입력정화_사후평균_동의연동_패턴.md", "intro": "예측(결과 후보 + 확률)을 내는 앱이 \"실제로 어땠나요\"를 받아 확률을 점점 맞추고 싶을 때. 보정 공식보다 **입력이 먼저 망가져 있는 경우가 많다** —\n원 사례는 RVS_App(역산 시뮬레이터, 2026-10-31). 프로젝트 무관하게 적용 가능. §7은 이 보정을 사용자 사이로 넓힐 때(공유 풀, 2026-11-11).", "sections": [{"kind": "solution", "heading": "1. 입력부터 정화한다 (보정 공식보다 먼저)", "body": "- **기본값 있는 질문은 데이터를 오염시킨다.** \"예측한 대로 행동했나요\" 스위치가 기본 켜짐이면, 안 건드린 사용자는 원래대로 했어도 전부 \"그대로 했음\"으로 쌓인다.\n  → 기본값 없는 선택(바꿔 본 대로 / 원래대로 / 다른 걸)으로, 안 고르면 저장하지 않는다. \"원래대로\"도 버리지 말고 따로 둔다(원래 행동 보정의 재료).\n- **적중은 사람이 고른다.** 실제 결과 글을 키워드·임베딩으로 예측과 자동 대조하면 그 판정이 곧 학습 라벨이 된다 — 틀린 판정이 그대로 보정에 들어간다.\n  → \"예측 N개 + 예측에 없던 결과\" 중 사용자가 직접 고르게 하고, 자동 판정은 **\"추천\" 표시만**(미리 선택해 두면 그냥 넘겨 자동 판정과 같아진다).\n- **선택지는 서버가 저장해 둔 그 예측에서만.** 화면마다 후보를 넘겨받으면 경로마다 달라질 수 있다 — 조회 응답에 후보를 싣고, 저장 때 서버가 고른 순위를 그 세션의 후보 수로 검사한다.\n- **출처를 기록한다**(`user`/`keyword`)와 자동 추천 순위도 같이 저장 — 옛 자동 판정 기록은 지우지 말고 `unverified`로 분리, 추천이 사용자 선택과 얼마나 맞는지(일치율)도 잴 수 있다.\n- 이건 `JudgeCal_Athe/확률적_결과_기반_자기편향_순환_함정.md`의 \"신호는 사용자 입력이어야 한다\"를 라벨 쪽에 적용한 것이기도 하다."}, {"kind": "solution", "heading": "2. 보정은 사후 평균, 원본은 그대로 두고 읽을 때 덧씌운다", "body": "- 결과가 여럿이면 디리클레(베타의 다중 버전) 사후 평균: **보정 확률_i = (원래 확률_i × k + 실제로 된 수_i) ÷ (k + 기록 수)**.\n  k = 원래 확률을 기록 몇 건만큼 믿을지(예 20 — 기록 20건이면 원래와 실제가 반반). 기록이 최소 건수(예 5) 미만이면 원래 그대로.\n  \"예측에 없던 결과\"는 기록 수에만 들어가 전부를 깎고, 합 100으로 다시 나눈다(최대잔여법).\n- **원본(시드 파일·DB)은 안 바꾼다.** 후보를 돌려주는 한 곳에서만 덧씌운다 — 끄기는 상수 하나, 되돌리기는 커밋 되돌리기. 파일을 직접 고쳐 커밋하는 방식은\n  원본을 쓰는 다른 작업(자동 콘텐츠 채우기 등)과 충돌하고, 배포 서버의 실사용 집계를 반영하기 어렵다.\n- **결과 순서·개수를 유지한다** — 저장된 후보의 n번째가 원본의 n번째여야 다음 집계가 같은 칸을 센다(정렬은 보여 줄 때만).\n- k·최소 건수는 운영 한도(요금제 숫자)가 아니라 엔진 조정값이다(`개발_서비스_폴더_분리_운영_패턴.md`의 \"엔진·안정화 로직은 제약이 아니다\")."}, {"kind": "solution", "heading": "3. 집계 표를 따로 두지 말고 매번 기록에서 센다 (표본이 작은 동안)", "body": "- 별도 카운터 표는 \"다시 기록하면 두 번 셈\", \"동의 철회 시 빼기\", \"기록 삭제 시 빼기\"를 전부 따로 처리해야 한다.\n  기록 + 예측 노드 + 동의 표를 조인해 조회 때 세면 셋 다 공짜로 맞는다. 느려지면 그때 인덱스나 캐시를 둔다(측정 뒤)."}, {"kind": "solution", "heading": "4. 다른 사용자 기록을 쓰는 순간, 동의와 안내를 동작과 일치시킨다", "body": "- 집계만 쓴다 해도 \"남의 기록으로 내 확률이 바뀐다\" — 기존 학습 동의 설정이 있으면 **동의한 사용자의 기록만** 재료로.\n- 실측 함정: 동의 설정을 먼저 만들어 두면 안내가 \"지금은 아무 곳에도 쓰이지 않고 허락 여부만 저장돼요\"로 남아 있다가, 실제로 쓰기 시작한 커밋에서\n  **안내와 API 플래그(`in_use: false`)를 같이 안 바꾸면 거짓 안내가 된다**(RVS는 보정 커밋이 먼저 푸시되고 다음 작업에서 발견). 동의를 실제로 쓰는 커밋에\n  안내 문구·플래그·테스트를 같이 넣는다. 옛 문구로 받은 동의를 새 용도에 써도 되는지도 확인(배포 전이면 해당 없음)."}, {"kind": "solution", "heading": "5. 보정 곡선은 \"참고용\"을 그대로 보여 준다", "body": "- \"몇 %라고 본 결과가 실제로 몇 % 일어났나\"를 구간별로 — 결과가 적은 구간(예 10개 미만)·기록이 적을 때(예 30건 미만)는 숫자와 함께 \"아직 N건이라 참고용\".\n  표본이 적은데 숫자만 보여 주면 우연을 성과로 착각하게 하고, 그대로 밝히는 게 신뢰를 만든다.\n- 운영자용(전체 집계)과 사용자용(내 기록)은 **같은 계산 함수 하나**를 쓰고 재료만 다르게."}, {"kind": "solution", "heading": "5-1. 운영자 지표 — 곡선 옆에 무엇을 같이 두나 (RVS 2026-10-31, 개발자 콘솔)", "body": "- **Brier에 \"예측에 없던 결과\" 칸을 넣는다**: 후보 확률 합이 100%로 정규화돼 있으면 실제 결과가 후보 밖일 때 후보 칸만 보면 오차가 작게 나온다. 확률 0인 칸 하나를 더해 그 경우를 1로 친다.\n- **절대값 대신 기준선 대비**(skill = 1 − Brier ÷ 같은 기록에 후보 확률을 모두 같게 준 Brier): 후보 수가 기록마다 달라 Brier 절대값끼리는 비교가 안 된다. 양수면 \"확률을 붙인 의미가 있다\".\n- **로그 손실은 바닥을 둔다**(없던 결과 = 1%): 0을 넣으면 한 건이 평균을 무한대로 만든다.\n- **구간 비율엔 윌슨 95% 구간**: 칸마다 후보 수가 작아 정규 근사는 0~1 밖으로 나간다.\n- **결과 출처별로 나눈다**(사례 매칭 / AI 생성): AI가 만든 사례와 실제로 관찰된 사례를 같은 무게로 믿지 않으려면 먼저 둘의 실제 적중이 다른지 본다. 사례마다 \"실제 결과로 검증된 횟수·한 번도 안 맞은 사례·마지막 검증 시각\"만 세고 사례 문장·id는 내보내지 않는다.\n- **오차 원인은 사용자가, 1위가 빗나갔을 때만**: \"어디서 빗나갔나요\" 선택지(상황 판단 / 행동 효과 / 상대 반응 / 바깥 변수 / 예측에 없던 일)를 1위가 맞지 않은 기록에만 묻고 고르지 않아도 저장되게 한다. 서버는 같은 조건이 아니면 버린다(나중에 1위로 고쳐 기록하면 지워짐). AI 추정은 기록마다 호출 비용이 들고 원인을 지어낼 수 있다.\n- 모두 순수 함수 하나(조회와 분리)로 두고, 재료가 0건이어도 null·빈 칸으로 그려지게 시험한다 — 배포 전에는 대부분 0건이다."}, {"kind": "solution", "heading": "6. 먼저 데이터 속도를 잰다", "body": "- 보정의 재료는 \"예측대로 행동했고 직접 고른\" 기록뿐이다. 사용자가 예측한 행동을 실제로 하는 비율이 낮으면 표본이 거의 안 쌓인다 —\n  기록 대비 그 비율(scored / not_followed)을 콘솔에 먼저 띄우고, k·최소 건수는 그 속도를 보고 정한다. 데이터 0건일 때 넣은 보정은 \"최소 건수 미만이면 원본\"이라 동작이 안 바뀌어 안전하다."}, {"kind": "solution", "heading": "7. 사용자 사이로 넓힐 때 — 복사해 올리지 말고 동의한 사용자의 기록에서 매주 계산한다 (RVS 2026-11-11)", "body": "\"여러 사용자가 같은 방향으로 쌓은 결과를 모두가 참조하는 풀로 올리고 싶다\"는 요구에서, 처음엔 실제 결과를 기록할 때 일반화한 글을 공유 표에 복사해 올리고 탈퇴 직전에도 옮기는 방식을 만들었다가(여러 커밋) **같은 날 전부 걷어냈다.** 이유와 대안:\n\n- **복사의 문제 셋**: ① 내 기록과 같은 정보가 두 곳에 있어 동의 철회·계정 삭제마다 \"연결 끊기\"·삭제 훅이 따로 필요하다 ② 공유 표에 사용자가 쓴 글이 남는다(규칙으로만 일반화한 글 — 지역명·별명·직장 얘기는 규칙이 못 지운다) ③ 사용자마다 문장이 달라 \"같은 상황·같은 결과\"를 묶는 기준을 글 단위로 따로 만들어야 한다. 3절(\"집계 표를 따로 두지 말고 매번 기록에서 센다\")을 사용자 간으로 넓히면 이 셋이 같이 사라진다.\n- **파생 방식**: 공유 풀은 별도로 올리는 곳이 아니라 **동의한 사용자의 세션(실제 결과 기록)에서 주기적으로 계산한 통계**다. 표본 한 건 = 실제 결과를 적은 세션 중 *예측한 행동을 그대로 했고* 목표 역산이 아닌 것. 라벨 = 실제 결과가 예측 후보 중 몇 번째인지(후보에 없으면 \"일치 아님\") + 그때 AI가 낸 순위별 확률. 사용자 식별은 솔트 해시뿐이고 상한 계산에만 쓰며 글은 담지 않는다.\n  - **철회 = 다음 계산부터 빠짐, 계정 삭제 = 세션이 지워져 흔적 없음** — 철회·삭제 처리 코드가 필요 없다.\n  - **동의 시점이 아니라 동의 여부로 판단하면 동의 전에 적은 기록도 포함된다.** 구현을 끝내고 문서를 쓰다 발견했다 — 문구에 \"허락하기 전에 이미 적은 것도 포함\"을 명시한다(안 하면 사용자는 \"앞으로 적는 것만 쓰이겠지\"라고 읽는다).\n- **승격은 표본 수로, 도배 상한을 같이 둔다**: 묶음 하나의 센 표본이 N건 이상이면 승격(RVS는 20). 한 사용자가 한 묶음에서 센 건수를 k로 제한하면(RVS 2) **서로 다른 사용자 수 하한이 N÷k(10명)로 자동 보장**돼 따로 하한 규칙이 필요 없다. 하루 기여 상한(5)도 같은 곳에서 건다.\n- **묶음 이름표를 글 없이 유지한다**: 주마다 그리디로 다시 묶으면 묶음이 흔들려 \"같은 묶음의 일반 문장 재사용\"이 깨진다. 글이나 대표 문장을 저장하지 않고, **센 표본의 세션 id 해시 집합**을 저장해 새 묶음과 절반 이상 겹치면 같은 묶음, 아니면 대표 임베딩의 코사인으로 본다. 임베딩 호출이 안 되는 환경(키 없음)에서도 동작한다.\n- **사람이 읽는 문장은 승격 때 묶음당 한 번만 만든다**: 사용자별로 일반화하면 AI 호출이 사용량에 비례하고 사용자별 일반화 글이 남는다. 묶음이 승격될 때 그 묶음의 글 몇 개를 AI에 주고 일반 문장 하나를 받아 규칙 검사(숫자·연락처 제거·길이)를 거치고, 못 만들면 **노출하지 않고 다음 주에 다시** 한다. 표본이 2배가 되면 한 번 갱신. 개발자 부담 호출은 전용 신원의 하루 한도가 그대로 상한이다.\n- **노출은 자동 + 이력**: 승인 큐 대신 승격·갱신·해제를 이력 표에 남겨 문제가 생겼을 때 찾는 용도로 쓴다(관리 부담보다 추적 가능성을 택한 결정). 20건 아래로 내려가면(철회) 승격이 풀리고 그것도 이력에 남는다.\n- **보여 주는 방식**: \"비슷한 N건 중 1위 예측이 맞은 비율 X% · AI가 낸 확률 Y%\"를 나란히 — 5절 보정 곡선을 묶음 단위로 옮긴 것이다. 마음에 안 들면 호출 1회로 AI가 매칭 정보와 내 프로필을 합쳐 다시 계산(기존 AI 보강 경로 재사용). 통계는 결과 **세트로 세지 않고 근거로만** 쓴다 — 세트로 세면 같은 증거를 두 번 센다.\n- **킬 스위치는 읽기까지 닫는다**: 첫 구현은 서버 스위치가 올리는 쪽(기여)만 막아서 이미 승격된 데이터는 스위치를 꺼도 계속 보였다(설계 검토에서 발견). 스위치 하나가 쓰기·계산 배치·읽기·동의 화면을 모두 닫는지 시험한다.\n- **동의 문구는 쓰이는 것을 그대로 말한다**: 기존의 \"건수만 쓰는\" 학습 동의(4절)와 달리 상황·행동 글이 AI 일반화의 입력으로 쓰이므로 별도 스위치·별도 문구가 필요하다. 서버 스위치가 꺼져 있는 동안은 화면에서 숨긴다(안 열린 기능을 동의받지 않는다).\n- **교차 사용자 읽기 SQL은 저장소 계층에**: 공유 풀 로직 모듈이 세션·동의 표를 직접 조인하면 계층 감사에서 걸린다(RVS 11-11 감사에서 실제로 잡혀 고침) — 저장소 메서드가 재료를 돌려주고 로직은 변환(순위·해시·상한)만 한다."}, {"kind": "checklist", "heading": "체크리스트", "body": "- [ ] 피드백 질문에 기본값이 없는가(안 고르면 저장 안 됨)\n- [ ] 적중 라벨을 사람이 고르고, 자동 판정은 추천 표시만인가\n- [ ] 선택지가 서버 저장값에서만 오고 서버가 범위를 검사하는가\n- [ ] 출처(user/auto)를 기록하고 옛 자동 판정 기록을 분리했는가\n- [ ] 보정은 원본 불변·읽을 때 덧씌우기·순서 유지·최소 건수인가\n- [ ] 다른 사용자 기록을 쓰면 동의자만, 그리고 안내·플래그·테스트를 같은 커밋에서 바꿨는가\n- [ ] 곡선이 표본 부족을 \"참고용\"으로 밝히는가\n- [ ] (사용자 간 공유) 글을 복사해 올리지 않고 동의한 사용자의 기록에서 계산하는가 — 철회·삭제 처리 코드가 필요 없는가\n- [ ] 동의가 소급되는지(동의 전 기록 포함 여부)를 문구에 밝혔는가\n- [ ] 승격 N·사용자당 상한·하루 상한이 있고 서로 다른 사용자 수 하한이 자동 보장되는가\n- [ ] 일반 문장이 묶음당 한 번이고 못 만들면 노출하지 않으며, 승격·해제 이력이 남는가\n- [ ] 서버 스위치가 쓰기·배치·읽기·동의 화면을 모두 닫는가(꺼 보고 확인)\n\n원 소속: RVS_App(2026-10-31, `narrative_game/seed_calibration.py`·`calibration.py`·실제 결과 기록 개편; §7은 2026-11-11 `shared_pool/samples.py`·`promote.py`·`match`). 프로젝트 무관하게 적용 가능."}], "projects": ["JudgeCal_Athe", "RVS_App"], "links": ["개발_서비스_폴더_분리_운영_패턴"], "updated": "2026-11-12", "tags": ["LLM", "보안·개인정보", "설계·구조"], "tags_overridden": true, "public": true}, {"id": "서버거절규칙_롤아웃_앱먼저_시즌경계_튜닝값비저장_원칙", "title": "서버가 거절하는 새 규칙의 롤아웃 — 앱 먼저, 플래그는 시즌 경계, 튜닝값은 저장 금지 (범용)", "short": "서버 거절 규칙 롤아웃", "source": "공용/서버거절규칙_롤아웃_앱먼저_시즌경계_튜닝값비저장_원칙.md", "intro": "게임·콘텐츠 서버가 \"이 행동은 이제 안 된다\"처럼 **새 거절 규칙**을 플래그로 켜는 모든 배포에 적용되는 운영 원칙.\n(보스전 규칙형 기믹을 실사용자 앞에 내놓는 지침을 쓰다 나온 것 — 규칙 자체는 프로젝트 전용이지만 순서·저장 원칙은 어디서나 같다.)", "sections": [{"kind": "solution", "heading": "1. 앱을 먼저 배포하고, 규칙 플래그는 그 뒤에 켠다", "body": "- 서버가 응답에 **필드를 새로 내리는 것**은 모르는 클라이언트가 무시하면 끝이라 안전하다.\n- 그러나 **서버가 행동을 거절하는 새 규칙**은 모르는 클라이언트에게 \"버튼은 눌리는데 오류(409 등)가 나는 앱\"으로 보인다.\n- 그래서 순서는 ① 새 필드를 이해하고 버튼을 막아 주는 앱 배포 → ② 사용자들이 업데이트할 시간 → ③ 규칙 플래그 ON.\n  (서버만 먼저 켜면 옛 앱 사용자는 조용한 오류 폭탄을 맞는다.)"}, {"kind": "solution", "heading": "2. 누적형 랭킹이 있는 콘텐츠는 플래그를 시즌 경계에서만 바꾼다", "body": "- 판 단위로 모드가 고정되면 진행 중인 판은 안전하다(시작 때 모드로 끝까지 간다).\n- 문제는 **시즌 누적 값**(누적 피해, 점수)이다. 시즌 중간에 규칙을 켜거나 끄면 같은 시즌의 앞 판과 뒤 판 난이도가 달라 순위가 불공정해진다.\n- 켜고 끄는 시점은 시즌 리셋 직후. 부득이하게 시즌 중에 바꿨다면 그 시즌 순위 보상을 수동 점검한다. 같은 플래그를 쓰는 다른 경로(자동 NPC 대전 등)도 같이 바뀐다는 점을 체크리스트에 넣는다.\n- 켜기 전 체크: DB 스냅샷, 진행 중 세션이 없는 시간대."}, {"kind": "solution", "heading": "3. 튜닝 값은 코드 상수로, 저장하는 건 \"진행 결과\"뿐", "body": "- 배정표·수치·구간 경계 같은 튜닝 값을 DB에 저장하는 순간 그 값이 마이그레이션 대상이 된다. 코드 상수면 바꿔도 마이그레이션이 없다.\n- 저장해야 하는 건 플레이어/회사의 **진행 결과**(체력 누적, 랜덤으로 굴린 구성처럼 재굴림하면 안 되는 것)뿐이다."}, {"kind": "solution", "heading": "4. 저장되는 식별자는 이름을 바꾸지 않는다", "body": "- 저장된 구성에는 id 문자열이 들어간다(효과 id, 카드 id 등). id를 바꾸거나 지우면 저장본이 가리킬 곳이 없어지고, 모르는 id를 무시하는 코드라면 깨지진 않지만 **있던 효과가 조용히 사라진다**.\n- 이름을 바꿔야 하면 별칭 표(옛 id → 새 id)를 둔다. 의미(수치)만 바꾸는 건 자유다.\n- 풀에서 항목을 뺄 때는 이미 붙은 효과를 지울지 둘지 정책을 먼저 정한다(기본: 그대로 둔다)."}], "projects": [], "links": [], "updated": "2026-10-08", "tags": ["배포·운영", "FastAPI"], "tags_overridden": true, "public": true}, {"id": "서브에이전트_보고사실_실행전_재검증_패턴", "title": "서브에이전트가 보고한 \"사실관계\"도 실행 전에 직접 재검증한다 (범용)", "short": "서브에이전트 보고 재검증", "source": "공용/서브에이전트_보고사실_실행전_재검증_패턴.md", "intro": "`LLM_블라인드_서브에이전트_자기일관성_측정_패턴.md`와는 다른 축이다 — 그\n문서는 \"여러 번 생성한 결과가 서로 얼마나 일관되는가\"를 다루고, 이 문서는\n**서브에이전트 1회 보고 안의 개별 사실 주장 하나하나가 실제로 맞는지**를\n다룬다. 서브에이전트(fork든 fresh Agent든)가 코드베이스를 조사해 \"X는 Y\n상태다\"라고 보고하면, 그 보고를 실행 계획의 전제로 그대로 믿고 진행하기\n쉽다 — 서브에이전트도 결국 같은 모델이 grep/Read 몇 번으로 결론 내린\n것이라, 검색 누락이나 오독으로 사실과 다른 결론을 낼 수 있다.", "sections": [{"kind": "problem", "heading": "문제", "body": "\"조사만 하는\" 서브에이전트의 결과 리포트는 보통 신뢰도가 높다고 가정하고\n그 위에 바로 실행 계획을 얹는다. 그런데 리포트의 개별 항목(예: \"이 파일은\n어디서도 참조 안 됨\", \"이 함수는 아무도 안 씀\")은 grep 패턴이 조금만\n빗나가도(예: 실제 참조가 다른 표기법·다른 확장자·주석 안에 있는 경우) 틀린\n채로 리포트에 남는다. 리포트 전체 톤이 확신에 차 있어도 개별 사실은 오류일\n수 있다는 점이 리뷰어(사람이든 AI든)에게 잘 안 드러난다."}, {"kind": "solution", "heading": "해법", "body": "- 서브에이전트 리포트의 항목 중 **그 위에 바로 코드 변경을 얹을 항목**만이라도,\n  실행 직전에 자신이 직접 한 번 더 확인한다(예: \"미사용\"이라는 결론이면\n  실행 직전 자신이 직접 grep 한 번 더 돌려서 확인) — 리포트 전체를 다시\n  조사하란 뜻이 아니라, 그 결론을 근거로 실제 파일을 만들거나 지우는\n  단계에서만 값싸게 한 번 더 확인.\n- 특히 \"미사용/죽은 코드/참조 없음\"류의 **부정 명제**(무언가가 없다는 주장)는\n  긍정 명제보다 검증 실패 확률이 높다 — grep 패턴 하나만 놓쳐도 \"없다\"는\n  결론이 그냥 나와버리기 때문. 이런 항목을 실행 계획의 전제로 쓸 땐 재검증\n  우선순위를 높게 둔다.\n- 재검증에서 리포트가 틀렸다고 확인되면, 그 사실을 조용히 넘기지 말고 작업\n  결과물(커밋 메시지, 결정이력)에 \"리포트가 이 부분은 틀렸었다\"로 명시 —\n  같은 서브에이전트를 다음에도 신뢰할 근거(또는 못 할 근거)가 쌓인다."}, {"kind": "case", "heading": "실측 사례 (poker_app, ADR-121/125, 2026-09-14)", "body": "전체 UI 애니메이션/UX 전수조사를 fork 서브에이전트에 맡겼는데, 그 리포트가\n\"Lottie 애셋 4개(`trophy`/`chip_spin`/`spade_icon`/`cards_loader.json`)가\n전부 미사용(grep 0건)\"이라고 결론 냈다. 이후 실제로 그 4개를 소비하는 코드를\n작성하려고 각각의 사용처를 직접 grep한 결과, `cards_loader.json`은\n`splash_screen.dart`가 이미 오래전 커밋부터 쓰고 있었음이 드러났다(fork의\ngrep이 이 참조를 놓친 것으로 추정). 실제 미사용은 3개였다 — 실행 직전 재검증\n덕에 \"이미 쓰이고 있는 에셋을 새로 소비하는 코드를 중복 작성\"하는 실수를\n피했고, 결정이력 문서에도 \"전수조사 리포트가 이 부분은 틀렸었다\"고 명시\n기록했다."}], "projects": ["poker_app"], "links": ["LLM_블라인드_서브에이전트_자기일관성_측정_패턴"], "updated": "2026-09-14", "tags": ["AI 에이전트"], "tags_overridden": true, "public": true}, {"id": "설정경로_환경변수_우선순위_폴백_패턴", "title": "설정 경로를 환경변수 우선 + 하드코딩 폴백으로 (범용)", "short": "설정 경로는 환경변수 우선", "source": "공용/설정경로_환경변수_우선순위_폴백_패턴.md", "intro": "여러 스크립트/프로세스가 같은 설정 파일(레지스트리 JSON, 공용 로그 경로 등)을\n공유해서 읽어야 하는데, 그 파일 위치가 사람/기기마다 다를 수 있는 모든 상황에\n적용하는 패턴. 특정 프로젝트에 종속되지 않음.", "sections": [{"kind": "solution", "heading": "핵심 패턴", "body": "```python\nimport os\nfrom pathlib import Path\n\ndef resolve_config_path() -> Path:\n    return Path(\n        os.environ.get(\"MY_CONFIG_PATH\")\n        or (Path.home() / \".myapp\" / \"config.json\")  # 범용 기본값\n    )\n```\n\n- **환경변수가 있으면 그걸 쓰고, 없으면 합리적 기본값으로 폴백한다** — 소스코드에\n  특정 사람의 개인 경로(`C:\\Users\\<사용자이름>\\...` 같은)를 직접 박아두지 않는다. 기본값은\n  \"이 코드를 처음 받은 사람이 아무것도 안 해도 그럴듯하게 동작할 위치\"(홈 디렉토리\n  기준 등)로 잡는다.\n- **같은 설정을 공유하는 소비자가 여럿이면(여러 스크립트, 여러 훅, 하나의 앱), 이\n  resolve 함수 자체를 한 곳에만 두고 나머지가 그걸 재사용한다.** 각 소비자가\n  독립적으로 `os.environ.get(...) or Path.home()/...` 를 따로 구현하면, 나중에 기본\n  경로를 바꿀 때 한 곳만 놓쳐도 그 소비자만 몰래 옛 경로를 계속 보는 드리프트가\n  생긴다(실측 사례 아래 참고). 다만 소비자들이 서로 다른 모듈/레포에 흩어져 있어\n  import로 공유가 안 되는 경우(예: 독립 실행되는 훅 스크립트)는 예외적으로 각자\n  같은 로직을 복제해도 되지만, 그럴 땐 주석에 \"원본은 어디\" + \"복제 이유\"를 반드시\n  남긴다."}, {"kind": "case", "heading": "실측 함정 1 — 소비자 중 일부만 이 패턴을 적용하면 조용히 드리프트난다", "body": "한 프로젝트(앱 본체)가 이 패턴을 먼저 도입했는데, 같은 설정을 읽는 다른 소비자\n(전역 훅 스크립트 2개)는 여전히 옛날처럼 경로를 하드코딩하고 있었던 사례(2026-08-19).\n나중에 설정 파일을 실제로 이동시켰을 때, 앱은 환경변수를 갱신해서 잘 따라갔지만\n훅 2개는 하드코딩된 옛 경로를 계속 봐서 조용히(에러 없이, 그냥 아무 동작도 안 하는\n채로) 고장났다. **\"이 설정을 읽는 모든 곳\"을 한 번에 다 찾아서 같은 패턴으로\n맞춰야 한다** — 하나라도 빠지면 그 한 곳만 눈에 안 띄게 stale 상태로 남는다."}, {"kind": "case", "heading": "실측 함정 2 (Windows) — 환경변수를 갱신해도 이미 떠 있는 프로세스엔 반영 안 됨", "body": "`[System.Environment]::SetEnvironmentVariable(\"MY_CONFIG_PATH\", \"...\", \"User\")`\n(PowerShell) 또는 `setx`(cmd)로 Windows 사용자 환경변수를 갱신하면, 그건 **레지스트리에\n값을 쓰는 것**이지 이미 실행 중인 프로세스의 메모리 안 환경변수를 바꾸는 게 아니다.\nWindows가 `WM_SETTINGCHANGE` 메시지를 브로드캐스트하긴 하지만, 이미 떠 있는\n프로세스(셸, 이미 시작된 앱, 이미 열려 있는 에이전트 세션 등)는 대개 이걸 감지해서\n재로드하지 않는다 — **새로 시작하는 프로세스부터만** 새 값을 본다.\n\n이 함정은 실제로 이렇게 드러난다: 환경변수를 방금 갱신했는데, \"지금 이 세션\"에서\n`os.environ.get(...)`을 다시 읽어보면 여전히 옛 값이 나온다. 당황하지 않아도 되는\n정상 동작이다 — 다음에 그 프로세스(터미널, 앱, 세션)를 새로 켜면 그때 반영된다.\n지금 세션에서 즉시 확인하고 싶으면, 그 값을 명시적으로 override해서(`export\nMY_CONFIG_PATH=...` 또는 서브프로세스 호출 시 `env=` 인자로 주입) 새 프로세스를\n띄우는 방법으로 검증한다 — 이미 떠 있는 프로세스의 환경변수를 코드로 바꿀 방법은\n없다."}, {"kind": "context", "heading": "언제 이 패턴이 필요한가", "body": "- 설정 파일 위치가 \"이 프로젝트를 쓰는 사람마다 다를 수 있는\" 경우(개인 컴퓨터 경로,\n  회사마다 다른 배포 경로 등) — 특히 코드를 공개 저장소로 옮기거나 여러 사람이\n  같이 쓰게 될 가능성이 있으면 처음부터 이 패턴으로 시작하는 게 나중에 \"개인 경로\n  스크러빙\" 작업을 통째로 다시 하는 것보다 싸다.\n- 소비자가 2개 이상이고 그중 하나라도 별도 프로세스로 실행되는 경우(훅, CLI,\n  스케줄된 작업 등) — 코드 안에서 import로 공유가 안 되는 경계가 있으면 이 패턴이\n  아니고서는 위치를 한 곳만 바꿔서 전체가 따라오게 만들 방법이 없다."}], "projects": [], "links": [], "updated": "2026-11-17", "tags": ["Windows", "Python", "배포·운영"], "tags_overridden": true, "public": true}, {"id": "소비형_선충전_지갑_스토어결제_환불회수_패턴", "title": "소비형 선충전 지갑 + 스토어 결제 + 환불 회수 패턴", "short": "선충전 지갑과 환불 회수", "source": "공용/소비형_선충전_지갑_스토어결제_환불회수_패턴.md", "intro": "구독 대신 \"횟수 묶음\"을 사서 쓰는 구조(AI 호출권, 코인류)를 서버 지갑으로 만들 때의 순서와 함정. RVS_App 실측(2026-11-08~09).", "sections": [{"kind": "solution", "heading": "1. 지갑은 서버가 채운다 — 클라이언트 토큰은 믿지 않는다", "body": "- 흐름은 **스토어 결제 → 서버가 스토어에 직접 확인 → 지갑 충전 → 소비(consume)** 순서다. 클라이언트는 구매 토큰만 서버로 보낸다.\n- 충전은 구매 토큰의 해시를 `ref`(유일 키)로 원장에 남겨 **같은 구매는 한 번만** 반영한다. 재시도·중복 호출이 안전해진다.\n- 구매 토큰을 계정에 묶어(다른 계정이 쓰면 409) 영수증 재사용을 막는다."}, {"kind": "solution", "heading": "2. 소비 실패는 충전을 되돌리지 않는다", "body": "- 충전 뒤 소비(consume)가 실패하면 **503으로 재시도를 요청**한다. 지갑은 이미 채워져 있고, 다시 부르면 충전은 건너뛰고(ref 중복) 소비만 다시 시도한다.\n- 클라이언트는 결제 plugin의 자동 소비를 끄고(`autoConsume:false`) 서버 확인이 끝난 뒤에만 완료를 알린다. 앱을 켤 때 끝나지 않은 구매를 다시 서버에 확인시킨다."}, {"kind": "solution", "heading": "3. 차감은 낸 곳으로 돌려준다", "body": "- 차감 순서(전체 예산 → 하루 무료 → 지갑)가 있으면 **요청마다 지갑에서 낸 단위 수를 기억**해 두고, 실패·취소 환불은 지갑 몫부터 되돌린다. 안 그러면 무료분만 늘어나거나 지갑이 샌다.\n- 잔액은 `CHECK(balance>=0)` + `UPDATE … WHERE balance>=n`의 원자 차감으로 지킨다(읽고 쓰기 금지)."}, {"kind": "solution", "heading": "4. 환불 회수 — 스토어가 정하고, 서버는 따라간다", "body": "- 환불 결정은 스토어(사용자 48시간 요청·카드 분쟁 포함)가 하므로 \"N일 이후엔 환불 불가\"는 **서버 규칙이 아니라 운영·약관 정책**이다. 서버는 환불된 구매를 **시점과 무관하게** 거둔다(돈은 나갔는데 횟수가 남는 걸 막는다).\n- 하루 한 번 환불 목록(Play `purchases.voidedpurchases`, `type=0`)을 조회해 토큰 해시로 원장의 충전 행을 찾아 거둔다. 실시간이 필요하면 RTDN(Pub/Sub)을 같은 회수 함수 앞에 얹는다.\n- **가능한 만큼만 거두고 0에서 멈춘다** — 음수 잔액을 허용하려면 스키마 제약을 바꿔야 하고, 이미 쓴 몫은 사실상 회수 불가라 소액 소비형에선 0 멈춤이 단순하다.\n- 거둔 기록도 `void:<충전 ref>`로 원장에 남겨 한 번만 거둔다(거둘 게 0이어도 행을 남긴다). 이후 새로 채운 횟수는 다시 거두지 않는다.\n- 결제 검증이 설정되지 않은 서버(개발 등)에서는 회수를 조용히 건너뛰고, 그 밖의 실패는 서버를 멈추지 않게 로그만 남긴다."}, {"kind": "problem", "heading": "5. 함정", "body": "- Google Play 소비형은 구독용 v2 조회가 아니라 `purchases.products.get`(구매 완료 `purchaseState==0`, 소비됨 `consumptionState==1`)이다. 필드가 다르다.\n- Flutter 위젯 시험에서 `defaultTargetPlatform`은 기본 android라 결제 지원으로 잡힌다 — 미지원 분기는 가짜 결제기를 주입해 시험한다.\n- 상품 id·횟수·가격 같은 운영 값은 개발 폴더엔 중립(빈 목록), 서비스 폴더에서만 채워 두 폴더가 어긋나지 않게 한다(`개발_서비스_폴더_분리_운영_패턴.md`)."}, {"kind": "solution", "heading": "6. 등급·구독을 지갑으로 갈아탈 때", "body": "- 돈의 기준을 \"호출 횟수\" 하나로 두면 기능 잠금(`require/enabled`)과 등급별 한도는 둘 다 필요 없다. **잠금 호출을 먼저 걷고**, 요청 신원(소유자·등급)이 계정 등급을 읽지 않게 해 한도를 하나로 맞춘다. 계정의 등급 열은 지우지 않고 읽지만 않으면 스키마 변경 없이 끝난다.\n- 등급 전용 모듈·라우트·시험은 삭제 대신 `_legacy/`로 옮기고 README에 되살리는 방법을 적는다. 시험은 \"옛 잠금 값·계정 등급이 있어도 동작과 한도가 같다\"로 먼저 쓴다.\n- ContextVar(요청 신원)는 `asyncio.run` 안에서 심으면 밖에서 안 보인다 — 시험은 같은 코루틴 안에서 확인한다(안 그러면 변경 전에도 통과해 버린다).\n- 다음 수익 후보(예: 무료 한도 초과 슬롯 판매)는 수요 지표(한도 도달 비율 등)를 정해 두고, 지표가 나오기 전엔 상품·화면을 만들지 않는다."}], "projects": ["RVS_App"], "links": ["개발_서비스_폴더_분리_운영_패턴"], "updated": "2026-11-09", "tags": ["결제·한도", "Android", "FastAPI"], "tags_overridden": true, "public": true}, {"id": "실시계_만료판정_테스트_고정날짜_픽스처_시한폭탄_함정", "title": "실제 시계로 만료를 판정하는 코드를 고정 날짜 픽스처로 테스트하면, 날짜가 지나는 순간 조용히 깨진다", "short": "고정 날짜 테스트 시한폭탄", "source": "공용/실시계_만료판정_테스트_고정날짜_픽스처_시한폭탄_함정.md", "intro": "", "sections": [{"kind": "case", "heading": "실측 사례 (poker_app/server, 2026-09-29, ADR-193 후속)", "body": "회사 대전 도전에 \"응답 기한 2일, 지나면 자동 거절\"을 넣었다. 기한 판정은 `datetime.now(timezone.utc)`(실제 시계)로 한다.\n그런데 이미 있던 테스트 헬퍼가 도전을 `created_at=\"2026-09-28T00:00:00+00:00\"`(작성 당일 고정값)으로 만들고 있었다.\n작성한 날에는 전부 통과하지만, 이틀이 지나면 그 도전들이 전부 \"만료\"로 판정돼 수락·거절 테스트가 일제히 깨진다 —\n코드는 그대로인데 달력 때문에. 기한 기능을 넣으면서 헬퍼를 `now - age` 기준으로 바꿨다(`age_hours=0` 기본, 만료 경계\n테스트는 47시간/49시간)."}, {"kind": "solution", "heading": "패턴", "body": "- 실제 시계를 읽는 판정(만료·쿨다운·\"오늘\"·시즌 경계)을 새로 넣을 때, 그 판정을 거치게 되는 **기존 테스트 픽스처의 날짜\n  리터럴**을 먼저 찾는다(`grep -n \"20[0-9][0-9]-\" tests/`).\n- 픽스처는 \"지금 기준 상대값\"으로 만든다(`now - timedelta(...)`). 경계 테스트는 경계 양쪽(예: 기한 −1시간/+1시간)으로.\n- 절대 날짜가 꼭 필요하면(과거 시즌 표시처럼 \"현재와 다르기만 하면 되는\" 값) 판정이 실제 시계와 무관한지 확인한다 —\n  poker_app의 `season_marker` 비교는 저장된 값끼리 비교라 고정 리터럴이어도 안전했다.\n- 시계를 주입 가능하게(`now=` 인자) 하면 가장 확실하지만, 파이프라인 전 경로에 인자를 뚫기 부담이면 위 상대값 픽스처로 충분."}], "projects": ["poker_app"], "links": [], "updated": "2026-09-29", "tags": ["테스트"], "tags_overridden": true, "public": true}, {"id": "앱계산_배지_테마팩_해금_서버없는_게임화_패턴", "title": "서버 없이 붙이는 게임화 — 앱이 기록으로 배지를 계산하고, 배지가 테마 팩을 여는 패턴", "short": "서버 없는 게임화", "source": "공용/앱계산_배지_테마팩_해금_서버없는_게임화_패턴.md", "intro": "", "sections": [{"kind": "context", "heading": "언제", "body": "이미 기록(메모·실행 이력)이 서버에 쌓이는 앱에 \"실제 앱·게임 같은\" 재방문 동기(배지·해금 스킨)를 붙이고 싶은데,\nDB 스키마를 바꾸거나 서버 배포를 다시 하고 싶지 않을 때. Flutter 기준이지만 구조는 프레임워크 무관."}, {"kind": "solution", "heading": "구조", "body": "| 조각 | 레이어 | 하는 일 |\n|---|---|---|\n| 배지 정의·계산 `computeBadges(records, now)` | logic(순수 함수) | 기록 목록 → 배지마다 현재 값·목표. 연속 일수는 `now`를 인자로(시험이 고정) |\n| 팩 정의 `ThemePack{label, unlockedBy}` | logic | 이름과 여는 배지만. 색·글꼴은 모른다 |\n| 팩 겉모습 `Skin{light, dark, titleFont, texture}` | ui | 색 토큰 두 벌 + 제목 글꼴 + 배경 무늬. logic을 모른다 |\n| 팩→겉모습 매핑, 설정 칸, 획득 알림 | ux | 두 레이어를 잇는 유일한 곳 |\n| 고른 팩·이미 알린 배지 저장 | 기기 저장(영속) | 파일/Prefs, 화면은 파이프라인 감싸개로만 |\n\n앱 뼈대(전역)가 \"고른 팩\"과 \"밝기\"를 둘 다 구독해 테마를 다시 만든다 — 설정 화면 스택은 그대로 유지된다."}, {"kind": "solution", "heading": "규칙", "body": "1. **획득은 계산, \"봤다\"만 저장.** 배지 값은 매번 기록에서 센다(집계 표 없음 → 이중 계산·불일치 없음). 저장하는 건 \"이미 알려 준 배지\" 집합뿐.\n2. **한 번 연 해금은 안 잠근다.** 해금 = 지금 계산된 획득 ∪ 저장된 \"봤다\" 집합. 사용자가 기록을 지워도 쓰던 스킨이 갑자기 잠기지 않는다.\n3. **알림은 기록을 불러올 때, 한 번에 묶어서.** 첫 실행에 기존 기록만으로 여러 개가 한꺼번에 열리면 토스트 하나: \"배지 획득: A, B · 팩 X 열림\".\n4. **목표는 서버 목록 상한보다 작게.** 기록 API가 최근 N개만 주면 그보다 큰 목표(“역산 500번”)는 영영 못 연다.\n5. **스킨은 제목 글꼴만 바꾼다.** 본문까지 손글씨로 바꾸면 긴 글을 못 읽는다. 한글 글꼴은 개당 2~8MB — OFL 확인, Regular만 넣고 굵기는 합성, 8MB급은 빼고 2~3MB급으로.\n6. **배경 무늬는 이미지 대신 `CustomPainter`.** 줄·모눈·점·민무늬를 테마 확장(`ThemeExtension`)의 값으로 두면 용량 0, 다크에서도 토큰 색을 따른다.\n7. **잠긴 항목도 미리보기를 보여 준다.** 팩 타일은 그 팩의 색 점 3개와 그 팩 글꼴로 이름을 그리고, 잠겼으면 흐리게 + 자물쇠 + 여는 배지 이름.\n\n> 클라이언트가 둘 이상(앱 + 언어가 다른 웹)이 되면 이 계산을 서버로 옮긴다 — `다중클라이언트_규칙은_서버한곳_게임판정_도우미대사_패턴.md`(RVS_App 2026-11-02 격파 판정 이전)."}, {"kind": "problem", "heading": "함정", "body": "- 다크 팔레트를 새로 만들면 \"평행/보조 카드 바탕\" 같은 옅은 색이 어두운 배경 위에서 탁해진다(남색 위 갈색). **실기기 다크에서 한 번씩 본다.**\n- 위젯 시험의 `pumpAndSettle`은 계속 도는 애니메이션이 있으면 안 끝난다 — 공개 연출은 한 번만 도는 컨트롤러(차례는 `Interval`), 반복 깜박임은 잠깐 보이는 자리 표시에만.\n- 앱 코드가 돌기 전의 시스템 시작 화면(Android splash)은 앱 안 테마 선택을 모른다 — 기기 밝기만 따른다. 팩마다 바꾸려면 네이티브 쪽에 값을 써 둬야 한다.\n- 기기를 바꾸면 배지는 서버 기록으로 다시 계산되지만 \"봤다\" 집합은 사라져 알림이 한 번 더 뜬다. 해금 시점까지 남기려면 그때 서버 저장(스키마 변경)."}, {"kind": "checklist", "heading": "시험", "body": "- 계산: 종류별 개수, 연속 일수(오늘 없으면 어제부터, 끊김), 0건.\n- 해금: 기본 팩은 처음부터, 나머지는 여는 배지 있을 때만.\n- 저장: 팩·\"봤다\" 집합 왕복(파일 구현).\n- 알림: 새 배지는 한 번만, 두 번째엔 안 뜸.\n- 설정: 잠긴 팩은 눌러도 그대로, 열린 팩은 고르면 바로 적용·저장.\n\n출처: RVS_App(2026-11-02, UI·UX 4차 3단계) — `client/lib/logic/badges.dart`·`theme_pack.dart`, `ui/theme.dart` `RvsSkin`·`RvsTexture`, `ux/rvs/badges_view.dart`, `test/badges_test.dart`."}], "projects": ["RVS_App"], "links": ["다중클라이언트_규칙은_서버한곳_게임판정_도우미대사_패턴"], "updated": "2026-11-06", "tags": ["Flutter", "설계·구조"], "tags_overridden": true, "public": true}, {"id": "운영값_덮어쓰기_파일_새키_누락_기본값추락_함정", "title": "운영 값 덮어쓰기 파일에 새 키를 안 넣으면 조용히 다른 값으로 떨어진다", "short": "덮어쓰기 파일 새 키 누락", "source": "공용/운영값_덮어쓰기_파일_새키_누락_기본값추락_함정.md", "intro": "2026-11-15 신설(RVS_App — 게스트 등급을 만들고 승격하다 게이트가 잡음).", "sections": [{"kind": "problem", "heading": "증상", "body": "- 개발 폴더에서는 새 기능(예: 등급 `guest`의 한도 2회)이 시험까지 통과하는데, 서비스 폴더로 승격하는 검증에서 \"제약 짝 테스트\"가 실패한다.\n- 안 잡혔다면: 운영에서 새 등급이 **기본 등급 값으로 떨어져** 의도(2회)가 아니라 10회가 나갔을 것이다. 에러가 없다."}, {"kind": "problem", "heading": "원인", "body": "- 구조: `rules.py`(중립/기본값) 위에 서비스 폴더만 가진 `rules_values.py`가 **같은 이름의 표를 통째로 교체**한다(`globals()[name] = value`).\n- 표는 `{\"free\": .., \"paid\": ..}`처럼 키가 등급이라, 새 키(`guest`)를 `rules.py`에만 넣으면 교체 뒤의 표에는 그 키가 없다. 조회가 `표.get(등급, 표[\"free\"])`이면 에러 없이 `free` 값이 나온다.\n- 같은 이유로 운영 상수(`_GLOBAL_AI_DAILY` 3000 → 새 상한 250)도 운영 파일을 안 고치면 옛 값이 그대로 산다."}, {"kind": "solution", "heading": "지침", "body": "1. **새 키·새 상수를 rules.py에 만들면 같은 작업 안에서 운영 값 파일(`rules_values.py`)에도 넣는다.** 승격 전 체크리스트 한 줄: `grep -n \"새이름\" server/constraints/*.py`.\n2. 운영 값 파일 적용 함수는 **rules.py에 없는 이름을 거부**(AttributeError)하게 해 두면 오타·삭제는 잡히지만 \"빠진 키\"는 못 잡는다 → 짝 테스트(기본값 단언)를 **운영 값을 얹은 상태에서도** 돌리는 게이트를 둔다(승격 게이트가 서비스 폴더에서 돌린 것이 이 사례).\n3. 조회가 기본값으로 폴백하는 구조라면, 새 등급 전용 테스트는 \"운영 값을 얹은 상태에서 그 등급의 값이 기본 등급과 달라야 함\"까지 단언한다.\n4. 개발 폴더의 기본값 테스트가 운영 값(서비스 폴더만 있음)을 못 본다는 사실 자체가 맹점이다 — 서비스 폴더에서 한 번 더 도는 단계를 생략하지 않는다."}], "projects": ["RVS_App"], "links": [], "updated": "2026-11-15", "tags": ["배포·운영", "Python"], "tags_overridden": true, "public": true}, {"id": "인프라_실제용량_맞춤_설계_패턴", "title": "인프라는 텍스트북 스택보다 실제 배포 대상 용량에 맞춘다 (범용)", "short": "인프라는 실제 용량에 맞춰", "source": "공용/인프라_실제용량_맞춤_설계_패턴.md", "intro": "새 프로젝트/기능의 인프라(DB, 인증, 파일저장 등)를 설계할 때 적용하는 판단\n원칙. 개인 홈서버·소규모 VPS처럼 자원이 뻔히 제한된 환경에 배포할 계획이면\n특히 중요.", "sections": [{"kind": "problem", "heading": "함정 — \"정석\" 스택을 먼저 정하고 나중에 배포 환경을 맞추려 함", "body": "Postgres+Redis+MinIO+커스텀 인증처럼 \"제대로 하려면 이렇게\"라는 텍스트북\n구성을 먼저 정해두고, 나중에야 실제 배포 대상(2코어/8GB 홈서버에 이미 컨테이너\n7개가 도는 중, 명시적으로 \"가벼운 서비스 4~6개까지\"로 스스로 제한해둔 상황\n같은)의 실제 여유 용량을 확인하는 순서로 진행하면, 뒤늦게 \"이 스택은 이\n서버에 못 올린다\"는 걸 깨닫고 되돌리게 된다."}, {"kind": "checklist", "heading": "원칙 — 스택을 정하기 전에 실제 배포 대상부터 확인한다", "body": "1. **배포 대상의 실제 여유 용량(CPU/메모리/이미 떠 있는 서비스 수)을 먼저\n   확인**한다 — \"이 정도면 되겠지\"가 아니라 실측.\n2. **같은 인프라 위에서 비슷한 필요를 이미 해결한 사례가 있는지 먼저\n   찾는다** — 형제 프로젝트가 같은 서버에서 이미 검증한 도구(예: DB+인증+\n   파일저장+실시간을 한 프로세스로 묶는 올인원 도구)가 있으면, 새 프로젝트도\n   그걸 재사용하는 쪽이 \"새로 프로세스 하나 더 얹기\"보다 안전하다 — 이미\n   그 환경에서 돌아간다는 것 자체가 검증된 사실이다.\n3. **여러 프로젝트가 같은 인프라 인스턴스를 공유할 땐 네임스페이스(접두사\n   등)로 구분**하고, 인스턴스를 따로 새로 안 판다 — 자원이 제한된 환경일수록\n   \"일단 나눠놓고 나중에 합친다\"보다 \"일단 합쳐두고 필요해지면 나눈다\"가 더\n   싸다."}, {"kind": "other", "heading": "재검토 트리거를 명시적으로 남긴다", "body": "공유 인스턴스로 갈 땐 \"이 결정을 재검토해야 하는 조건\"을 결정 문서에 같이\n남긴다(예: \"두 프로젝트 실사용 트래픽이 둘 다 유의미하게 늘어나면 그때\n분리를 재검토\"). \"나중에 문제되면 그때 보자\"를 조건 없이 남기면, 실제로\n문제가 될 때까지 아무도 그 결정을 다시 안 열어본다 — 언제 다시 열어봐야\n하는지 구체적인 신호를 미리 정해두는 게 핵심이다."}, {"kind": "solution", "heading": "여러 독립 서비스를 하나로 흡수할 때(반대 방향의 같은 원칙)", "body": "이미 별개로 떠 있던 서비스를 메인 앱에 합칠 때도 같은 절약 원칙이 적용된다\n— 예: 독자적인 인증/헬스체크/루트 라우트를 갖고 있던 별도 FastAPI 앱을\n메인 서버의 `APIRouter(prefix=\"/...\")`로 흡수하는 경우, 그 서비스가 갖고\n있던 자체 인증/헬스체크/루트 라우트 중 **메인 앱이 이미 커버하는 것들은\n그대로 들고 오지 말고 명시적으로 재감사해서 제거**한다 — 흡수했는데\n중복 라우트/중복 인증 로직이 남으면 그 자체가 나중에 어느 쪽이 진짜인지\n헷갈리는 원인이 된다."}], "projects": [], "links": [], "updated": "2026-08-19", "tags": ["배포·운영"], "public": true}, {"id": "자동로드_문서_비대화_파일단위_
