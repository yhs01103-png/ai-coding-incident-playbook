<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 코딩 사고 플레이북</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📘%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* 기초 강좌(강좌_v2.html)·3월 교재와 같은 톤: 어두운 배경 + 보라/분홍/민트/주황 */
:root{
  --bg:#08080a;--panel:#111115;--soft:#18181f;--soft2:#1f1f28;--line:#2c2c3e;--line2:#3a3a52;
  --ink:#f2f2f8;--body:#dcdce8;--sub:#b4b4cc;--dim:#9a9ab8;
  --accent:#7c6cfc;--link:#b3a8ff;--accent-soft:rgba(124,108,252,.16);--code:#14141b;
  --problem:#fc6c8f;--problem-soft:rgba(252,108,143,.12);--solution:#6cfcb8;--solution-soft:rgba(108,252,184,.1);
  --case:#a99cff;--case-soft:rgba(124,108,252,.14);--checklist:#fcb86c;--checklist-soft:rgba(252,184,108,.12);
  --muted:#9a9ab8;--muted-soft:#1f1f28;--ok:#6cfcb8;--bad:#fc6c8f;
  --head:'Noto Sans KR','Malgun Gothic',sans-serif;--mono:'JetBrains Mono',Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.8 'Noto Sans KR','Malgun Gothic',system-ui,sans-serif;-webkit-font-smoothing:antialiased;word-break:keep-all}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse at 15% 10%,rgba(124,108,252,.13) 0%,transparent 45%),
             radial-gradient(ellipse at 85% 85%,rgba(252,108,143,.09) 0%,transparent 45%)}
header,main{position:relative;z-index:1}
a{color:var(--link);text-decoration:none}a:hover{text-decoration:underline}
/* 가독성: 본문은 한 줄 72자 안팎, 문단 색은 제목보다 한 단계 낮게, 강조는 더 밝게 */
.md{color:var(--body);max-width:76ch}.md b{color:#fff}.intro{max-width:76ch}
.md p,.md li{font-size:16px}.md li::marker{color:var(--dim)}
header{position:sticky;top:0;z-index:5;background:rgba(17,17,21,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line2)}
.bar{max-width:1280px;margin:0 auto;padding:14px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.brand{font-family:var(--head);font-weight:700;font-size:17px}
.brand small{display:block;font-family:'Noto Sans KR',sans-serif;font-weight:700;font-size:10px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--accent);margin-bottom:2px;order:-1}
.brand{display:flex;flex-direction:column}
nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav a{padding:7px 14px;border-radius:999px;color:var(--sub);font-weight:500;font-size:14px;border:1px solid transparent}
nav a.on{background:var(--accent-soft);color:var(--accent);border-color:rgba(124,108,252,.35)}
nav a:hover{text-decoration:none;color:var(--ink)}
main{max-width:1280px;margin:0 auto;padding:20px}
/* minmax(0,1fr): 본문의 긴 코드가 칸 폭을 밀어 화면이 옆으로 넘치지 않게 */
.layout{display:grid;grid-template-columns:320px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:minmax(0,1fr)}}
.side{position:sticky;top:76px;background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:14px;max-height:calc(100vh - 96px);display:flex;flex-direction:column}
@media (max-width:860px){.side{position:static;max-height:none}}
.side input,.side select{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;
  background:var(--soft);color:var(--ink);font:inherit;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--sub);border-radius:999px;
  padding:3px 10px;font-size:12px;cursor:pointer;font-weight:600}
.chip.on{background:var(--accent-soft);color:var(--accent);border-color:rgba(124,108,252,.45)}
.list{overflow:auto;margin:6px -6px 0;padding:0 6px}
.item{display:block;padding:9px 10px;border-radius:10px;color:var(--ink);font-size:14px;line-height:1.4}
.item:hover{background:var(--soft);text-decoration:none}.item.on{background:var(--accent-soft)}
.item .m{display:flex;gap:6px;margin-top:3px;font-size:11px;color:var(--sub)}
.count{font-size:12px;color:var(--sub);margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.side-head{padding:4px 4px 14px;margin-bottom:12px;border-bottom:1px solid var(--line2)}
.eyebrow{font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
.side-title{font-family:var(--head);font-size:17px;font-weight:700;color:var(--ink);margin-top:4px}
.side-desc{font-size:12.5px;color:var(--sub);line-height:1.6;margin-top:4px}
.flabel{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--dim);margin:10px 2px 6px}
.chips{margin-top:0!important}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px 30px}
@media (max-width:600px){.card{padding:18px}}
h1.t{font-family:var(--head);font-size:24px;line-height:1.4;margin:0 0 12px}
section.s>h2,.hero h2,.pc h3{font-family:var(--head)}
.card{box-shadow:0 1px 0 rgba(255,255,255,.02) inset}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:16px}
.tag{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--soft);color:var(--sub);font-weight:600}
.tag.warn{background:var(--problem-soft);color:var(--problem)}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:10px;padding:9px 16px;font:inherit;
  font-weight:700;font-size:14px;cursor:pointer;background:linear-gradient(135deg,#7c6cfc,#9a6cfc);color:#fff}
.btn:hover{text-decoration:none;filter:brightness(1.1)}
.btn.ghost{background:var(--soft);color:var(--ink)}.btn:disabled{opacity:.45;cursor:default}
.intro{color:var(--body);background:var(--soft);border-left:3px solid var(--accent);padding:12px 16px;border-radius:0 10px 10px 0;margin:6px 0 10px}
section.s{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
section.s>h2{font-size:19px;line-height:1.45;margin:0 0 10px;color:var(--ink);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
/* 절 종류 배지: 채운 색 + 어두운 글자로 대비를 크게 */
.k{font-size:12px;font-weight:800;padding:3px 9px;border-radius:6px;letter-spacing:.3px;color:#14121c}
.k.problem{background:var(--problem)}.k.solution{background:var(--solution)}
.k.case{background:var(--case)}.k.checklist{background:var(--checklist)}
.k.context,.k.related,.k.other{background:#3a3a52;color:#e4e4f0}
section.s{border-left:3px solid transparent;margin-left:-16px;padding-left:13px}
section.s:has(.k.problem){border-left-color:rgba(252,108,143,.55)}section.s:has(.k.solution){border-left-color:rgba(108,252,184,.5)}
section.s:has(.k.case){border-left-color:rgba(169,156,255,.55)}section.s:has(.k.checklist){border-left-color:rgba(252,184,108,.55)}
.md h3,.md h4{font-size:15px;margin:16px 0 6px}
.md p{margin:8px 0}.md ul,.md ol{margin:8px 0;padding-left:22px}.md li{margin:3px 0}
.md code{background:var(--soft2);color:#d6d0ff;padding:1px 6px;border-radius:5px;font:13px/1.5 var(--mono)}
.md pre{background:var(--code);border:1px solid var(--line);padding:14px 16px;border-radius:10px;overflow:auto;margin:10px 0}
.md pre code{color:var(--ink)}
.md pre code{background:none;padding:0;font-size:13px}
.md blockquote{margin:10px 0;padding:6px 14px;border-left:3px solid var(--accent);background:var(--soft);border-radius:0 8px 8px 0}
.md table{border-collapse:collapse;margin:10px 0;font-size:14px;display:block;overflow:auto}
.md th,.md td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.md th{background:var(--soft)}
.q{border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0;background:var(--panel)}
.q .qh{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--sub);font-weight:700;margin-bottom:6px}
.q .sit{font-weight:600;margin:0 0 12px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--soft);color:var(--ink);
  border-radius:10px;padding:10px 14px;margin:6px 0;font:inherit;font-size:14px;cursor:pointer}
.opt:hover{border-color:var(--accent)}.opt.ok{border-color:var(--ok);background:var(--solution-soft)}
.opt.bad{border-color:var(--bad);background:var(--problem-soft)}
.code{background:var(--code);border:1px solid var(--line);border-radius:10px;padding:8px 0;overflow:auto;font:13px/1.6 var(--mono)}
.ln{display:flex;cursor:pointer;padding:0 14px;white-space:pre}.ln:hover{background:var(--accent-soft)}
.ln i{font-style:normal;color:var(--sub);width:28px;flex:none;user-select:none}
.ln.pick{background:var(--accent-soft);box-shadow:inset 3px 0 var(--accent)}
.ln.ok{background:var(--solution-soft);box-shadow:inset 3px 0 var(--ok)}.ln.bad{background:var(--problem-soft);box-shadow:inset 3px 0 var(--bad)}
textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--soft);
  color:var(--ink);font:inherit;font-size:14px;resize:vertical}
.rub label{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:14px;cursor:pointer}
.exp{margin-top:12px;padding:12px 14px;border-radius:10px;background:var(--soft);font-size:14px}
.exp b.ok{color:var(--ok)}.exp b.bad{color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.pc h3{margin:0 0 4px;font-size:17px}.pc .n{color:var(--sub);font-size:13px;margin-bottom:10px}
.pc ul{margin:0;padding-left:18px;font-size:14px}.pc li{margin:3px 0}
.bars{display:flex;height:6px;border-radius:99px;overflow:hidden;background:var(--soft);margin:8px 0 12px}
.bars span{display:block}
.empty{color:var(--sub);text-align:center;padding:60px 20px}
/* 프로젝트 */
.tag.ghost{background:transparent;border:1px solid var(--line2);color:var(--dim)}
.method summary{cursor:pointer;list-style:none;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.method summary::-webkit-details-marker{display:none}.method summary b{font-family:var(--head);font-size:16px}
.method .more{margin-left:auto;font-size:12px;color:var(--link)}.method[open] .more{display:none}
.method .md{margin-top:14px}.method{margin-bottom:18px}
.pfilter{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;margin:0 0 16px}
.pfilter .flabel{margin:0}.pfilter .chips{margin:0 14px 0 0}
.pcard{display:flex;flex-direction:column;color:var(--ink);transition:border-color .15s,transform .15s}
.pcard:hover{text-decoration:none;border-color:rgba(124,108,252,.6);transform:translateY(-2px)}
.pg{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--sub);font-weight:600}
.pg.big{font-size:14px;margin-bottom:6px}.stars{color:var(--checklist);letter-spacing:2px;font-size:14px}
.pc .sum{color:var(--body);font-size:14px;line-height:1.7;margin:4px 0 12px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.stack{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.pfoot{margin-top:auto;display:flex;gap:14px;font-size:12px;color:var(--sub);border-top:1px solid var(--line);padding-top:10px}
.pfoot b{color:var(--ink);font-size:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0}@media (max-width:760px){.two{grid-template-columns:1fr}}
.box{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.box ul{margin:8px 0 0;padding-left:18px;color:var(--body);font-size:14.5px}.box li{margin:5px 0}
section.s.plain{border-left:0;margin-left:0;padding-left:0}
.hint{font-family:'Noto Sans KR',sans-serif;font-size:12px;font-weight:500;color:var(--dim)}
.tl{list-style:none;margin:6px 0 0;padding:0 0 0 18px;border-left:2px solid var(--line2)}
.tl li{position:relative;margin:0 0 18px;padding-left:6px}
.tl li::before{content:'';position:absolute;left:-25px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--bg)}
.tlh{display:flex;gap:8px;align-items:center}.ref{font:700 12px var(--mono);color:var(--accent);background:var(--accent-soft);padding:1px 8px;border-radius:6px}
.date{font-size:12px;color:var(--dim)}.tlt{font-weight:700;font-size:16px;margin:4px 0 6px;color:var(--ink)}
.tlr{color:var(--body);font-size:14.5px;margin:3px 0}.tlr .lbl{display:inline-block;min-width:58px;font-size:12px;font-weight:700;color:var(--dim)}
.rev{font-size:12px;font-weight:700;color:var(--checklist);border:1px solid currentColor;padding:0 7px;border-radius:6px}
.tld{margin:8px 0 2px;border:1px solid var(--line2);border-radius:10px;padding:2px 12px;background:var(--soft)}
.tld summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--accent);padding:6px 0}
.tld ul{margin:2px 0 6px;padding-left:18px}.tld li{margin:2px 0;padding:0}.tld li::before{display:none}
.rl{margin:6px 0;padding-left:18px}.rl li{margin:6px 0}.rl .tag{margin-left:4px}.rl .fold{display:none}
.hero{margin-bottom:18px}.hero h2{margin:0;font-size:22px}.hero p{margin:4px 0 0;color:var(--sub)}
.prog{font-size:12px;color:var(--sub)}
/* 가독성 2차: 한 줄을 짧게, 줄·문단 간격 넓게, 절 사이 여백 크게 */
.md{max-width:68ch;line-height:1.9}.intro{max-width:68ch}
.md p{margin:12px 0}.md li{margin:7px 0}.md ul,.md ol{margin:12px 0}
section.s{margin-top:30px;padding-top:24px}
section.s>h2{font-size:20px;margin-bottom:14px}
h1.t{font-size:27px;margin-bottom:4px}
.full{color:var(--dim);font-size:14px;line-height:1.6;margin:0 0 14px;max-width:80ch}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}
.toc a{font-size:12.5px;padding:4px 10px;border-radius:8px;background:var(--soft);color:var(--sub);border:1px solid var(--line)}
.toc a:hover{color:var(--ink);border-color:var(--line2);text-decoration:none}
.toc a i{font-style:normal;display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
/* 목록: 짧은 제목 한 줄 + 회색 메타 한 줄, 항목 사이 구분선 */
.item{padding:10px 10px;border-bottom:1px solid var(--line);border-radius:0;font-size:14.5px;font-weight:600}
.item.on{border-radius:10px;border-bottom-color:transparent}
.item .m{font-weight:500;font-size:11.5px;color:var(--dim);flex-wrap:wrap}
.item .m span+span::before{content:"·";margin-right:6px;color:var(--line2)}
a.tag{color:var(--sub)}a.tag:hover{color:var(--ink);text-decoration:none;background:var(--soft2)}
/* 용어: 본문 첫 등장에 점선 밑줄, 올리면 뜻 */
.term{color:inherit;border-bottom:1.5px dotted var(--link);position:relative;cursor:help}
.term:hover{text-decoration:none;color:var(--link)}
.term:hover::after,.term.tip::after{content:attr(data-tip);position:absolute;left:0;top:calc(100% + 6px);z-index:9;width:max-content;max-width:320px;
  background:#22222e;color:var(--ink);border:1px solid var(--line2);border-radius:8px;padding:8px 12px;font-size:13px;line-height:1.6;
  font-weight:500;white-space:normal;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.tc h3{margin:0;font-size:18px;font-family:var(--head)}.tc .ts{color:var(--link);font-weight:600;margin:6px 0 8px;font-size:14.5px}
.tc p{color:var(--body);font-size:14.5px;margin:0 0 10px}.tc .al{font-size:12px;color:var(--dim)}
.tc.hit{border-color:var(--accent);box-shadow:0 0 0 2px rgba(124,108,252,.35)}
.tc ul{margin:6px 0 0;padding-left:18px;font-size:13.5px}
/* 1단계 점검: 찾기 패널은 넓은 화면에선 늘 펼침, 좁은 화면에선 접어서 본문이 먼저 보이게 */
.finder{display:flex;flex-direction:column;min-height:0;flex:1}
.ftoggle{display:none}
@media (max-width:860px){
  .ftoggle{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:none;color:var(--ink);
    font:inherit;font-weight:700;font-size:15px;padding:2px;cursor:pointer}
  .ftoggle .fa{font-size:12px;font-weight:600;color:var(--link)}
  .finder.closed>:not(.ftoggle){display:none}
  .finder:not(.closed)>.ftoggle{margin-bottom:6px}
  .side .side-head{display:none}
  .list{max-height:60vh}
}
/* 공백 없는 긴 글자(경로·식별자·URL)가 좁은 화면 밖으로 밀려나지 않게 — 줄 안에 들어갈 수 없을 때만 끊긴다 */
main{overflow-wrap:anywhere}
[hidden]{display:none!important}
/* 2단계: 칩은 버튼(키보드로 고를 수 있게), 포커스 테두리 */
button.chip{font-family:inherit;line-height:1.6}
.chip:focus-visible,.ln:focus-visible,.opt:focus-visible,.btn:focus-visible,.ftoggle:focus-visible{outline:2px solid var(--link);outline-offset:2px}
/* 휴대폰: 용어 뜻은 화면 아래에 고정된 띠로(단어 위치에 따라 화면 밖으로 나가지 않게) */
@media (hover:none){.term.tip::after{position:fixed;left:16px;right:16px;bottom:16px;top:auto;width:auto;max-width:none}}
/* 퀴즈 점수 요약·끝 버튼 */
.qsum{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;font-size:13px;color:var(--sub);margin:0 0 6px}
.qsum .bars{flex:1 0 100%;margin:4px 0 6px}.qsum b{color:var(--ink)}
.qend{justify-content:space-between;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
/* 용어 검색·분야 묶음 */
.tbar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin:0 0 18px}
.tbar input{flex:1 1 260px;max-width:420px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--soft);color:var(--ink);font:inherit;font-size:14px}
.tbar .chips{margin:0}
.tgroup{margin-bottom:26px}.tgh{font-size:16px;color:var(--sub);margin:0 0 10px;font-weight:700}
.rhead{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.rhead h1.t{flex:1 1 320px}
.rhead .btn{flex:none;margin-top:4px}
.meta.p{margin-bottom:6px}
.meta .ml{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--dim);margin-right:2px}
</style>
</head>
<body>
<header><div class="bar">
  <div class="brand"><small>Incident → Rule → Code → Effect</small>AI 코딩 사고 플레이북</div>
  <nav id="nav">
    <a href="#rules" data-v="rules">규칙</a>
    <a href="#quiz" data-v="quiz">퀴즈</a>
    <a href="#projects" data-v="projects">프로젝트</a>
    <a href="#decisions" data-v="decisions">결정</a>
    <a href="#terms" data-v="terms">용어</a>
    <a id="course" href="#" target="_blank" rel="noopener" hidden>기초 강좌 ↗</a>
  </nav>
</div></header>

<script>
const DATA = {"rules": [{"id": "1대N_확장_배지_대표엔티티_드릴다운_패턴", "title": "\"알림 배지 1개 = 엔티티 1개\"였던 설계가 엔티티 여러 개로 늘어날 때 (범용)", "short": "배지 1개가 엔티티 N개로 늘 때", "source": "공용/1대N_확장_배지_대표엔티티_드릴다운_패턴.md", "intro": "알림/배지/뱃지형 UI가 \"지금 이 앱에서 이 종류의 엔티티는 항상 최대 1개\"라는\n암묵 전제 위에 만들어져 있다가(예: \"대기 중인 도전장 1건\"), 나중에 그\n엔티티가 여러 개 동시에 존재할 수 있게(예: \"회사를 여러 개 소유 가능\") 도메인\n자체가 확장될 때 반복되는 설계 문제.", "sections": [{"kind": "problem", "heading": "문제", "body": "배지 하나 → 탭 하나 → 상세 화면 하나로 바로 연결되는 구조는 엔티티가 항상\n1개일 때만 자명하다. 엔티티가 N개로 늘면 \"배지를 눌렀을 때 어느 엔티티의\n상세 화면으로 보낼지\"가 더 이상 자명하지 않다 — 이 시점에 흔히 나오는\n과잉설계는 \"알림 센터\"류의 새 목록형 화면을 통째로 새로 만드는 것인데,\n엔티티가 실제로 동시에 여러 개 걸리는 경우가 드물다면 이건 문제 크기 대비\n과한 투자다."}, {"kind": "solution", "heading": "해법 — 새 화면 대신 \"대표 엔티티 고정 + 그 안에서 드릴다운\"", "body": "1. 배지는 여전히 **하나만** 유지하고, 목적지를 \"대표 엔티티\"(보통 그\n   도메인에서 이미 존재하는 정렬 기준의 1등 — 예: 가장 규모가 큰 것, 가장\n   최근 것)의 상세 화면으로 고정한다. 새 알림 목록 화면을 만들지 않는다.\n2. 그 상세 화면 안에 \"이 엔티티와 같은 종류의 나머지 것들\"을 나열하는 보조\n   섹션(예: \"계열사\", \"관련 항목\")을 추가해서, 실제로 알림이 걸린 엔티티가\n   대표 엔티티가 아니었더라도 한 번 더 탭해서 도달할 수 있게 한다.\n3. 이 보조 섹션은 엔티티가 1개뿐이면(가장 흔한 경우) 자동으로 숨겨서, 평소엔\n   기존 화면과 다를 게 없다 — 화면이 늘어나는 게 아니라 기존 화면에 조건부\n   섹션 하나가 추가되는 것뿐이다.\n\n이 접근의 핵심은 \"새 UX 화면/네비게이션 계층을 만들지 않고, 이미 있는\n상세→목록 탐색 구조를 한 단계 더 씀\"이다 — 알림 센터형 UI는 엔티티가 실제로\n자주 여러 개 동시에 걸리는 도메인(이메일 받은편지함 등)에서나 투자 가치가\n있다."}, {"kind": "case", "heading": "실측 사례 (poker_app, ADR-119/120, 2026-09-13~14)", "body": "\"라이벌→플레이어 회사 도전\" 배지는 원래 \"대기 중 도전 1건\"이라는 전제로\n설계됐다(회사가 1개뿐이던 시절). 이후 다중 소유(ADR-109)로 플레이어가 회사를\n여러 개 가질 수 있게 되면서, \"매물 제안/역제안\" 배지를 새로 추가할 때 같은\n문제가 재현됐다 — 회사 여러 개가 각자 대기 중 제안을 가질 수 있어 \"배지 하나\n→ 어느 회사로 보낼지\"가 불명확. 사용자가 직접 제안한 해법(레퍼런스 앱의\n실제 구조를 조사해 검증)이 정확히 위 2단계 패턴이었다: 배지는 항상\n\"peak_season_earnings 기준 가장 큰 보유 회사\"로 고정 이동, 그 회사 상세\n화면에 \"계열사\" 섹션(나머지 보유 회사 목록 + 대기 제안 있는 회사는 뱃지\n표시)을 신설. 새 알림 센터 화면은 만들지 않았고, 회사가 1개뿐인 대다수\n플레이어에게는 계열사 섹션 자체가 안 보인다(조건부 렌더링)."}], "projects": ["poker_app"], "links": [], "updated": "2026-09-14", "tags": ["Flutter", "설계·구조"], "tags_overridden": true, "public": true}, {"id": "Android_납품전_debug서명_allowBackup_점검_패턴", "title": "Android 앱을 납품·배포하기 전 점검 — debug 서명, allowBackup, 서명 경고가 안 보이는 문제 (범용)", "short": "Android 납품 전 점검", "source": "공용/Android_납품전_debug서명_allowBackup_점검_패턴.md", "intro": "Flutter 앱을 APK로 고객에게 넘기거나 배포하기 전에, 코드는 멀쩡해도 **빌드 설정이 개발용 그대로**인 경우가 많다.\nMarket_Agent_App(2026-10-07 실측)과 Lazzy_App_OS_Monorepo 클라이언트가 같은 기본 템플릿 상태였다.", "sections": [{"kind": "solution", "heading": "1. release 빌드가 debug 키로 서명된다 (Flutter 기본 템플릿)", "body": "`android/app/build.gradle.kts`의 기본값은 release에도 `signingConfigs.getByName(\"debug\")`를 쓴다(`flutter run --release`가\n되게 하려는 템플릿 주석이 그대로 남아 있다). 결과:\n\n- **업데이트가 막힌다** `[Android 일반 동작 — 이번에 키 불일치 설치는 재현 안 함]`. 같은 패키지 이름이라도 서명 키가 다르면 `adb install -r`/스토어 업데이트가\n  `INSTALL_FAILED_UPDATE_INCOMPATIBLE`로 실패해 **앱을 지우고 다시 깔아야 하고, 그러면 앱 안 데이터가 사라진다.**\n  debug 키로 한 번이라도 고객에게 나가면, 나중에 진짜 키로 바꾸는 순간 기존 고객은 전부 재설치가 필요하다.\n- debug 인증서는 누구나 만들 수 있어 \"내가 만든 앱\"의 증거가 못 된다.\n- **debug 키 서명 APK는 납품용이 아니다.**\n\n**조치**: 키스토어 정보를 `android/key.properties`(저장소에 올리지 않음, `.gitignore`)에 두고 release 서명 설정을\n읽게 한다. 파일이 없으면 개발 편의상 debug 키로 빌드하되 **경고를 낸다.** 서명 키 파일과 비밀번호는 **분실하면\n복구할 수 없으니** 저장소 밖에 따로 백업한다. 납품할 모든 APK는 처음부터 이 키로 서명한다."}, {"kind": "solution", "heading": "2. `allowBackup`을 지정하지 않으면 기본값이 \"허용\"이다", "body": "`AndroidManifest.xml`의 `<application>`에 `android:allowBackup`이 없으면 백업이 허용된다(Android 12+는\n`dataExtractionRules`/`fullBackupContent`도 별도로 본다). 앱 데이터(대화·알림 박스 등)가 클라우드 백업과 `adb\nbackup`에 실려 나간다. 개인정보를 저장하는 앱은 `android:allowBackup=\"false\"`로 둔다. 백업을 끄면 재설치 후\n데이터는 복원되지 않는다 — 사용자가 백업에 의존하는 앱인지 먼저 확인한다.\n\n점검(설치된 debug 앱): `adb shell dumpsys package <패키지> | grep -E \"flags=\"` 에 `ALLOW_BACKUP`이 **없어야** 한다\n(없으면 차단됨). 이번 실측: 수정 전엔 지정이 없었고 수정 후 `flags=[ DEBUGGABLE HAS_CODE ALLOW_CLEAR_USER_DATA ]`."}, {"kind": "solution", "heading": "3. 서명 경고가 `flutter build` 출력에 안 나온다", "body": "`build.gradle.kts`의 `logger.warn(\"...key.properties 없음...\")` 같은 경고는 `flutter build apk --release` 출력에\n**나오지 않았다**(Gradle 로그를 Flutter가 걸러서 보여 줌, 이번 실측으로 확인). 경고가 안 보인다고 서명이 정상인\n것이 아니다. **경고 대신 산출물을 직접 검사한다:**\n\n```\nJAVA_HOME=\"C:/Program Files/Android/Android Studio/jbr\"   # apksigner는 java가 PATH/JAVA_HOME에 있어야 한다\napksigner.bat verify --print-certs build/app/outputs/flutter-apk/app-release.apk\n# Signer #1 certificate DN: C=US, O=Android, CN=Android Debug   ← 이게 나오면 debug 서명\n```\n\n`apksigner`는 `%LOCALAPPDATA%\\Android\\Sdk\\build-tools\\<버전>\\apksigner.bat`. `flutter doctor -v`의 \"Java binary\"가\nJDK 위치를 알려 주고, 없으면 Android Studio의 `jbr` 폴더를 쓴다."}, {"kind": "checklist", "heading": "4. 설치가 \"성공\"처럼 보이는데 안 된 경우 (점검 시 같이 쓰는 확인)", "body": "`adb -s <기기> install ... | tail -1`처럼 파이프로 이어 쓰면 설치 실패여도 종료 코드가 0이 된다(파이프의 마지막\n명령 코드). 기기가 USB에서 빠져 있어도 명령이 \"기기를 기다리는 중\"으로 멈췄다가 다음에 연결되면 이어서 진행한다.\n설치 후에는 `dumpsys package <패키지> | grep lastUpdateTime`이 **기기의 현재 시각**으로 갱신됐는지로 확인한다."}, {"kind": "case", "heading": "5. 적용 사례: key.properties 폴백 + 세션 토큰 보안 저장 (JudgeCal, 2026-10-12)", "body": "- release 서명: `android/key.properties`(gitignore)가 있으면 그 키, 없으면 경고 후 debug 키로 폴백하게 gradle을 짜 두면 키가 없는 지금도 빌드가 깨지지 않고, 배포 때는 파일만 두면 된다. 키스토어는 사용자 확인 없이 만들지 않는다. 폴백 여부는 `java -jar build-tools/<ver>/lib/apksigner.jar verify --print-certs <apk>`의 DN으로 확인(.bat은 출력이 비는 경우가 있었다).\n- 토큰 보안 저장: 저장소를 인터페이스(SecretStore)로 감싸 생성자로 주입해야 기존 테스트가 플러그인 없이 돈다. 기본값을 실제 플러그인으로 두면 `load`/`saveSession`을 부르는 기존 테스트가 응답 없이 멈추므로(실측), 해당 테스트 전부에 메모리 구현을 꽂는다.\n- 옛 평문 값 이전은 \"보안 저장소에 쓰기 → 다시 읽어 확인 → 옛 값 삭제\" 순서. 보안 저장소 읽기 실패는 로그아웃으로 처리.\n- OneDrive 폴더에서 `flutter test`가 멈추면 build/.dart_tool을 뺀 임시 복사본에서 돌린다(복사한 windows/flutter/ephemeral 링크는 지우고 pub get)."}, {"kind": "related", "heading": "함께 볼 것", "body": "- 저장 데이터 암호화는 `Hive_암호화는_값만_키는_평문_함정_평문박스_1회이전_패턴.md` — 백업을 끄는 이유가 거기와 이어진다.\n- 실기기 확인 절차는 `Flutter_실기기_adb_탭_스크린샷_자동검증_절차.md`."}], "projects": ["Lazzy_App_OS_Monorepo", "Market_Agent_App"], "links": ["Flutter_실기기_adb_탭_스크린샷_자동검증_절차", "Hive_암호화는_값만_키는_평문_함정_평문박스_1회이전_패턴"], "updated": "2026-10-12", "tags": ["Flutter", "Android", "배포·운영", "보안·개인정보"], "public": true}, {"id": "CLAUDE_md_임포트_전개_미검증_위험_패턴", "title": "CLAUDE.md `@경로` 임포트 전개 미검증 위험 패턴", "short": "CLAUDE.md @임포트 미검증", "source": "공용/CLAUDE_md_임포트_전개_미검증_위험_패턴.md", "intro": "트리거(상황): 사용자 레벨 `~/.claude/CLAUDE.md`(또는 프로젝트 CLAUDE.md)에서\n`@경로` 문법으로 다른 규칙 문서를 참조하고 \"이건 항상 로드된다\"고 가정해 그\n하위 문서에만 실제 규칙 본문(참조조건 표, 트리거 규칙 등)을 두고 있을 때 —\n그 하위 규칙이 세션에서 실제로 적용됐는지 의심되거나, 여러 세션에 걸쳐 같은\n정책 위반이 반복되는데 원인을 코드가 아니라 \"규칙이 안 읽혔을 가능성\"에서\n찾아야 할 때.", "sections": [{"kind": "other", "heading": "무엇이 실제로 발견됐는가", "body": "`@경로` import는 \"세션 시작 시 그 자리에 내용을 그대로 펼쳐 넣는 공식 문법\"\n이라고 문서화돼 있지만(예: 이 사용자의 `~/.claude/CLAUDE.md` 머리말), 실제\n세션의 시스템 리마인더를 열어보면 `@C:\\...\\파일명.md` 줄이 **문자열 그대로**\n남아있고 대상 파일 내용으로 안 펼쳐진 사례가 관측됐다(JudgeCal_Athe 세션,\n2026-09-05). 그 하위 문서(이 사례에서는 프로젝트 전역 작업규칙 마스터본)가\n가리키는 여러 개의 하위 참조조건 규칙(다른 문서를 언제 열지 정하는 규칙들)이\n그 세션 내내 컨텍스트에 전혀 없었다는 뜻 — 사용자가 우연히 그 규칙의 존재를\n물어봐서 직접 파일을 열어 확인한 뒤에야 뒤늦게 반영됐다."}, {"kind": "problem", "heading": "왜 위험한가", "body": "- 에러가 안 뜬다 — import가 안 펼쳐져도 세션은 정상적으로 진행되고, 그\n  세션이 마스터본의 규칙을 하나도 안 지키고 있다는 신호가 사용자에게도\n  AI에게도 안 보인다.\n- \"상시 로드\"라는 문서상 주장과 실제 동작이 갈리는 걸 확인할 방법이\n  세션 시작 시점의 시스템 리마인더를 직접 열어 `@`로 시작하는 줄이 문자열\n  그대로 남아있는지 육안으로 대조하는 것뿐 — 자동 알림이 없다.\n- 체인이 길수록(마스터본 → 참조조건 규칙 여러 개 → 각 참조조건이 또 가리키는\n  실제 프로토콜 문서) 실패가 한 지점에서 전체 체인을 조용히 끊는다."}, {"kind": "solution", "heading": "완화책", "body": "1. **\"상시 로드\"를 안전장치로 신뢰하지 않는다** — 중요한 참조조건 규칙(언제\n   어느 문서를 열지 정하는 규칙)이 의심스러우면, \"이미 로드됐을 것\"이라고\n   가정하지 말고 그 자리에서 직접 Read로 열어 확인하는 걸 기본 습관으로\n   삼는다. 상시 로드는 있으면 편한 최적화일 뿐, 있다고 보장되는 안전장치가\n   아니다.\n2. **재현성으로 구분한다** — 이 문제가 매 세션 재현되는지, 이번 한 번만인지\n   구분 없이 \"가끔 그렇다\"로 단정하지 않는다. 다음 세션에서 같은 방식으로\n   시스템 리마인더를 열어 재확인하고, 반복되면 구조적 결함(빈도 상시)으로,\n   1회만 재현되면 관측 부족(빈도 미상)으로 기록을 갱신한다.\n3. **체인을 짧게 유지한다** — 마스터본이 가리키는 각 하위 참조조건 규칙\n   문서 자체도 또 다른 문서를 가리키는 깊은 체인을 만들지 않는다(이 사용자의\n   기존 규칙 — \"C-3/C-4 절에는 '언제 여는지'만 남기고 본문은 중복 기재하지\n   않는다\"). 체인이 얕을수록 한 지점의 임포트 실패가 덜 광범위하게 퍼진다.\n4. **불일치 발견 시 보고** — 도구/제품 자체의 버그일 가능성이 있으므로\n   재현 정보(파일 경로, 세션 시작 시스템 리마인더의 관측 내용)를 남겨 추적\n   가능하게 한다.\n5. **(2026-09-06, 실제 적용·검증됨) `@import` 대신 SessionStart 훅으로\n   배달한다** — 프로즈(`@import`)는 실패해도 신호가 안 남지만, 훅은 외부\n   프로세스가 실제로 실행되는 것이라 신뢰성 등급 자체가 다르다. 이 사용자\n   워크스페이스엔 이미 매 세션 확실히 발동하는 SessionStart 훅(SSOT\n   레지스트리 드리프트 감지용, `ssot_session_context.py`)이 있었고, 그\n   출력이 이 세션 내내 한 번도 안 빠지고 나온 걸 직접 확인했다 — 그래서\n   마스터본(`클로드_코드_답변_전역규칙.md`)도 같은 방식으로 배달하는 훅\n   (`~/.claude/hooks/global_rules_context.py`)을 신설해 `@import`를\n   완전히 우회했다. 단, 처음엔 cwd 무관하게 매 세션 무조건 그 파일 전문\n   (~7,600자)을 주입하다가 \"이 워크스페이스와 무관한 프로젝트에서도 매번\n   이 비용이 붙는다\"는 지적을 받아, `ssot_session_context.py`가 이미\n   쓰던 것과 동일한 cwd-매치 로직(`_is_or_under`, 레지스트리의 `roots[]`\n   경로 하위 여부 확인)을 그대로 복제해 **등록된 SSOT 루트(하위 폴더\n   포함) 세션에서만** 주입하도록 스코프를 좁혔다 — 매치/비매치 양쪽 다\n   실제로 pipe-test해 확인(매치 시 정상 주입, 비매치 시 출력 0바이트).\n   교훈: \"훅으로 신뢰성을 확보\"와 \"그 훅을 아무 데나 무조건 발동시키지\n   않기\"는 별개 결정이다 — 신뢰성 문제를 해결하자마자 이번엔 \"매번 발동\n   비용\" 문제가 새로 생기므로, 조건부 게이팅(레지스트리 매치 등 이미\n   가벼운 신호가 있으면 그걸 재사용)을 같이 넣어야 실질적으로 쓸 만하다.\n6. **(2026-09-06, 일반화) 이 문제는 `@import`에만 한정되지 않는다** —\n   README → CLAUDE.md → 상위 워크스페이스 인덱스로 이어지는 파일 체인,\n   그리고 마스터본 안의 \"이 상황엔 이 문서를 열어라\"류 참조조건 규칙\n   (예: 이 사용자 워크스페이스의 C-1~C-5)도 전부 같은 신뢰성 등급이다 —\n   전부 \"AI가 그 문서를 실제로 읽고 알아서 따라야\" 작동하는 프로즈\n   기반이라, `@import`와 동일한 방식으로 조용히 안 지켜질 수 있다(아직\n   이쪽은 실측 사례가 없어 [추정]). 신뢰성이 특히 중요한 소수의 규칙만\n   골라 이 완화책 5번처럼 훅으로 전환하는 걸 검토할 가치가 있고, 모든\n   참조조건을 훅으로 바꾸는 건 과함(대부분은 프로즈로 충분히 작동해왔고,\n   신뢰성 문제가 실측되지도 않았다).\n\n비고: 순수 범용(특정 프로젝트 코드와 무관, `@경로` import 기능 자체의 신뢰성\n문제이자 프로즈 기반 참조조건 규칙 전반의 신뢰성 등급 문제) — JudgeCal_Athe\n세션에서 1회 관측 후 완화책 5번을 실제로 적용·검증 완료. 원인 자체의 재현\n빈도(항상/가끔/이번만)는 아직 미상이나, 훅 기반 완화책은 이미 검증된 해법으로\n남긴다."}], "projects": ["JudgeCal_Athe"], "links": [], "updated": "2026-09-06", "tags": ["AI 에이전트", "Git·문서"], "tags_overridden": true, "public": true}, {"id": "Claude_Code_프로젝트규칙_인덱싱_패턴", "title": "Claude Code 다중 프로젝트 워크스페이스 — 규칙 인덱싱 패턴 (범용)", "short": "여러 프로젝트 규칙 인덱싱", "source": "공용/Claude_Code_프로젝트규칙_인덱싱_패턴.md", "intro": "여러 프로젝트가 한 워크스페이스(상위 폴더) 밑에 모여 있고, 그 프로젝트들이 공통\n작업규칙을 공유해야 하는 모든 상황에 적용하는 패턴. 특정 워크스페이스 하나에\n종속된 문서가 아니다 — 새 워크스페이스를 만들거나 새 PC로 옮길 때 이 패턴을\n그대로 재현한다. (`flutter_App` 워크스페이스가 실제 적용 예시로 곳곳에 등장하지만,\n그건 예시일 뿐 이 문서의 대상이 아니다.)", "sections": [{"kind": "solution", "heading": "핵심 원칙 3가지", "body": "1. **하드코딩 대상은 \"위치\"지 \"내용\"이 아니다.** 어떤 파일을 다른 파일이 참조할 때,\n   그 경로를 고정으로 적어두는 건 안전하다 — 위치는 거의 안 바뀌고, 내용은 참조하는\n   쪽이 매번 다시 읽으므로(또는 `@import`로 자동으로) 최신 상태가 반영된다. 진짜\n   위험한 건 **내용을 복붙**하는 것 — 참조 대신 전체 텍스트를 그대로 옮겨 담으면\n   원본이 바뀔 때마다 사본도 일일이 갱신해야 하는 이중 관리가 시작된다.\n2. **\"항상 필요한 것\"과 \"가끔 필요한 것\"을 구분해서 로드 방식을 다르게 한다.** 항상\n   필요한 것(예: 코딩 작업 컨벤션)은 세션 시작 시 무조건 자동으로 있어야 하고, 가끔만\n   필요한 것(예: 특정 프로젝트 세부 규칙, 설계 문서 프로토콜)은 인덱스에 경로만\n   기록해두고 필요할 때 찾아서 연다.\n3. **\"자동 로드 안 함\"과 \"경로를 모름\"은 다르다.** 어떤 항목을 항상 로드 대상에서\n   뺐다고 그 항목이 어디 있는지까지 인덱스에서 지우면 안 된다 — 인덱스의 존재 이유\n   자체가 \"가끔 필요한 것의 경로를 항상 기록해두고, 여는 건 필요할 때만 하는 것\"이다."}, {"kind": "solution", "heading": "계층 구조 (3단)", "body": "1. **사용자 레벨(`~/.claude/CLAUDE.md`, Claude Code 공식 기능)** — 이 PC의 어느\n   프로젝트에서 세션을 열든 예외 없이 항상 로드되는 유일한 자리. `@import`로\n   \"항상 필요한 것\"만 최소한으로 하드코딩한다(원칙 2). 보통 2가지 정도로 충분:\n   - 워크스페이스 공통 작업규칙 마스터본(선커밋/커밋규칙/테스트/빌드 등 코딩\n     컨벤션 — 프로젝트 세부사항이나 설계 문서 프로토콜은 여기 안 넣는다, 아래\n     \"무엇을 항상 로드할지\" 참고)\n   - 워크스페이스 밖에서도 항상 알아야 하는 것이 있다면 그것도(예: PC 환경설정\n     스크립트 위치 인덱스)\n\n2. **워크스페이스 루트의 분류기(`<workspace>/.claude/CLAUDE.md`)** — 워크스페이스\n   루트에서 세션을 열었을 때만 로드됨(개별 프로젝트 폴더 안에서 열면 안 보임 —\n   그래도 무관, 1번이 이미 항상 부르고 있으므로). **실제 내용을 담지 않는다** —\n   \"항상 필요한 것\"이 어디 있는지(1번이 이미 불렀으니 참고용) + \"가끔 필요한 것\"\n   (다른 프로젝트 찾기, 워크스페이스 공용 참고 문서 등)의 경로만 안내하는 순수\n   인덱스. 여기서 `@import`를 또 쓰면 1번과 중복 로드되니 안 쓴다.\n\n3. **각 프로젝트 루트의 `.claude/CLAUDE.md`** — `@import` 안 쓴다. \"작업규칙\n   마스터본은 이미 자동 로드돼 있다\"는 한 문단 + (있다면) 그 프로젝트만의 전용\n   규칙만 프로즈로 담는다. 1번이 이미 어디서 세션을 열든 보장해주므로, 프로젝트\n   마다 또 `@import`할 필요가 없다.\n\n**3.5. (선택 확장) 이 위에 레지스트리 계층을 하나 더 얹을 수 있다.** 프로젝트\n수가 많아지면 3번 파일 하나하나에 프로즈로 참조조건을 써넣는 대신, 별도 레지스트리\n파일(JSON 등, 프로젝트 label→경로→참조조건 매핑)을 하나 두고 각 3번 파일은 그\n레지스트리를 가리키는 순수 포인터로만 남길 수 있다(\"실제 참조조건은 항상 레지스트리\n파일에서 확인, 여기 내용을 복붙하지 않는다\" 같은 문구). 이러면 참조조건이 바뀔 때\n프로젝트마다 CLAUDE.md를 손대는 대신 레지스트리 한 곳만 고치면 된다 — 원칙 1\n(\"하드코딩 대상은 위치지 내용이 아니다\")을 3번 계층에도 한 단계 더 적용한 것.\n프로젝트 수가 적으면 오버엔지니어링이니, 3번만으로 부족하다고 느껴질 때만 도입한다.\n\n**3.5-a. 레지스트리를 도입했으면 물리 CLAUDE.md는 \"산출물\"이지 관리 대상이\n아니다.** 레지스트리의 참조조건 텍스트가 실질적 규칙 SSOT가 되는 순간, 각\n프로젝트의 물리 `CLAUDE.md`는 그 텍스트로부터 그때그때 재생성 가능한 결과물일\n뿐이다(둘 데이터가 어긋날 위험은 \"손편집 vs 재생성\"의 이중관리처럼 보이지만,\n재생성이 항상 레지스트리와 100% 일치하게 만들면 애초에 발생하지 않는다). 이\n상태에서 물리 CLAUDE.md가 남아있는 유일한 이유는 **레지스트리/훅을 못 읽는 다른\nAI 툴(Cursor/Windsurf 등, `.cursorrules`/`.windsurfrules`류 관례)과의 호환**뿐 —\n그런 툴을 안 쓰기로 했다면 물리 파일 자체를 완전히 없애도 지금 작업 중인 AI\n에이전트 입장에서는 기능 손실이 없다(레지스트리를 직접 읽으면 되므로).\n\n**3.5-b. 공유 컨트롤플레인(레지스트리+상시로드 규칙)은 자식 프로젝트가 아니라\n공통 조상 위치에 둔다.** 여러 프로젝트(워크스페이스)가 하나의 레지스트리를\n같이 참조하는 구조에서, 그 레지스트리 파일을 그 여러 프로젝트 중 \"가장 자주\n여는\" 프로젝트 하나 안에 물리적으로 두면 당장은 편해도 구조적으로 어색하다 —\n그 프로젝트가 여러 소비자 중 하나일 뿐인데 소유자처럼 보이게 되고, 나중에 그\n프로젝트만 통째로 옮기거나 삭제하면 다른 모든 프로젝트가 같이 끊긴다. 여러\n소비자가 공유하는 설정/레지스트리/컨트롤플레인은 **그 소비자들의 공통\n부모(워크스페이스) 밑에 전용 폴더**를 두고 거기 둔다(예: `<여러 프로젝트의\n부모>/Plug_In_Global/.claude/` 같은 형태) — 특정 자식 프로젝트에 얹혀사는 대신.\n\n**3.5-c. 레지스트리 하나당 하위 문서는 \"README 체인\"으로 뻗는다, JSON을 매번\n안 고친다.** 레지스트리의 각 항목(루트)은 그 루트의 **최상위(진입점) README** 딱\n하나만 가리키면 된다(예: `readmeReferenceCondition` 필드 하나). 그 밑에 하위\n프로젝트/폴더가 늘어나서 README가 여러 개 생겨도 레지스트리는 절대 안\n건드린다 — 대신 새 README가 생길 때마다 그 **바로 위(부모) README**에 \"경로 +\n언제 여는지 한 줄\"을 표로 추가한다. 즉 인덱싱은 \"레지스트리→최상위 README\"\n한 번만 구조화 데이터로 하고, 그 아래는 전부 README가 README를 가리키는\n자연어 체인으로 내려간다. 이러면 하위 문서가 아무리 늘어나도 레지스트리는\n등록 시점 이후로 사실상 안정 상태를 유지한다 — 레지스트리를 고쳐야 하는 경우는\n\"완전히 새로운 최상위 루트를 등록할 때\"뿐이다.\n\n**3.5-d. referenceCondition(또는 그에 준하는 프로즈 필드)을 새로 쓰거나 고칠 때\n따르는 공통 골격**: `# {루트명} — {한 줄 역할}` 헤더로 시작 → \"사용자 레벨 규칙은\n이미 자동 로드됨\" 한 문단(2번 계층과의 중복 로드 방지 확인) → 본문(인덱스\n표 또는 산문, 하위 항목 3개 이상이면 표로) → (하위 프로젝트가 여럿이면) \"다른\n루트와의 관계\" 절, 양방향 역참조 명시 → \"세션이 이 루트 자체에서 열렸을 때만\"\n절(하위에 여러 프로젝트가 있을 때만 필요, 완결형 단일 프로젝트면 생략). 안 쓰는\n섹션은 억지로 채우지 말고 뺀다 — 짧아도 되는 루트를 길게 쓰는 것보다, 그 루트\n성격에 맞는 섹션만 남기는 쪽이 다른 루트들과의 패턴 일관성을 지킨다.\n\n**3.5-e. README 체인만으로는 \"정말 열리는지\"가 프로즈 판단에 의존한다 —\n자동 체크가 필요한 하위 항목엔 경량 레지스트리 티어를 하나 더 둔다.**\n3.5-c의 README 체인은 그 문서가 지금 작업과 \"관련있다\"고 AI가 판단해야만\n실제로 열린다는 약점이 있다 — 새로 생긴 미등록 하위 폴더에서 그냥 작업을\n시작하면 그 판단 자체가 안 걸릴 수 있다는 게 실측으로 확인됨(README가\n있는데도 한 번도 안 열리는 경우). 그 폴더를 완전한 루트로 승격(3.5의\n레지스트리 계층 전체, referenceCondition 동기화·actions 같은 무거운\n기계장치 포함)하는 건 과하다. 그 중간에 **경량 레지스트리 배열**(무거운\n루트 배열과 완전히 분리, 최소 필드 `{label, path, parentLabel, 마지막\n점검일}`만)을 하나 더 둘 수 있다 — 프로즈가 아니라 \"구조화된 목록\"이라,\n세션 시작 훅 같은 자동 체크가 AI 판단 없이도 전체를 순회할 수 있게 된다.\n\n**3.5-f. 폴더가 이동해도 재탐색 가능하게, 그 폴더의 README 자신에 라벨을\n자기선언시킨다.** 경량 레지스트리가 경로를 들고 있어도 폴더가 옮겨지면\n경로가 끊긴다. 그 폴더의 README.md 맨 위에 `<!-- SSOT-LABEL: 이름 -->`\n같은 자기선언 마커 한 줄을 두면, 경로가 끊겼을 때 이 라벨로 다시 찾아낼\n수 있는 앵커가 된다. 표기는 값 하나만 담을 거면 프론트매터보다 주석\n마커가 낫다 — 구조화된 값(부모 라벨, 마지막 점검일 등)은 어차피 레지스트리\nJSON이 이미 들고 있으므로 README 쪽엔 재탐색용 앵커 하나만 있으면 충분하고,\n주석은 렌더링 시 안 보여서 기존 문서 스타일을 안 깬다(프론트매터는 여러\n필드를 담기엔 좋지만 렌더링 시 그대로 텍스트 블록으로 노출되고, 이미\n프론트매터 관례가 없는 프로젝트라면 스타일이 붕 뜬다).\n\n**3.5-g. \"정기 점검이 필요한 항목\"의 알림은 시계가 아니라 날짜 문턱값으로\n잡고, 평소엔 카운트다운 → 문턱값 도달 시 승인 요청으로 전환한다.** AI\n에이전트는 세션이 열려 있을 때만 존재하므로 \"N시간마다\"/\"매일 자정에\" 같은\n시계 기반 알림은 실제 무인 백그라운드 실행(cron 등)이 있어야만 의미가\n있다 — 이건 \"사람이 세션 중 직접 승인\"이라는 전제 자체를 벗어나는 훨씬 큰\n결정(사람 없이 파일을 만들고 고치는 자율 에이전트가 된다는 뜻)이라, 정기\n점검엔 안 맞는 경우가 많다. 대신 \"마지막 점검일 대비 오늘 며칠 지났나\"를\n**세션이 열릴 때마다(그 항목과 무관한 세션 포함, 3.5-e처럼 cwd 매치 여부와\n무관하게 전체 순회)** 재계산하는 문턱값 방식을 쓰면, 세션 사이 공백을\n자연스럽게 흡수하면서도 무인 실행 없이 같은 효과를 낸다. 새 문턱값 숫자를\n발명하지 말고 그 프로젝트에 이미 있는 비슷한 성격의 문턱값을 재사용한다\n(근거 없는 임의의 새 숫자보다 낫다). 알림 방식도 \"문턱값 넘기 전엔 조용,\n넘으면 갑자기 경고\"보다 낫게 — 문턱값 전엔 매 세션 \"점검까지 D-N일\" 같은\n카운트다운을 항상 보여줘서 사람이 원하면 언제든 앞당겨 수동으로 트리거할\n수 있게 열어두고, 문턱값에 도달하면 그제서야 \"지금 진행할까요?\" 승인형\n프롬프트로 바꾼다. 어느 쪽이든 신호만 낼 뿐 실제 점검(파일 생성/수정 등)은\n사람 승인 뒤 에이전트가 그 세션 안에서 직접 수행 — 신호를 내는 쪽과\n실행하는 쪽을 분리하는 원칙은 그대로 유지된다.\n\n**3.5-h. 범용규칙 문서가 다른 프로젝트를 마이닝해 신설될 때, 원본 프로젝트\nREADME에도 역참조를 표준 절차로 남긴다.** 코드_프로젝트_범용규칙(또는 이에 준하는\n범용 패턴 저장소)에 새 패턴 문서가 어떤 프로젝트의 실측 사례를 근거로 신설되면,\n그 근거가 된 원본 프로젝트의 README(또는 그 프로젝트 인덱싱 계층의 진입점\nREADME — 3.5-c의 README 체인 규칙을 따름)에도 \"일반화된 버전은 `<경로>`에 있다\"는\n역참조 한 줄을 매번 남기는 걸 표준으로 삼는다(임기응변이 아니라 절차). 이 역참조는\n**참조조건(어떤 상황에 여는지) 한 줄만** 담는다 — 범용규칙 문서 쪽에 원본 프로젝트의\n세부 내용을 복붙하지 않듯, 반대 방향(세부 내용을 원본 README에 길게 인라인으로\n늘어놓는 것)도 하지 않는다. 세부 내용은 그 프로젝트 안 별도 파일로 분리하고,\nREADME에는 그 파일을 가리키는 참조조건 한 줄만 남긴다 — 이 폴더의 \"문서 인덱스\"\n표(참조조건 한 줄 + 실제 내용은 별도 .md) 자체가 이미 이 원칙을 코드_프로젝트_\n범용규칙 자신에게 적용하고 있는 사례다.\n\n**3.5-i. 세션 밖(무인 스케줄러 등)에서 도는 감지원이 있으면, 그 결과를\n다음 세션에 넘기는 통로도 같은 레지스트리 파일에 \"구조화된 요청 큐\"로\n둔다.** 3.5-g가 정리한 \"세션이 열릴 때만 존재하는 AI 에이전트\" 전제는\n감지 자체가 세션 밖(작업 스케줄러/cron 등)에서 일어나는 경우에도 안\n바뀐다 — 무인 스케줄러가 문제를 찾아도 그 자리에서 파일을 고칠 순 없고\n(3.5-g와 동일한 \"신호와 실행 분리\" 원칙), 사람이 다음 세션을 열 때까지\n그 발견을 어딘가에 들고 있어야 한다. 이때 GUI 버튼 같은 별도 입력\n경로를 새로 만들 필요는 보통 없다 — 구조적으로 감지 가능한 문제\n(경로 소실/문서 부재/신선도 등)는 애초에 사람이 먼저 알아채야 하는\n케이스가 실질적으로 없기 때문(설계 중 실제로 이 결론에 도달해 GUI\n버튼 안을 스스로 기각한 사례 있음). 대신 `{requestId, targetType,\ntargetLabel, actionType, requestedAt, note}` 형태의 최소 필드짜리\n배열을 레지스트리에 하나 더 둔다 — 처리 완료되면 그 항목을 지우고\n이력은 안 남긴다(경량 레지스트리의 `마지막 점검일`을 덮어쓰기만 하는\n것과 같은 원칙, 이력이 필요하면 3.5-j 참고). 이 큐 하나로 GUI/CLI/\n무인 스케줄러처럼 서로 프로세스가 다른 여러 감지원이 전부 같은 레지스트리\n파일을 통해서만 접점을 갖는다 — 서로 직접 호출하지 않는다.\n\n**3.5-j. 감지 로그는 \"최근 이력\"이 아니라 \"나중에 알고리즘 투자 여부를\n판단할 데이터\"로 설계한다.** 3.5-g의 큐(3.5-i)는 처리되면 이력을 안\n남기므로, \"이 종류의 문제가 실제로 얼마나 자주 발생하는가\"를 시간을\n두고 판단하려면 별도의 축적형 로그가 필요하다 — 단순 디버그용 최근\n20건 뷰가 아니라, 각 발견마다 **근거(evidence)**까지 구조화해서 담아야\n나중에 \"이 패턴이 반복되니 전용 처리 로직에 투자할 가치가 있다/없다\"를\n데이터로 판단할 수 있다(예: 경로가 사라진 걸 감지할 때 \"이동했는지\n삭제됐는지 재탐색하는 알고리즘\"을 만들지 말지는, 그 사라짐이 실제로\n몇 번이나 발생했는지가 쌓여야 판단 가능하다 — 감지만 하고 재탐색은\n사람이 매번 판단하게 미뤄둔 스켈레톤 단계에서 특히 중요). 상한(보관\n개수)도 \"최근 로그\"류 진단 로그보다 넉넉하게 잡는다 — 목적이 다르면\n같은 숫자를 재사용하지 않는다.\n\n**3.5-k. SessionStart 훅이 주입하는 양은 \"상시/조건부\"로 나눠 줄인다 — 훅은 입구(인덱스)만\n주고 상세는 참조 조건으로 돌린다.** 훅이 주입한 파일은 곧 상시 로드이므로 파일 크기가 곧 모든\n세션의 비용이다. 실측 예: 한 워크스페이스에서 훅 3개가 매 세션 약 17.6k자를 넣고 있었다(작업규칙\n전문 10,373자 + 프로젝트 인수인계 전문 5,797자 + 레지스트리 요약 약 1.5k자). 이 중 인수인계를\n\"다음 시작점 + 최근 세션 요약(3개) + 참조 조건 표\"로 줄였더니 5,797자 → 1,780자(훅 출력 측정\n2,253자)가 됐고, 긴 내용(사용자 프로필·미결·이전 진행)은 **원문 그대로** 별도 문서로 옮겨 표로만\n연결했다. 판단 기준: (1) 상시 주입 파일 자체를 인덱스형으로 설계한다(훅 코드는 거의 안 바꿔도\n파일이 작아지면 자동 절감). (2) \"읽지 않으면 적용 안 되는\" 규칙 전문은 포인터로만 돌리면 `@import`\n미전개와 같은 조용한 누락 위험이 있다 — 줄이려면 핵심 요약 상시 + 전문 포인터(이중 관리 비용)가\n한계선이고, 줄일지는 사용자가 정한다. (3) 이동은 삭제가 아니다: 줄 범위를 스크립트로 추출해 원문을\n보존하고, 분리 전 원본은 백업 폴더에 두며, 이동 후 문서 안 경로가 실제 파일을 가리키는지 스크립트로\n전수 확인한다. 함정: 스크립트 안 한 글자 함수명 `R`은 PowerShell 별칭 `r`(Invoke-History)과\n충돌해 쓰기가 전부 실패했다(원본은 무사) — 함수명은 2글자 이상으로 짓는다.\n\n**3.5-l. 폴더마다 \"위·아래 포인터만\" 가진 CLAUDE.md + README 참조 조건 체인 + 부모 등록\n게이트.** 3.5-a는 레지스트리가 있으면 물리 CLAUDE.md가 군더더기라고 했지만, Claude Code가 조상\nCLAUDE.md는 자동으로 전부 불러오고 하위 CLAUDE.md는 그 폴더 파일을 건드릴 때 지연 로드한다는 점을\n이용하면 \"어느 폴더에서 열든 그 폴더의 입구가 자동으로 보장\"된다(레지스트리 계층이 없는 하위 폴더에\n특히 유효). 규칙: (1) CLAUDE.md는 포인터만 — 최상위 CLAUDE.md 경로, 바로 위 CLAUDE.md, \"항상 먼저\n이 폴더 README를 읽을 것\", 하위 목록과 여는 조건(내용 복붙 금지). (2) README는 그 폴더 문서의\n참조 조건 전문(경로 + 언제 여는지 표) + 하위 README를 여는 조건. (3) **게이트**: 새 문서·하위\n폴더·기록 파일은 부모 README 표(와 부모 CLAUDE.md 하위 목록)에 먼저 한 줄을 추가한다 — 표에 없는\n문서는 기록·참조 대상이 아니다(읽기 인덱스 = 기록 인덱스). 이러면 최상위에서 하위 README의 조건만\n갱신하면 아래로 자연스럽게 내려간다. 절충: 앱이 생성하는 이웃 블록이 닿지 않는 하위 폴더에서는 포인터\nCLAUDE.md가 수동 관리라 새 폴더를 만들 때 3곳(새 CLAUDE.md, 부모 하위 목록, 부모 README 표)을\n사람이 맞춰야 하고 어긋남을 알려주는 자동 검증이 없다. 새 세션에서 실제로 자동 로드되는지는 첫\n세션에 확인 항목으로 두고 검증한다."}, {"kind": "other", "heading": "무엇을 \"항상 로드\"에 넣을지 판단 기준", "body": "항상 로드 대상은 최소한으로 유지한다 — 넣을 때마다 모든 세션(그 워크스페이스와\n전혀 무관한 세션 포함)이 그 컨텍스트 비용을 상시로 문다. 판단 기준:\n\n- **넣어야 하는 것**: 코딩 작업 자체의 컨벤션(커밋 규칙, 테스트 규칙 등) — 거의\n  매 세션 실제로 쓰인다.\n- **빼야 하는 것**: 특정 작업 유형에서만 쓰이는 프로토콜(예: 설계 문서 작성\n  프로토콜, 아키텍처 레이어 방침) — 그 문서 자신이 \"일반 작업규칙과 분리 유지,\n  합치면 컨텍스트 부담 상시 발생\"이라고 명시하는 경우가 특히 그렇다. 이런 건\n  분량이 크면 클수록 항상 로드 대가가 커지므로 인덱스로 돌린다.\n- **분류기 자체는 `@import`를 쓰지 않는다** — 워크스페이스 루트에서 열 때만 로드되는\n  파일이 1번(사용자 레벨)과 같은 내용을 또 `@import`하면, 루트에서 여는 그 순간만\n  같은 내용이 두 번 로드되는 낭비가 생긴다."}, {"kind": "other", "heading": "새 프로젝트를 워크스페이스에 추가할 때", "body": "1. `<프로젝트>/.claude/CLAUDE.md`를 아래 템플릿으로 생성(`@import` 안 씀):\n   ```\n   # <프로젝트명> — 프로젝트 규칙\n\n   작업규칙 마스터본은 이미 자동 로드돼 있다 — `~/.claude/CLAUDE.md`(사용자 레벨)가\n   `@import`로 세션마다 무조건 주입하므로 따로 찾아가서 읽을 필요 없다.\n   `<워크스페이스 루트>/.claude/CLAUDE.md`는 프로젝트별 양방향 인덱스(다른 프로젝트\n   경로 목록) 용도 — 이 프로젝트 안에서만 작업할 땐 안 봐도 되고, 다른 프로젝트를\n   찾아야 할 때만 연다.\n   ```\n2. 워크스페이스 루트 분류기의 프로젝트 인덱스 표에 새 행(프로젝트명 + **루트 폴더\n   경로**, `.md` 파일까지는 안 적음 — 아래 \"인덱스 표는 md 파일이 아니라 폴더\n   경로로\" 참고)을 추가한다(양방향 — 새 프로젝트 CLAUDE.md에도 위 템플릿으로 이미\n   역참조가 남는다).\n3. 이 프로젝트만의 전용 규칙(빌드 명령, 커밋 정책, 고정 SSOT 문서 등)이 생기면 위\n   템플릿 아래에 이어서 프로즈로 적는다."}, {"kind": "other", "heading": "인덱스 표는 md 파일이 아니라 폴더 경로로", "body": "프로젝트별 인덱스 표에 각 프로젝트의 `CLAUDE.md` 파일 경로를 직접 적지 않는다 —\n파일 경로를 그대로 적어두면 인덱스를 열자마자 나열된 걸 전부 열어보게 되기 쉽다.\n대신 **프로젝트 루트 폴더**까지만 적어서, 필요한 프로젝트를 찾은 다음에도 \"그 안\n`.claude/CLAUDE.md`를 찾아서 연다\"는 판단을 한 단계 더 거치게 한다."}, {"kind": "case", "heading": "새 워크스페이스에 이 패턴을 처음 적용할 때 — 폴더 구조 예시", "body": "작은 항목(프로젝트 인덱스 표, 짧은 참고 경로 등)은 분류기 파일 안에 섹션으로 직접\n담고, 크거나 항상 로드 대상인 것만 별도 파일로 분리한다 — 폴더/파일을 필요 이상\n쪼개지 않는다. `flutter_App` 워크스페이스의 실제 구조:\n\n```\n<workspace>/.claude/\n├── CLAUDE.md      ← 분류기. 프로젝트 인덱스 표, 스캐폴딩 킷 경로, 가끔 필요한\n│                     참고문서 경로 등 작은 항목은 여기 섹션으로 직접 담음.\n│                     @import 안 씀.\n└── .claude/       ← 작업규칙 마스터본(항상 로드) — 크거나 상시 필요한 것만\n    └── CLAUDE.md     여기 별도 파일로 분리.\n```"}, {"kind": "other", "heading": "Claude Code 공식 import 문법(`@경로`)", "body": "CLAUDE.md 안에 `@경로/파일` 한 줄만 적으면 그 파일 내용을 **세션 시작 시 그 자리에\n그대로 펼쳐 넣는** 공식 import 문법(상대/절대/`~/` 경로 전부 지원, 재귀 최대 4단계,\n코드블록 안 `@`는 무시, `.md` 아닌 파일도 가능 — `.txt`도 확인됨).\n\n| | 프로즈 안내문 | `@경로` import |\n|---|---|---|\n| 로드 여부 | AI가 \"가서 읽어야지\"라고 판단해야 함(안 읽을 수도 있음) | 세션 시작 시 무조건 자동 로드 |\n| 작업 폴더 밖 참조 | 제약 없음 | 최초 1회 승인 팝업 뜸(그 뒤론 안 뜸) |\n| 토큰 비용 | 참고 시에만 | 매 세션 항상(안 읽을 수도 있는 대신 확실히 읽음) |\n| 언제 쓰나 | \"가끔 필요\" 성격 | \"항상 있어야\" 성격 — 최소 개수만 |\n\n**주의**: import 대상 파일을 나중에 이동/리네임하면, 그 파일을 가리키던 `@import`\n줄을 같이 고쳐야 한다 — 프로즈 포인터와 달리 깨져도 에러 없이 조용히 무시될 수\n있어 더 위험하다. 하드코딩 지점을 최소화할수록 이 유지보수 리스크도 줄어든다."}], "projects": [], "links": [], "updated": "2026-10-19", "tags": ["AI 에이전트", "Git·문서"], "tags_overridden": true, "public": true}, {"id": "Dart_이름있는매개변수_후행쉼표_위치_함정", "title": "Dart에서 이름있는 매개변수 그룹 뒤의 후행 쉼표는 `}`/`]` 안쪽에만 올 수 있다 (범용)", "short": "Dart 후행 쉼표 위치", "source": "공용/Dart_이름있는매개변수_후행쉼표_위치_함정.md", "intro": "Dart(Flutter 포함) 메서드/함수 시그니처가 위치 인자 + 이름있는 매개변수\n그룹(`{...}`, 또는 선택적 위치 매개변수 `[...]`)을 함께 쓸 때, 그 시그니처를\n손으로 여러 줄로 재포맷하거나 다른 파일의 기존 시그니처를 옮겨적을 때 걸리는\n순수 문법 함정.", "sections": [{"kind": "problem", "heading": "함정", "body": "```dart\n// ❌ 컴파일 에러 — \"Expected to find ')'\"\nFuture<int> bar(\n  String stat, int tier, {bool isDayPass = false},\n) async { ... }\n```\n\n```dart\n// ✅ 정상 — 후행 쉼표가 `}` **안쪽**에 있고, `}`와 `)`가 같은 줄에 붙어있다\nFuture<int> bar(\n  String stat, int tier, {bool isDayPass = false,\n}) async { ... }\n```\n\n두 형태는 줄바꿈 위치만 다르고 겉보기엔 사소한 차이지만, Dart 문법상\n후행 쉼표는 이름있는 매개변수 그룹 **안쪽**(마지막 매개변수 뒤, `}` 앞)에만\n허용되고, `}` **뒤**에 또 쉼표를 두는 건 항상 무효다(줄바꿈 여부와 무관 —\n같은 줄에 `{...}, )`로 붙여 써도 똑같이 에러). 기존에 정상 동작하던 파일의\n시그니처를 복사해서 다른 곳(테스트 더블의 override 메서드 등)에 붙여넣는\n과정에서 무심코 재포맷하다가 이 형태로 바뀌면, 원본과 \"똑같아 보이는\" 코드가\n컴파일이 깨진다.\n\n**드물게 친절한 함정** — 다른 유사 함정들(예: 다중 클래스 반복 치환 시\n괄호가 엉뚱한 곳으로 새는 경우)과 달리, 이 에러는 실제 원인 줄·칼럼(후행\n쉼표 위치)을 정확히 짚어준다 — `dart analyze`/`flutter analyze`/`flutter\ntest` 컴파일 단계가 전부 동일하게 정확한 위치를 보고하므로, 에러 메시지의\n줄 번호를 그대로 믿고 그 지점의 쉼표/괄호 배치만 확인하면 빠르게 해결된다."}, {"kind": "solution", "heading": "해법", "body": "1. 이름있는 매개변수 그룹으로 끝나는 시그니처를 여러 줄로 쓸 땐 항상\n   `}) async {` 처럼 **닫는 `}`와 `)`를 같은 줄에 붙여 쓰고**, 후행 쉼표는\n   그 직전(마지막 매개변수 뒤)에 둔다.\n2. 다른 파일의 기존 시그니처를 복사할 때는 개행 위치까지 통째로 그대로\n   옮기고, 옮기면서 임의로 재포맷하지 않는다 — 특히 여러 개의 override\n   메서드를 연달아 작성할 때(테스트 더블/페이크 클라이언트 등) 자기도\n   모르게 스타일을 \"정리\"하다가 이 형태로 바뀌기 쉽다.\n3. `dart format <파일>`(또는 IDE의 포맷 온 세이브)을 신뢰할 수 있으면 그걸\n   돌려서 정규 포맷으로 맞추는 게 가장 안전 — 이 규칙을 외울 필요 자체가\n   없어진다.\n4. 에러 메시지가 \"Expected to find ')'\" 이고 그 위치가 `{...}` 뒤 쉼표\n   근처라면, 다른 원인을 찾아 헤매지 말고 이 패턴부터 의심한다."}, {"kind": "case", "heading": "실측 사례 (poker_app, 2026-09-15)", "body": "`poker_server_client.dart`에 실제로 동작하던\n```dart\nFuture<PurchaseBuffCardResult> purchaseBuffCard(\n  String stat, int tier, {bool isDayPass = false,\n}) async { ... }\n```\n를 `test/ui/consortium_provider_test.dart`의 페이크 클라이언트(`_CardClient`)\noverride 메서드로 옮겨적으면서, 다른 override들과 시각적 통일감을 주려고\n무심코\n```dart\nFuture<PurchaseBuffCardResult> purchaseBuffCard(\n  String stat, int tier, {bool isDayPass = false},\n) async { ... }\n```\n로 재포맷 — `flutter test`가 정확히 그 줄·칼럼(닫는 `}` 바로 뒤 쉼표)을\n\"Expected to find ')'\"로 짚어줘, `dart analyze`로 최소 재현(`class Foo {\nFuture<int> bar(String stat, int tier, {bool isDayPass = false}, ) async {\n... }}`)까지 만들어 원인을 확정한 뒤 원본과 동일한 `}) async {` 형태로\n되돌려 해결했다."}], "projects": ["poker_app"], "links": [], "updated": "2026-09-16", "tags": ["Flutter"], "public": true}, {"id": "FastAPI_dependency_예외_에러버블링_사각지대_패턴", "title": "FastAPI dependency 안의 예외는 \"파이프라인이 1차로 잡는다\" 원칙 밖에 있다 (범용)", "short": "FastAPI dependency 예외 사각지대", "source": "공용/FastAPI_dependency_예외_에러버블링_사각지대_패턴.md", "intro": "`레이어_분리_방침.md`류의 에러 버블링 모델(\"에러는 파이프라인에서 1차로 전부\n잡는다 — 로직·API가 UX로 직접 던지지 않음\")을 FastAPI로 구현할 때 생기는\n구조적 사각지대. 특정 프로젝트에 종속되지 않음 — FastAPI `Depends()`(또는\n동급의 \"라우트 본문 실행 전에 먼저 도는\" 미들웨어/dependency 메커니즘을 쓰는\n프레임워크 전반)에서 재현된다.\n\n원본 사례: poker_app(flutter_App/poker_app/server)의 \"앱 정밀 분석\" 인프라\n감사(2026-09-07) — DB 파일을 읽기전용으로 만들어 쓰기 실패를 강제 유발하는\n장애복원력 테스트 중 실측.", "sections": [{"kind": "problem", "heading": "문제 — dependency는 파이프라인의 try/except보다 먼저 실행된다", "body": "FastAPI의 요청 처리 순서는 `Depends(...)` → 라우트 함수 본문(보통 여기서\n파이프라인을 호출) 순이다. 그런데 에러 버블링 방침의 \"파이프라인이 1차로\n전부 잡는다\"는 규칙은 **파이프라인 함수 안의 try/except**로 구현되므로, 그\ntry/except 블록은 라우트 본문(파이프라인 호출부) 안에서만 유효하다 —\n`Depends()` 안에서 실행되는 코드는 그 try/except의 바깥에서, 그보다 먼저\n실행된다.\n\n**실측 재현**: poker_app 서버의 `get_player_id()` dependency는 헤더 값을\n읽어 반환하기 전에 `ensure_player(player_id)`(DB에 처음 보는 player_id면\n행 삽입)를 호출한다. 이 DB 쓰기가 실패하면(감사 중 강제로 읽기전용 파일로\n만들어 재현) 이 예외를 잡는 코드가 어디에도 없다 — 라우트 본문의 파이프라인\ntry/except는 아직 실행되지도 않은 시점이라 무의미하고, FastAPI는 처리 안 된\n예외를 그대로 raw HTTP 500 + 파이썬 스택트레이스로 응답에 내보낸다. 결과:\n계약(\"장애 시 502로 깔끔히 버블링\")과 실제 동작(500 + 정보노출)이 어긋나고,\n동시에 스택트레이스가 클라이언트에 노출된다(정보노출)."}, {"kind": "problem", "heading": "왜 눈에 안 띄는가", "body": "- dependency는 보통 \"인증/헤더 파싱처럼 절대 안 실패하는 얇은 조회\"라고\n  가정하고 설계되지만, 실제로는(이 사례처럼) 그 안에서 DB 조회·쓰기·외부\n  호출이 슬며시 들어가기 쉽다 — \"여기서 플레이어를 처음 본 거면 등록해두자\"\n  같은 편의 로직이 자연스럽게 dependency 쪽에 얹히기 때문.\n- 정상 경로 테스트만으로는 절대 안 드러난다 — dependency의 DB 호출이\n  실패하는 경우 자체가 \"장애 상황을 강제로 유발\"해야만 재현되므로, 일반적인\n  단위/통합 테스트 스위트가 이 경로를 우연히 커버할 확률이 낮다."}, {"kind": "solution", "heading": "해법 — 둘 중 하나, 섞지 말 것", "body": "1. **dependency는 순수 조회만** — DB 등록/쓰기처럼 실패 가능한 부수효과는\n   dependency에서 빼서 파이프라인 함수 맨 앞으로 옮긴다(그러면 그 함수의\n   기존 try/except가 자연스럽게 커버). dependency는 헤더에서 값을 뽑아\n   반환하는 것까지만 — 방침의 \"경로 레이어는 아무것도 호출하지 않는다\"는\n   원칙과 결이 같다.\n2. **dependency 자체에 방어적 try/except를 건다** — 부수효과를 dependency\n   쪽에 남겨야 하는 구조적 이유가 있다면(예: 모든 라우터가 공통으로 필요해서\n   조립 시점 일괄 적용이 더 맞는 경우), dependency 함수 본문에 자체\n   try/except를 걸어 502로 변환해 던진다 — 파이프라인의 1차 캐치를\n   기대하지 말고 dependency 자신이 그 책임을 진다는 걸 명시적으로\n   받아들이는 것.\n\n어느 쪽을 고르든, **\"파이프라인이 다 잡아줄 것\"이라는 가정을 dependency\n코드에 그대로 적용하지 않는다**는 게 핵심 — dependency는 그 가정이 성립하지\n않는 유일한 지대라는 걸 설계 시점에 의식적으로 표시해둔다(주석 한 줄로도\n충분, 다음에 이 dependency를 확장하는 사람이 같은 함정을 반복하지 않게)."}, {"kind": "context", "heading": "언제 이 패턴이 필요한가", "body": "- FastAPI(또는 유사 프레임워크)에서 인증/헤더 파싱용 dependency 안에\n  DB 조회·쓰기·외부 API 호출 등 실패 가능한 코드가 있는지 감사할 때.\n- \"장애 복원력\" 계층을 실제로 실행 검증할 때(코드만 읽고 \"파이프라인이\n  잡을 것\"이라고 짐작하지 않고, dependency가 관여하는 요청 경로도 반드시\n  강제 장애 유발로 재현) — `코드기반_인프라분석_라이브검증_패턴.md`(같은\n  폴더)의 \"라이브로 확인\" 원칙과 정확히 같은 이유."}], "projects": ["poker_app"], "links": ["코드기반_인프라분석_라이브검증_패턴"], "updated": "2026-09-07", "tags": ["FastAPI", "Python"], "tags_overridden": true, "public": true}, {"id": "FastAPI_http미들웨어_연결끊김_차단_취소무력화_함정", "title": "FastAPI `@app.middleware(\"http\")`가 연결 끊김을 막는다 — 요청 취소가 화면에서만 되고 서버는 끝까지 돌아 저장한다", "short": "FastAPI 미들웨어가 취소를 막음", "source": "공용/FastAPI_http미들웨어_연결끊김_차단_취소무력화_함정.md", "intro": "2026-11-01 신설(RVS_App 실기기 점검에서 발견). 요청 취소(`request.is_disconnected()` 감시 → 저장 전 중단,\n`JudgeCal_Athe/클라이언트_취소_서버_저장전_중단_중복쓰기_방지_패턴.md`)를 만들어 단위 테스트까지 통과시켰는데, **실제 서버에서는 한 번도 작동한 적이 없던** 사례다.", "sections": [{"kind": "problem", "heading": "증상", "body": "- 앱은 \"취소했어요\"를 띄우고 입력을 남긴다 — 화면만 보면 정상.\n- 서버 로그에는 취소한 요청이 끝까지 돌아 `status=ok`로 저장된다(역산·평행세계·정밀 예측 모두). 정밀 예측은 화면에 \"한도는 쓰지 않았어요\"라고 뜨는데 서버는 한도를 썼다.\n- 기록 탭에 취소한 역산 카드가 남는다 — 이게 실기기에서 눈에 띈 첫 단서였다."}, {"kind": "problem", "heading": "원인", "body": "`app.middleware(\"http\")(함수)`로 붙인 미들웨어는 Starlette의 `BaseHTTPMiddleware`로 감싸진다. 이 래퍼가 라우트에 넘기는 `receive`는\n연결 끊김(`http.disconnect`)을 전달하지 않아서, 라우트의 `await request.is_disconnected()`가 **끝까지 False**다. IP 제한·보안 헤더처럼\n\"요청마다 한 번 보고 지나가는\" 흔한 미들웨어 하나만 있어도 생긴다.\n\n확인한 실험(uvicorn을 실제로 띄우고 0.7초 뒤 소켓을 닫음):\n\n| 앱 구성 | 라우트가 끊김을 봤나 |\n|---|---|\n| 미들웨어 없음 | True |\n| `@app.middleware(\"http\")`로 통과만 하는 미들웨어 1개 | **False** |"}, {"kind": "problem", "heading": "왜 테스트가 못 잡았나", "body": "- 감시 로직 테스트는 `is_disconnected()`만 흉내 내는 가짜 요청을 썼다 — 미들웨어를 안 거친다.\n- `TestClient`도 실제 소켓이 없어 연결 끊김을 재현하지 못한다.\n- 그래서 \"감시 로직이 맞다\"는 것과 \"실제 요청에 신호가 닿는다\"는 것이 따로 놀았다. 모의 테스트가 배선 결함을 가린 같은 계열의 함정이다\n  (`JudgeCal_Athe/모킹된_테스트가_import_배선_결함을_가린다_함정.md`)."}, {"kind": "solution", "heading": "해법", "body": "미들웨어를 **순수 ASGI 클래스**로 바꾼다 — `receive`를 그대로 넘기므로 끊김 신호가 라우트까지 간다.\n\n```python\nclass SecurityHeaders:\n    def __init__(self, app):\n        self.app = app\n\n    async def __call__(self, scope, receive, send):\n        if scope[\"type\"] != \"http\":\n            return await self.app(scope, receive, send)\n\n        async def send_with_headers(message):\n            if message[\"type\"] == \"http.response.start\":\n                message.setdefault(\"headers\", [])\n                headers = MutableHeaders(scope=message)   # starlette.datastructures\n                for name, value in EXTRA.items():\n                    if name not in headers:               # 라우트가 정한 값은 덮지 않는다(setdefault와 같게)\n                        headers[name] = value\n            await send(message)\n\n        await self.app(scope, receive, send_with_headers)\n\napp.add_middleware(IpRateLimit)       # 등록 순서 규칙은 그대로 — 나중에 붙인 것이 바깥\napp.add_middleware(SecurityHeaders)\napp.add_middleware(CORSMiddleware, ...)\n```\n\n- 요청을 막는 미들웨어(IP 제한 429 등)는 `Request(scope)`로 헤더·IP만 읽고, 막을 때는 `await JSONResponse(...)(scope, receive, send)`로 응답한다.\n- `@app.middleware(\"http\")` → `app.add_middleware(클래스)`로 바꿔도 **순서 규칙(나중 등록이 바깥)은 같다** — CORS를 맨 바깥에 두던 이유(429에도 CORS 헤더)를 그대로 지킨다."}, {"kind": "checklist", "heading": "시험 — 진짜 서버로", "body": "1. **구조 확인**: `[m for m in app.user_middleware if m.cls is BaseHTTPMiddleware] == []` — 누가 `@app.middleware(\"http\")`를 다시 붙이면 바로 걸린다.\n2. **실제 소켓**: 같은 미들웨어를 단 작은 앱을 `uvicorn.Server(...)`로 스레드에서 띄우고(빈 포트), 원시 소켓으로 POST를 보낸 뒤 닫는다 →\n   라우트 안의 취소 토큰이 True가 되는지 본다(`srv.started`를 기다린 뒤 보내고, 끝나면 `srv.should_exit = True`). 2초 안팎.\n3. **수동 확인**: 서버를 띄우고 원시 소켓으로 오래 걸리는 요청을 보낸 뒤 2초 만에 닫는다 → 로그가 `status=ok`가 아니라 취소로 끝나고 저장이 없어야 한다.\n   adb reverse 같은 터널을 의심하기 전에 이걸 먼저 해 보면 원인이 앱/터널이 아니라 서버라는 걸 바로 가른다."}, {"kind": "context", "heading": "범위·남는 것", "body": "- 끊김이 닿아도 **이미 나간 외부 호출(LLM 등)은 끝까지 기다린다** — 감시 토큰은 \"다음 시도 전·저장 직전\"에서만 멈춘다(설계대로). 실측: 취소 뒤 15~19초 걸린 호출은 끝까지 돌고 저장만 안 했다.\n- 배포 앞단(프록시·로드밸런서)이 클라이언트 연결을 바로 끊어 주는지는 별개다 — 로컬에서 되는 것을 확인한 뒤 배포 환경에서 한 번 더 본다.\n- `BaseHTTPMiddleware`는 스트리밍 응답·`BackgroundTasks`·ContextVar 전파에서도 알려진 제약이 있다 — 새 미들웨어는 처음부터 순수 ASGI로 쓰는 편이 낫다.\n\n관련: `JudgeCal_Athe/클라이언트_취소_서버_저장전_중단_중복쓰기_방지_패턴.md`(취소 설계 본체), `공용/Flutter_실기기_adb_탭_스크린샷_자동검증_절차.md`(실기기에서 서버 로그와 화면을 같이 보는 법)."}], "projects": ["JudgeCal_Athe", "RVS_App"], "links": ["Flutter_실기기_adb_탭_스크린샷_자동검증_절차"], "updated": "2026-11-01", "tags": ["FastAPI", "Python"], "tags_overridden": true, "public": true}, {"id": "Flutter_시크릿_에셋번들_노출_방지_패턴", "title": "Flutter 시크릿을 에셋 번들로 노출하지 않기 (범용)", "short": "Flutter 시크릿 에셋 노출 방지", "source": "공용/Flutter_시크릿_에셋번들_노출_방지_패턴.md", "intro": "`.env`를 pubspec `assets:`에 넣고 `flutter_dotenv`로 런타임 로드하는 흔한 패턴은,\n빌드 산출물(APK/앱번들/Windows exe)에 `.env` 원본 파일이 **평문 그대로 패킹**된다는\n치명적 함정이 있다. 앱 파일을 압축 해제(APK는 zip, exe도 flutter_assets 폴더가\n그대로 딸려나감)하면 누구나 API 키/서버 주소를 그대로 꺼낼 수 있다.", "sections": [{"kind": "problem", "heading": "핵심 문제", "body": "```yaml\n# pubspec.yaml — 이렇게 하면 안 됨\nflutter:\n  assets:\n    - .env\n```\n\n```dart\n// main.dart — 이 조합이 위 문제를 만든다\nawait dotenv.load(fileName: '.env');\nfinal apiKey = dotenv.env['GEMINI_API_KEY'];\n```\n\n`assets:`에 나열된 파일은 빌드 시점에 산출물 안에 **파일 그대로** 복사된다 —\n컴파일되어 사라지는 게 아니다. `.gitignore`로 `.env`를 저장소에서 숨겨도 이 문제와는\n무관하다(레포에는 안 올라가지만 빌드 산출물에는 그대로 들어간다는 게 이 함정의\n핵심 — 두 가지는 완전히 다른 노출 경로)."}, {"kind": "solution", "heading": "해법 패턴 — dart-define 전환", "body": "값을 런타임에 파일로 로드하는 대신, **컴파일타임 상수**로 바이너리에 굽는다.\n\n```dart\n// lib/env/app_env.dart — 환경값 레이어, 아무것도 호출하지 않는다\nclass AppEnv {\n  static const String baseUrl = String.fromEnvironment(\n    'BASE_URL',\n    defaultValue: 'http://localhost:8000',\n  );\n  static const String geminiApiKey = String.fromEnvironment('GEMINI_API_KEY');\n}\n```\n\n값 주입은 로컬 실행/빌드 스크립트가 `--dart-define-from-file`로 자동 처리한다:\n\n```powershell\n# scripts/_dart_defines.ps1\n# dart_defines.json은 저장소 루트, .gitignore 처리(실제 값). 커밋되는 건\n# dart_defines.example.json(예시/플레이스홀더)뿐이다.\nfunction Get-DartDefineArgs {\n    $ProjectRoot = Split-Path -Parent $PSScriptRoot\n    $definesFile = Join-Path $ProjectRoot \"dart_defines.json\"\n    if (Test-Path $definesFile) {\n        # 원소 1개짜리 배열을 return하면 PowerShell 파이프라인이 스칼라로\n        # 풀어버려 호출부 @defineArgs 스플래팅이 깨진다(flutter가 \"Target\n        # file \"-\" not found\"로 죽음, 실측) — unary comma로 감싸서 방지.\n        return ,@(\"--dart-define-from-file=$definesFile\")\n    }\n    Write-Warning \"dart_defines.json 없음 — dart_defines.example.json 참고.\"\n    return ,@()\n}\n```\n\n```powershell\n# scripts/run_local.ps1 / build_*.ps1 — ExtraArgs는 반드시 명시 파라미터로\n# 받는다. 파라미터 블록 없이 자동변수 $args에 의존하면, _dart_defines.ps1을\n# dot-source하는 순간 $args가 그 호출 자체의 인자(없음)로 덮어써져 flutter에\n# 손상된 인자가 들어간다(실측 버그).\nparam([Parameter(ValueFromRemainingArguments = $true)] [string[]] $ExtraArgs = @())\n. \"$PSScriptRoot\\_dart_defines.ps1\"\n$defineArgs = Get-DartDefineArgs\nflutter run @ExtraArgs @defineArgs\n```\n\n체크리스트:\n- `pubspec.yaml`의 `assets:`에서 `.env` 제거, `flutter_dotenv` 의존성 자체를 제거\n  (남겨두면 다음 사람이 다시 쓸 여지가 생긴다)\n- 값 소비처가 여러 파일에 흩어져 있으면(예: 서비스마다 `dotenv.get('BASE_URL', ...)`을\n  각자 인라인으로 복제) 전부 `AppEnv` 같은 단일 창구로 모은다 — 흩어진 채로 두면\n  하나 놓치고 지나가기 쉽다(아래 \"실측\" 참고)\n- `.gitignore`에 `dart_defines.json` 추가(실제 키 포함), `dart_defines.example.json`만 커밋\n- 수정 후 반드시 `flutter analyze`로 `Undefined name 'dotenv'` 같은 누락 참조가\n  없는지 확인 — 여러 파일에 흩어진 소비처 중 하나를 편집 중 놓치는 실수가 실제로\n  발생했다(아래 실측 3 참고)"}, {"kind": "other", "heading": "런타임에 값을 바꿔야 하는 경우는 dart-define만으론 부족", "body": "dart-define은 컴파일타임에 고정되므로, \"재시작 없이 서버 주소를 바꾸고 싶다\"(설정\n화면에서 로컬 서버로 전환 등)는 요구에는 안 맞는다. 이 경우 컴파일타임 기본값 +\n런타임 오버라이드를 병행한다(\"push, 안 당김\" 패턴 — 하위 호출부는 값의 출처를 몰라도\n됨):\n\n```dart\nclass JarvisPaths {\n  static const String _compiledDefault = String.fromEnvironment('BASE_URL', ...);\n  static String? _runtimeOverride;\n  static void setBaseUrlOverride(String? url) { _runtimeOverride = url; }\n  static String get baseUrl => _runtimeOverride ?? _compiledDefault;\n}\n```\n\n이 런타임 오버라이드 자체의 설계(버전마커로 원격/로컬 자동전환할지, 언제 이게\n오히려 과한지)는 `배포환경_버전마커_자동전환_런처_패턴.md` 참고 — 그 문서는 \"어디로\n붙을지\"를 다루고, 이 문서는 \"붙는 값 자체를 어떻게 안전하게 주입할지\"를 다뤄\n관심사가 분리된다."}, {"kind": "other", "heading": "핵심 교훈 — 한 프로젝트에서 고친 보안수정은 형제 프로젝트로 자동 전파되지 않는다", "body": "이 취약점은 같은 개발자의 형제 Flutter 프로젝트 3곳에서 **독립적으로 3번** 발견됐다\n(Lazzy_App_OS_Monorepo에서 2026-08-06 최초 발견·수정 → Hub_App_winter에서\n2026-08-20까지 미반영 상태로 남아있다 발견·수정 → AllAd Launcher에서 같은 날 세\n번째로 발견·수정). 세 프로젝트 모두 같은 개발자가 만들었고 같은 패턴\n(`flutter_dotenv` + `.env` in assets)을 각자 독립적으로 채택했을 뿐인데, 한 곳의\n수정이 다른 곳에 저절로 퍼지지 않았다 — **코드는 프로젝트 경계를 넘어 스스로\n전파되지 않는다**는 당연한 사실이, \"이미 한 번 고쳤으니 안전하다\"는 착각을 만들기\n쉽다는 게 이 반복의 진짜 교훈이다.\n\n같이 보기 — 이 사고(재보정이 \"지금 보고 있는 대상\"으로만 사정거리가 한정된\n실측 사례)는 판단 메커니즘 자체를 다루는\n`Coding_Nomal\\모든_표본_일상_전략\\탐색_판단_전환_모델\\탐색_판단_전환_모델.md`\n3-3절에서도 같은 근거로 인용된다 — 코드 레벨 수정은 여기서, 판단 구조 쪽\n일반화는 그 문서에서.\n\n**같은 스택을 공유하는 형제 프로젝트가 여러 개 있으면**, 보안수정 하나를 적용한\n직후 다음 감사를 형제 프로젝트 전체에 돌린다:\n\n```bash\n# 형제 프로젝트들을 한 번에 훑는 감사 커맨드\ngrep -rln \"assets:\" --include=\"pubspec.yaml\" <프로젝트루트들> | \\\n  xargs grep -l \"\\.env\"\ngrep -rln \"flutter_dotenv\" --include=\"pubspec.yaml\" <프로젝트루트들>\n```\n\n발견 즉시 전부 고치지 못하더라도, 이 감사를 **정기적으로 반복 가능한 절차**로\n남겨두는 것 자체가 핵심이다 — 체크리스트 문서 하나를 만드는 것보다 실제로 grep을\n돌려서 형제 프로젝트를 훑는 행동이 있어야 발견된다(이번 세 번째 발견도 사용자가\n\"루트에서 가져올만한거 가져와\"라고 명시적으로 감사를 요청해서야 나왔다 — 자동으로는\n안 드러났다)."}, {"kind": "case", "heading": "실측 3 — 여러 파일에 흩어진 소비처는 수정 중 하나를 놓치기 쉽다", "body": "Hub_App_winter는 `baseUrl` getter가 5개 서비스 파일에 각자 인라인으로 중복\n구현돼 있었다. 5개를 순서대로 고치던 중 `chat_classifier_service.dart` 한 곳을\n빠뜨렸는데, `flutter analyze`가 `Undefined name 'dotenv'`로 즉시 잡아냈다 — 이런\n류의 다중 파일 일괄 치환은 **눈으로 다 훑었다고 믿지 말고 `flutter analyze`(또는\n동급 정적분석)를 마지막 검증 스텝으로 반드시 거친다.**"}, {"kind": "context", "heading": "언제 이 패턴이 필요한가", "body": "- Flutter 앱이 API 키/서버 주소/토큰처럼 빌드 산출물에 노출되면 안 되는 값을\n  `.env` + `flutter_dotenv`로 다루고 있을 때 — 특히 `pubspec.yaml`의 `assets:`\n  목록에 `.env`가 직접 들어있으면 즉시 P0로 취급한다.\n- 새 Flutter 프로젝트를 시작할 때 처음부터 이 패턴(dart-define + AppEnv +\n  `_dart_defines.ps1`)으로 시작하면, 나중에 이미 배포된 빌드에 키가 노출된 뒤\n  재발급하는 것보다 훨씬 싸다."}], "projects": [], "links": [], "updated": "2026-08-24", "tags": ["Flutter", "Android", "LLM", "보안·개인정보"], "tags_overridden": true, "public": true}, {"id": "Flutter_실기기_adb_탭_스크린샷_자동검증_절차", "title": "실기기 확인을 adb 탭·스크린샷으로 직접 돌리는 절차 (poker_app 2026-10-06 실측)", "short": "adb로 실기기 확인 자동화", "source": "공용/Flutter_실기기_adb_탭_스크린샷_자동검증_절차.md", "intro": "", "sections": [{"kind": "context", "heading": "언제", "body": "UI 흐름(시트 자동 열림, 결과 화면, 서버 재시작 뒤 이어하기)을 사람 손 없이 실기기에서 확인할 때. 에뮬레이터·위젯 테스트로는 안\n잡히는 레이아웃 넘침·문구·실제 서버 연동을 본다."}, {"kind": "solution", "heading": "절차", "body": "1. `adb devices`로 연결 확인(Windows는 `%LOCALAPPDATA%\\Android\\Sdk\\platform-tools\\adb.exe` — Git Bash PATH엔 없을 수 있다).\n2. 로컬 서버를 프로젝트 스크립트·`.env` 그대로 띄운다(DB 경로가 곧 계정 — 다른 DB로 뜨면 401). 백그라운드 셸이 바로 종료되면\n   `Start-Process ... -RedirectStandardError`로 분리 실행하고 로그로 기동 확인.\n3. USB면 `adb reverse tcp:PORT tcp:PORT`.\n4. ⚠️ **패키지 이름을 빌드 설정(`applicationId`)에서 확인하고 실행** — 같은 기기에 옛 앱(다른 패키지)이 있으면 `monkey -p 옛이름`으로\n   엉뚱한 앱을 띄워 \"코드에 없는 화면\"을 보고 헤맨다. `adb shell pm list packages | findstr 키워드`로 후보부터.\n   **`uninstall`·`install`은 더 위험하다**(RVS_App 2026-11-16): 옛 앱(`com.rvs.app`)을 실제 앱으로 착각해 \"서버에 연결할 수 없습니다\"를\n   앱 데이터 문제로 넘겨짚고 `adb uninstall com.rvs.app`을 해서 그 앱의 기기 데이터가 지워졌다. 증상을 보고 지우기 전에 **지금 띄운 앱이\n   어느 패키지인지**부터 확인한다. 실행은 `am start …/.MainActivity`가 클래스 이름이 달라 실패할 수 있으니\n   `adb shell monkey -p <패키지> -c android.intent.category.LAUNCHER 1`. 화면 캡처는 폰(`screencap`+`pull`)이나 창 단위만 — 전체 화면 캡처는\n   무관한 화면이 찍힌다.\n5. 스크린샷: `adb shell screencap -p /sdcard/x.png` → `adb pull` → 이미지로 열어 판단. 탭: `adb shell input tap X Y`(스크린샷 좌표가\n   `wm size`와 같으면 그대로 사용). 뒤로가기 `input keyevent 4`. 두 동작을 스크립트(tap.ps1/shot.ps1)로 묶으면 한 줄씩 진행된다.\n6. 시간이 걸리는 화면 전환은 고정 대기 후 찍고, 로딩 중이면 한 번 더 찍는다.\n7. 서버 재시작 복구 같은 시나리오는 \"앱 화면 유지 → 서버 프로세스만 종료·재기동 → 앱에서 다음 액션\"으로 검증."}, {"kind": "case", "heading": "앱 저장 데이터 평문 점검 (debug 빌드, run-as) — 2026-10-07 Market_Agent_App 실측", "body": "암호화 적용 후 \"파일에 평문이 남았나\"를 기기에서 확인하는 절차. **내용은 화면·보고서에 옮기지 않고 \"있음/없음\"과\n숫자만 남긴다**(대화·알림 원문이라 점검 자체가 새로운 노출이 되면 안 된다).\n\n1. `adb shell run-as <패키지> ls app_flutter` — `*.hive` 목록과 크기. `run-as`는 **debuggable 빌드에서만** 된다.\n2. 파일마다 `adb exec-out run-as <패키지> cat app_flutter/<이름>.hive`를 로컬 스크립트(파이썬 `-I`)에 받아 바이트로 검사.\n   Windows 콘솔(cp949)에 한글을 그대로 찍으면 깨지니 결과는 `PLAINTEXT`/`none` 같은 영문 라벨 + 숫자로 출력.\n3. **\"한글 3바이트 패턴이 몇 번 나왔나\"로 판정하지 않는다.** 암호문(무작위 바이트)에서도 UTF-8 한글 시퀀스\n   (`[ê-í][-¿]{2}`)가 위치당 약 0.1%(= 4/256 × 1/16)로 우연히 맞는다. 암호화된 78,840바이트 파일에서\n   기댓값 ≈77건, 실측 74건. 개수가 아니라 **연속 길이**(한글·ASCII 인쇄 가능 문자가 이어지는 구간이 10~15자 이상인\n   수)로 본다. 암호화된 박스는 짧은 우연 일치(최장 7~9자)만, 평문이 남은 박스는 긴 구간(최장 114자)이 나왔다.\n4. 판정이 갈리면 박스 **키**가 내용인지 의심한다 → `Hive_암호화는_값만_키는_평문_함정_평문박스_1회이전_패턴.md`.\n5. 점검 후 로컬에 받은 임시 파일/스크립트는 지운다."}, {"kind": "case", "heading": "다른 세션이 작업 중일 때 — 커밋된 코드만으로 실기기 확인 (RVS_App 2026-10-31 실측)", "body": "작업 폴더에 남의 미커밋 변경이 있으면 거기서 빌드·서버를 띄우는 순간 그 반쯤 된 코드를 확인하게 된다(되돌리거나 stash하는 것도 남의 작업을 건드리는 일).\n\n1. `git worktree add --detach <스크래치>/head HEAD` — 저장소 이력은 공유, 작업 파일은 별도. **추적 안 되는 로컬 파일은 따라오지 않는다**: `.env`, 폴더 라벨(`android/app_variant.local`), `android/local.properties`, 데이터 폴더를 직접 복사한다. 데이터는 **사본**이라 시험 중 생긴 계정·기록이 실제 개발 DB를 더럽히지 않는다.\n2. Windows 경로 길이: 임시 폴더 아래는 Flutter 빌드 산출물이 260자를 넘어 `Could not write file`. `subst R: <폴더>`로 짧은 드라이브를 만들어 빌드하고 끝나면 `subst R: /d`.\n3. 드라이브가 다르면(R:의 프로젝트, C:의 pub 캐시) Kotlin 증분 컴파일이 `Daemon compilation failed: null`로 죽는다 → **사본의** `android/gradle.properties`에만 `kotlin.incremental=false`.\n4. **개발용 무인증 스위치(추적 안 되는 파일)를 일부러 빼고 한 번 더 돌린다** — 인증이 켜진 배포 설정에서만 나는 버그가 있다(RVS: 시작 요청 4개가 동시에 거절되자 각자 기기 가입 → 같은 초에 계정 4개). 개발 서버가 무인증이면 이 경로는 영영 안 지나간다.\n5. 끝나면 `git worktree remove --force`(긴 경로로 실패하면 폴더를 지우고 `git worktree prune`) — 복사한 `.env`도 함께 사라진다. `git stash`는 worktree끼리 공유되니 사본에서 쓰지 않는다.\n6. **앱이 사본 서버에서 받은 로그인 토큰을 기기에 남긴다**: 원래 서버로 돌아가면 모르는 토큰 → 401 → 새 계정 가입 → 기존 데이터가 안 보인다. `pm clear`는 예약 알림·온보딩 기록까지 지우므로, 토큰 저장 파일만 지운다(flutter_secure_storage는 `run-as <패키지> rm shared_prefs/FlutterSecureStorage.xml` — 먼저 그 파일의 키가 토큰뿐인지 `cat`으로 확인, 앱은 `force-stop` 뒤)."}, {"kind": "other", "heading": "위젯 테스트로 재현이 안 되는 것 (실기기에서만 보인 것)", "body": "- **지연 생성 목록 끝으로 이동**: `ListView.builder`의 `maxScrollExtent`는 아직 안 그린 항목 높이의 추정치라 `jumpTo(max)`가 며칠 전 위치에서 멈췄다. 테스트는 데이터가 동기로 들어와 통과한다. 채팅·타임라인처럼 최신이 아래면 `reverse: true` + `jumpTo(0)`.\n- **줄바꿈이 안 되는 라벨 위젯**: 폭 360·글자 ×1.6 시험이 있어도 새로 넣은 조건부 위젯(선택해야 나타나는 칩 묶음의 제목)까지 열지 않으면 못 잡는다 — 조건부 UI를 넣으면 폰 폭 시험이 그 상태까지 열게 늘린다(RVS: 4.4px 넘침).\n  같은 날 같은 원인으로 한 번 더(RVS 10-31, 66px): 공용 머리글 위젯이 `Row[Text, Expanded(Divider)]`라 글자가 줄바꿈되지 않아 \"예측 중 실제와 가장 가까운 것\"(16자)이 넘쳤다 —\n  처음엔 칩(ChoiceChip)을 의심해 바꿨는데 그대로였다. **추측하지 말고 넘친 위젯을 찍어 본다**: 폰 폭 시험에서 `tester.takeException()`은 요약만 주므로,\n  시험 흐름 앞에 `final old = FlutterError.onError; FlutterError.onError = (d) { debugPrint('DBG ${d.toString()}'); old?.call(d); };`을 잠깐 넣으면\n  \"relevant error-causing widget was: Row …paper.dart:224\" 같은 생성 위치가 나온다(확인 뒤 지운다). 공용 위젯을 고치면 다른 화면까지 바뀌므로 머리글을 짧게\n  하는 쪽을 먼저 보고(×1.6·폭 360에서 한글 약 15자), 공용 위젯 수정은 따로 정한다."}, {"kind": "related", "heading": "함께 볼 것", "body": "- 발견한 문제는 그 자리에서 목록으로 적고(문구·레이아웃·돈 계산), 고친 뒤 재빌드·재설치해 같은 화면을 다시 찍어 확인."}], "projects": ["Market_Agent_App", "RVS_App", "poker_app"], "links": ["Hive_암호화는_값만_키는_평문_함정_평문박스_1회이전_패턴"], "updated": "2026-11-17", "tags": ["Flutter", "Android", "테스트"], "tags_overridden": true, "public": true}, {"id": "Flutter웹_첫화면멈춤_dartio_조건부import_가벼운웹분리_판단", "title": "Flutter 앱을 웹으로 켰더니 하얀 화면 — dart:io 함정, 조건부 import, 그리고 \"웹은 따로 가볍게\" 판단", "short": "Flutter 웹 하얀 화면", "source": "공용/Flutter웹_첫화면멈춤_dartio_조건부import_가벼운웹분리_판단.md", "intro": "", "sections": [{"kind": "problem", "heading": "문제", "body": "Android·Windows용으로 만든 Flutter 앱에 `flutter create . --platforms web`을 하면 **빌드는 성공**하는데, 브라우저에서 첫 화면이 안 뜬다(하얀 화면).\n콘솔에 눈에 띄는 오류도 없다.\n\n**실측(RVS_App, 2026-11-02)**: 원인은 시작 경로에서 웹에 없는 기능을 건드린 것 — `Platform.environment`(접속 주소·OAuth ID 읽기),\n`dart:io` `File`(기기 설정·입력 임시 저장·오류 로그), `Platform.isAndroid`(알림·구글 로그인 분기), 알림 플러그인 초기화."}, {"kind": "solution", "heading": "고치는 법(앱 구조를 지키면서)", "body": "1. **환경변수**: `platform_env.dart`가 조건부 export — `export 'platform_env_web.dart' if (dart.library.io) 'platform_env_io.dart';`\n   웹은 빈 표(값은 빌드 때 `--dart-define`으로), 앱은 `Platform.environment`.\n2. **기기 저장소**: 키-값 인터페이스(`read/write`) + 구현 둘 — 웹은 `package:web`의 `localStorage`, 앱·시험은 Map.\n   `package:web`은 VM 시험에서 컴파일되지 않으므로 반드시 `if (dart.library.js_interop)` 조건부 import 뒤에 둔다. 설정 저장소(파일)는 그대로 두고 웹용 구현 클래스를 하나 더 만든다.\n3. **OS 판별**: `Platform.isAndroid` 대신 `kIsWeb` 먼저, 그다음 `defaultTargetPlatform`. 웹에서 안 되는 기능(기기 알림, 플랫폼별 구글 로그인)은 `kIsWeb`이면 건너뛰고 안내만.\n4. **`main.dart`**: `kIsWeb ? WebStore() : FileStore()`로 고르고 알림 초기화를 건너뛴다.\n5. **포맷 주의**: `dart format lib` 전체를 돌리면 무관한 파일까지 바뀐다 — 바꾼 파일만 지정하고 `git status`로 확인한다."}, {"kind": "checklist", "heading": "확인할 때의 함정", "body": "- Flutter 웹(CanvasKit)은 그림이 **그림자 DOM 안의 캔버스**라 `document.querySelector`로 글자를 찾을 수 없고, 헤드리스 Chrome의 `--screenshot`·`--dump-dom`은 그리기 전에 끝나 빈 화면이 찍힌다.\n  → `--remote-debugging-port`로 띄우고 CDP(`Page.captureScreenshot`, `Runtime.evaluate`, `Input.dispatchMouseEvent`)로 실제 시간을 기다려 찍는다.\n- 확장이 없는 환경에서도 이 방식으로 클릭·입력까지 된다. 스크립트는 저장소 밖(임시 폴더)에 둔다."}, {"kind": "other", "heading": "\"웹은 Flutter 그대로 vs 가볍게 따로\" 판단", "body": "| | Flutter 웹 그대로 | 웹만 가벼운 새 프로젝트(예: Vite+TS) |\n|---|---|---|\n| 첫 로딩 | 무겁다(RVS 실측 약 20MB: 앱 코드 3MB·엔진 2MB·한글 글꼴 14.7MB) | 수십 KB |\n| 링크로 유입되는 웹(가입 없이 바로) | 불리 | 유리 |\n| 화면·연출 자유도 | 앱과 같은 부품 | 웹 연출을 자유롭게 |\n| 비용 | 한 벌 | 화면 두 벌 — **규칙은 서버로**(→ `다중클라이언트_규칙은_서버한곳_게임판정_도우미대사_패턴.md`) |\n\nRVS는 \"링크로 들어오는 게임형 웹\"이라 따로 가볍게 갔다. 서버 호출·상태는 순수 TS 모듈로 두고 화면만 작은 함수로 짜 두면,\n나중에 Svelte 등으로 옮길 때 화면만 바꾸면 된다. 그래도 Flutter 웹 대응(위 1~4)은 남겨 둘 가치가 있다 — 앱을 데스크톱 브라우저로 시험할 때 쓴다."}, {"kind": "checklist", "heading": "체크리스트", "body": "- [ ] 시작 경로에 `dart:io`·`Platform.*` 호출이 없다(웹에서 실행해 확인)\n- [ ] 저장소·환경 읽기가 조건부 import로 갈라져 있고 VM 시험이 통과한다\n- [ ] 웹에서 안 되는 기능은 `kIsWeb`로 건너뛰고 안내한다\n- [ ] 확인은 CDP로 기다려 찍었다(헤드리스 스크린샷만 믿지 않는다)"}], "projects": ["RVS_App"], "links": ["다중클라이언트_규칙은_서버한곳_게임판정_도우미대사_패턴"], "updated": "2026-11-06", "tags": ["Flutter", "웹"], "tags_overridden": true, "public": true}, {"id": "Hive_암호화는_값만_키는_평문_함정_평문박스_1회이전_패턴", "title": "Hive 암호화는 값만 — 키는 평문으로 남는다, 그리고 평문 박스를 암호화 박스로 옮기는 법 (범용)", "short": "Hive 암호화는 값만", "source": "공용/Hive_암호화는_값만_키는_평문_함정_평문박스_1회이전_패턴.md", "intro": "대화·알림·메시지처럼 개인정보가 든 Hive 박스를 `HiveAesCipher`로 암호화할 때 쓰는 체크리스트.\nMarket_Agent_App(2026-10-07 P1 → 실기기 검증)에서 실측했고, 같은 구조(평문 `Hive.openBox`로 대화 기록을\n저장)인 Lazzy_App_OS_Monorepo 클라이언트(chat_history·context_history·settings 박스)에도 해당한다.", "sections": [{"kind": "problem", "heading": "함정 1. 암호화되는 건 값뿐이다 — 박스 키(key)는 파일에 평문으로 남는다", "body": "`Hive.openBox(name, encryptionCipher: cipher)`는 **값(value)** 프레임만 AES로 암호화한다. `box.put(key, value)`의\n`key`는 암호화되지 않는다. 그래서 키를 `\"$패키지|$알림키|$제목|$본문\"`처럼 **내용으로 만들면** 값을 암호화해도\n그 내용이 파일에 그대로 읽힌다. 중복 판정용 \"이미 본 항목\" 박스(`Box<String>`)가 특히 위험하다 — 값은 의미 없는\n표식이고 정보는 전부 키에 들어 있다.\n\n실측(Market_Agent_App, 2026-10-07): 암호화 적용 후에도 `seen_listings.hive`에서 10자 이상 이어지는 한글 구간이\n255건(최장 114자) 남았다. 다른 암호화 박스(키가 id인 것)는 우연 일치 수준뿐이었다(→ 판정법은\n`Flutter_실기기_adb_탭_스크린샷_자동검증_절차.md` \"앱 저장 데이터 평문 점검\"). 키가 알림 제목·본문을 담는다는\n것은 설계 문서(중복 판정 키 구성)에서의 추정이고, 값은 열람하지 않았다.\n\n**대응**: 사용자 내용이 들어가는 박스 키는 해시(SHA-256 등 `crypto` 패키지)로 바꿔 저장한다. 중복 판정은 키 일치만\n쓰므로 해시로 충분하다. 기존 평문 키는 아래 \"1회 이전\" 때 해시로 변환해 옮긴다."}, {"kind": "problem", "heading": "함정 2. 이전 버전이 만든 평문 박스를 그냥 암호화 모드로 열면 깨진다", "body": "이미 설치된 앱에 암호화를 추가하면, 디스크의 박스 파일은 평문이다. 같은 이름을 `encryptionCipher`로 열면\n읽기 오류가 나거나 빈 박스처럼 보인다. 그렇다고 오류를 잡아 \"평문으로 되돌려 열기\"를 하면 이미 암호화된 박스를\n깨뜨린다. → **박스마다 \"암호화 완료\" 표식**을 보안 저장소(Android Keystore 기반)에 두고 분기한다.\n\n```dart\n// 키: 보안 저장소에 한 번 생성. 읽기 자체가 실패하면 예외를 그대로 낸다(평문으로 폴백 금지).\n// 박스 열기:\nif (await secrets.read('hive_box_encrypted.$name') == '1') {\n  return Hive.openBox<T>(name, encryptionCipher: cipher);        // 이미 이전됨\n}\nfinal plain = await Hive.openBox<T>(name);                       // 평문 박스 읽기\nfinal data = Map.of(plain.toMap());  await plain.close();\nawait Hive.deleteBoxFromDisk(name);                              // 평문 파일 제거\nfinal box = await Hive.openBox<T>(name, encryptionCipher: cipher);\nawait box.putAll(data);                                          // 필요하면 여기서 키를 해시로 변환\nawait secrets.write('hive_box_encrypted.$name', '1');            // 표식은 맨 마지막\n```\n\n- 표식은 **맨 마지막**에 쓴다. 중간에 죽으면 다음 실행이 평문 경로를 다시 탄다(평문 파일을 지우기 전에\n  죽었다면 데이터가 남아 있고, 지운 뒤 죽었다면 이미 `putAll` 전이라 손실 — 아래 주의 참고).\n- 단위 테스트에서는 `init()`을 부르지 않으면 평문으로 열리게 해 두면 기존 테스트가 그대로 돈다. 이전 로직은\n  가짜 `secrets` 구현을 주입해 따로 테스트한다(106줄 테스트로 이전·재실행·표식 케이스 고정)."}, {"kind": "problem", "heading": "주의 — 복구 정책이 데이터 손실이다", "body": "\"키를 잃었거나 파일이 깨졌을 때 박스를 비우고 새로 시작\"은 앱이 죽는 것보다 낫지만 **그 박스의 기록이 전부\n사라진다.** 알림 원문·판단 캐시처럼 다시 만들 수 있는 박스에는 괜찮고, **사용자 대화 기록·설정은 그대로\n적용하면 안 된다** — 백업 후 비우기, 또는 사용자에게 알림 후 비우기로 바꾼다. 또한 안드로이드 백업이 켜져 있으면\n(`allowBackup` 기본값) 재설치·기기 변경 후 박스 파일만 복원되고 Keystore 키는 복원되지 않아 이 복구 경로가 실제로\n발동할 수 있다 `[추정 — 이번에 복원 시나리오는 재현 안 함]` → `Android_납품전_debug서명_allowBackup_점검_패턴.md`와 같이 본다."}, {"kind": "related", "heading": "함께 볼 것", "body": "- 보안 저장소 키를 읽지 못했을 때 평문으로 열지 않는 이유는 위 코드 주석 — \"이미 암호화된 박스를 깨뜨린다\".\n- 같은 주제의 시크릿 번들 노출은 `Flutter_시크릿_에셋번들_노출_방지_패턴.md`(빌드 산출물 쪽), 이 문서는 기기 저장 데이터 쪽."}], "projects": ["Lazzy_App_OS_Monorepo", "Market_Agent_App"], "links": ["Android_납품전_debug서명_allowBackup_점검_패턴", "Flutter_시크릿_에셋번들_노출_방지_패턴", "Flutter_실기기_adb_탭_스크린샷_자동검증_절차"], "updated": "2026-10-09", "tags": ["Flutter", "로컬 저장소", "보안·개인정보"], "tags_overridden": true, "public": true}, {"id": "LLM_JSON응답_간헐해석실패_JSON모드_내용없는_진단로그_패턴", "title": "LLM JSON 응답이 가끔 안 읽힐 때 — JSON 응답 모드 + 내용 없는 진단 로그 패턴", "short": "LLM JSON 응답 간헐 실패", "source": "공용/LLM_JSON응답_간헐해석실패_JSON모드_내용없는_진단로그_패턴.md", "intro": "", "sections": [{"kind": "problem", "heading": "문제", "body": "LLM에게 \"아래 JSON 형식으로만 답하라\"고 시키고 응답에서 첫 `{`~마지막 `}`를 잘라 `json.loads` 하는 구조는 대부분 돌아간다.\n그런데 **가끔 한 번씩** 못 읽고 폴백(\"결과를 만들지 못했어요\")으로 떨어진다. 다시 하면 정상이라 재현이 안 되고,\n로그에는 원문을 남기지 않는 원칙(개인정보) 때문에 \"못 읽었다\"만 남아 원인이 갈리지 않는다.\n\n**실측(RVS_App, 2026-11-02)**: gemini-3.6-flash 역산 결과 생성이 실기기 2번 중 1번 실패. 로그 \"길이 1373, `{` 시작 False, `}` 끝 False\".\n같은 프롬프트를 직접 보내 응답 모양을 보려 했지만 그날 그 모델의 **하루 한도가 이미 소진**돼 재현 불가.\n예비 모델(3.1-flash-lite)은 9번 모두 맨 JSON — 모델마다 버릇이 다르다."}, {"kind": "problem", "heading": "흔한 원인(모양으로 가른다)", "body": "| 로그 모양 | 원인 후보 | 잘라 읽기가 견디나 |\n|---|---|---|\n| 시작이 `` ` ``(펜스), 끝도 `` ` `` | 코드 펜스(```json … ```) | 견딤 — 첫 `{`~마지막 `}` |\n| 앞에 설명 문장, 뒤에 `}` | 머리말 | 견딤 |\n| `}`로 안 끝나고 `finishReason`이 STOP 아님 | 길이 한도·안전 차단으로 잘림 | 못 견딤 |\n| 모양은 멀쩡한데 `JSONDecodeError` | **문자열 안 큰따옴표 미이스케이프**(`\"팀장이 \"알겠어\"라고 했다\"`), 끝 쉼표 | 못 견딤 |\n\n한국어 결과 문장은 인용(\"…라고 말한다\")이 잦아 마지막 줄이 특히 흔하다."}, {"kind": "solution", "heading": "해결", "body": "1. **모델의 JSON 응답 모드를 켠다.** Gemini는 `generationConfig.responseMimeType = \"application/json\"`(OpenAI는 `response_format={\"type\":\"json_object\"}`).\n   모델이 유효한 JSON만 내므로 펜스·머리말·미이스케이프가 한꺼번에 사라진다. 프롬프트의 \"JSON으로만 답하라\"와 파서는 그대로 둔다(이중 안전).\n   - Gemini는 **검색 그라운딩 도구와 JSON 모드를 같이 못 쓴다** — 공용 호출 함수에서 `use_search`면 끈다.\n   - 공용 호출 함수에 **선택 인자**(`json_mode=False`)로 넣고 실패가 확인된 호출부터 켠다. 전체 기본값으로 바꾸면 평문 응답(해설 등)이 깨진다.\n2. **진단 로그는 모양만, 내용은 빼고.**\n   - 공용 호출 함수: `finishReason`이 STOP이 아니면 이유와 길이만 경고.\n   - 파서 실패 지점: 길이, `{` 시작·`}` 끝, 펜스로 시작하는지, `JSONDecodeError`의 **종류와 위치**(`\"Expecting ',' delimiter @812/1373\"`) — `e.msg`·`e.pos`만 쓰고 `e.doc`은 쓰지 않는다.\n   - 다음 실패 한 번으로 위 표의 어느 칸인지 갈린다. 로그에 원문 조각이 없는지 시험으로 고정한다(caplog에 비밀 문자열이 없음을 assert).\n3. **재현 조사는 한도를 쓴다.** 응답 모양 조사(같은 프롬프트 n번)는 생성 호출이라 무료 등급이면 그날 서비스·측정 몫을 먹는다.\n   조사 스크립트는 원문을 출력하지 않고 `finishReason`·parts 수·앞뒤 몇 글자·파싱 성공 여부만 찍는다."}, {"kind": "problem", "heading": "함정", "body": "- **시험 가짜 함수가 새 인자에 깨진다.** `monkeypatch`로 바꿔 끼운 가짜가 `async def fake(prompt, temperature=None)`처럼 좁게 받으면\n  호출부에 `json_mode=True`를 더하는 순간 TypeError로 수십 개가 실패한다. 가짜는 처음부터 `**_kw`로 받게 쓴다(RVS: 21개 고침).\n- 인자를 더하는 대신 \"프롬프트에 'JSON으로만' 문구가 있으면 자동으로 JSON 모드\"는 문구가 호출마다 달라(“JSON 하나만”, “JSON 객체 하나만”) 깨지기 쉽다 — 명시 인자가 낫다.\n- 실패 재현 없이 고친 것은 **\"실모델 확인 대기\"로 남긴다.** 예비 모델에서 잘 된다고 실패한 모델에서 해결됐다는 증거는 아니다."}, {"kind": "checklist", "heading": "체크리스트", "body": "- [ ] JSON을 기대하는 호출 중 실제로 실패가 난 호출에 JSON 모드를 켰는가(검색 도구와 함께 쓰는 호출은 제외)\n- [ ] `finishReason`·JSON 오류 종류·위치가 로그에 남고 원문은 안 남는가(시험으로)\n- [ ] 시험 가짜 함수가 `**_kw`를 받는가\n- [ ] 한도가 풀린 날 실패 모델로 다시 확인했는가 — 전까지는 \"확인 대기\"\n\n출처: RVS_App(2026-11-02) — `server/analyzer/gemini.py` `call_gemini(json_mode=)`, `narrative_game/prompts.py` `json_error`, `test_gemini_json_mode.py`."}], "projects": ["RVS_App"], "links": [], "updated": "2026-11-02", "tags": ["LLM"], "public": true}, {"id": "LLM_블라인드_서브에이전트_자기일관성_측정_패턴", "title": "LLM 판단의 자기일관성을 재려면 \"진짜 블라인드\" 반복 생성이 필요하다", "short": "LLM 자기일관성 블라인드 측정", "source": "공용/LLM_블라인드_서브에이전트_자기일관성_측정_패턴.md", "intro": "", "sections": [{"kind": "context", "heading": "언제 이 문서를 참조하는가", "body": "\"같은 프롬프트를 LLM에 여러 번 넣어서 답이 얼마나 안정적으로 나오는지\"를\n측정해 신뢰도/일관성 신호로 쓰고 싶을 때 — 콘텐츠 저작 품질 게이트, 프롬프트\n튜닝 검증, \"이 판단이 우연인지 재현 가능한지\" 확인 등. 그리고 그 결과를\n자동으로 점수화하려는데 임베딩 API가 없거나(키 미설정) 쓰기 애매할 때."}, {"kind": "problem", "heading": "핵심 함정 — \"반복 호출\"의 대부분은 진짜 독립이 아니다", "body": "같은 세션/컨텍스트 안에서 \"다시 만들어봐\"를 반복하면 모델이 자기가 방금 쓴\n답을 대화 이력에서 그대로 보고 있어서, 새로 만드는 게 아니라 살짝 바꿔\n베끼는 쪽으로 편향된다(앵커링). `Agent(subagent_type: \"fork\")`도 마찬가지다\n— fork는 호출자의 전체 대화 컨텍스트를 그대로 물려받으므로 \"독립 생성\"의\n전제 자체가 깨진다.\n\n**해법**: 컨텍스트를 전혀 공유하지 않는 fresh 서브에이전트(fork가 아닌 일반\nAgent 호출, 매번 완전히 새 세션)를 N개(보통 5개) 병렬로 띄워, 각각에 완전히\n자기완결적인 동일 프롬프트만 준다(\"다른 자료나 이전 시도는 전혀 없다 — 이\n프롬프트만 보고 처음부터 새로 만들어라\"를 프롬프트에 명시). 이래야 N개의\n결과가 진짜 서로 독립적인 표본이 된다."}, {"kind": "other", "heading": "측정한 값이 의미하는 것 — 정확도가 아니라 결정공간의 안정성", "body": "**자기일관성 ≠ 정답 여부.** N개가 전부 똑같이 수렴해도 그건 \"모델이 이\n프롬프트에서 일관되게 같은 편향을 재생산한다\"는 뜻일 수 있지, 그 답이 실제로\n맞다는 보증이 아니다(온도가 낮으면 사소한 이유로도 트리비얼하게 수렴한다).\n반대로 낮은 수렴률은 \"이 상황이 실제로 여러 타당한 접근이 갈리는 애매한\n영역\"이라는 신호일 수도, 프롬프트 설계가 부실해서 노이즈가 큰 것일 수도\n있다 — 둘을 코드만으로는 구분 못 한다.\n\n그래서 이 점수를 **승격/차단 게이트로 쓰지 않는다**. 실사용(실제 사람의\n선택·결과)과 대조해 불일치가 나는 것만 신뢰 가능한 신호로 삼고, 자기일관성\n점수는 \"참고용 배지\"나 \"검수 우선순위 정렬\" 용도로만 쓴다 — 실측 사례(아래)\n에서 사용자가 먼저 이 구분을 요구했다: \"승격보다 사용자가 감안하고 보는\n방향으로.\""}, {"kind": "problem", "heading": "자동 점수화의 함정 — 임베딩 없이 키워드/자카드로 대체하면 값이 왜곡된다", "body": "N개의 결과를 자동으로 클러스터링해서 점수(예: \"5개 중 몇 개 클러스터로\n나뉘는가\")를 내고 싶을 때, 임베딩(의미 기반 유사도) 없이 표면 단어 겹침\n(자카드)만으로 대체하면 — 특히 한국어처럼 조사/어미가 붙는 언어에서는 —\n의미가 완전히 같은 문장도 겹치는 단어가 거의 없어서 클러스터가 실제보다\n훨씬 잘게 쪼개진다(`한국어_조사_결합_토큰화_누락_함정.md` 참고). 실측:\n자카드 기반 클러스터링이 \"일관성 0.3\"으로 낸 상황을 사람이 직접 읽어보니\n5번 중 4번이 사실상 같은 전략(\"휴식/잠시 손 떼기\")이었다 — 표현만 달랐을\n뿐. 임베딩 API 키가 없는 환경에서는 자동화를 억지로 밀어붙이지 말고, N개\n(보통 25개 안팎)를 사람(또는 LLM 자신)이 직접 읽고 의미 단위로 묶어 수동\n산정하는 편이 더 정확하다 — 다만 그 값은 재현 불가능한 주관적 추정이므로\n출처 필드(예: `consistency_score_method: \"manual_llm_estimate\"`)로 반드시\n표시해서, 나중에 진짜 임베딩이 생기면 구분해서 재계산할 수 있게 해둔다."}, {"kind": "case", "heading": "실측 사례 (JudgeCal_Athe, D-122, 2026-09-11)", "body": "역산 시뮬레이터(내러티브 판단 게임)의 사전 저작 콘텐츠(상황당 행동선택\n5개)가 \"AI가 한 번 생성한 것\"이라 얼마나 안정적인 판단인지 알 길이 없다는\n문제에서 출발. 상황 하나당 fresh 서브에이전트 5개를 블라인드로 띄워 행동\n목록을 독립 생성시킨 뒤, 직접 읽고 의미 클러스터로 묶어 \"행동목록 겹침률\"을\n0.0~1.0로 수동 산정 — `consistency_score` 필드로 콘텐츠에 저장하고, 실제\n매칭된 상황에서 사용자에게 참고용 배지로만 노출(승격/차단에는 안 씀). 두\n카테고리(daily 1개, job 1개, 총 20개 상황×5=100회 독립 생성)에 반복 적용해\n기법 자체가 카테고리 무관하게 재현됨을 확인 — 점수 분포가 실제 판단 난이도\n차이(업계 표준 대응이 있는 상황은 0.9대, 재량 판단이 필요한 애매한 상황은\n0.8 이하)를 잡아내는 것도 확인했다(순수 노이즈였다면 이런 분포 차이가 안\n나왔을 것)."}, {"kind": "other", "heading": "비용 감", "body": "상황 1개당 5회 호출(각 호출 3~4만 토큰 안팎, 5~15초) — 실사용 요청 경로에\n넣기엔 비싸다. **콘텐츠 저작/큐레이션 시점(1회성)**에만 쓰고, 그 결과값을\n저장해 실제 서비스 요청에서는 저장된 값을 그대로 재사용하는 구조로 짜야\n한다. 상황 10개 분량이면 50회 호출 — 한 번에 다 띄우면(병렬) 실제 대기\n시간은 각 호출의 지연시간 수준(수십 초)으로 끝난다."}], "projects": ["JudgeCal_Athe"], "links": [], "updated": "2026-09-11", "tags": ["LLM", "AI 에이전트", "테스트"], "tags_overridden": true, "public": true}, {"id": "LLM_파이프라인_안정성_패턴", "title": "LLM 호출을 파이프라인에 넣을 때 안정성 체크리스트 (범용)", "short": "LLM 파이프라인 안정성", "source": "공용/LLM_파이프라인_안정성_패턴.md", "intro": "Gemini/Claude/OpenAI 등 외부 LLM API를 파이프라인(요약, 추출, 분류, 판단 등)에\n끼워 넣는 모든 프로젝트에 적용되는 패턴. 여러 프로젝트(모조리 요약 NOVA,\nAWDSD/mind_duel)에서 독립적으로 도달한 결론을 통합(2026-08-19).", "sections": [{"kind": "solution", "heading": "1. 원문은 LLM 호출과 무관하게 먼저, 별도로 저장한다", "body": "LLM 파이프라인이 **파생 결과(요약/추출값)만 저장하고 원문은 버리면** 두 가지\n사고가 난다: (1) LLM 호출이 실패하거나 결과 품질이 나쁘면 사용자 입력 자체가\n소실된다. (2) 나중에 더 나은 프롬프트/모델로 다시 처리하고 싶어도 사용자에게\n재입력을 요구해야 한다. **원문 저장은 LLM 호출 성공 여부와 완전히 독립적인\n단계로 만든다** — LLM 호출 전에(또는 최소한 LLM 호출과 별개 트랜잭션으로)\n원문부터 커밋한다."}, {"kind": "solution", "heading": "2. LLM 실패는 fail-not-fail — 폴백 결과를 만들지, 파이프라인을 끊지 않는다", "body": "1번과 짝을 이루는 원칙: LLM 호출이 실패해도(타임아웃, 레이트리밋, 파싱 실패 등)\n전체 파이프라인이 죽거나 사용자에게 빈 결과를 주면 안 된다. 실패 시 정해진\n템플릿/보수적 폴백 결과로 대체해서 흐름을 끊지 않는다(원문은 이미 1번에서\n저장돼 있으므로, 폴백으로 나간 항목은 나중에 재처리 대상으로 표시해두면 된다)."}, {"kind": "solution", "heading": "3. 실패를 유형별로 나눠서 다르게 대응한다 — 하나로 뭉쳐 처리하지 않는다", "body": "\"LLM 호출 실패\"를 한 가지로 취급하면 대응이 전부 뭉뚱그려진다. 최소 4가지로\n나눠서 각각 다르게 반응하는 게 실측으로 검증됨(AWDSD/mind_duel):\n\n| 실패 유형 | 반응 |\n|---|---|\n| 일시적 오류(네트워크/5xx) | N회 재시도(지수 백오프) |\n| 쿼터 초과 | 즉시 폴백(재시도해도 소용없음) |\n| 모델 미지원(그 요청 형태를 이 모델이 못 함) | 대체 모델 후보 목록을 자동으로 순회 |\n| 응답 파싱 실패(형식이 기대와 다름) | 즉시 폴백 + 원문 응답 로그(프롬프트 튜닝 재료로) |\n\n이유: 재시도가 의미 있는 실패(일시적)와 재시도해봐야 똑같이 실패하는 것\n(쿼터초과/모델미지원)을 같은 로직으로 처리하면, 후자에서 쓸데없이 재시도\n횟수만 소모하고 사용자 체감 지연만 늘어난다."}, {"kind": "solution", "heading": "4. 이미 구조화된 숫자가 있으면 프로즈로 뭉개서 넘기지 않는다", "body": "파이프라인 어딘가에서 원본 데이터를 \"~500자 요약 텍스트\"로 압축해서 프롬프트에\n넣는 중간 단계가 있으면, 그 압축 과정에서 **이미 숫자로 갖고 있던 값**(승률,\n빈도, 점수 등)이 프롬프트 안에서 사실상 안 보이는 산문 속에 묻혀버릴 수 있다\n(실측 사례: `win_rate`/`pattern_rate` 필드가 있었는데 파서가 그걸 문장으로\n풀어써서 프롬프트에 넣고 있었음 — 모델이 사실상 못 봄). **구조화된 숫자/필드가\n이미 있으면 프롬프트에 JSON이나 표 형태로 직접 넣는다** — 산문으로 재서술하는\n단계를 끼워 넣지 않는다."}, {"kind": "solution", "heading": "5. 계산 가능한 보조 로직이 있으면 AI 출력에 상시 합산해둔다 — \"폴백\"과는 다른 결이다", "body": "2번(\"실패 시 폴백 템플릿\")과 헷갈리기 쉽지만 다른 패턴이다. 2번은 \"AI가 실패했을\n때만\" 대체 로직이 켜지는 비상용 스위치인 반면, 이 패턴은 **AI가 정상일 때도\n결정론적 계산식을 항상 함께 돌려서 그 결과를 AI 출력에 더한다** — 계산식이\n평소엔 \"보조 신호\"로 섞이다가, AI가 막히면 자연스럽게 \"단독 신호\"로 격상되는\n구조다. 판단(정성적 상황 이해·서술)은 AI가 잘하고, 그 판단에 따른 수치 반영\n(스탯 증감 등)은 결정론적 공식이 이미 있다면 AI에게 그 계산까지 맡길 이유가\n없다 — 프롬프트로 \"숫자도 정확히 계산해서 내놔\"를 강제하는 것보다, AI는 서술+\n정성 판정(예: 합격/보류/탈락)만 내고 그 판정에 대응하는 수치 변화는 코드가\n결정론적으로 계산해 항상 더하는 쪽이 재현성·테스트 가능성·AI 장애 내성 셋 다\n높다.\n\n```python\n# 매 턴: AI 판정(정성) + 결정론적 공식(정량)을 항상 합산\ntry:\n    ai_result = call_llm(prompt)           # 정성 판정만(예: 합격/보류/탈락)\n    formula_delta = deterministic_formula(ai_result.verdict, state)\n    final_delta = combine(formula_delta, ai_result.delta)  # 항상 더함\nexcept LLMError:\n    # AI가 막혀도 판정 자체를 규칙 기반으로 대체하고, 공식은 그대로 단독 적용\n    verdict = rule_based_verdict(input_text)\n    final_delta = deterministic_formula(verdict, state)\n    mark_as_fallback(...)  # 어느 경로로 나온 결과인지 투명하게 표시\n```\n\n실측 사례(JudgeCal/판단보정기, 2026-08-20): 스토리모드의 능력치 성장을\n`growth_engine.formula_delta`(합격 시 +2, 탈락 시 -1, 조건부 배수/면제 —\n`비대칭_성장쇠퇴_공식_설계_패턴.md` 참고)가 항상 계산하고, Gemini의 턴 판정\ndelta에 그 값을 더한다. Gemini 호출 자체가 막히면(`GeminiError`) 판정은\n키워드 기반 규칙으로 대체하고 공식은 그대로 단독 적용 — AI 유무와 무관하게\n파이프라인이 절대 500으로 안 죽는다(`is_fallback` 플래그로 어느 경로였는지\n사용자에게도 노출). \"AI가 항상 필요한 것\"과 \"AI가 있으면 더 좋지만 없어도 되는\n것\"을 코드 레벨에서 분리하는 게 핵심 — 정량 계산은 후자로 설계할 수 있는 경우가\n생각보다 많다."}, {"kind": "problem", "heading": "6. 판단/분류 로직이 키워드 휴리스틱의 한계에 부딪히면, LLM에 그 판단 자체를", "body": "구조화 출력으로 맡기는 걸 고려한다\n\n여러 독립 프로젝트(SSOT_Explorer의 O-007/008 분류기, AWDSD/mind_duel의\naccept/reject 판정)에서 같은 패턴이 반복 확인됨: 키워드 매칭 기반 판단\n로직이 뉘앙스가 필요한 케이스에서 구조적 한계에 부딪히면, 그 판단을 LLM에게\n**구조화 출력(JSON 스키마 강제)**으로 직접 맡기고 휴리스틱을 삭제하는 쪽이\n더 낮은 유지보수 비용으로 더 나은 정확도를 낸다 — 단, 이건 \"오프라인/무료\n휴리스틱\"에서 \"네트워크 호출+비용이 드는 LLM 의존\"으로 원칙을 바꾸는\n결정이므로, 그 전환 자체를 명시적으로 승인받고 진행한다(자동으로 넘어가지\n않는다 — 원칙 변경은 사용자 판단 영역).\n\n**실측 갱신(2026-08-26) — \"명시적 승인\"을 코드 레벨에서 항구화하는 법**:\nSSOT_Explorer의 O-007/008 분류기(위에서 언급된 그 스켈레톤)가 실제로\n전환됐다 — 다만 \"한 번 구두 승인받고 전면 전환\"이 아니라, **API\n키(자격증명) 환경변수의 존재 여부 자체를 승인 신호로 코드화**하는\n방식을 택했다: 환경변수가 없으면 이전과 완전히 동일하게 예외를 던지고\n네트워크 호출이 전혀 일어나지 않고(오프라인 기본값 100% 보존), 배포하는\n사람이 직접 자기 키를 설정해야만 그 인스턴스에서만 전환이 켜진다(BYOK\n— Bring Your Own Key, 소스 자체엔 키를 내장 안 함). 한 번의 대화형 승인이\n아니라 **배포마다 반복되는, 되돌리기 쉬운(키를 지우면 즉시 원상복구)\n승인 메커니즘**이라는 게 \"구두 승인 후 코드를 영구히 바꿔버리는\" 방식과의\n핵심 차이 — 특히 이 코드가 여러 사람에게 배포/판매되는 경우, 각 배포\n주체가 자기 판단으로 켜고 끌 수 있어야 \"그 전환 자체를 명시적으로\n승인받는다\"는 원칙이 배포 이후에도 계속 성립한다. 구현 디테일: 네트워크\n호출은 단일 함수(`_call_gemini` 류)로 격리해 테스트가 그 이음매 하나만\nmonkeypatch하면 되게 하고, \"자격증명 없음\"과 \"자격증명은 있는데 호출\n실패\"를 별도 예외 클래스로 분리해 두 실패 모드를 호출부/테스트가\n구분할 수 있게 함. 상세: `Lazzy_App_OS_Monorepo\\productized\\\ndev_infra_tooling_kit\\ssot_explorer\\router_ai_judgment.py`(H-PROD-011)."}, {"kind": "case", "heading": "7. 이 원칙을 파이프라인 안 일부 진입점에만 적용하면, 다른 진입점(특히", "body": "최초 진입점)은 여전히 뚫려 있을 수 있다\n\n2번(\"LLM 실패는 fail-not-fail\")을 파이프라인의 한 단계(예: 매 턴 판정)에\n이미 적용해뒀다고 해서, 같은 파이프라인의 **다른 진입점**(예: 그 파이프라인\n자체를 시작시키는 최초 호출)도 자동으로 안전해지는 게 아니다. 같은\n코드베이스 안에 \"이미 이 패턴을 적용한 부분\"과 \"아직 안 한 부분\"이\n공존하면, 개발자 본인도 \"전체적으로 적용돼 있다\"고 착각하기 쉽다 — 실제로\n막히는 건 사용자가 가장 먼저 거치는 진입점일 확률이 높은데(예: \"일단\n시작해야\" 그 뒤 단계들도 도달하므로), 정작 그 지점만 빠져있으면 체감상\n\"기능 전체가 죽었다\"로 보인다.\n\n**대응**: 파이프라인 안의 모든 LLM 호출 지점을 한 번에 나열하고(`grep`으로\n그 LLM 클라이언트 함수를 호출하는 모든 지점), 각각이 실패 시 무엇을\n반환/발생시키는지 표로 만든 뒤, \"그대로 500/예외를 올리는\" 지점이 있으면\n그게 **진입점(파이프라인의 첫 단계)인지**부터 확인한다 — 진입점이 안\n막히면 나머지 단계에서의 실패는 사용자가 \"이미 시작은 했으니\" 상대적으로\n용인하지만, 진입점이 막히면 기능 자체를 아예 못 씀.\n\n실측 사례(JudgeCal_Athe/판단보정기, 2026-08-29): 턴 진행(`submit_turn`)은\n이미 `fallback_judge`로 `GeminiError`를 흡수해 500을 안 냈지만, 그\n파이프라인의 진입점인 \"캐릭터 입장\"(`create_run`의 인트로 생성)은 여전히\n`except GeminiError: raise HTTPException(500)`이었다. 사용자가 겪은 현상은\n\"캐릭터 입장 자체가 안 된다\"였고, 처음엔 \"아직 안 만든 기능(크로스유저\n매칭 시스템)을 먼저 완성해야 하나\"로 오인됐다 — 실제론 이미 만들어둔\nfail-not-fail 원칙이 그 파이프라인의 한 지점에만 적용돼 있었을 뿐. 고칠\n때는 새 폴백 함수(`fallback_intro`)를 기존 폴백 모듈(`fallback_judge.py`)에\n같이 두고, 기존 폴백들의 라벨링 관례(반환값 안에 \"AI 미사용\"임을 그대로\n문장으로 알림)를 그대로 재사용했다 — 새 파이프라인 실패 처리를 만들 때마다\n매번 새 관례를 만들지 않고 이미 검증된 관례를 복제하는 게 일관성 유지에도,\n리뷰 비용 절감에도 유리하다."}, {"kind": "solution", "heading": "8. AI가 원칙적으로 결과에 관여 안 하는 시스템에서, 좁게 격리된 예외로만", "body": "LLM에게 실제 결정을 맡길 때 — 그 결정이 아니라 \"결정론적 기준선과의\n차이\"를 회수한다\n\n지금까지의 1~7번은 \"AI가 있으면 쓰고 없으면 폴백\"이 기본 전제였다. 이 패턴은\n반대 방향 상황을 다룬다: 시스템 전체는 \"AI는 서술/코칭만 하고 실제 게임\n결과·판정에는 절대 관여하지 않는다\"는 원칙을 지키는데, 아주 좁은 일부\n구간(예: 전체 상대 중 소수의 \"보스\"급 상대)에서만 그 원칙의 **명시적\n예외**로 LLM이 실제 결정을 대신하게 하는 경우다.\n\n핵심 설계 두 가지:\n\n- **예외 범위를 계약(contract)에 문장으로 못 박는다.** \"이 원칙은 시스템\n  전체가 아니라 X 카테고리에만 적용된다\"를 코드 주석이 아니라 계약 문서\n  (스택/정책/폴백 3분리 중 정책 쪽)에 명시하고, 실제 분기 조건(예: ID\n  프리픽스 화이트리스트)도 그 계약과 정확히 대응시킨다 — 그래야 나중에\n  \"왜 얘만 AI가 결정하지?\"를 코드 리딩 없이 계약 문서만 보고 답할 수 있다.\n- **LLM이 대신 낸 결정 자체가 아니라, 그 결정이 \"기존 결정론적 로직이 이미\n  계산해 넘긴 입력에서 무엇을 보충했는지\"를 별도로 회수한다.** 이건 \"왜 이\n  결정을 내렸는지\"(설명/근거)를 묻는 것과 다르다 — 그건 별도의 사후 분석\n  기능(리플레이/디버그 도구) 몫이다. 여기서 묻는 건 \"네가 받은 기계적\n  입력에 없어서 네가 스스로 채워 넣은 게 뭐냐\"라는, **결정론적 시스템의\n  입력 설계 자체에 대한 갭 진단**이다. 이 응답은 실제 소비자(게임 UI 등)\n  에게는 절대 노출하지 않고 개발자 전용 저장소에만 쌓는다 — 나중에 \"결정론적\n  로직에 어떤 입력을 더 추가해야 하는지\"를 판단하는 실측 데이터가 된다.\n\n```python\n# 좁은 예외 구간에서만: LLM이 실제 결정 + \"갭 노트\"를 함께 반환\ndecision = call_llm(mechanical_input, legal_actions)  # {action, gap_note}\napply_action(decision[\"action\"])                       # 실제 게임에 반영\nif decision.get(\"gap_note\"):\n    dev_only_log.record(mechanical_input, decision[\"gap_note\"])  # 소비자 비노출\n``
