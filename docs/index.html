이관_패턴", "title": "자동 로드 문서 비대화 — 글자 수 한도와 파일 단위 이관 패턴", "short": "자동 로드 문서 비대화", "source": "공용/자동로드_문서_비대화_파일단위_이관_패턴.md", "intro": "", "sections": [{"kind": "context", "heading": "언제 여는가", "body": "CLAUDE.md처럼 세션마다 자동 로드되는 문서나 결정이력처럼 계속 누적되는 설계 문서가 한 파일로 수십만 자까지 커졌을 때, 또는 \"줄 수 기준으로 레거시\n섹션으로 옮기기\"만으로는 총량이 줄지 않을 때. 규칙의 정식 위치는 `Plug_In_Global\\.claude\\설계도_이중계층_프로토콜.md` [15]이고, 이 문서는 그\n절차를 실제로 돌릴 때 걸린 함정과 요령을 모은 것이다."}, {"kind": "problem", "heading": "왜 줄 수 기준만으로는 안 되는가", "body": "- Read 툴은 한 번에 약 25,000토큰까지만 읽는다. 한글 문서는 줄 수보다 글자 수가 먼저 닿는다(9,315줄·468,897자 파일은 offset/limit 없이 못 읽었다).\n- 같은 파일 안에서 최신→레거시 섹션 헤더만 옮기면 총량이 그대로라 컨텍스트 비용이 줄지 않는다. 자동 로드 문서에서는 이게 곧 매 세션 비용이다.\n- \"N줄을 넘으면 옮긴다\"는 규칙만 있고 측정 시점이 없으면 실행되지 않는다(실측: 결정이력이 한 번도 분리되지 않고 3,178줄, 이후 9,315줄까지 누적)."}, {"kind": "solution", "heading": "절차 요약", "body": "1. 한도를 글자 수로 정해 프로젝트 README에 적는다(바이트가 아님). 절·결정을 추가한 작업 끝에 측정한다.\n2. 이관 구간은 연속된 결정 블록 경계에서 자른다. 유효한 OPEN 목록처럼 살아 있는 항목이 섞인 비-결정 블록은 옮기지 않는다 — 구간 사이에 그런 블록이\n   끼어 있으면 구간을 둘로 나눈다(예: ADR-21~76 / 77~133).\n3. 원문을 스크립트로 새 파일에 **그대로** 복사하고(줄바꿈 보존: Python `newline=''`, 한글이면 `PYTHONUTF8=1`), 복사본에 원문 구간이 그대로 포함되는지 검사한 뒤에\n   원본에서 지운다.\n4. 원본에 남기는 것: 결정 문서는 번호·제목·\"결정:\" 한 줄(원문에서 자동 추출, 새로 쓰지 않음) + 이관 파일 경로. 자동 로드 규칙 문서는 \"현행 규칙 요약\" 절(규칙만,\n   항목마다 원문 절·번호). 요약 문장은 사람이 새로 쓰는 부분이라 사용자 검토 대상이다.\n5. 이관 파일 경로와 여는 조건을 프로젝트 README 참조 표에 한 줄씩 추가한다."}, {"kind": "problem", "heading": "함정", "body": "- 이관 후에도 한도를 넘는다: ADR 본문만 옮겨서는 남은 OPEN 서술·오래된 변경이력이 큰 덩어리로 남는다. 이관 전에 블록별 글자 수를 재서 필요한 구간을 한꺼번에 정한다.\n- 다른 문서가 \"결정이력 N행\"처럼 줄 번호로 인용하면 이관 뒤 어긋난다. 번호(ADR 등)로 인용하게 하고, 번호가 문서마다 다르면 결정이력 기준으로 맞춘다.\n- 요약 절에 규칙을 옮겨 적을 때 원문에 없는 규칙을 만들지 않는다 — 원문의 \"~할 것/반드시/⚠️\" 문장을 근거로 뽑고 출처를 단다.\n- 자동 로드 문서를 지우는 게 아니라 그 안의 \"구현 서술\" 구간만 옮기는 것이다. 현행 규칙(레이어 구조·인증·금지 사항 등)까지 같이 빠지면 규칙이 로드되지 않는다."}, {"kind": "case", "heading": "실측 사례", "body": "- poker_app(2026-10-07): server/CLAUDE.md 1,905행·142KB → 352행·19,284자(이관분 115KB), client/CLAUDE.md 25,828자 → 14,197자(이관분 13,438자),\n  결정이력 468,897자 → 99,087자(ADR-21~183 본문 3파일 + OPEN-39·v7 서술 + 오래된 변경이력).\n- SSOT_Explorer(2026-08-24): 결정이력이 D-001~D-082까지 3,178줄 누적된 것이 [6] 2000줄 트리거 신설의 계기였다."}], "projects": ["SSOT_Explorer", "poker_app"], "links": [], "updated": "2026-10-07", "tags": ["AI 에이전트", "Git·문서"], "tags_overridden": true, "public": true}, {"id": "자율에이전트_행동루프_안전장치_패턴", "title": "사용자를 대신해 행동하는 자율 에이전트 루프의 안전장치 체크리스트 (범용)", "short": "자율 에이전트 행동 루프 안전장치", "source": "공용/자율에이전트_행동루프_안전장치_패턴.md", "intro": "앱이 사용자를 대신해 연속으로 여러 행동을 자동 수행하는 모든 기능(화면\n자동조작, 자동화 매크로, 반복 API 호출 루프 등)에 적용하는 안전 체크리스트.\nAllAd Launcher(AllAd_Launcher, 접근성 서비스 기반 앱 자동조작 에이전트) 실측 사례에서 정리\n(2026-08-19). Claude Code/IDE용 AI 에이전트의 \"MCP 쓰기권한 거버넌스\"\n(`AI_에이전트_MCP_쓰기권한_거버넌스_패턴.md`)와 결이 같지만, 이 문서는 **일반\n사용자를 대신해 화면/외부 앱을 조작하는 소비자용 에이전트**가 대상이라 그\n문서와 별개로 둔다.", "sections": [{"kind": "checklist", "heading": "체크리스트 4가지", "body": "1. **되돌리기 어려운 행동은 무조건 확인 게이트를 거친다, 예외 없음.**\n   결제/삭제/발송처럼 \"실행하면 되돌릴 수 없는\" 행동으로 분류되는 액션은\n   자동/신뢰 모드 여부와 무관하게 항상 사용자 확인을 막는 다이얼로그를\n   거친다 — 우회 경로를 아예 만들지 않는다.\n\n2. **루프가 도는 동안 언제든 누를 수 있는 중단 버튼이 항상 화면에 보인다.**\n   \"실행 취소\"가 아니라 \"지금 당장 멈추기\" — 루프 시작 후 사용자가 마음이\n   바뀌었을 때 즉시 멈출 수 있는 경로가 실행 내내 사라지지 않아야 한다.\n\n3. **같은 행동이 N회 연속 실패하면 자동으로 멈춘다(기본값 3회).**\n   \"안 되는 걸 계속 시도\"는 사용자가 지켜보고 있지 않을 때 특히 위험하다 —\n   같은 액션이 연속으로 실패를 반복하면 사람 개입 없이도 루프 자체가\n   스스로 멈춘다. 임계값은 상황에 맞게 조정 가능하되, 기본값이 \"무한\n   재시도\"면 안 된다.\n\n4. **비용이 저렴한 경로를 기본값으로, 비싼/위험한 경로는 사용자가 명시적으로\n   연 것으로 취급한다.** 예: 화면 요소 트리 분석(저렴)을 기본으로 쓰고,\n   비전 모델 호출(비쌈)이 필요한 케이스는 사용자가 그 기능의 자격증명을\n   등록해야만 활성화 — **자격증명 등록 자체가 \"이 비싼 경로를 써도 된다\"는\n   동의 신호를 겸하게** 설계하면 별도 동의 UI 없이도 opt-in이 구조적으로\n   보장된다."}, {"kind": "solution", "heading": "개발 측 부가 원칙 — 한 라운드 = 한 기능 = 한 커밋", "body": "이 종류의 기능을 개발할 때는 라운드당 기능 하나씩만 커밋한다 — 자율 루프\n로직은 한 라운드에서 여러 걸 한꺼번에 바꾸면 \"이번 변경 중 뭐가 이 이상행동을\n일으켰는지\" 역추적이 어렵다. 문제가 생기면 커밋 하나만 되돌리면 바로 이전\n안전 상태로 복구되게 만드는 게, 사후 디버깅 비용을 줄이는 것보다 더 중요한\n안전장치다(자율 행동 루프는 실제 사용자 환경에 부작용을 남기므로, \"일단\n배포하고 다음에 고치자\"의 대가가 일반 버그보다 크다)."}], "projects": ["AllAd_Launcher"], "links": [], "updated": "2026-11-18", "tags": ["Android", "AI 에이전트", "게이트"], "tags_overridden": true, "public": true}, {"id": "적립장부만_먼저_만들고_지급을_사용처몫으로_미루면_영영_미지급_함정", "title": "적립 장부만 먼저 만들고 \"지급은 사용처가 알아서\"로 미루면, 아무도 지급하지 않는 장부가 남는다", "short": "지급 없는 적립 장부", "source": "공용/적립장부만_먼저_만들고_지급을_사용처몫으로_미루면_영영_미지급_함정.md", "intro": "", "sections": [{"kind": "case", "heading": "실측 사례 (poker_app/server, 2026-09-28 → 09-29, ADR-190 → ADR-197)", "body": "카드 로드아웃 층(ADR-190)을 만들면서 부스트 카드는 \"이긴 팟 × 부스트%\"를 세션의 보너스 장부(`bonus_chips`)에 쌓게만 했다.\n테이블 칩과 섞지 않으려는 좋은 분리였고, 헤더에 \"지급은 콘텐츠 정산 몫\"이라고 적었다. 그런데 이 층을 처음 쓴 콘텐츠(보스전)의\n정산은 체력 피해만 계산했고, 장부는 판이 끝나면 세션과 함께 사라졌다 — 부스트 카드를 산 사람은 보너스를 한 번도 못 받았다.\n테스트도 \"장부에 쌓인다\"까지만 확인해서 초록불이었다. 인수인계 목록에 \"지급 방식 미정\"으로 남아 있다가 하루 뒤 발견해\n\"판을 친 회사 자금으로\"(ADR-197)로 닫았다."}, {"kind": "solution", "heading": "패턴", "body": "- 적립/지급을 층으로 나누는 건 괜찮다. 다만 **지급 책임을 \"나중에 누군가\"로 두는 순간** 그 층을 쓰는 첫 사용처가 지급을\n  구현하지 않으면 조용히 증발한다(에러도, 실패하는 테스트도 없음).\n- 장부를 만드는 쪽에서 막는 법(하나 이상):\n  1. 장부를 쓰는 첫 사용처를 만들 때 **지급까지 같은 작업 단위로** 넣는다. 못 정하면 그 사용처에서는 장부를 아예 켜지 않는다.\n  2. 세션 종료 지점(정산 함수)에 \"장부가 비어 있지 않은데 지급 경로가 없다\" 경고/로그를 둔다.\n  3. 테스트를 \"쌓인다\"에서 끝내지 말고 \"끝나면 어딘가의 잔액이 그만큼 늘었다\"까지 확인한다.\n- 규칙 파일(프로젝트 CLAUDE.md 등)에 \"이 장부를 쓰는 새 콘텐츠는 정산에서 지급할 것\"을 한 줄 남긴다(poker_app server/CLAUDE.md)."}], "projects": ["poker_app"], "links": [], "updated": "2026-09-29", "tags": ["설계·구조", "결제·한도"], "tags_overridden": true, "public": true}, {"id": "전역_값풀_개인정보_화이트리스트_k명노출_자동완성_패턴", "title": "사용자들이 적은 값을 서로 자동완성으로 쓰게 할 때 — 항목은 고정, 값만 풀, 개인정보는 화이트리스트와 k명 노출로 막는다", "short": "공유 자동완성과 개인정보", "source": "공용/전역_값풀_개인정보_화이트리스트_k명노출_자동완성_패턴.md", "intro": "", "sections": [{"kind": "problem", "heading": "문제", "body": "프로필처럼 항목이 많은 입력은 사용자가 직접 치기 힘들다. 다른 사람들이 이미 쓴 값(\"INTJ\", \"신중함\", \"파이썬\")을 후보로 보여 주면\n\"검색해서 고르기\"로 바뀐다. 그런데 사용자 입력을 남에게 보여 주는 순간 **이름·지역·병명·연락처가 새어 나갈 수 있다**.\n\n**실측(RVS_App, 2026-11-03·06)**: 프로필 값 전역 풀을 서버에 두고 웹·앱 입력칸에 자동완성을 붙였다.\n사용자 요구는 \"항목(스키마)은 내가 미리 세팅해 고정, 그 안의 값만 풀로, 개인정보 항목은 스키마로 막고, 나중엔 직접 안 치고 골라서\"."}, {"kind": "solution", "heading": "패턴", "body": "1. **두 가지 검색을 나눈다**\n   - 항목 검색(맨 위 검색창): 항목 이름·분야 이름만 찾는다. 고르면 그 섹션을 펼치고 칸으로 이동. 풀과 무관.\n   - 값 자동완성(각 칸): 그 칸에 치면 바로 아래 후보. 이것만 전역 풀을 쓴다.\n2. **풀 칸은 화이트리스트**: 짧고 범용적인 칸만(성향 키워드, 가치, 강점·약점, 기술 이름, 우선순위 이름, 루틴 이름, 관계 이름표 \"팀장\").\n   이름·지역·건강·메모·목표·일정·자유 서술은 **기본 제외**. 새 항목을 만들 때 \"풀 허용\"을 명시적으로 켜야 들어간다.\n3. **값 검증**: 그 칸의 최대 길이 안, 연락처처럼 보이는 값 거절(`@`, URL, 4자리 이상 숫자, 전화번호 꼴). 저장은 막지 않고 풀에만 안 넣는다.\n4. **k명 노출**: 다른 사용자에게는 서로 다른 사용자 k명(예: 3명) 이상이 쓴 값만 보인다. 한 사람만 쓴 값은 그 사람에게만 보인다(\"내가 쓴 값\" 표시).\n5. **기여는 현재 프로필과 같게**: 프로필 저장 때마다 그 사용자의 풀 행을 지우고 지금 값으로 다시 넣는다 → 지운 값은 빠진다. 계정 삭제 때 그 사용자 행을 지운다(삭제 훅을 풀 모듈이 스스로 등록).\n6. **표 하나**: `(field, value, owner, created_at)` 기본키 `(field, value, owner)`. 조회는 `GROUP BY value HAVING COUNT(DISTINCT owner) >= k OR mine` + 부분 일치(대소문자 무시), 많이 쓴 순.\n7. **클라이언트는 명세로 안다**: 프로필 명세 응답에 `pool_fields` 목록을 실어 보내고, 그 칸에만 자동완성을 붙인다. 풀을 안 쓰는 칸으로 조회하면 404."}, {"kind": "problem", "heading": "함정", "body": "- **목록 칸(한 줄에 하나)**: 자동완성은 \"지금 커서가 있는 줄\"로 찾고, 고르면 그 줄만 바꾼다. 칩 입력이면 고르는 즉시 칩으로 추가.\n- **시험 픽스처**: 명세 응답에 새 키(`pool_fields`)를 붙였으면, 명세를 대조하는 서버 시험과 픽스처 생성 스크립트도 같은 모양(응답 그대로)으로 맞춘다. 한쪽만 고치면 다른 쪽 시험이 깨진다(RVS 11-06).\n- **조회 칸 이름은 서버가 정한다**: 클라이언트 입력칸 이름 = 풀 경로(`section.field`, 목록 항목은 `list.subfield`)로 맞추면 연결이 단순하다.\n- **풀이 비어 있을 때의 첫 경험**: 처음엔 후보가 거의 없다(k명 조건). 내가 쓴 값은 바로 보이게 해야 \"기능이 동작한다\"가 느껴진다."}, {"kind": "checklist", "heading": "체크리스트", "body": "- [ ] 풀 칸 목록이 코드 한 곳(화이트리스트)에 있고 개인정보 칸이 없다\n- [ ] 연락처 꼴 거절과 길이 제한이 있다\n- [ ] k명 이상만 남에게 보인다(시험으로 확인)\n- [ ] 값을 지우거나 계정을 지우면 기여가 빠진다(시험으로 확인)\n- [ ] 명세 응답에 풀 칸 목록이 있고, 픽스처·대조 시험이 같은 모양이다"}], "projects": ["RVS_App"], "links": [], "updated": "2026-11-06", "tags": ["보안·개인정보", "FastAPI"], "tags_overridden": true, "public": true}, {"id": "코드기반_인프라분석_라이브검증_패턴", "title": "코드만 보고 인프라 리스크를 확정하지 않는다 — 라이브 상태로 검증 (범용)", "short": "인프라 분석은 실측으로", "source": "공용/코드기반_인프라분석_라이브검증_패턴.md", "intro": "레포 코드(설정 파일, IaC, `.gitignore` 등)를 읽어서 인프라 리스크를 진단할\n때 적용하는 원칙. 클라우드 플랫폼(Railway/Vercel/Fly.io 등)은 볼륨 마운트·\n환경변수·도메인 연결 같은 상태를 **대시보드/CLI로만 설정하고 레포에는\n아무 흔적도 안 남기는 경우**가 흔하다 — 코드에 설정 파일이 없다는 것이\n\"그 인프라가 안 갖춰져 있다\"는 증거가 되지 않는다.", "sections": [{"kind": "problem", "heading": "함정 — \"코드에 없음\" = \"인프라에 없음\"으로 성급히 결론", "body": "`railway.toml`/`Dockerfile`/볼륨 마운트 선언이 저장소에 전혀 없는 걸 보고\n\"재배포 시 영구 스토리지가 없어 데이터가 날아갈 것\"이라고 **코드 근거만으로\n\"High 리스크\"를 확정**해 보고했던 실측 사례(2026-08-21). 실제로 플랫폼 CLI\n(`railway status`, `railway volume list`)로 확인하니 볼륨이 이미 정확한\n마운트 경로에 붙어있었고, 데이터도 이미 그 위에 쌓이고 있었다 — 코드\n근거만으로 내린 결론이 완전히 틀렸던 것. 같은 세션에서 \"빌드 산출물(`dist/`)이\ngit에 추적되고 있는지 미확인\"이라고 리스크 목록에 올려둔 것도, `git ls-files\n-- dist/ build/`로 10초 안에 \"이미 gitignore로 안전하게 빠져 있다\"를 확정할\n수 있었던 걸 확인 없이 열어둔 항목이었다."}, {"kind": "checklist", "heading": "원칙 — CLI/API로 확인 가능한 건 코드 근거만으로 리스크를 확정하지 않는다", "body": "1. **인프라 리스크를 보고하기 전에, 그 플랫폼이 CLI/API를 제공하면 실제\n   상태를 먼저 조회한다** — 로그인 여부(`<platform> whoami`), 프로젝트 연결\n   상태(`<platform> status`), 리소스 목록(볼륨/도메인/환경변수 목록 명령)\n   순으로 짧게 확인하는 것만으로도 \"코드에 없어서 리스크\"였던 항목의 상당수가\n   즉시 해소되거나 반대로 진짜 문제로 확정된다.\n2. **`git ls-files`/`git check-ignore` 같은 로컬에서 즉시 확인 가능한\n   질문은 \"미확인\"으로 남겨두지 않는다** — 명령 하나로 끝나는 확인을 안\n   하고 리스크 목록에 올리면, 나중에 그 리스크를 근거로 불필요한 작업을\n   벌이게 될 수 있다.\n3. CLI/API 자체가 없거나 접근 권한이 없어서 확인이 불가능한 항목만\n   \"코드로는 확인 안 됨(대시보드에서 직접 확인 필요)\"로 명시하고, 사용자에게\n   그 확인을 요청한다 — 이때도 \"리스크가 있다\"고 단정하지 않고 \"확인이\n   필요하다\"로 표현을 구분한다.\n4. 확인 결과가 코드 근거의 결론을 뒤집으면, 즉시 정정하고 그 자리에서\n   사용자에게 알린다 — 이전에 내린 잘못된 판단을 방치한 채로 다음 작업을\n   진행하지 않는다."}, {"kind": "context", "heading": "언제 이 패턴이 필요한가", "body": "- 클라우드에 배포된 프로젝트의 인프라(스토리지/네트워크/시크릿)를\n  코드/설정 파일 리뷰만으로 감사(audit)할 때.\n- \"설정 파일이 없다\"는 관찰을 근거로 심각도(Critical/High 등)를 매기기\n  직전 — 특히 그 심각도가 사용자의 다음 행동(추가 작업, 긴급 조치)을\n  좌우할 때는 반드시 라이브 검증을 먼저 시도한다.\n- 해당 플랫폼의 CLI가 이미 로그인/연결돼 있는 환경(예: `railway whoami`가\n  바로 성공하는 상태)이라면, 그 확인 비용은 거의 0에 가까우므로 생략할\n  이유가 없다."}, {"kind": "case", "heading": "분석을 직접 실행으로 돌릴 때의 함정 (6개 앱 정밀 분석, 2026-10-11 실측)", "body": "테스트·분석 도구를 \"다른 사람 저장소\"나 \"작업 중인 저장소\"에서 돌릴 때 결과가 틀어지거나 부작용이 생기는 경우가 반복됐다.\n\n1. **작업 중(미커밋) 코드와 커밋된 코드의 결과를 따로 본다.** 같은 서버 테스트가 작업 트리에서는 661개 중 8개 실패, 커밋된 코드\n   (`git archive HEAD`로 임시 폴더에 풀어 실행)에서는 598개 전부 통과였다. 실패가 \"배포된 코드의 결함\"인지 \"작업 중 코드의 미완성\"인지는 둘을\n   나눠야 알 수 있다. 원본 작업 트리는 건드리지 않고 임시 복사본에서 돌린다.\n2. **실제 비밀이 든 설정 파일이 있는 저장소는 더미 환경값을 강제로 넣고 테스트한다.** `.env`에 실제 키·서비스 계정이 있으면 테스트가 실제 외부\n   서비스(데이터베이스, 결제, AI)에 닿을 수 있다. CI가 쓰는 더미 값(`GEMINI_API_KEY=ci-dummy`, 서비스 계정 `{}` 등)과 빈 자격 증명 경로를\n   명령에 직접 지정한다(dotenv는 이미 설정된 환경변수를 덮어쓰지 않는다).\n3. **테스트 격리 누락은 실행해 봐야 보인다.** 서버 테스트를 돌린 뒤 실제 계정 DB 옆에 `-shm`/`-wal` 파일이 새로 생겼다 — 어떤 테스트가\n   `conftest.py`에서 임시 경로로 돌리지 않은 실제 DB를 연다는 증거. 실행 전후로 `git status`를 비교해 흔적을 찾고, 흔적이 남았으면 삭제하지 말고\n   (사용자 승인 대상) 보고한다.\n4. **고정 날짜 픽스처는 분석 날에 처음 터지기도 한다.** 조회 기간 30일 함수에 고정 날짜(`2026-08-16`)를 넣은 테스트가 9월 15일부터 조용히\n   실패하고 있었다(CI가 서버 변경 때만 돌아 발견이 늦음) → `실시계_만료판정_테스트_고정날짜_픽스처_시한폭탄_함정.md`.\n5. **동기화 폴더(OneDrive) 아래의 `build/`는 잠겨 도구가 실패할 수 있다.** `flutter test`가 build 폴더의 unit_test_assets 삭제 실패로 시작하지\n   못했다. `build/`를 지우지 말고 `git archive`로 임시 복사본을 만들어 거기서 `pub get`과 테스트를 돌린다.\n6. **분석이 만든 흔적은 정리하지 말고 보고한다.** 생성 파일(gitignore된 코드 생성물)은 다시 만들어도 되지만(`flutter gen-l10n`), 추적 대상\n   저장소 옆에 생긴 새 파일은 사용자에게 알린다.\n7. **긴 테스트는 백그라운드로 돌리고 진행률만 본다.** 서버 1,900개 테스트는 30분 이상 걸렸다. 완주를 못 기다리면 \"약 N% 구간까지 실패 0건\"처럼\n   확인한 범위를 그대로 적고 통과로 단정하지 않는다.\n\n8. **개발 PC의 `.env`(실제 키)가 테스트에도 로드되면 \"모킹 안 된 경로\"가 조용히 실제 네트워크를 부른다.** 서버 테스트가 전체 10분(느린\n   파일 하나 7분+)이었고, 원인은 알고리즘이 아니라 모듈 레벨로 import된 외부 호출 함수(`from x import call_llm`)를 일부 테스트가 안\n   바꿔서 실제 API를 부르고, 실패하면 캐시가 안 쌓여 반복마다 재시도하던 것이었다. 직전 감사의 \"실제 호출 테스트 0\"은 키가 없는 환경\n   기준이라 개발 PC에선 틀렸다. 해법: `conftest.py` autouse 픽스처로 테스트 전체에서 키를 비워 즉시 실패시키고, 실호출이 의도인 테스트만\n   자체적으로 다시 설정한다(실측: 602초 -> 252초). 느린 테스트를 찾을 땐 `--durations`보다 먼저 \"이 테스트가 네트워크를 타는가\"를 본다.\n9. **서버 로그에 클라이언트 요청이 0건이면 클라이언트가 다른 곳으로 나간 것이다.** 화면은 \"서버에 연결할 수 없습니다\"를 그리고 서버는\n   멀쩡히 떠 있었다. 원인은 서버 후보 목록이 컴파일타임 값만 읽고 후보가 없으면 프로덕션 주소를 하드코딩해, 문서에 적힌 런타임\n   환경변수를 무시하던 것. 확인법: 서버 로그의 요청 수를 본다(요청이 아예 없으면 도달 못한 것). 오류 문구가 주소를 고정 텍스트로\n   적고 있으면 실제 접속 대상과 어긋나 오해를 부른다 — 표시하는 주소는 실제로 쓴 값에서 만든다.\n10. **앱 창 캡처가 앱 대신 다른 창(전체 화면)을 잡을 수 있다.** 창 제목으로 캡처했는데 사용자의 브라우저가 나왔다 — 대상 창이 가려져\n    있었기 때문. 사용자 개인 화면이 찍히므로(1) 그 이미지는 쓰지 않고, (2) 앱 창을 최상단으로 올리고(`SetWindowPos` TOPMOST +\n    `SetForegroundWindow`) 그 창의 영역만 캡처한다. 서버 로그의 요청 목록과 프로세스 상태를 보조 근거로 같이 쓴다."}], "projects": [], "links": ["실시계_만료판정_테스트_고정날짜_픽스처_시한폭탄_함정"], "updated": "2026-10-14", "tags": ["배포·운영"], "public": true}, {"id": "크로스런타임_계약_동기화_위험", "title": "서로 다른 런타임에 걸친 상수/계약은 동기화를 강제할 장치가 없다 (범용)", "short": "런타임 사이 계약 동기화", "source": "공용/크로스런타임_계약_동기화_위험.md", "intro": "클라이언트(Dart/Flutter)와 서버(Python)처럼 **서로 다른 언어/런타임**이 같은\n개념(임계값, 스키마, 툴 이름 등)을 각자 자기 쪽 코드에 따로 선언해야 하는 모든\n프로젝트에서 반복 확인되는 구조적 한계. 최소 4개 독립 프로젝트(SSOT_Explorer의\nMCP 툴 스키마, Hub_App_winter의 레이어 분리 방침 문서, JudgeCal의 표본 크기\n임계값, poker_app의 보스전 액션/레이즈 범위 계약)에서 각자 발견돼 \"이건 개별\n버그가 아니라 크로스런타임 자체의 구조적 한계\"로 확인됨(2026-08-19 종합,\n2026-09-01 poker_app 사례 추가).\n\n**실측 사례(poker_app, 2026-09-01, H-041/ADR-63~64)**: client(Dart,\n`boss_llm_decision.dart`)와 server(Python, `boss_decision_logic.py`)가\n\"합법 액션 문자열 집합은 `{fold, call, raise}`, raise면 `min_raise`~\n`max_raise` 범위 안\"이라는 같은 검증 규칙을 양쪽에 각각 손으로 구현했다\n— client 쪽은 게임 엔진의 `ActionType` enum(`fold`/`call`/`raise`)과\n이름이 우연히 같아 지금은 안 어긋나지만, 엔진 쪽 enum 이름이 바뀌면\n서버 쪽 `_VALID_ACTIONS`는 컴파일 타임에 아무 신호 없이 조용히\n어긋난다. 완화책으로 결정 문서(ADR-63/64)에 \"이 검증 규칙은 두 곳에\n있다\"를 명시적으로 남기고, 서버 쪽 검증을 관대하게(loose)가 아니라\n엄격하게(strict) 짜서 — 어긋나면 \"잘못된 값을 그대로 통과\"가 아니라\n\"즉시 502로 실패 + 클라이언트 폴백\"으로 안전하게 넘어가게 설계(아래\n\"완화책\"과 별개로, 크로스런타임 계약이 어긋났을 때의 **실패 방향**도\n같이 설계해두면 완전 동기화가 안 돼도 안전망이 남는다).", "sections": [{"kind": "problem", "heading": "문제", "body": "같은 런타임 안에서는 상수/스키마를 한 곳에 선언하고 import해서 쓰면 되지만,\n언어가 다르면(Python↔Dart 등) **코드를 공유할 방법이 없다** — 값을 양쪽에\n각각 손으로 선언해야 한다. 한쪽만 바뀌면:\n- 컴파일 타임에 안 걸림(둘 다 각자 문법적으로는 유효한 코드라서)\n- 런타임에도 바로 안 걸림 — 실제로 그 값에 의존하는 경로가 실행될 때가\n  돼서야(\"알 수 없는 값\", 잘못된 판정 등) 어긋남이 드러난다"}, {"kind": "other", "heading": "지금 수준에서 할 수 있는 것 — 완전 자동화는 안 되니 최소한이라도", "body": "- **결정 문서에 \"이 값을 바꾸면 반드시 다른 쪽도 같이 바꿔야 한다\"를 명시적으로\n  남긴다** — 코드 주석뿐 아니라 설계 결정 로그에도, 값이 있는 두 파일 경로를\n  서로 교차 언급해서(양방향) 한쪽만 보고 고치는 실수를 줄인다.\n- **완전한 해결책은 스키마 단일 소스(JSON Schema 등)에서 양쪽 코드를 생성하는\n  것**이지만, 이건 별도 빌드 파이프라인 투자가 필요해서 프로젝트 초기엔\n  오버엔지니어링이다 — 크로스런타임으로 공유해야 하는 계약이 몇 개 안 될 땐\n  \"문서화된 수동 동기화\"로 충분하고, 개수가 늘어나거나 실제로 어긋난 사고가\n  한 번이라도 나면 그때 코드생성 파이프라인 도입을 검토한다.\n- 최소한 **CI 린트로 이름 일치 정도는 확인**할 수 있다(값 전체를 생성하진\n  못해도, \"이 상수 이름이 두 파일 다 존재하는가\" 정도의 존재 여부 체크는\n  스크립트 몇 줄로 가능) — 완전 자동화가 부담스러우면 이 정도가 절충안."}, {"kind": "other", "heading": "새 크로스런타임 계약을 추가할 때 미리 할 일", "body": "새로 클라이언트+서버 양쪽에 같은 값/스키마가 필요해지면, 만들자마자 그\n사실을 결정 문서에 \"이 값은 두 곳에 있다\"로 기록해둔다 — 나중에 \"여기 있는\n줄 몰랐다\"는 사고를 막는 가장 싼 방법은 처음 만든 순간에 남겨두는 것뿐이다."}, {"kind": "case", "heading": "실측 후속 (poker_app, 2026-09-19) — 값의 성격에 따라 \"복제\"가 아니라 \"원본 조회\"를 택한다", "body": "같은 프로젝트 안에서 두 방식이 공존한다: **가격 견적**은 클라이언트가 서버 공식을 미러링하되 실제 청구는 서버\n응답을 신뢰(어긋나도 표시만 잠깐 틀릴 뿐 돈은 서버 값), **확률 고지**(랜덤박스/카드팩 확률)는 미러링하지 않고\n서버가 원본 표를 조회 API로 그대로 내려준다. 판단 기준은 **어긋났을 때의 비용**이다 — 견적은 화면 오차로 끝나지만\n확률 고지는 실제 추첨과 한 글자라도 다르면 법적/신뢰 문제라, 복제본 자체를 만들지 않는 편이 \"동기화를 강제하는\n장치\" 문제를 통째로 없앤다(고지 값이 추첨 값에서 파생 → 동기화할 대상이 없음). 새 크로스런타임 값을 만들 때\n\"어긋나면 비용이 큰가?\"를 먼저 묻고, 크면 복제 대신 조회로 설계한다(네트워크가 필요해지는 대가는 감수)."}], "projects": ["poker_app"], "links": [], "updated": "2026-09-21", "tags": ["Flutter", "Python", "설계·구조"], "tags_overridden": true, "public": true}, {"id": "타입체커_ORM쿼리결과_오탐_패턴", "title": "정적 타입체커(mypy 등) 오탐 세 가지 패턴 — 실제 버그로 단정하기 전에", "short": "타입체커 오탐 3가지", "source": "공용/타입체커_ORM쿼리결과_오탐_패턴.md", "intro": "# 확인할 것 (범용)\n\n정적 타입체커(mypy 등)를 CI에 새로 켜고 나면 \"미해결 오류 목록\"이 나온다. 그중\n상당수가 실제로는 코드가 잘못돼서가 아니라 **타입체커가 추론에 실패**한 것일 수\n있다 — advisory 단계 결과를 검토 없이 곧바로 \"버그 의심\"으로 기록하기 전에\n아래 세 패턴부터 확인한다(전부 실측 사례에서 확인된, 서로 다른 근본원인).", "sections": [{"kind": "solution", "heading": "패턴 1 — 같은 이름의 루프 변수를 한 함수 안에서 재사용", "body": "```python\nfor r in query_a_rows:      # r: ModelA로 추론\n    ...r.field_only_on_a...\n\nfor r in query_b_rows:      # 사람 눈엔 새 루프, 새 타입 — 그런데\n    ...r.field_only_on_b...  # 타입체커가 여기서도 r을 ModelA로 계속 붙잡고\n                              # \"ModelA has no attribute field_only_on_b\" 오류를 냄\n```\n\nPython 자체엔 루프 스코프가 없어서 `r`은 함수 전체에서 같은 변수다 — 런타임은\n아무 문제 없이 동작한다(각 루프에서 실제 객체가 맞으니까). 문제는 타입체커\n쪽인데, 두 번째 이터러블(`query_b_rows`)의 원소 타입을 강하게 추론 못 하는 경우\n(예: ORM 라이브러리의 쿼리 반환 타입에 대한 타입 스텁이 약하거나 없어서 `Any`에\n가깝게 추론됨), 타입체커가 첫 번째 루프에서 굳혔던 타입(`ModelA`)을 그대로 들고\n가서 두 번째 루프의 속성 접근을 전부 \"그 타입엔 없는 속성\"으로 오탐 처리한다.\n오류 메시지가 **실제로 접근하고 있는 두 번째 모델이 아니라 첫 번째 모델 이름**으로\n나오는 게 특징 — 오류 메시지만 보고 \"그 첫 번째 모델에 그 필드를 추가해야 하나\"로\n잘못 짚기 쉽다."}, {"kind": "checklist", "heading": "확인 순서", "body": "1. 오류가 가리키는 줄의 **실제 루프가 순회하는 쿼리/변수가 뭔지**부터 코드로\n   확인한다 — 오류 메시지의 모델 이름이 아니라, 그 줄이 실제로 어떤 이터러블\n   안에 있는지를 본다.\n2. 그 실제 모델(오류 메시지가 아니라 진짜 순회 대상)의 정의에 그 속성이 있는지\n   확인한다 — 있으면 오탐 확정, 없으면 진짜 버그일 수 있으니 계속 조사한다.\n3. 오탐이 확정되면 **루프 변수 이름을 서로 다르게 지어서** 재발을 막는다(가장\n   싸고 확실한 수정 — 타입체커 억제 주석보다 낫다, 사람이 다시 읽을 때도 두\n   루프가 다른 대상이라는 게 이름만으로 바로 보인다). 억제 주석(`# type: ignore`류)\n   으로 넘기면 나중에 진짜 그 자리에 버그가 생겨도 조용히 묻힌다."}, {"kind": "solution", "heading": "패턴 2 — 제너레이터 함수가 `return`으로 값을 실어보내는데 반환타입을 너무", "body": ""}, {"kind": "other", "heading": "좁게(또는 대충) 선언해뒀다", "body": "Python 제너레이터는 `yield`로 값을 흘려보내는 동시에 `return <값>`으로 최종\n결과를 실어보낼 수 있다(PEP 380) — 호출부는 `result = yield from gen()`으로\n그 반환값을 받는다. 이 패턴 자체는 정상 동작하지만, 함수 시그니처를 단순히\n`Iterator[T]`나 `Generator[T, None, None]`(반환값 없음을 뜻하는 세 번째 타입\n인자 `None`)으로 선언해두면, 타입체커가 **함수 안에서 그 반환값을 만드는 데\n쓰인 지역변수들의 타입을 정확히 못 따라간다** — 실제 원인 함수 자체가 아니라\n그 함수 **본문 안 지역변수 추론이 줄줄이 깨지면서**, 관련 없어 보이는 여러\n줄에서 동시다발적으로 오류가 쏟아지는 게 특징이다(패턴 1처럼 특정 모델 이름을\n지목하는 게 아니라, \"이 표현식의 타입을 못 정하겠다\"류 오류가 한 함수 안에\n몰려있으면 이 패턴을 의심한다).\n\n**확인/수정**: 그 제너레이터가 실제로 `return`으로 뭘 실어보내는지 코드로\n확인한 뒤, 시그니처를 `Generator[YieldType, SendType, ReturnType]`(세 타입\n인자 전부)으로 정확히 선언한다 — `SendType`은 보통 `None`, `ReturnType`은\n실제 `return` 문의 타입(튜플이면 `tuple[...]`)을 그대로 적는다. 로직은\n전혀 안 바꾸고 타입 힌트만 정확화하는 것만으로 그 함수 안에서 나던 오류\n다수가 한 번에 해소된다 — 오류 하나하나를 따로 억제하지 않는다."}, {"kind": "solution", "heading": "패턴 3 — 타입힌트 없는 빈 리스트에 나중에 값을 여러 번 채워 넣으면, 그", "body": ""}, {"kind": "other", "heading": "변수가 딕셔너리 리터럴 안에서 다른 값의 타입으로 잘못 통합 추론된다", "body": "```python\nsteps = []                                    # 타입힌트 없음\nsteps.append({\"stage\": \"a\", \"count\": 3})      # dict 값 섞임(str/int)\n...\nresult = {\n    \"ok\": True,                               # bool\n    \"totalMs\": round(sum(s.get(\"ms\", 0) for s in steps), 2),  # ← 여기서 오류\n}\n```\n\n`steps`처럼 빈 컨테이너로 시작해 나중에 값이 섞인 원소를 채우는 변수는,\n그 변수를 참조하는 지점이 **다른 타입의 값과 같은 딕셔너리 리터럴 안에\n같이 있으면** 타입체커가 엉뚱한 타입(위 예시면 `bool`)을 그 변수의 원소\n타입으로 잘못 통합해버릴 수 있다 — 오류 메시지가 \"Generator has\nincompatible item type 'object'; expected 'bool'\"처럼, 실제로 다루는\n값(`ms`, 숫자)과 전혀 무관한 타입(`bool`)을 언급하는 게 특징이다. 패턴\n1(엉뚱한 모델 이름)·패턴 2(제너레이터 반환타입 미명시)와 같은 계열 —\n\"타입체커가 문맥을 잘못 짚었다\"는 신호를 코드가 아니라 타입힌트 부재\n탓으로 돌려야 함을 오류 메시지가 안 알려준다.\n\n**확인/수정**: 문제의 변수 선언에 명시적 타입힌트를 붙인다(위 예시면\n`steps: list[dict] = []`). 로직은 전혀 안 바꾸고 선언부 한 줄만 정확화하면\n그 변수를 다시 참조하는 모든 지점의 오류가 한 번에 사라진다 — 오류가 난\n그 줄(딕셔너리 리터럴 안)에 억제 주석을 달거나 코드를 우회하지 않는다,\n근본 원인은 항상 그 변수가 **맨 처음 선언된 자리**에 있다."}, {"kind": "other", "heading": "CI 게이트 도입 초기에 특히 조심할 것", "body": "`CI_보안게이트_레거시코드베이스_도입_패턴.md`의 원칙대로 타입체커를 처음\nadvisory로 켜면 미해결 오류가 대량으로 나온다 — 그 목록을 훑을 때 \"미해결\n오류 = 잠재 버그 목록\"이라고 그대로 믿지 않는다. 패턴 1일 확률이 높은 신호:\n(1) 오류가 ORM 쿼리 결과를 순회하는 루프 근처에 몰려있다, (2) 같은 함수 안에\n구조가 비슷한 루프가 여러 개 있다, (3) 오류가 가리키는 모델이 그 함수의 다른\n부분에서도 쓰이고 있어 완전히 무관하진 않다(그래서 더 그럴듯해 보인다).\n패턴 2일 확률이 높은 신호: (1) 오류들이 전부 같은 함수 하나 안에 몰려있다,\n(2) 그 함수가 제너레이터(`yield` 포함)다, (3) 오류 메시지가 특정 모델 이름이\n아니라 지역변수/표현식 타입을 못 정하겠다는 식이다. 패턴 3일 확률이 높은\n신호: (1) 오류가 가리키는 예상 타입(`bool` 등)이 실제로 그 줄이 다루는 값과\n전혀 무관해 보인다, (2) 오류 지점이 여러 키를 가진 딕셔너리 리터럴 안이다,\n(3) 원인으로 의심되는 변수가 함수 앞쪽에서 타입힌트 없는 빈 리스트/딕셔너리로\n시작한다. 이런 오류를 \"다음 라운드에서 정리\"로 미룰 때도, 최소한 한 번은 이\n확인 순서를 거쳐서 \"진짜 버그 후보\"와 \"오탐이라 안전하게 무시 가능\"을\n나눠두면, 나중에 그 목록을 다시 볼 사람(또는 세션)이 처음부터 다시 조사하지\n않아도 된다."}], "projects": [], "links": [], "updated": "2026-08-23", "tags": ["Python", "테스트"], "tags_overridden": true, "public": true}, {"id": "파이썬_패키지_getattr_monkeypatch_고정_함정", "title": "패키지 `__getattr__`로 구현을 넘기는 모듈을 monkeypatch하면 전환이 고정된다", "short": "__getattr__ monkeypatch 고정", "source": "공용/파이썬_패키지_getattr_monkeypatch_고정_함정.md", "intro": "2026-11-15 신설(RVS_App `constraints` 패키지 — rules/noop 짝을 `__getattr__`로 전환).", "sections": [{"kind": "problem", "heading": "증상", "body": "- 시험 하나에서 `monkeypatch.setattr(constraints, \"guest_trial_enabled\", lambda: True)`를 했더니, 그 뒤 **다른 시험의** `constraints.use(\"noop\")` 전환이 안 먹고 엉뚱한 값이 나온다. 단독 실행은 통과, 전체 실행에서만 깨진다."}, {"kind": "problem", "heading": "원인", "body": "- 패키지가 `__getattr__(name)`으로 \"현재 구현(rules|noop)의 같은 이름\"을 돌려주는 구조다. `setattr(패키지, name, ...)`은 **패키지 모듈 `__dict__`에 그 이름을 실제로 만든다.** 이후 접근은 `__getattr__`까지 안 가고 그 값(또는 monkeypatch 복원 시 남은 흔적)에 고정돼, 구현 전환이 이름 하나에 대해서만 안 먹는다."}, {"kind": "solution", "heading": "지침", "body": "- 구현 모듈 쪽을 패치한다: `monkeypatch.setattr(constraints.rules, \"_GUEST_POOL_DAILY\", 20)` / `constraints.rules.guest_trial_enabled`. 패키지 객체에 직접 `setattr`하지 않는다.\n- 값 전환이 목적이면 패키지가 제공하는 `use(\"noop\")` 같은 공식 스위치를 쓰고, 시험 끝에 원복한다(autouse 픽스처).\n- 이런 구조의 패키지를 새로 만들면 README/주석에 \"패치는 구현 모듈에 한다\"를 한 줄 적는다."}], "projects": ["RVS_App"], "links": [], "updated": "2026-11-15", "tags": ["Python", "테스트"], "tags_overridden": true, "public": true}, {"id": "파일유형_매직바이트_검증_패턴", "title": "업로드/수신 파일의 진짜 유형은 확장자가 아니라 매직바이트로 확인 (범용)", "short": "파일 유형은 매직바이트로 확인", "source": "공용/파일유형_매직바이트_검증_패턴.md", "intro": "사용자가 업로드하거나 외부에서 들어오는 파일을 다루는 모든 기능(파일 업로드\nAPI, 파일 뷰어/변환기, 첨부파일 처리 등)에 적용되는 보안 패턴.\nFileLens_App 실측에서 정리(2026-11-18 프로젝트 폴더에서 공용으로 이동).", "sections": [{"kind": "problem", "heading": "문제 — 확장자는 사용자가 마음대로 붙인 라벨일 뿐", "body": "파일 확장자(`.jpg`, `.pdf` 등)는 파일 내용과 무관하게 얼마든지 바꿔 붙일 수\n있다 — 확장자만 보고 처리 방식을 정하면, 실행파일에 `.jpg`를 붙여 이미지\n처리 파이프라인에 밀어넣는 식의 위조 공격에 그대로 노출된다."}, {"kind": "solution", "heading": "해법 — 파일 헤더(매직바이트)로 실제 유형을 판별하고, 확장자와 대조", "body": "```python\ndef detect_real_type(file_bytes: bytes) -> str:\n    if file_bytes[:8] == b'\\x89PNG\\r\\n\\x1a\\n':\n        return 'png'\n    if file_bytes[:3] == b'\\xff\\xd8\\xff':\n        return 'jpeg'\n    if file_bytes[4:8] == b'ftyp':  # MP4/MOV 계열\n        return 'mp4'\n    if file_bytes[:4] == b'%PDF':\n        return 'pdf'\n    # 바이너리 시그니처 없는 텍스트류는 휴리스틱(UTF-8 디코딩 성공 여부 등)\n    return _detect_text_heuristic(file_bytes) or 'unknown'\n\n\ndeclared_ext = filename.rsplit('.', 1)[-1].lower()\nactual_type = detect_real_type(file_bytes)\nif declared_ext != actual_type:\n    log_security_event(\"확장자_위변조_의심\", filename=filename,\n                        declared=declared_ext, actual=actual_type)\n    # 여기서 곧바로 거부할지, 실제 유형 기준으로만 처리할지는 위험도에 따라 결정\n```\n\n핵심은 **불일치를 발견했을 때 조용히 확장자 쪽으로 맞춰버리지 않는 것** —\n확장자와 실제 내용이 다르다는 사실 자체를 보안 이벤트로 로그에 남긴다.\n이후 그 파일을 거부할지, 실제 감지된 유형 기준으로 처리를 계속할지는\n그 기능의 위험도(실행 가능한 파일을 다루는지, 단순 뷰어인지)에 따라\n달리 정한다."}, {"kind": "case", "heading": "적용 범위", "body": "이미지/동영상/문서처럼 확장자 위조가 실제 보안 문제로 이어질 수 있는 모든\n업로드 기능에 적용한다. 사용자가 자기 컴퓨터 안에서만 쓰는 로컬 도구(외부\n업로드가 없는 경우)에는 우선순위가 낮다."}], "projects": ["FileLens_App"], "links": [], "updated": "2026-11-18", "tags": ["보안·개인정보", "웹"], "tags_overridden": true, "public": true}, {"id": "포크_앱_공유파일_갈라짐_점검_패턴", "title": "포크한 앱의 공유 파일 갈라짐 점검 — 한쪽을 고치면 다른 쪽도 고쳐야 하는지 알려 주는 장치", "short": "포크 앱 공유 파일 갈라짐", "source": "공용/포크_앱_공유파일_갈라짐_점검_패턴.md", "intro": "", "sections": [{"kind": "problem", "heading": "문제", "body": "앱 A를 복사해 앱 B를 만들면(포크) 같은 파일을 두 곳이 따로 들고 간다. 공유 모듈(호출 계측, LLM 호출 계층, 상태 라우터 등)은 한쪽에서 버그를 고치거나 안정화를 넣으면 **다른 쪽에도 같은 수정이 필요**한데, 그걸 알려 주는 장치가 없다. 실제로 JudgeCal에서 만든 취소·AI 연결 확인·응답 모델이 RVS에 한참 뒤에야 옮겨졌고, RVS에서 만든 하루 한도 429 차단기는 JudgeCal에 없는 채로 지내다 옮겼다. \"이식했다\"는 기억은 휘발되고, 포크 기준 커밋 기록조차 실제와 어긋나 있었다(함정: 개발_서비스_폴더_분리_운영_패턴 함정 29)."}, {"kind": "solution", "heading": "패턴", "body": "작은 스크립트 하나(`scripts/check_fork_drift.py`)가 세 가지만 한다.\n\n1. **공유 파일 목록**(의도적으로 같은 모양을 유지해야 하는 서버 파일 8~10개)마다 두 앱의 **줄 차이 수**를 센다(CRLF/LF 무시, `difflib`).\n2. **기준 파일**(`fork_drift_baseline.json`)에 마지막으로 검토했을 때의 *상대 앱 커밋 해시*와 파일별 차이 수를 저장한다.\n3. 실행하면 (a) 상대 앱에서 **기준 이후 그 파일들을 건드린 커밋 목록**(`git log <기준>..HEAD -- 파일들`)과 (b) 차이 수가 기준과 달라진 파일을 보여 주고, 하나라도 있으면 종료 코드 1이다. 검토하고 필요한 수정을 옮긴(또는 안 옮기기로 한) 뒤 `--update-baseline`으로 기준을 갱신한다. **기준 갱신은 사람(또는 사람이 시킨 에이전트)이 검토한 뒤에만** 하고 자동으로 하지 않는다.\n\n의도적으로 다른 부분(한쪽만 있는 한도 환불, 서로 다른 작업 이름 등)은 처음 기준에 이미 들어 있어 경고가 되지 않는다 — \"다름\"이 아니라 \"다름이 **변했을 때**\"만 알린다. 그래서 오탐 없이 계속 켜 둘 수 있다."}, {"kind": "problem", "heading": "하지 말 것", "body": "- **공용 패키지로 뽑기부터 하지 않는다.** 두 앱의 배포·의존성이 달라 공유 패키지가 오히려 결합을 만든다. 파일 수가 적고 갈라지는 방향이 한쪽 우세한 동안은 점검 스크립트가 훨씬 싸다. 갈라짐 경고가 자주 울리면 그때 공용화를 검토한다.\n- 목록에 **크게 갈라진 파일**(예: 한도·계정 로직)은 넣지 않는다. 처음부터 차이가 수백 줄이면 변화가 신호가 되지 않는다. 한쪽 변경이 다른 쪽에 의미가 있는 파일만 고른다.\n- 기준 해시를 *포크 시점*으로 두지 않는다 — 마지막 **검토 시점**이다.\n- **공유 파일 안의 상대 앱 이름(로거 이름·ContextVar 이름 등)을 \"잔재 정리\"로 바꾸지 않는다.** 차이 0줄이던 파일에 의미 없는 차이가 생겨 이후 진짜 변경이 묻힌다. 이름 정리는 공유 목록 밖 파일(클라이언트 설정 등)에서만 하고, 공유 파일은 \"포크 유산이라 둔다\"고 설계 문서에 적는다(RVS_App 2026-10-30 — 클라이언트 `JUDGECAL_*` 정의 이름은 `RVS_*` 우선 + 폴백으로 바꾸고, 서버 `judgecal.*` 로거는 `fork_drift_baseline` 대상이라 유지)."}, {"kind": "checklist", "heading": "체크리스트", "body": "- [ ] 포크 직후 공유 파일 목록과 기준(상대 앱 HEAD, 파일별 차이 수)을 저장했는가\n- [ ] 한쪽의 공유 파일을 고친 날 스크립트를 돌렸는가(커밋 전 훅으로 걸지 않아도 된다)\n- [ ] 한쪽에만 있는 개선을 *옮길지 말지*를 설계 문서에 적었는가(예: 해설 캐시는 입력이 매번 달라지는 게임에는 효과가 작아 안 옮김)\n- [ ] 기준을 갱신하기 전에 옮길 것을 다 옮겼는가\n\n원 소속: RVS_App <-> JudgeCal_Athe (2026-10-24). 프로젝트 무관하게 적용 가능."}], "projects": ["JudgeCal_Athe", "RVS_App"], "links": [], "updated": "2026-10-30", "tags": ["Git·문서", "설계·구조"], "tags_overridden": true, "public": true}, {"id": "폴더명_레이어명_불일치_사각지대_패턴", "title": "폴더/파일 이름이 레이어를 흉내내도 실제 의존 방향은 안 지켜질 수 있다 (범용)", "short": "폴더 이름과 실제 의존 방향", "source": "공용/폴더명_레이어명_불일치_사각지대_패턴.md", "intro": "`레이어_분리_방침.md`(Plug_In_Global)류의 원칙을 적용하는 프로젝트가 폴더명을\n레이어명과 맞추기 시작하면(`hooks/`=UX, `services/`=API호출, `pipeline.js`=\n파이프라인, `contracts/`=계약 등) \"이름이 곧 구조 보증\"이라고 착각하기 쉽다.\n실제로는 이름과 실제 import 관계가 어긋난 채로 방치되는 사각지대가 있다.\n\n**실측 사례(poker_app 세션, 2026-09-14)**: `Local_APP\\AI연동 자동실행\n허브 엔진_레거시_롤백용`(workout/diet/skin/stretch 멀티앱 허브 — 이\nknowledge base의 다른 문서가 인용하는 `Hub_App`/`Hub_APP_Sever`와 같은\n계열의 스냅샷으로 추정) 프론트엔드를 열어 실제 import문을 grep으로\n대조한 결과 —\n- `apps/workout/hooks/useWorkoutSync.js`(폴더명상 UX)가 `apps/workout/\n  pipeline.js`(파이프라인)를 거치지 않고 `shared/services/hubApiService.js`\n  (API호출 레이어)를 **직접 import**.\n- `apps/workout/pipeline.js` 자신도 실제로는 페이지 컴포넌트를 재수출하는\n  수준이라, 방침이 말하는 \"경로+API호출+DB+로직+계약을 재조립하는\n  오케스트레이션\" 역할과는 거리가 있었음.\n- `apps/workout/components/WorkoutHubTab.jsx`(폴더명상 UI)가 `shared/\n  contracts/policy.js`(계약)를 직접 import — 계약은 \"참조만\" 원칙 자체는\n  안 어겼지만, UI가 계약을 직접 참조하는 경로 자체가 방침의 통신 방향\n  단방향 원칙과 결이 다름.\n\n폴더 이름 자체는 처음엔 의도대로 지어졌을 가능성이 높다 — 개발이 진행되며\n지켜지지 않게 된 것으로 보이고, 이걸 잡아낼 별도 장치(lint, 감사)가 없어서\n아무도 눈치채지 못한 채 누적된 사례로 추정된다.\n\n**반대 방향 사례(RVS_App, 2026-11-01)** — 이름만 보고 감사하면 위반을 **잘못 세기도** 한다.\nFlutter 클라이언트 `lib/path/`에 경로 상수(`app_paths`)와 함께 기기 파일 저장소(`mode_store`·`draft_store` —\n안내를 봤는지·모드·입력 임시 저장을 파일로 읽고 씀)가 들어 있었다. 감사는 폴더 이름대로 이걸 \"경로 레이어\"로 보고\n`mode_store → logic/app_mode` import를 \"경로는 아무것도 부르지 않는다\" 위반으로 세 번 연속 기록했다. 실제 책임으로 보면\n저장소는 **DB(영속) 레이어**라 모델 타입을 참조하는 게 정상 — 오분류였다. 대신 진짜 위반은 따로 있었다: 화면(UX) 4개가\n그 저장소를 직접 받아 쓰고 있었다(파이프라인 경유 원칙 위반, 6건). 해결은 저장소 틀을 logic으로 옮기는 게 아니라\n(로직은 처리 단위라 저장소 틀의 자리가 아님 — 처음 낸 안을 방침과 대조하다 철회) 파이프라인에 얇은 감싸개\n(`DevicePrefs`)를 두고 화면은 그것만 받게 한 것. 저장소 생성은 전역설정(`main`) 한 곳이라 테스트는 거의 안 바뀌었다.\n\n교훈: 감사 표의 행을 셀 때 \"이 파일이 실제로 무엇을 하는가\"를 먼저 적고 나서 방향 규칙을 대본다 — 이름에서 레이어를 정하면\n없는 위반을 세고(오분류), 있는 위반의 원인을 엉뚱한 데서 고치려 든다(틀을 logic으로 옮기는 안).", "sections": [{"kind": "problem", "heading": "문제", "body": "- 폴더명이 레이어처럼 보이면 리뷰어/AI 에이전트 모두 \"이름이 맞으니 구조도\n  맞겠지\"라고 안심하고 실제 import 그래프를 재확인하지 않게 된다.\n- 코드 리뷰만으로는 놓치기 쉽다 — 한 파일의 import 몇 줄만 보고 \"저 레이어를\n  건드리네\"라고 즉시 알아채는 사람은 드물고, 위반이 하나씩 조용히 쌓인다.\n- `레이어_분리_방침.md`가 \"폴더명은 1:1로 안 맞아도 된다\"고 명시한 것의\n  반대쪽 함정이다 — 그 문서는 \"이름이 달라도 책임만 맞으면 된다\"만\n  다루고, \"이름을 맞췄다고 책임까지 자동 보장되진 않는다\"는 이번에\n  새로 확인된 축."}, {"kind": "solution", "heading": "완화책", "body": "- **기계적 검증 장치**를 둔다 — JS는 import 경계 lint(예: `eslint-plugin-\n  boundaries`, dependency-cruiser), Python은 import-linter류로 \"이 폴더는\n  저 폴더만 import 가능\"을 강제. 처음부터 못 두면 최소한 존재는 인지해둔다.\n- 장치가 없는 프로젝트는 **주기적 레이어 감사 체크리스트에 \"이름-실제 방향\n  일치 여부\" 항목을 넣는다** — `앱_정밀_분석_프롬프트.md`(Plug_In_Global)\n  0-3단계 레이어 감사 표의 10번째 행이 이 항목을 명문화한 실제 사례.\n- 감사 결과는 1회성 리포트로 흘려보내지 말고 프로젝트 자체 설계도 폴더에\n  누적 로그로 남긴다 — 다음 감사 때 \"지난번보다 나아졌는지\" 비교 근거가\n  없으면 같은 위반이 반복돼도 아무도 모른다(`설계도_이중계층_프로토콜.md`\n  §13 로깅 규칙 참고).\n- 새로 폴더를 레이어명으로 지을 때, \"이 이름이 약속하는 호출 방향\"을 그\n  폴더 최상단 주석/README에 한 줄로 명시해두면 나중에 감사할 때 \"원래\n  의도\"와 \"실제 상태\"를 바로 대조할 수 있다."}], "projects": ["Hub_App", "RVS_App", "poker_app"], "links": [], "updated": "2026-11-01", "tags": ["설계·구조"], "tags_overridden": true, "public": true}, {"id": "현재상태_이력스냅샷_분리_백필_설계_패턴", "title": "\"현재 상태\" 단일 블롭 + \"날짜별 이력\" 스냅샷을 분리하고, 과거 날짜를", "short": "현재 상태와 이력 스냅샷 분리", "source": "공용/현재상태_이력스냅샷_분리_백필_설계_패턴.md", "intro": "# 안전하게 백필하는 설계 패턴 (범용)\n\n\"오늘/지금 상태\"만 담는 엔티티(위젯, 대시보드 카드, 프로필 등)에 나중에\n\"과거 날짜 기록도 남기고 싶다\"는 요구가 추가될 때 적용하는 패턴. 특정\n프로젝트/도메인에 종속되지 않음 — \"지금 상태 하나만 저장하던 걸 시계열로도\n보고 싶다\"는 상황이면 어디든 적용.", "sections": [{"kind": "problem", "heading": "문제의 근본 원인", "body": "\"오늘 상태\" 엔티티는 보통 **덮어쓰기(overwrite) 저장** 방식이다 — 갱신할\n때마다 이전 값을 지우고 새 값으로 바꾼다. 이 상태에서 \"지난 화요일 기록도\n넣어줘\" 같은 요청을 그대로 같은 갱신 함수에 흘려보내면, 그 갱신 함수는\n\"지금\"이 언제인지 구분하지 못하므로 **오늘의 실제 상태가 지난 화요일\n데이터로 덮어써진다** — 사용자 입장에선 \"과거 기록 하나 추가했을 뿐\"인데\n실제로는 오늘 화면이 통째로 날아가는 사고가 된다."}, {"kind": "solution", "heading": "핵심 설계 — 두 저장소를 명확히 분리한다", "body": "1. **\"현재\" 저장소**(단일 행/블롭, 매번 갱신될 때 덮어씀)와 **\"이력\"\n   저장소**(날짜를 키로 하는 별도 테이블/컬렉션, 날짜별로 upsert)를 처음부터\n   별개 스키마로 둔다. 같은 갱신 함수가 두 저장소를 동시에 건드리더라도,\n   \"이력\" 쪽은 항상 \"그 갱신이 어느 날짜에 해당하는지\"를 명시적으로 받아서\n   그 날짜 행만 upsert하고, \"현재\" 쪽은 그 날짜 인자가 없을 때만(=오늘\n   갱신할 때만) 건드린다.\n\n2. **백필(과거 날짜 기록) 요청이 들어오면 \"현재\" 갱신 경로를 아예 안 탄다.**\n   갱신 함수 진입부에서 \"이건 오늘 갱신인가, 과거 날짜 백필인가\"부터\n   분기한다 — 과거 날짜면:\n   - 이력 저장소에서 **그 날짜의 기존 행**을 먼저 읽어온다(있으면 병합\n     대상, 없으면 빈 상태에서 시작 — \"그 날짜에 아직 아무 것도 없었다\"는\n     정상적인 경우이지 에러가 아니다).\n   - 요청으로 들어온 필드만 그 위에 병합해서 다시 그 날짜 행에만 쓴다.\n   - \"현재\" 저장소는 이 경로에서 **읽지도 쓰지도 않는다** — 오늘 화면이\n     이 백필로 영향받을 방법 자체를 원천 차단한다.\n   - 이력 저장소가 아직 초기화 안 됐어도(그 엔티티 자체를 오늘 한 번도\n     안 써봤어도) 백필은 막지 않는다 — \"오늘 상태가 세팅됐는지\"와 \"지난\n     날짜 기록을 남길 수 있는지\"는 서로 무관한 조건이다.\n\n3. **같은 패턴을 여러 엔티티 종류에 반복 적용할 땐 공용 헬퍼로 뽑아낸다.**\n   \"그 날짜 행 하나만 조회\"/\"그 날짜 행 upsert\"는 엔티티 종류(위젯 A,\n   위젯 B, ...)마다 새로 안 짜고 하나의 범용 함수로 만들어서 각 엔티티의\n   갱신 로직이 그 함수만 호출하게 한다 — 한 엔티티 종류에 이 패턴을\n   검증해서 넣은 뒤, 다른 종류에도 같은 요구가 생기면 그 검증된 헬퍼를\n   그대로 재사용해서 리스크 없이 확장할 수 있다."}, {"kind": "checklist", "heading": "배포된 시스템에서 이 기능을 검증할 때", "body": "- **최소 페이로드로 스모크테스트한다**: 날짜 파라미터만 채우고 나머지\n  필드는 비운 요청을 보내서, \"현재\" 상태가 실제로 그대로인지(`get` 계열\n  조회로 재확인)와 응답 모양이 기대한 대로인지(옛 코드와 새 코드가 다른\n  응답을 주도록 설계했다면 그 차이로 배포 반영 여부까지 같이 확인) 둘 다\n  본다. → 배포 확인 기법 자체는 `CI_보안게이트_레거시코드베이스_도입_패턴.md`의\n  \"배포 반영 여부를 안전하게 확인하는 법\" 참고.\n- **이력을 실제로 조회할 방법이 없으면 백필 자체가 반쪽짜리다.** 이력\n  저장소에 데이터를 쌓기만 하고 그걸 다시 읽어서 보여주는 조회 경로가\n  없으면, \"저장은 됐는데 아무도 확인을 못 하는\" 상태가 된다 — 백필 기능을\n  만들 때 \"그 데이터를 나중에 어떻게 꺼내 볼 것인가\"도 같은 라운드에 같이\n  설계한다(엔티티 종류별 전용 조회 로직을 새로 만들지 않고, \"현재\" 조회와\n  마찬가지로 엔티티 종류에 무관한 범용 조회 하나로 처리 — 위 3번 원칙과\n  같은 이유)."}, {"kind": "problem", "heading": "흔히 놓치는 것 — \"숫자가 필요한데 원본엔 숫자가 없다\"", "body": "이력에 채워 넣을 데이터가 사람이 서술한 텍스트(예: 일지, 메모)이고 스키마는\n정량값(칼로리, 금액 등)을 요구할 때, 그 정량값을 추정해서 채워야 하는\n경우가 있다. 이때는:\n\n- **추정치를 원본 값처럼 보이게 채우지 않는다** — 표시용 필드에 원문 서술을\n  그대로 남기고, 정량값은 \"추정\"이라는 걸 사용자에게 명시적으로 알린다.\n  사용자가 실제로 알려준 정확한 수치(제품 표기 등)가 섞여 있으면 그것만은\n  추정치와 구분해서 그대로 반영한다.\n- **정밀도 수준(항목별 개별 추정 vs 끼니/구간 합계 추정 vs 아예 채우지\n  않음)은 에이전트가 임의로 정하지 말고 사용자에게 먼저 확인한다** — 특히\n  건강/금융처럼 숫자가 이후 다른 계산(목표 대비 잔여량 등)의 입력으로\n  다시 쓰이는 도메인이면, 낮은 정밀도로 밀어붙였을 때 그 후속 계산 전체가\n  오해를 낳을 수 있다."}], "projects": [], "links": [], "updated": "2026-08-19", "tags": ["로컬 저장소", "설계·구조"], "tags_overridden": true, "public": true}, {"id": "후속확인_로컬알림_기본켬_기록률측정_패턴", "title": "사용자가 \"나중에 결과를 적어야\" 가치가 쌓이는 앱 — 로컬 예약 알림으로 후속 확인, 기본은 켬, 효과는 기록률로 잰다 (범용)", "short": "결과 기록 알림은 기본 켬", "source": "공용/후속확인_로컬알림_기본켬_기록률측정_패턴.md", "intro": "예측·계획·약속처럼 **나중에 실제 결과를 기록해야** 정확도나 데이터가 쌓이는 앱은 기록을 사용자의 기억에만 맡기면 결과 기록이 거의 쌓이지 않는다. 서버 푸시 없이 기기 로컬 예약 알림으로 \"며칠 뒤 어떻게 됐나요?\"를 묻고, 그 효과를 서버 쪽 지표로 잰다. RVS_App(2026-10-23)에서 Lazzy(Jarvis)의 로컬 알림 구현을 줄여 옮기며 정리했다.", "sections": [{"kind": "solution", "heading": "1. 로컬 예약 알림만으로 충분한 경우", "body": "- 알림 시각이 \"지금 + N일\" 정도로 느슨하고 서버 이벤트에 달려 있지 않다 → `flutter_local_notifications`의 `zonedSchedule`. 서버 푸시(FCM)·백그라운드 폴링은 가져오지 않는다(비용 0, 앱이 꺼져 있어도 예약 시각에 온다).\n- 예약은 **절대 시각**을 `tz.TZDateTime.from(DateTime, tz.local)`로 변환해 넘기면 기기 시간대 패키지가 없어도 순간이 맞다.\n- 하루 단위 알림이면 `inexactAllowWhileIdle`로 충분해 \"정확한 알람\" 권한(`SCHEDULE_EXACT_ALARM`)을 요구하지 않는다. 대신 Android 13+ `POST_NOTIFICATIONS`, 재부팅 후 복원용 `RECEIVE_BOOT_COMPLETED`와 `ScheduledNotificationReceiver`/`BootReceiver`를 매니페스트에 넣고, 플러그인이 요구하는 `coreLibraryDesugaring`을 켠다. 의존성 `timezone` 버전은 플러그인 쪽 요구(예: ^0.11)에 맞춘다 — 다른 앱의 고정 버전을 그대로 옮기면 해결 실패.\n- 한계: 기기를 바꾸면 예약이 사라진다. Windows는 앱이 꺼져 있으면 안 올 수 있고 취소가 제한된다."}, {"kind": "solution", "heading": "2. 설계 규칙", "body": "- **고정 문구**: 알림 본문에 사용자가 쓴 상황·내용을 넣지 않는다(잠금 화면 노출). 누르면 열릴 대상은 payload(`종류:세션 id`)로만 넘긴다.\n- **알림 id는 세션 id에서 결정적으로**(해시) 만든다 — 예약 목록을 따로 저장하지 않아도 나중에 같은 id로 취소할 수 있다.\n- **구현을 인터페이스 뒤에 둔다**: 기본 `NoReminders`(아무것도 안 함), 기기 구현은 `main()`에서만 끼운다. 테스트는 가짜(예약·취소 기록, 탭 스트림)를 끼운다. 기기 구현을 `main()`에서만 import하면 위젯 테스트가 플러그인을 로드하지 않는다.\n- **설정은 기존 설정 스키마의 한 섹션으로**(RVS는 프로필 스키마 `reminders`: 끔/1·3·7일 뒤 + 시각). 스키마·폼·검증이 다른 섹션과 같은 경로로 나온다. 단, 기기 전용 값이므로 **AI 프롬프트에서 빼고**, 채팅 AI가 바꾸지 못하게 한다(섹션 플래그로 구조 힌트·값 변경 경로 둘 다 막는다).\n- 알림을 눌러 앱이 **새로 켜진 경우**도 처리한다(`getNotificationAppLaunchDetails` → 첫 로드 뒤 한 번 꺼내 쓰기). 이미 기록돼 있으면 기록된 내용이 보이게 해서 취소 실패(Windows)를 흡수한다.\n- 결과를 기록하는 모든 경로에서 예약을 취소한다(기록 화면이 여러 곳에서 열리면 호출 지점이 한 곳인 저장 함수에 건다).\n- **물어볼 거리가 없는 결과에는 예약하지 않는다**(RVS 2026-10-31 실기기): AI가 결과를 못 만들어 자리표시 후보만 돌아온 역산에도 \"3일 뒤 어떻게 됐나요?\"가 예약되고 타임라인에 정상 카드로 남았다. 예약 판단을 \"응답이 200인가\"가 아니라 \"보여 줄 결과가 있는가\"(예: `hasNoResult`)에 걸고, 서버도 같은 판정(`is_fallback`)으로 타임라인 기록을 건너뛴다 — 앱만 막으면 다른 클라이언트·옛 앱에서 같은 카드가 생긴다."}, {"kind": "solution", "heading": "3. 기본은 \"켬\", 끄는 건 \"끔\"만", "body": "기록이 서비스의 원료라면 기본을 켠다. 구현은 **\"끔\"만 끄고 나머지(미설정·모르는 값)는 기본값**으로 해석한다 — 미설정이 꺼짐이면 아무도 켜지 않는다. 첫 예약 때 OS 권한 창이 뜨는 것은 감수하고, 거부하면 예약만 건너뛰고 본 기능은 그대로 둔다. 안내(첫 실행 한 장)에 알림 이유와 끄는 위치를 적는다."}, {"kind": "solution", "heading": "4. 효과 측정 — 알림이 기록을 늘리는가", "body": "- 기기가 예약하면 서버에 **\"N일 뒤 알림 예약\"을 표시**한다(서버 시계로 알림 시각 계산 — 기기 시간대와 무관). 표시 호출이 실패해도 알림 자체는 동작한다.\n- 집계: (알림 시각이 지난 역산 중 결과를 적은 비율) vs (알림 없이 N일 넘게 지난 역산 중 같은 비율). 둘을 나란히 본다.\n- 주의: 기본을 켠 뒤에는 \"알림 없음\" 표본이 줄어든다(켜기 전 기록이 비교 대상). 한 사람 안의 수치는 건수가 적을 때 우연이므로 전체 합계(개발자 콘솔)로 판단한다. 알림 시각이 지나지 않은 건은 분모에 넣지 않는다.\n- **미확인 관리**(RVS 2026-10-31): 기록률만으로는 \"아직 기다리는 중\"과 \"포기된 것\"이 섞인다. 알림 시각이 지났는데 기록이 없는 건을 지난 기간(7일 안 / 30일 안 / 만료)으로 나눠 센다 — 만료 기준은 예측 기간과 맞춘다(그 뒤에 적은 결과는 같은 기간의 예측과 비교할 수 없다)."}, {"kind": "case", "heading": "구현 사례", "body": "RVS_App: `client/lib/pipeline/reminders.dart`(설정 해석·예약·취소·기본 NoReminders), `local_reminders.dart`(기기 구현), 서버 `PUT /rvs/simulations/{id}/reminder`, `profile_store.reminder_stats()`, 개발자 콘솔 `/devconsole/users`. 원형: Lazzy_App_OS_Monorepo `client/lib/backend/notifications/notification_service.dart`."}], "projects": ["Lazzy_App_OS_Monorepo", "RVS_App"], "links": [], "updated": "2026-10-31", "tags": ["Flutter", "Android"], "tags_overridden": true, "public": true}], "quizzes": {"1대N_확장_배지_대표엔티티_드릴다운_패턴": {"rule_id": "1대N_확장_배지_대표엔티티_드릴다운_패턴", "questions": [{"id": "q1", "type": "choice", "section": "문제", "situation": "'대기 중 도전 1건' 배지가 있었는데, 플레이어가 회사를 여러 개 가질 수 있게 바뀌었다. 흔히 나오지만 과한 대응은?", "options": ["배지 목적지를 대표 회사로 고정한다", "알림 센터 같은 새 목록 화면을 통째로 만든다", "상세 화면에 계열사 섹션을 추가한다", "회사가 1개면 보조 섹션을 숨긴다"], "answer": 1, "explain": "엔티티가 실제로 동시에 여러 개 걸리는 경우가 드물면 새 목록 화면은 문제 크기 대비 과하다. 받은편지함처럼 자주 여러 개가 걸리는 도메인에서나 투자 가치가 있다."}, {"id": "q2", "type": "choice", "section": "해법 — 새 화면 대신 \"대표 엔티티 고정 + 그 안에서 드릴다운\"", "situation": "엔티티가 N개로 늘어난 뒤에도 배지를 하나로 유지한다. 이 패턴에서 배지를 눌렀을 때의 목적지는?", "options": ["알림이 걸린 엔티티 중 가장 오래된 것", "도메인에 이미 있는 정렬 기준의 1등(예: 가장 규모가 큰 것) — 대표 엔티티의 상세 화면", "엔티티 선택 대화상자", "매번 다른 엔티티를 돌아가며"], "answer": 1, "explain": "배지는 하나로 유지하고 대표 엔티티로 고정한다. 실제로 알림이 걸린 것이 대표가 아니어도, 상세 화면 안 보조 섹션에서 한 번 더 탭해 도달한다."}, {"id": "q3", "type": "scenario", "section": "해법 — 새 화면 대신 \"대표 엔티티 고정 + 그 안에서 드릴다운\"", "situation": "대표 회사 상세 화면에 '계열사' 섹션을 추가하려 한다. 이 섹션의 설계 조건을 쓰세요.", "rubric": ["대표가 아닌 나머지 같은 종류 엔티티를 나열한다고 썼다", "대기 중 알림이 있는 엔티티에는 배지를 표시한다고 썼다", "엔티티가 1개뿐이면 섹션을 숨겨 평소 화면이 기존과 같다고 썼다", "새 화면·네비게이션 계층을 만들지 않고 기존 상세 화면에 조건부 섹션만 더한다고 썼다"], "explain": "대다수 사용자에게는 화면이 전혀 바뀌지 않고, 여러 개를 가진 사용자만 한 단계 더 탐색한다."}]}, "Android_납품전_debug서명_allowBackup_점검_패턴": {"rule_id": "Android_납품전_debug서명_allowBackup_점검_패턴", "questions": [{"id": "q1", "type": "spot", "section": "1. release 빌드가 debug 키로 서명된다 (Flutter 기본 템플릿)", "situation": "Flutter 기본 템플릿 그대로인 android/app/build.gradle.kts의 일부다. 이 설정으로 만든 APK를 고객에게 납품하면 안 되는 이유가 되는 줄을 고르세요.", "code": "android {\n    buildTypes {\n        release {\n            signingConfig = signingConfigs.getByName(\"debug\")\n            isMinifyEnabled = false\n        }\n    }\n}", "answer_lines": [4], "explain": "release 빌드가 debug 키로 서명된다. 나중에 진짜 키로 바꾸면 서명이 달라 업데이트가 INSTALL_FAILED_UPDATE_INCOMPATIBLE로 막히고, 고객은 앱을 지우고 다시 깔아 앱 안 데이터를 잃는다. 키 정보는 gitignore된 key.properties에서 읽게 한다."}, {"id": "q2", "type": "choice", "section": "2. `allowBackup`을 지정하지 않으면 기본값이 \"허용\"이다", "situation": "대화·알림 기록을 저장하는 앱의 AndroidManifest.xml <application>에 android:allowBackup 속성이 없다. 맞는 판단은?", "options": ["지정이 없으면 백업이 꺼진 상태라 안전하다", "지정이 없으면 백업이 허용되어 앱 데이터가 클라우드 백업과 adb backup에 실려 나갈 수 있다 — 개인정보 앱은 false로 둔다", "release 빌드에서는 백업이 자동으로 꺼진다", "Android 12 이상에서는 이 속성이 무시된다"], "answer": 1, "explain": "기본값은 허용이다(12+는 dataExtractionRules도 따로 본다). 끄면 재설치 후 데이터가 복원되지 않으므로 사용자가 백업에 의존하는 앱인지 먼저 확인한다. 점검은 dumpsys package 출력의 flags에 ALLOW_BACKUP이 없는지로 한다."}, {"id": "q3", "type": "choice", "section": "3. 서명 경고가 `flutter build` 출력에 안 나온다", "situation": "gradle에 'key.properties 없음' 경고(logger.warn)를 넣어 두었고, flutter build apk --release 출력에 경고가 보이지 않았다. release 서명이 정상인지 확인하는 방법은?", "options": ["경고가 안 보였으니 정상이다", "apksigner verify --print-certs로 산출물 인증서를 직접 보고, DN이 'CN=Android Debug'인지 확인한다", "앱을 설치해 실행되는지 본다", "build.gradle.kts를 다시 읽어 본다"], "answer": 1, "explain": "Flutter가 Gradle 로그를 걸러서 보여 줘 경고가 출력에 나오지 않았다(실측). 경고 대신 산출물을 직접 검사한다. apksigner는 java가 PATH나 JAVA_HOME에 있어야 돈다."}, {"id": "q4", "type": "choice", "section": "4. 설치가 \"성공\"처럼 보이는데 안 된 경우 (점검 시 같이 쓰는 확인)", "situation": "adb -s 기기 install -r app.apk | tail -1 을 스크립트에서 돌렸고 종료 코드가 0이었다. 설치가 실제로 됐는지 확인하는 방법은?", "options": ["종료 코드가 0이므로 설치됐다", "dumpsys package 패키지 출력의 lastUpdateTime이 기기의 현재 시각으로 갱신됐는지 본다", "같은 명령을 한 번 더 돌려 본다", "PC의 APK 파일 수정 시각을 확인한다"], "answer": 1, "explain": "파이프의 종료 코드는 마지막 명령(tail)의 것이라 설치가 실패해도 0이 된다. 기기가 빠져 있으면 명령이 대기했다가 나중에 이어서 진행하기도 하므로, 설치 결과는 기기 쪽 기록으로 확인한다."}]}, "Claude_Code_프로젝트규칙_인덱싱_패턴": {"rule_id": "Claude_Code_프로젝트규칙_인덱싱_패턴", "questions": [{"id": "q1", "type": "choice", "section": "핵심 원칙 3가지", "situation": "여러 프로젝트가 공통 작업규칙을 공유한다. 각 프로젝트 문서에 무엇을 적어 두는 것이 안전한가?", "options": ["공통 규칙 본문을 그대로 복사해 둔다", "공통 규칙 파일의 위치(경로)만 적고, 내용은 그때그때 원본을 읽는다", "공통 규칙의 요약을 프로젝트마다 새로 쓴다", "아무것도 적지 않는다"], "answer": 1, "explain": "하드코딩할 것은 위치지 내용이 아니다. 내용을 복붙하면 원본이 바뀔 때마다 사본도 갱신해야 하는 이중 관리가 시작된다."}, {"id": "q2", "type": "choice", "section": "핵심 원칙 3가지", "situation": "설계 문서 프로토콜을 '항상 로드'에서 뺐다. 인덱스에서는 어떻게 해야 하나?", "options": ["항상 로드에서 뺐으니 인덱스에서도 경로를 지운다", "경로는 인덱스에 그대로 남기고, 필요할 때만 연다", "프로토콜을 지운다", "모든 프로젝트 CLAUDE.md에 복사한다"], "answer": 1, "explain": "'자동 로드 안 함'과 '경로를 모름'은 다르다. 인덱스의 존재 이유가 가끔 필요한 것의 경로를 항상 기록해 두는 것이다."}, {"id": "q3", "type": "choice", "section": "무엇을 \"항상 로드\"에 넣을지 판단 기준", "situation": "다음 중 사용자 레벨 '항상 로드'에 넣기에 가장 맞는 것은?", "options": ["설계 문서 작성 프로토콜", "아키텍처 레이어 방침", "커밋·테스트 규칙 같은 코딩 작업 컨벤션", "특정 프로젝트의 빌드 명령"], "answer": 2, "explain": "항상 로드는 모든 세션이 비용을 상시로 문다. 거의 매 세션 실제로 쓰이는 것만 넣고, 특정 작업 유형에서만 쓰이는 프로토콜은 인덱스로 돌린다."}, {"id": "q4", "type": "choice", "section": "인덱스 표는 md 파일이 아니라 폴더 경로로", "situation": "워크스페이스 분류기의 프로젝트 인덱스 표에 각 프로젝트를 적을 때 맞는 것은?", "options": ["각 프로젝트의 .claude/CLAUDE.md 파일 경로를 적는다", "프로젝트 루트 폴더 경로까지만 적는다", "각 프로젝트 CLAUDE.md를 @import로 건다", "프로젝트 이름만 적는다"], "answer": 1, "explain": "파일 경로를 적어 두면 인덱스를 열자마자 나열된 것을 전부 열어 보기 쉽다. 폴더까지만 적어 '필요한 프로젝트를 찾은 뒤 연다'는 판단을 한 단계 더 거치게 한다."}, {"id": "q5", "type": "scenario", "section": "Claude Code 공식 import 문법(`@경로`)", "situation": "공통 규칙 파일을 `@경로`로 import하고 있다. 이 방식의 대가와 유지보수 시 주의점을 쓰세요.", "rubric": ["매 세션 항상 토큰 비용이 들므로 '항상 있어야' 하는 것만 최소 개수로 쓴다고 썼다", "import 대상 파일을 옮기거나 이름을 바꾸면 import 줄도 같이 고쳐야 한다고 썼다", "깨져도 에러 없이 조용히 무시될 수 있어 프로즈 포인터보다 위험하다고 짚었다"], "explain": "하드코딩 지점이 적을수록 이 유지보수 위험도 줄어든다."}]}, "CLAUDE_md_임포트_전개_미검증_위험_패턴": {"rule_id": "CLAUDE_md_임포트_전개_미검증_위험_패턴", "questions": [{"id": "q1", "type": "choice", "section": "왜 위험한가", "situation": "CLAUDE.md의 @경로 import가 세션에서 펼쳐지지 않고 문자열 그대로 남았다. 이때 일어나는 일은?", "options": ["세션 시작 시 오류가 떠서 바로 알 수 있다", "세션은 정상 진행되고, 하위 규칙이 빠졌다는 신호가 사용자에게도 AI에게도 보이지 않는다", "Claude Code가 자동으로 다시 불러온다", "하위 문서의 첫 절만 로드된다"], "answer": 1, "explain": "확인 방법은 세션 시작 시스템 리마인더에서 @로 시작하는 줄이 문자열 그대로 남았는지 직접 대조하는 것뿐이다. 체인이 길수록 한 지점의 실패가 전체를 조용히 끊는다."}, {"id": "q2", "type": "choice", "section": "완화책", "situation": "이 워크스페이스에서 규칙 문서를 가장 확실하게 매 세션 배달하는 방법으로 실제 적용·검증된 것은?", "options": ["@import 체인을 더 깊게 만들어 여러 경로로 로드한다", "SessionStart 훅이 외부 프로세스로 규칙을 주입하고, 등록된 루트 세션에서만 주입하도록 범위를 좁힌다", "규칙 본문을 모든 프로젝트 README에 복사한다", "세션마다 사용자가 규칙을 붙여 넣는다"], "answer": 1, "explain": "훅은 실제로 실행되는 외부 프로세스라 신뢰성 등급이 다르다. 다만 무관한 프로젝트에도 매번 비용이 붙는다는 지적에 따라 cwd 매치로 범위를 좁혔고, 매치·비매치 양쪽을 pipe-test로 확인했다."}, {"id": "q3", "type": "choice", "section": "완화책", "situation": "작업 중 '언제 어느 문서를 열지 정하는 참조조건 규칙'이 이번 세션에 적용됐는지 의심스럽다. 맞는 행동은?", "options": ["상시 로드라고 문서에 적혀 있으니 로드됐다고 가정한다", "그 자리에서 해당 문서를 Read로 직접 열어 확인한다", "세션을 재시작할 때까지 그 규칙과 관련된 작업을 미룬다", "다른 프로젝트 세션에서 같은 규칙이 보이는지 확인한다"], "answer": 1, "explain": "상시 로드는 있으면 편한 최적화일 뿐 보장된 안전장치가 아니다. 중요한 참조조건일수록 직접 열어 확인하는 것을 기본 습관으로 둔다."}, {"id": "q4", "type": "scenario", "section": "완화책", "situation": "한 세션에서 @import가 펼쳐지지 않은 것을 처음 발견했다. 이 관측을 어떻게 기록하고 확인할지 쓰세요.", "rubric": ["다음 세션에서 같은 방식으로 시스템 리마인더를 열어 재현되는지 다시 확인한다고 썼다", "반복되면 구조적 결함(빈도 상시)으로, 한 번뿐이면 관측 부족(빈도 미상)으로 구분해 기록한다고 썼다", "도구 버그일 수 있으므로 파일 경로와 리마인더 관측 내용 같은 재현 정보를 남긴다고 썼다"], "explain": "'가끔 그렇다'로 단정하지 않고 재현성으로 구분해야 대응 수준(훅 전환 등)을 정할 근거가 생긴다."}]}, "Dart_이름있는매개변수_후행쉼표_위치_함정": {"rule_id": "Dart_이름있는매개변수_후행쉼표_위치_함정", "questions": [{"id": "q1", "type": "choice", "section": "함정", "situation": "다음 Dart 시그니처 중 컴파일되는 것은? (줄바꿈은 결과에 영향이 없어 한 줄로 적었다)", "options": ["`Future<int> bar(String stat, {bool isDayPass = false}, ) async {}`", "`Future<int> bar(String stat, {bool isDayPass = false,}) async {}`", "`Future<int> bar(String stat, {bool isDayPass = false,},) async {}`", "`Future<int> bar(String stat, [bool isDayPass = false], ) async {}`"], "answer": 1, "explain": "후행 쉼표는 이름 있는 매개변수 그룹 안쪽(마지막 매개변수 뒤, `}` 앞)에만 허용된다. `}` 뒤의 쉼표는 안쪽에 쉼표가 이미 있어도, 선택적 위치 매개변수 `[...]`여도, 줄바꿈과 무관하게 항상 무효다."}, {"id": "q2", "type": "spot", "section": "실측 사례 (poker_app, 2026-09-15)", "situation": "정상 동작하던 시그니처를 테스트 페이크 클라이언트로 옮기며 다른 override들과 모양을 맞추려 재포맷했다. 'Expected to find ')''가 나는 줄을 고르세요.", "code": "class _CardClient extends FakeClient {\n  @override\n  Future<PurchaseBuffCardResult> purchaseBuffCard(\n    String stat, int tier, {bool isDayPass = false},\n  ) async {\n    return const PurchaseBuffCardResult.ok();\n  }\n}", "answer_lines": [4], "explain": "닫는 `}` 바로 뒤의 쉼표가 원인이다. 원본처럼 `{bool isDayPass = false,` 다음 줄에 `}) async {`로 붙여 써야 한다. 이 에러는 원인 줄·칼럼을 정확히 짚어 주는 드문 경우다."}, {"id": "q3", "type": "choice", "section": "해법", "situation": "이 실수를 다시 하지 않는 가장 확실한 방법은?", "options": ["후행 쉼표를 아예 쓰지 않는다", "dart format(또는 저장 시 포맷)으로 정규 포맷을 맞춘다", "시그니처를 한 줄로만 쓴다", "override 메서드는 손으로 새로 타이핑한다"], "answer": 1, "explain": "포맷터를 믿을 수 있으면 규칙을 외울 필요가 없어진다. 복사할 때는 개행 위치까지 그대로 옮기고 임의로 '정리'하지 않는 습관도 함께 둔다."}]}, "FastAPI_dependency_예외_에러버블링_사각지대_패턴": {"rule_id": "FastAPI_dependency_예외_에러버블링_사각지대_패턴", "questions": [{"id": "q1", "type": "choice", "section": "문제 — dependency는 파이프라인의 try/except보다 먼저 실행된다", "situation": "헤더에서 player_id를 읽는 dependency가 처음 보는 id면 DB에 행을 넣는다. DB가 읽기 전용이 되자 클라이언트가 스택트레이스가 담긴 500을 받았다. 라우트 본문의 파이프라인은 모든 예외를 502로 바꾸는데 왜 못 잡았나?", "options": ["파이프라인 try/except가 비동기 예외를 못 잡아서", "Depends()가 라우트 본문보다 먼저 실행돼, 그 예외가 파이프라인 try/except의 바깥에서 터져서", "DB 드라이버가 예외를 삼켜서", "FastAPI가 502를 지원하지 않아서"], "answer": 1, "explain": "실행 순서는 Depends → 라우트 본문(파이프라인)이다. dependency 안의 예외를 잡을 코드가 없어 FastAPI가 raw 500과 스택트레이스를 내보낸다. 계약(502)과 실제 동작이 어긋나고 정보 노출까지 생긴다."}, {"id": "q2", "type": "spot", "section": "해법 — 둘 중 하나, 섞지 말 것", "situation": "'dependency는 순수 조회만' 원칙으로 보면 사각지대를 만드는 줄을 고르세요.", "code": "def get_player_id(x_player_id: str = Header(...)) -> str:\n    if not x_player_id:\n        raise HTTPException(400, \"missing player id\")\n    ensure_player(x_player_id)\n    return x_player_id", "answer_lines": [4], "explain": "ensure_player는 DB 쓰기라 실패할 수 있는 부수효과다. 파이프라인 함수 맨 앞으로 옮기면 기존 try/except가 덮는다. 꼭 dependency에 남겨야 하면 dependency 자신이 try/except로 502로 바꿔 던진다."}, {"id": "q3", "type": "scenario", "section": "왜 눈에 안 띄는가", "situation": "팀원이 '우리 테스트 커버리지가 90%라 이런 경로는 이미 확인됐다'고 한다. 왜 이 사각지대가 테스트로 잘 드러나지 않는지, 어떻게 확인해야 하는지 쓰세요.", "rubric": ["dependency는 '절대 안 실패하는 얇은 조회'로 여겨져 편의 로직(DB 등록 등)이 슬며시 얹힌다고 썼다", "정상 경로 테스트로는 dependency의 DB 호출 실패가 일어나지 않아 드러나지 않는다고 썼다", "DB를 읽기 전용으로 만드는 등 장애를 강제로 일으켜 dependency 경로를 실제로 실행해 봐야 한다고 썼다"], "explain": "커버리지는 줄이 실행됐는지만 본다. 실패 경로는 장애를 강제로 만들어야 지나간다. 코드만 읽고 '파이프라인이 잡을 것'이라고 짐작하지 않는 것이 핵심이다."}]}, "FastAPI_http미들웨어_연결끊김_차단_취소무력화_함정": {"rule_id": "FastAPI_http미들웨어_연결끊김_차단_취소무력화_함정", "questions": [{"id": "q1", "type": "choice", "section": "원인", "situation": "라우트에서 `await request.is_disconnected()`로 클라이언트 취소를 감시하는데, 실제 서버에서는 항상 False다. 보안 헤더를 붙이는 미들웨어 하나가 `@app.middleware(\"http\")`로 붙어 있다. 원인은?", "options": ["uvicorn이 연결 끊김을 감지하지 못해서", "`@app.middleware(\"http\")`가 BaseHTTPMiddleware로 감싸지고, 그 래퍼가 넘기는 receive가 http.disconnect를 전달하지 않아서", "보안 헤더가 응답을 늦게 보내서", "is_disconnected는 POST 요청에서만 동작해서"], "answer": 1, "explain": "통과만 하는 미들웨어 하나로도 생긴다. 실험에서 미들웨어가 없으면 True, `@app.middleware(\"http\")` 1개면 False였다. 순수 ASGI 클래스로 바꾸면 receive를 그대로 넘겨 신호가 라우트까지 간다."}, {"id": "q2", "type": "choice", "section": "왜 테스트가 못 잡았나", "situation": "감시 로직 단위 테스트도 통과했고 TestClient 통합 테스트도 통과했는데 실서버에서만 취소가 안 됐다. 테스트가 놓친 이유로 맞는 것은?", "options": ["가짜 요청은 미들웨어를 거치지 않고, TestClient는 실제 소켓이 없어 연결 끊김을 재현하지 못해서", "테스트가 비동기가 아니어서", "테스트 DB가 달라서", "테스트에서 로그 레벨이 낮아서"], "answer": 0, "explain": "'감시 로직이 맞다'와 '실제 요청에 신호가 닿는다'가 따로 놀았다. 모의 테스트가 배선 결함을 가린 경우라서, 진짜 서버를 띄워 원시 소켓으로 끊어 보는 시험이 필요하다."}, {"id": "q3", "type": "spot", "section": "해법", "situation": "끊김 신호를 살리려고 바꾼 순수 ASGI 미들웨어다. 그런데 이 코드는 라우트가 정한 보안 헤더 값까지 덮어쓴다. 문제가 되는 줄을 고르세요.", "code": "async def send_with_headers(message):\n    if message[\"type\"] == \"http.response.start\":\n        message.setdefault(\"headers\", [])\n        headers = MutableHeaders(scope=message)\n        for name, value in EXTRA.items():\n            headers[name] = value\n    await send(message)", "answer_lines": [6], "explain": "원래 setdefault처럼 라우트가 이미 정한 값은 남겨야 한다. `if name not in headers:` 조건 안에서만 넣는다. 미들웨어를 바꾸면서 동작(덮지 않음)까지 바뀌지 않게 하는 것이 요점이다."}, {"id": "q4", "type": "scenario", "section": "시험 — 진짜 서버로", "situation": "누가 나중에 `@app.middleware(\"http\")`를 다시 붙여도 바로 알 수 있게 시험을 설계하려 한다. 어떤 시험을 넣을지 쓰세요.", "rubric": ["app.user_middleware에 BaseHTTPMiddleware가 없는지 확인하는 구조 시험을 넣었다", "uvicorn.Server를 스레드로 실제로 띄우고 원시 소켓으로 POST 뒤 닫아 라우트의 취소 토큰이 True가 되는지 보는 시험을 넣었다", "서버가 started 된 뒤 보내고 끝나면 should_exit로 내리는 등 시험이 스스로 정리되게 했다"], "explain": "구조 시험은 빠르게 회귀를 막고, 실제 소켓 시험은 신호가 진짜 닿는지 증명한다. 둘 다 있어야 같은 함정이 다시 들어오지 않는다."}]}, "Flutter_시크릿_에셋번들_노출_방지_패턴": {"rule_id": "Flutter_시크릿_에셋번들_노출_방지_패턴", "questions": [{"id": "q1", "type": "choice", "section": "핵심 문제", "situation": "팀원이 '.env는 .gitignore에 넣었으니 API 키는 안전하다'고 한다. pubspec.yaml의 assets에 .env가 들어 있고 flutter_dotenv로 로드한다. 맞는 판단은?", "options": ["안전하다 — 저장소에 없으면 노출될 곳이 없다", "위험하다 — assets에 나열된 파일은 빌드 산출물(APK·exe)에 평문 그대로 들어가 누구나 꺼낼 수 있다", "안전하다 — 빌드 때 .env가 컴파일되어 사라진다", "위험하다 — 하지만 릴리스 빌드에서는 자동으로 빠진다"], "answer": 1, "explain": ".gitignore는 저장소 노출만 막고, 빌드 산출물 노출과는 완전히 다른
