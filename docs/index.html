다. 실측에서는 '같은 상품이니 같은 가격'이라 공유를 유지했다."}, {"id": "q3", "type": "scenario", "section": "탐지/완화 방법", "situation": "상수 값을 바꾼 뒤 전체 테스트를 돌렸더니, 무관해 보이는 '회사 유지비' 테스트 6개가 하드코딩된 기대값 때문에 실패했다. 어떻게 처리할지 쓰세요.", "rubric": ["이 실패를 '재사용 지점을 못 찾았다'는 사후 신호로 받아들인다고 썼다", "기대값을 새 값으로 바로 고치기 전에, 그 계산식이 왜 이 상수를 쓰는지부터 읽는다고 썼다", "의도적 공유로 확인되면 기대값을 새 기준으로 다시 계산하고, 우연한 재사용이면 상수를 분리한다고 썼다"], "explain": "실패한 테스트를 기계적으로 새 값에 맞추면 의도하지 않은 연쇄 변경을 그대로 확정해 버린다."}]}, "공유파일_레지스트리_동시쓰기_OCC_재시도_패턴": {"rule_id": "공유파일_레지스트리_동시쓰기_OCC_재시도_패턴", "questions": [{"id": "q1", "type": "choice", "section": "문제", "situation": "GUI와 백그라운드 워치독이 같은 JSON 레지스트리를 쓴다. 저장은 임시 파일에 쓴 뒤 `os.replace()`로 교체한다. 그런데 GUI에서 추가한 항목이 가끔 조용히 사라진다. 이유는?", "options": ["os.replace가 Windows에서 원자적이지 않아서", "원자적 쓰기는 깨진 파일만 막고, 읽은 뒤 다른 프로세스가 저장한 내용을 내 스냅샷으로 덮어쓰는 손실갱신은 막지 못해서", "JSON 파일이 너무 커서", "워치독이 파일을 잠가서"], "answer": 1, "explain": "read-modify-write에서 쓰기 직전에 '디스크가 아직 내가 읽은 상태인가'를 확인하지 않으면 손실갱신이 생긴다. 쓰기는 매번 성공하므로 에러도 안 난다. 원자적 쓰기와 동시성 제어는 서로 다른 문제를 푼다."}, {"id": "q2", "type": "choice", "section": "해법 — 두 축으로 나눠서 다르게 처리", "situation": "OCC 충돌이 났다. 다음 중 '최신 상태를 다시 읽어 자동 재시도'해도 안전한 함수는?", "options": ["사람이 편집한 루트 목록 전체를 이 값으로 바꾸는 함수", "대기 큐에 항목 하나를 추가(append)하는 함수", "설정 섹션 전체를 사용자가 고친 값으로 교체하는 함수", "두 사람이 동시에 고친 같은 필드를 저장하는 함수"], "answer": 1, "explain": "판단 기준은 '최신 상태에 내 변경을 그대로 다시 적용해도 두 변경이 자동으로 합쳐지는가'이다. append·삭제 전용은 서로 무관해서 재시도가 안전하고, 통째 교체는 어느 쪽이 맞는지 사람이 정해야 하므로 멈추고 알린다."}, {"id": "q3", "type": "spot", "section": "해법 — 두 축으로 나눠서 다르게 처리", "situation": "OCC로 보호하려던 저장 함수다. 읽은 뒤 바뀌었는지 확인하는 데 쓰는 값이 틀린 줄을 고르세요.", "code": "def save_registry(data, read_hash):\n    current = sha256(REG.read_bytes()).hexdigest()\n    if current != sha256(json.dumps(data).encode()).hexdigest():\n        raise Conflict(\"다른 곳에서 저장됨 — 새로고침 후 다시 시도\")\n    write_atomic(REG, data)", "answer_lines": [3], "explain": "비교 대상은 '내가 읽었을 때의 파일 해시(read_hash)'다. 지금 쓰려는 새 데이터의 해시와 비교하면 내용을 바꿀 때마다 항상 충돌로 판정되고, 정작 다른 프로세스의 저장은 감지하지 못한다. `if current != read_hash:`여야 한다."}, {"id": "q4", "type": "scenario", "section": "일반화", "situation": "지금은 GUI 하나만 쓰는 설정 파일 저장 함수가 10개 있다. 동료가 '안전하게 전부 OCC로 감싸자'고 한다. 어떻게 판단할지 쓰세요.", "rubric": ["새 쓰기 경로(MCP tool 등)가 하나만 더 생겨도 손실갱신이 열린다는 위험을 인정했다", "실제로 여러 프로세스가 이미 쓰고 있는 것이 확인된 파일부터 적용하고, 근거 없이 전부 감싸는 것은 과설계라고 썼다", "적용할 때는 파일 전체 해시 하나로 기존 OCC 장치에 그 로드/저장 함수만 참여시키면 된다고 썼다"], "explain": "방어는 실제 위험이 확인된 곳부터 건다. 이미 있는 OCC 장치를 재사용하면 새 섹션을 보호하는 비용이 거의 없어서, 쓰기 경로가 늘어날 때 바로 붙일 수 있다."}]}, "다중클라이언트_규칙은_서버한곳_게임판정_도우미대사_패턴": {"rule_id": "다중클라이언트_규칙은_서버한곳_게임판정_도우미대사_패턴", "questions": [{"id": "q1", "type": "choice", "section": "언제 서버로 옮기나(판단표)", "situation": "앱과 웹(다른 언어) 클라이언트가 있다. 다음 중 서버 한 곳에서 계산하지 말고 기기에 두는 게 맞는 값은?", "options": ["콤보·체력 같은 판정 결과", "나중에 크레딧이 붙을 해금 조건", "사용자가 이 알림을 이미 봤는지 여부", "자주 바뀌는 안내 문구"], "answer": 2, "explain": "기기에만 의미가 있는 값(본 여부·연출 속도)은 기기에 둔다. 클라이언트가 둘 이상이거나 보상이 붙거나 자주 바뀌는 규칙은 서버 한 곳이 맞다."}, {"id": "q2", "type": "spot", "section": "패턴", "situation": "판정을 서버로 옮긴 엔드포인트다. '기준일' 원칙을 어겨 배포 서버(UTC)에서 자정~오전 9시 사이 하루가 밀리는 줄을 고르세요.", "code": "@router.get(\"/battle\")\ndef battle(user=Depends(current_user)):\n    day = datetime.utcnow().date().isoformat()\n    logs = read_logs(user.id)\n    return compute_battle(logs, day)", "answer_lines": [3], "explain": "기준일은 클라이언트가 보낸다(`?day=YYYY-MM-DD`). 서버 시각대와 사용자 시각대가 다르면 '오늘'이 어긋난다. 계산 함수 자체는 순수 함수로 두고 엔드포인트는 재료만 모아 넘긴다."}, {"id": "q3", "type": "choice", "section": "함정", "situation": "'그날의 몬스터 = 날짜 해시로 고른 풀 항목'으로 매번 다시 계산하는 구조에서, 고르는 규칙을 '직업 우선'으로 바꿨다. 무엇이 일어나나?", "options": ["오늘부터만 새 규칙이 적용된다", "지난날 판정까지 바뀐다(격파가 보스로 바뀌는 등)", "서버가 오류를 낸다", "클라이언트 캐시 때문에 아무 변화가 없다"], "answer": 1, "explain": "매번 다시 계산하는 구조라 규칙이 바뀌면 과거 결과도 바뀐다. 과거를 고정하려면 그날 고른 것을 저장해야 하므로, 바꾸기 전에 감수할지 정한다."}, {"id": "q4", "type": "scenario", "section": "함정", "situation": "웹 첫 화면이 느려서 팀원이 '판정 규칙을 웹에도 복사해서 바로 계산하자'고 한다. 어떻게 답할지 쓰세요.", "rubric": ["클라이언트에 규칙 복사본을 두면 두 벌이 되어 원점으로 돌아간다고 짚었다", "빠르게 보이려면 서버 결과를 캐시한다고 대안을 썼다", "판정 요청이 실패해도 그 줄만 숨기고 나머지 화면은 쓰게 한다고 썼다"], "explain": "한 번 서버로 옮긴 규칙을 클라이언트에 다시 들이면 같은 계정인데 앱과 웹이 다른 값을 보여 주는 문제가 돌아온다."}]}, "다중클래스_유사블록_반복치환_경계혼동_함정": {"rule_id": "다중클래스_유사블록_반복치환_경계혼동_함정", "questions": [{"id": "q1", "type": "choice", "section": "함정", "situation": "Dart 파일 하나에서 GestureDetector 두 곳을 InkWell로 바꿨다. 괄호 개수는 맞는데 컴파일 오류가 수백 줄 떨어진 곳에서 난다. 가장 그럴듯한 원인은?", "options": ["InkWell import 누락", "닫는 괄호를 다른 클래스의 비슷한 블록 끝에 잘못 추가했다", "Dart 포매터 버그", "두 위젯의 매개변수 이름이 다르다"], "answer": 1, "explain": "모양이 비슷한 두 블록이 서로 다른 클래스에 있으면 '같은 함수 안'이라고 착각하기 쉽다. 괄호 개수가 맞아 문법적으로 유효해 보일 수 있어 원인 위치가 멀리 떨어진다. 들여쓰기로 스코프를 정하는 Python은 이 함정에서 자유롭다."}, {"id": "q2", "type": "choice", "section": "해법", "situation": "같은 파일의 비슷한 블록 여러 곳을 순서대로 고칠 계획이다. 실수를 바로 직전 편집으로 좁히는 습관은?", "options": ["전부 고친 뒤 프로젝트 전체 분석을 한 번 돌린다", "편집 하나를 끝낼 때마다 그 파일만 즉시 분석(flutter analyze 파일 등)한다", "커밋한 뒤 CI 결과를 본다", "모든 블록을 한 번에 정규식으로 치환한다"], "answer": 1, "explain": "파일 단위 즉시 분석으로 실수가 다음 블록 전에 드러난다. 시작 전에 grep -n \"^class \"로 클래스 경계를 나열해 두고, 편집 줄이 어느 경계 안인지 확인한다."}, {"id": "q3", "type": "scenario", "section": "해법", "situation": "괄호가 엉뚱한 곳에 들어간 것을 발견했다. 어떻게 찾고 고칠지 쓰세요.", "rubric": ["괄호 개수를 처음부터 다시 세는 대신 최근에 편집한 두 블록의 diff를 나란히 본다고 썼다", "grep으로 클래스 경계를 다시 확인해 잘못 간 괄호가 어느 클래스에 있는지 찾는다고 썼다", "올바른 위치로 옮긴 뒤 그 파일을 다시 분석해 확인한다고 썼다"], "explain": "원인은 대부분 가장 최근에 편집한 두 블록 중 하나에 있다."}]}, "데이터이전_검증_부분문자열존재확인_거짓통과_원본삭제전_양방향대조_패턴": {"rule_id": "데이터이전_검증_부분문자열존재확인_거짓통과_원본삭제전_양방향대조_패턴", "questions": [{"id": "q1", "type": "spot", "section": "함정 1 — 부분문자열 존재 확인(`Contains`)은 짧은 값을 전부 통과시킨다", "situation": "평문 파일의 비밀값을 암호화 저장소로 옮긴 뒤 검증하는 PowerShell이다. 한 글자로 잘린 값도 '일치'로 통과시키는 줄을 고르세요.", "code": "$source = Get-Content $srcFile -Raw\n$report = foreach ($item in $migrated) {\n    $ok = $source.Contains($item.Value)\n    [pscustomobject]@{ Name = $item.Name; Ok = $ok; Len = $item.Value.Length }\n}\n$report | Format-Table Name, Ok, Len", "answer_lines": [3], "explain": "'원본 어딘가에 이 문자열이 있는가'는 짧은 값을 거의 다 통과시킨다. 구분자 뒤 전체 값으로 후보 집합을 만들어 완전 일치만 인정하고, 길이 하한을 같이 본다. 6번 줄의 길이 표는 한 글자 버그를 싸게 드러내는 좋은 장치다."}, {"id": "q2", "type": "choice", "section": "함정 2 — 정방향 대조만으로는 \"원본에 있지만 옮기지 않은 값\"을 못 찾는다", "situation": "새 저장소의 모든 값이 원본에 있는지(정방향) 확인했고 전부 일치했다. 그래도 원본을 지우기 전에 해야 하는 것은?", "options": ["같은 정방향 대조를 한 번 더 돌린다", "원본에서 비밀처럼 보이는 토큰을 뽑아 새 저장소에 없는 것을 센다(역방향) — 값 대신 파일:줄 (길이)만 출력", "원본 파일 크기만 비교한다", "저장소 항목 수만 센다"], "answer": 1, "explain": "정방향은 '파서가 놓친 원본 항목'을 영영 모른다. 역방향은 오탐을 허용하되 누락 의심이 0이 될 때까지 사람이 본다. 의심 건은 값 대신 모양(가가 = aaaa99!)과 라벨로 정체를 가린다."}, {"id": "q3", "type": "choice", "section": "함정 3 — 원본은 읽은 뒤에도 바뀐다 (사용자가 같은 파일을 계속 편집 중일 수 있다)", "situation": "대조를 마친 뒤 원본 파일을 지우려 한다. 마지막으로 꼭 넣어야 하는 안전장치는?", "options": ["삭제 후 휴지통을 비운다", "대조 시점의 LastWriteTime을 기록해 두었다가 삭제 순간에 다시 비교하고, 하나라도 다르면 전부 보류한다", "삭제를 밤에 한다", "원본을 다른 이름으로 바꾼 뒤 지운다"], "answer": 1, "explain": "사용자가 같은 파일을 계속 편집 중일 수 있다. 실측에서 첫 읽기 이후 원본에 새 값이 두 줄 추가됐고, 역방향 대조와 수정 시각 가드가 없었다면 삭제와 함께 사라졌다."}, {"id": "q4", "type": "scenario", "section": "순서 — 원본을 지우기까지", "situation": "AI가 이전 작업을 마치고 '14개 모두 원본과 일치했습니다. 원본을 지울까요?'라고 보고했다. 사용자로서 승인 전에 무엇을 확인해야 하는지 쓰세요.", "rubric": ["어떤 검증으로 일치를 봤는지(길이 하한? 완전 일치? 양방향?) 함께 보고하라고 요구했다", "마스터 비밀번호가 필요한 대조는 사용자가 직접 실행하는 읽기 전용 스크립트로 한다고 썼다", "삭제는 명시적 승인과 수정 시각 가드를 통과할 때만 하고, 중간 평문 사본도 별도로 지운다고 썼다"], "explain": "약한 검증의 '전부 일치'는 원본 삭제 결정의 근거가 되므로 가장 위험하다. 실측에서 '14개 일치' 보고 중 3개가 한 글자로 저장돼 있었다."}]}, "동시요청_인증복구_가입중복_단일실행_세션번호_패턴": {"rule_id": "동시요청_인증복구_가입중복_단일실행_세션번호_패턴", "questions": [{"id": "q1", "type": "choice", "section": "2. 고치는 법", "situation": "늦게 도착한 401이 이미 끝난 복구를 다시 시작하지 않게 '세션 번호'를 둔다. 이 번호는 언제 올려야 하나?", "options": ["옛 토큰을 지울 때", "새 세션(토큰)을 저장할 때만", "요청을 보낼 때마다", "401을 받을 때마다"], "answer": 1, "explain": "옛 토큰을 지울 때 올리면, 가입이 아직 진행 중일 때 도착한 거절이 '이미 바뀌었다'로 보고 토큰 없이 재시도해 또 거절받는다. 지운 상태는 '바뀐 세션'이 아니라 '복구 중'이다. 예외는 재로그인이 필요한 사용자 경로뿐이다."}, {"id": "q2", "type": "spot", "section": "2. 고치는 법", "situation": "동시 401을 한 번만 복구하려는 Dart 코드다. 실기기에서 '401 두 번 뒤 실패'를 만드는 줄을 고르세요.", "code": "Future<void> _recover() {\n  _token = null;\n  _session++;\n  return _recovering ??= _doRecover()\n      .whenComplete(() => _recovering = null);\n}", "answer_lines": [3], "explain": "토큰을 지우는 시점에 세션 번호를 올리면, 가입 응답을 기다리는 동안 도착한 다른 요청의 거절이 '세션이 바뀌었다'고 판단해 토큰 없이 다시 보내진다. 번호는 `_doRecover` 안에서 새 세션을 저장할 때 올린다."}, {"id": "q3", "type": "choice", "section": "1. 실측 (RVS_App 2026-10-31)", "situation": "시작 요청 4개를 동시에 보내게 바꾼 다음 날, 인증을 켠 서버에서 첫 실행에 같은 초에 계정 4개가 생겼다. 토큰 갱신은 이미 한 번으로 묶여 있었다. 원인은?", "options": ["서버가 같은 기기의 중복 가입을 막지 않아서", "기기 가입이라는 다른 복구 경로에는 '한 번만 실행' 장치가 없어서", "토큰 만료 시간이 너무 짧아서", "Future.wait가 요청을 순서대로 보내서"], "answer": 1, "explain": "토큰 갱신만 공유 Future로 묶고 무계정 기기 가입 경로는 빠져 있었다. 개발 서버는 무인증 스위치로 돌아 이 경로를 한 번도 지나지 않았고, 인증 켠 사본으로 실기기를 돌려서야 보였다."}, {"id": "q4", "type": "scenario", "section": "3. 시험 — 즉시 응답하는 가짜 서버로는 틈이 안 보인다", "situation": "고친 복구 로직을 시험하려 한다. 가짜 HTTP가 바로 답하는 목(mock)으로 '동시 4개 거절 → 가입 1번'을 확인했고 통과했다. 이걸로 충분하지 않은 이유와 추가할 시험을 쓰세요.", "rubric": ["즉시 응답하면 거절이 복구 시작 전에 다 도착해 '복구 중에 도착한 거절' 틈을 못 잡는다고 썼다", "Completer 등으로 가입 응답을 붙잡아 둔 동안 다른 요청의 거절을 풀어 주는 시험을 넣었다", "가입이 끝난 뒤에 옛 거절이 도착하는 경우(가입 없이 재시도로 성공)를 넣었다", "각 시험이 수정 전 코드에서 실제로 실패하는지 확인한다고 썼다"], "explain": "응답 시점을 손으로 잡아야 경쟁 상태가 재현된다. 수정 전 코드에서 실패하지 않는 시험은 버그를 잡는 시험이 아니다."}]}, "문서_전역화_프로젝트특정_잔재_함정": {"rule_id": "문서_전역화_프로젝트특정_잔재_함정", "questions": [{"id": "q1", "type": "choice", "section": "원인", "situation": "프로젝트 전용 규칙 문서를 '범용'으로 승격했는데, 본문에 원래 프로젝트의 빌드 명령과 폴더 경로가 규칙처럼 남았다. 이런 일이 생기는 이유는?", "options": ["승격 도구가 본문을 자동 수정하지 않아서", "'일반화할 가치가 있다'는 판단만 하고 '문장 단위까지 일반화됐는가'의 확인은 하지 않아서", "범용 문서는 원래 예시가 필요해서", "원래 프로젝트가 삭제돼서"], "answer": 1, "explain": "두 작업은 다르다. 취지와 구조만 보고 승격하면 본문 문장 하나하나가 원래 프로젝트를 전제로 쓰인 채 남는다."}, {"id": "q2", "type": "choice", "section": "체크리스트 (문서를 전역/공용 스코프로 승격하거나, 승격된 문서를 나중에 감사할 때)", "situation": "승격한 문서가 'OO 비교분석.md 참고'라고 적고 있는데, 그 문서는 원래 프로젝트에만 있다. 맞는 처리는?", "options": ["그대로 둔다 — 필요한 사람은 찾아갈 것이다", "조건부 문구('해당 프로젝트에 그런 문서가 있다면')로 바꾸거나 제거한다", "그 문서를 모든 프로젝트에 복사한다", "링크를 절대 경로로 바꾼다"], "answer": 1, "explain": "승격된 스코프 어디서나 존재하는 것인지, 기원 프로젝트에만 있는 것인지 구분한다. 후자를 그대로 두면 다른 맥락에서 존재하지 않는 파일을 찾게 된다."}, {"id": "q3", "type": "scenario", "section": "체크리스트 (문서를 전역/공용 스코프로 승격하거나, 승격된 문서를 나중에 감사할 때)", "situation": "프로젝트 전용 작업 규칙을 전 프로젝트 공용으로 승격하려 한다. 승격 전에 문서를 어떻게 점검할지 쓰세요.", "rubric": ["고유명사(프로젝트·앱·폴더명)를 훑어 예시인지 규칙 자체인지 구분한다고 썼다", "특정 스택 전용 명령이 유일한 지시처럼 쓰였으면 '실제 스택 명령으로 치환' 형태로 바꾼다고 썼다", "참조 문서·경로가 공용 범위 어디서나 존재하는지 확인한다고 썼다", "온보딩 전용 문구('루트를 모르면 질문하라' 등)가 매번 반복 실행되게 남지 않았는지 본다고 썼다"], "explain": "실측에서 규칙 문서 4개 중 3개가 각자 다른 형태로 이 잔재를 갖고 있었다 — 전역화 때 항상 누락되는 지점이다."}]}, "백엔드_필드추가_클라이언트_소비누락_감사_패턴": {"rule_id": "백엔드_필드추가_클라이언트_소비누락_감사_패턴", "questions": [{"id": "q1", "type": "choice", "section": "왜 조용히 묻히는가", "situation": "서버가 응답에 `streak_days`를 추가한 지 3주가 됐다. 클라이언트에는 아무 에러도 없고 타입체커도 조용하다. 이 상태가 오래 숨는 이유로 맞는 것은?", "options": ["서버가 필드를 보내지 않아서", "느슨한 JSON 파싱은 안 읽는 필드를 그냥 버려 에러가 없고, 타입체커는 서버 스키마와 클라이언트 모델을 같이 보지 못해서", "클라이언트가 캐시된 응답만 써서", "필드 이름이 너무 길어서"], "answer": 1, "explain": "양쪽을 다 아는 계약 검증 단계가 없으면 '서버는 보내는데 아무도 안 읽는' 상태가 몇 주씩 이어진다. 기능이 '구현 중'으로 잘못 표시된 채 방치되기 쉽다."}, {"id": "q2", "type": "choice", "section": "감사 방법", "situation": "최근 서버가 추가한 필드가 클라이언트에서 실제로 쓰이는지 확인하려 한다. 가장 먼저 할 일로 맞는 순서는?", "options": ["클라이언트 UI를 열어 눈으로 확인 → 끝", "서버 직렬화 코드·결정이력에서 추가된 필드를 특정 → 그 이름으로 클라이언트 전체 grep → 0건이면 미배선 확정", "클라이언트 모델에 필드를 일단 추가 → 서버 확인", "OpenAPI 코드젠을 도입"], "answer": 1, "explain": "필드를 먼저 특정하고 이름으로 grep하면 결과가 즉시 나온다. 0건이면 보내기 시작한 순간부터 아무도 안 읽었다는 뜻이다. 배선은 이미 검증된 필드 옆에 나란히 붙인다."}, {"id": "q3", "type": "spot", "section": "실측 후속 (poker_app, 2026-09-19~21) — \"클라이언트 배선\"을 끝내도 서버 안쪽 소비 지점이 남는다 (3층)", "situation": "서버가 퍼크(perks)를 저장하고 결정 함수에 perks 인자까지 만들었다. 그런데 실전 효과가 없다. 이 '3층' 누락이 있는 호출 줄을 고르세요.", "code": "def decide(state, perks=()):\n    ...\n\ndef run_live_match(state, player):\n    perks = load_perks(player.id)\n    return decide(state, perks=perks)\n\ndef run_background_sim(state, player):\n    return decide(state)", "answer_lines": [9], "explain": "정의와 일부 호출부에는 perks가 있지만 배경 시뮬레이션 호출부는 넘기지 않는다. 감사는 인자 이름으로 grep해 '호출 4곳 중 몇 곳이 넘기는가'를 보고, 시험은 결과 값이 아니라 인자 전달을 확인한다."}, {"id": "q4", "type": "scenario", "section": "반대 방향 — 서버가 필드 전송을 멈춘 뒤에도 클라이언트가 계속 읽는다 (RVS_App, 2026-11-11)", "situation": "설계를 바꿔 서버가 응답에서 `shared` 필드를 더는 보내지 않는다. 클라이언트 쪽에서 같이 처리해야 할 것과 그 이유를 쓰세요.", "rubric": ["필드를 읽는 모델 코드, 그리는 화면 코드, 그 값을 넣어 주는 시험 픽스처 세 곳을 grep한다고 썼다", "모델·표시·시험·픽스처를 한 번에 같이 지운다고 썼다", "시험의 가짜 응답이 옛 필드를 실어 주면 죽은 코드가 '검증된 기능'처럼 보인다고 짚었다"], "explain": "옵션 필드라 컴파일·실행·시험 모두 멀쩡해서 죽은 코드가 오래 남는다. 시험만 남기면 사라진 기능을 계속 보증하게 된다."}]}, "사용자입력양식_1파일1항목_스키마검증_부분수용_가져오기_패턴": {"rule_id": "사용자입력양식_1파일1항목_스키마검증_부분수용_가져오기_패턴", "questions": [{"id": "q1", "type": "choice", "section": "1. 한 파일에 여러 칸 vs 파일 1개당 1항목", "situation": "여러 계정을 파일로 한꺼번에 등록받는다. '한 파일 여러 칸' 대신 '파일 1개당 1항목'을 권하는 가장 큰 이유는?", "options": ["파일을 여는 횟수가 줄어든다", "틀린 파일만 빠지고 나머지는 등록되며, 오류 위치가 파일 이름으로 바로 드러난다", "JSON 문법이 더 단순해진다", "가져오기 속도가 빨라진다"], "answer": 1, "explain": "한 파일 여러 칸은 한 칸이 틀리면 파일 전체가 보류된다. 여러 개를 한 번에 쓰는 편의는 'template 5'처럼 양식을 개수만큼 한꺼번에 만들어 보완한다."}, {"id": "q2", "type": "spot", "section": "3. 가져오기 — 파일 상태를 4가지로 분류", "situation": "가져오기 폴더의 JSON을 분류하는 함수다. 다른 용도의 JSON이나 옛 버전 양식을 빨간 오류로 보여 주게 만드는 줄을 고르세요.", "code": "def classify(doc):\n    if doc.get(\"schema\") != \"vault-entry/1\":\n        return \"error\"\n    if all(v == \"\" for k, v in doc.items() if k not in (\"schema\", \"_help\")):\n        return \"blank\"\n    return \"ok\" if validate(doc) else \"error\"", "answer_lines": [3], "explain": "schema가 없거나 다른 JSON은 foreign으로 '양식이 아니라 건너뜀' 안내만 한다. error는 schema가 일치하는데 검증에 실패했거나 JSON 문법이 깨진 경우에만 쓰고, 파일 이름과 사유를 함께 보여 준다."}, {"id": "q3", "type": "choice", "section": "3. 가져오기 — 파일 상태를 4가지로 분류", "situation": "양식에 'password' 키(허용 키는 pw)를 쓰고 비밀번호를 따옴표 없는 숫자로 적었다. 맞는 처리는?", "options": ["모르는 키는 무시하고 나머지로 등록한다", "그 파일을 error로 제외하고, 알 수 없는 키(허용 키 목록과 함께)와 '따옴표로 감싼 문자열이어야 함'을 사유로 보여 준다", "숫자를 문자열로 바꿔 등록한다", "폴더 전체 가져오기를 중단한다"], "answer": 1, "explain": "라벨 오타를 조용히 무시하면 값이 사라진다. 파일 안에서는 전부 아니면 전무, 파일 사이에서는 부분 수용이다."}, {"id": "q4", "type": "scenario", "section": "4. 저장 전·후 안전장치", "situation": "가져오기에서 저장 직전과 직후에 둘 안전장치를 쓰세요.", "rubric": ["신규·덮어쓰기 개수와 항목별 출처 파일을 미리보기로 보여 주고, yes가 아니면 아무것도 저장하지 않는다고 썼다", "서로 다른 파일에 같은 이름이 있으면 어느 쪽이 이길지 추측하지 않고 전체 거부한다고 썼다", "저장 후 다시 읽어 양식과 같은지 검증하고, 실패하면 양식 파일을 건드리지 않는다고 썼다", "평문 양식 원본 삭제는 한 번 더 yes로 묻고, 기본값은 유지라고 썼다"], "explain": "저장 전 확인과 저장 후 재검증이 함께 있어야 평문 원본을 지워도 안전하다. 취소했을 때 목록이 그대로인지도 테스트로 확인한다."}]}, "사용자피드백_예측확률_보정루프_입력정화_사후평균_동의연동_패턴": {"rule_id": "사용자피드백_예측확률_보정루프_입력정화_사후평균_동의연동_패턴", "questions": [{"id": "q1", "type": "choice", "section": "1. 입력부터 정화한다 (보정 공식보다 먼저)", "situation": "'예측한 대로 행동했나요?' 스위치가 기본 켜짐이다. 이 질문이 보정 데이터에 미치는 영향은?", "options": ["영향 없다 — 사용자가 필요하면 끈다", "안 건드린 사용자가 전부 '그대로 했음'으로 쌓여 데이터가 오염된다 — 기본값 없는 선택으로 바꾸고 안 고르면 저장하지 않는다", "응답률이 올라가 데이터 품질이 좋아진다", "스위치 대신 자유 입력으로 바꾸면 해결된다"], "answer": 1, "explain": "보정 공식보다 입력이 먼저 망가져 있는 경우가 많다. '원래대로'라는 응답도 버리지 말고 따로 둔다."}, {"id": "q2", "type": "choice", "section": "1. 입력부터 정화한다 (보정 공식보다 먼저)", "situation": "실제 결과 글을 키워드·임베딩으로 예측 후보와 자동 대조해 적중을 판정할 수 있다. 이 판정을 어떻게 써야 하나?", "options": ["자동 판정을 그대로 학습 라벨로 쓴다", "사용자가 '예측 N개 + 예측에 없던 결과' 중 직접 고르게 하고, 자동 판정은 '추천' 표시만 한다(미리 선택해 두지 않는다)", "자동 판정을 미리 선택해 두고 사용자가 바꿀 수 있게 한다", "자동 판정과 사용자 선택의 평균을 쓴다"], "answer": 1, "explain": "자동 판정은 그대로 학습 라벨이 되므로 틀린 판정이 보정에 들어간다. 미리 선택해 두면 그냥 넘겨서 자동 판정과 같아진다. 출처(user/keyword)를 기록하면 추천과 선택의 일치율도 잴 수 있다."}, {"id": "q3", "type": "spot", "section": "2. 보정은 사후 평균, 원본은 그대로 두고 읽을 때 덧씌운다", "situation": "보정 확률 = (원래 확률 × k + 실제로 된 수) ÷ (k + 기록 수)를 구현했다. 공식과 다르게 계산하는 줄을 고르세요.", "code": "def calibrated(p, hits, total, k=20, min_n=5):\n    if total < min_n:\n        return p\n    return (p * total + hits) / (k + total)", "answer_lines": [4], "explain": "원래 확률에 곱하는 것은 기록 수가 아니라 k(원래 확률을 기록 몇 건만큼 믿을지)다. k=20이면 기록 20건일 때 원래와 실제가 반반이 된다. 최소 건수 미만이면 원래 그대로 두는 2~3번 줄은 맞다."}, {"id": "q4", "type": "choice", "section": "4. 다른 사용자 기록을 쓰는 순간, 동의와 안내를 동작과 일치시킨다", "situation": "학습 동의 설정을 먼저 만들 때 안내는 '지금은 아무 곳에도 쓰이지 않아요', API 플래그는 in_use: false였다. 이제 동의자 기록으로 보정을 시작한다. 맞는 것은?", "options": ["보정 코드만 먼저 배포하고 안내는 다음 작업에서 고친다", "동의를 실제로 쓰는 커밋에 안내 문구·플래그·테스트를 함께 넣는다", "안내는 그대로 두어도 된다 — 집계만 쓰기 때문이다", "동의 설정을 없애고 모두의 기록을 쓴다"], "answer": 1, "explain": "따로 고치면 그 사이 거짓 안내가 된다(실측: 보정 커밋이 먼저 푸시되고 다음 작업에서 발견). 집계만 써도 남의 기록으로 내 확률이 바뀌므로 동의자 기록만 재료로 쓴다."}, {"id": "q5", "type": "choice", "section": "7. 사용자 사이로 넓힐 때 — 복사해 올리지 말고 동의한 사용자의 기록에서 매주 계산한다 (RVS 2026-11-11)", "situation": "사용자들이 쌓은 결과를 공유 풀로 만들려 한다. 결과 글을 공유 표에 복사해 올리는 대신 '동의한 사용자의 기록에서 주기적으로 계산'하는 장점은?", "options": ["계산이 더 빠르다", "동의 철회는 다음 계산부터 빠지고 계정 삭제는 기록과 함께 사라져, 철회·삭제 처리 코드가 필요 없고 공유 표에 사용자 글이 남지 않는다", "사용자 글을 일반화하는 규칙을 더 정교하게 만들 수 있다", "동의 전 기록은 자동으로 제외된다"], "answer": 1, "explain": "복사하면 같은 정보가 두 곳에 생겨 철회·삭제마다 연결 끊기와 삭제 훅이 필요하다. 동의 여부로 판단하면 동의 전에 적은 기록도 포함되므로 안내 문구에 그 사실을 밝힌다."}]}, "서버거절규칙_롤아웃_앱먼저_시즌경계_튜닝값비저장_원칙": {"rule_id": "서버거절규칙_롤아웃_앱먼저_시즌경계_튜닝값비저장_원칙", "questions": [{"id": "q1", "type": "choice", "section": "1. 앱을 먼저 배포하고, 규칙 플래그는 그 뒤에 켠다", "situation": "서버에 '이 행동은 이제 안 된다'는 새 거절 규칙을 플래그로 넣었다. 맞는 배포 순서는?", "options": ["서버 플래그를 먼저 켜고 앱을 나중에 배포한다", "새 필드를 이해하고 버튼을 막는 앱 배포 → 업데이트할 시간 → 규칙 플래그 ON", "앱과 서버 플래그를 같은 시각에 동시에 바꾼다", "순서는 상관없다 — 응답 필드 추가와 같다"], "answer": 1, "explain": "응답에 새 필드를 내리는 것은 모르는 클라이언트가 무시하면 끝이지만, 거절 규칙은 옛 앱에 '버튼은 눌리는데 오류가 나는 앱'으로 보인다."}, {"id": "q2", "type": "choice", "section": "2. 누적형 랭킹이 있는 콘텐츠는 플래그를 시즌 경계에서만 바꾼다", "situation": "시즌 누적 피해로 순위를 매기는 보스전에 새 규칙 플래그를 켜려 한다. 언제 켜야 하나?", "options": ["진행 중인 판이 없을 때면 시즌 중간이라도 바로", "시즌 리셋 직후 — 켜기 전 DB 스냅샷, 진행 중 세션이 없는 시간대", "사용자가 가장 많은 시간대", "다음 앱 업데이트와 같은 날"], "answer": 1, "explain": "판 단위 모드 고정으로 진행 중인 판은 안전하지만, 시즌 중간에 바꾸면 같은 시즌의 앞 판과 뒤 판 난이도가 달라 순위가 불공정해진다. 같은 플래그를 쓰는 다른 경로(자동 NPC 대전 등)도 함께 바뀐다."}, {"id": "q3", "type": "choice", "section": "3. 튜닝 값은 코드 상수로, 저장하는 건 \"진행 결과\"뿐", "situation": "다음 중 DB에 저장해야 하는 것은?", "options": ["기믹 배정표", "난이도 구간 경계값", "랜덤으로 굴린 보스 구성(재굴림하면 안 되는 것)", "피해 배율"], "answer": 2, "explain": "튜닝 값을 DB에 넣는 순간 마이그레이션 대상이 된다. 코드 상수면 바꿔도 마이그레이션이 없다. 저장할 것은 플레이어의 진행 결과뿐이다."}, {"id": "q4", "type": "spot", "section": "4. 저장되는 식별자는 이름을 바꾸지 않는다", "situation": "효과 id 이름을 정리하는 커밋이다. 이미 저장된 구성에서 '있던 효과가 조용히 사라지게' 만드는 줄을 고르세요.", "code": "EFFECTS = {\n    \"armor_break\": ArmorBreak(power=0.3),\n    \"rage_v2\": Rage(power=1.5),\n    \"slow\": Slow(power=0.2),\n}", "answer_lines": [3], "explain": "저장된 구성에는 옛 id 'rage'가 들어 있다. id를 바꾸면 가리킬 곳이 없어지고, 모르는 id를 무시하는 코드라면 깨지지 않은 채 효과만 사라진다. 이름을 바꿔야 하면 옛 id → 새 id 별칭 표를 둔다. 수치(power)만 바꾸는 것은 자유다."}]}, "서브에이전트_보고사실_실행전_재검증_패턴": {"rule_id": "서브에이전트_보고사실_실행전_재검증_패턴", "questions": [{"id": "q1", "type": "choice", "section": "해법", "situation": "서브에이전트 조사 리포트에 '파일 A는 이미 쓰이고 있다'와 '에셋 B는 어디서도 참조되지 않는다'가 있다. 실행 직전 재검증을 우선해야 하는 것은?", "options": ["A — 긍정 명제가 더 틀리기 쉽다", "B — '없다'는 부정 명제는 grep 패턴 하나만 놓쳐도 그냥 성립해 버린다", "둘 다 재검증할 필요 없다 — 조사 전용 에이전트라 신뢰도가 높다", "리포트 전체를 처음부터 다시 조사한다"], "answer": 1, "explain": "부정 명제는 검색 누락에 약하다. 리포트 전체를 다시 조사하라는 게 아니라, 그 결론 위에 파일을 만들거나 지우는 단계에서만 값싸게 한 번 더 확인한다."}, {"id": "q2", "type": "choice", "section": "실측 사례 (poker_app, ADR-121/125, 2026-09-14)", "situation": "fork 서브에이전트가 'Lottie 에셋 4개 전부 미사용(grep 0건)'이라고 보고했다. 그 에셋을 쓰는 코드를 새로 쓰기 전에 사용처를 직접 grep했더니 하나는 스플래시 화면이 오래전부터 쓰고 있었다. 이 결과를 어떻게 처리해야 하나?", "options": ["조용히 3개만 진행한다", "실제 미사용 3개만 진행하고, 결정이력·커밋에 '리포트가 이 부분은 틀렸었다'고 남긴다", "리포트를 믿고 4개 모두 새로 소비하는 코드를 쓴다", "서브에이전트를 다시 돌려 4개 모두 다시 조사시킨다"], "answer": 1, "explain": "틀린 보고를 기록해 두어야 그 서브에이전트를 다음에 얼마나 믿을지 근거가 쌓인다. 재검증 덕분에 이미 쓰이는 에셋을 중복으로 소비하는 코드를 피했다."}, {"id": "q3", "type": "scenario", "section": "문제", "situation": "AI 세션이 '정리' 작업을 서브에이전트 조사 결과대로 진행하려 한다. 리포트에는 '이 함수 7개는 아무도 호출하지 않는다'고 확신에 찬 톤으로 적혀 있다. 삭제 전에 무엇을 확인하고 왜 그런지 쓰세요.", "rubric": ["서브에이전트도 같은 모델이 grep·읽기 몇 번으로 낸 결론이라 검색 누락·오독이 있을 수 있다고 짚었다", "실제 참조가 다른 표기·다른 확장자·주석·동적 호출에 있을 수 있다고 썼다", "삭제 직전에 각 함수 이름을 직접 다시 검색해 확인한다고 썼다"], "explain": "리포트의 확신에 찬 톤은 개별 사실의 정확도를 보장하지 않는다. 되돌리기 어려운 행동(삭제)의 전제가 되는 사실일수록 직접 확인한다."}]}, "설정경로_환경변수_우선순위_폴백_패턴": {"rule_id": "설정경로_환경변수_우선순위_폴백_패턴", "questions": [{"id": "q1", "type": "spot", "section": "핵심 패턴", "situation": "여러 스크립트가 공유하는 설정 파일 경로를 정하는 함수다. 이 패턴의 원칙을 어기는 줄을 고르세요.", "code": "import os\nfrom pathlib import Path\n\ndef resolve_config_path() -> Path:\n    return Path(\n        os.environ.get(\"MY_CONFIG_PATH\")\n        or \"C:/Users/kim/Desktop/myapp/config.json\"\n    )", "answer_lines": [7], "explain": "폴백에 특정 사람의 개인 경로를 박으면 다른 사람·다른 PC에서 깨지고, 공개 저장소로 옮길 때 경로를 지우는 작업을 다시 해야 한다. `Path.home() / \".myapp\" / \"config.json\"`처럼 처음 받은 사람도 그럴듯하게 동작할 위치로 둔다."}, {"id": "q2", "type": "choice", "section": "실측 함정 2 (Windows) — 환경변수를 갱신해도 이미 떠 있는 프로세스엔 반영 안 됨", "situation": "PowerShell에서 `[System.Environment]::SetEnvironmentVariable(\"MY_CONFIG_PATH\", \"D:/cfg.json\", \"User\")`를 실행한 뒤, 이미 열려 있던 세션에서 os.environ을 읽었더니 옛 값이 나온다. 맞는 해석은?", "options": ["설정이 실패했다 — 관리자 권한이 필요하다", "정상 동작이다 — 레지스트리에 썼을 뿐이고, 새로 시작하는 프로세스부터 새 값을 본다", "Windows는 사용자 환경변수를 지원하지 않는다", "Python 캐시를 지우면 바로 보인다"], "answer": 1, "explain": "이미 떠 있는 프로세스는 대개 변경을 다시 읽지 않는다. 지금 확인하려면 새 프로세스를 띄우면서 env로 값을 명시해 주입한다."}, {"id": "q3", "type": "scenario", "section": "실측 함정 1 — 소비자 중 일부만 이 패턴을 적용하면 조용히 드리프트난다", "situation": "앱 본체는 환경변수 우선 + 폴백으로 바꿨고, 같은 설정 파일을 읽는 훅 스크립트 2개는 아직 경로가 하드코딩돼 있다. 설정 파일을 다른 곳으로 옮길 계획이다. 무엇이 일어나고, 어떻게 해야 하는지 쓰세요.", "rubric": ["훅 2개가 에러 없이 옛 경로를 계속 봐서 조용히 동작을 멈춘다고 썼다", "이 설정을 읽는 모든 소비자를 먼저 찾아 같은 패턴으로 맞춘다고 썼다", "가능하면 resolve 함수를 한 곳에 두고 나머지가 재사용하게 한다고 썼다"], "explain": "소비자마다 따로 구현하면 기본 경로를 바꿀 때 한 곳만 놓쳐도 그곳만 stale로 남는다. 에러가 안 나서 발견이 늦다."}]}, "소비형_선충전_지갑_스토어결제_환불회수_패턴": {"rule_id": "소비형_선충전_지갑_스토어결제_환불회수_패턴", "questions": [{"id": "q1", "type": "choice", "section": "2. 소비 실패는 충전을 되돌리지 않는다", "situation": "스토어 결제를 서버가 확인해 지갑을 충전했는데, 그다음 스토어 소비(consume) 호출이 실패했다. 서버는 어떻게 응답해야 하나?", "options": ["충전을 취소하고 500을 돌려준다", "503으로 재시도를 요청한다. 다시 호출되면 같은 구매(ref)라 충전은 건너뛰고 소비만 다시 시도한다", "클라이언트에는 성공을 돌려주고 소비는 무시한다", "지갑에서 충전한 만큼 빼서 원래대로 돌린다"], "answer": 1, "explain": "충전은 구매 토큰 해시를 유일 키(ref)로 원장에 남겨 한 번만 반영되므로, 재시도가 안전하다. 충전을 되돌리면 돈은 나갔는데 횟수가 없는 상태가 생길 수 있다."}, {"id": "q2", "type": "spot", "section": "3. 차감은 낸 곳으로 돌려준다", "situation": "AI 호출이 실패해 차감한 단위를 돌려주는 코드다. 지갑에서 낸 몫과 무료로 낸 몫을 섞어 버리는 줄을 고르세요.", "code": "def refund(req):\n    from_wallet = wallet_units_of(req.id)  # 이 요청이 지갑에서 낸 단위\n    from_free = req.units - from_wallet\n    add_daily_free(req.user_id, req.units)\n    if from_wallet:\n        add_wallet(req.user_id, from_wallet)", "answer_lines": [4], "explain": "무료 몫은 from_free만큼만 돌려줘야 한다. req.units 전체를 무료에 더하면 지갑에서 낸 몫이 무료로도 한 번 더 돌아와 무료분이 늘어난다. 요청마다 지갑에서 낸 단위를 기억해 두는 이유가 이것이다."}, {"id": "q3", "type": "choice", "section": "4. 환불 회수 — 스토어가 정하고, 서버는 따라간다", "situation": "구매 30일 뒤에 스토어 환불 목록에 그 구매가 나타났다. 사용자는 이미 일부 횟수를 썼다. 서버는 어떻게 하나?", "options": ["약관상 7일이 지났으니 무시한다", "시점과 무관하게 거두되 잔액 0에서 멈추고, `void:<충전 ref>` 행을 남겨 한 번만 거둔다", "잔액을 음수로 만들어 다음 충전에서 상계한다", "계정을 정지한다"], "answer": 1, "explain": "환불 여부는 스토어가 정하므로 '며칠 이후 불가'는 서버 규칙이 아니라 운영 정책이다. 서버는 환불된 구매를 시점과 무관하게 거두되, 음수는 스키마 제약을 바꿔야 해서 0에서 멈춘다. 거둔 기록도 원장에 남겨 중복 회수를 막는다."}, {"id": "q4", "type": "scenario", "section": "1. 지갑은 서버가 채운다 — 클라이언트 토큰은 믿지 않는다", "situation": "설계 리뷰: 앱이 결제가 끝나면 `{\"purchased\": true, \"units\": 50}`을 서버로 보내고, 서버는 그 값대로 지갑을 충전한다. 무엇을 바꿔야 하는지 쓰세요.", "rubric": ["서버가 스토어에 직접 구매를 확인하고, 클라이언트는 구매 토큰만 보낸다고 썼다", "구매 토큰 해시를 유일 키(ref)로 원장에 남겨 같은 구매는 한 번만 반영한다고 썼다", "구매 토큰을 계정에 묶어 다른 계정이 같은 영수증을 쓰지 못하게(409) 한다고 썼다"], "explain": "클라이언트가 보낸 값은 조작될 수 있다. 서버 확인, 한 번만 반영, 계정 묶기의 세 가지가 함께 있어야 재시도·중복 호출·영수증 재사용이 모두 안전해진다."}]}, "실시계_만료판정_테스트_고정날짜_픽스처_시한폭탄_함정": {"rule_id": "실시계_만료판정_테스트_고정날짜_픽스처_시한폭탄_함정", "questions": [{"id": "q1", "type": "spot", "section": "실측 사례 (poker_app/server, 2026-09-29, ADR-193 후속)", "situation": "도전에 '응답 기한 2일, 지나면 자동 거절'을 넣었다. 기한 판정은 실제 시계(datetime.now)로 한다. 이 테스트 헬퍼에서 이틀 뒤 수락·거절 테스트를 일제히 깨뜨릴 줄을 고르세요.", "code": "def make_challenge(db, attacker, defender, age_hours=0):\n    return db.insert_challenge(\n        attacker=attacker,\n        defender=defender,\n        created_at=\"2026-09-28T00:00:00+00:00\",\n    )", "answer_lines": [5], "explain": "작성한 날에는 통과하지만 실제 날짜가 이틀을 넘기면 모든 도전이 '만료'로 판정된다. 코드는 그대로인데 달력 때문에 깨진다. `now - timedelta(hours=age_hours)`처럼 지금 기준 상대값으로 만든다."}, {"id": "q2", "type": "choice", "section": "패턴", "situation": "만료 기한(48시간) 경계를 시험하려 한다. 가장 맞는 픽스처 구성은?", "options": ["created_at을 오늘 날짜 리터럴로 하나만 둔다", "지금 기준 47시간 전과 49시간 전으로 경계 양쪽을 하나씩 만든다", "지금 기준 48시간 전 정확히 하나만 만든다", "1년 전 날짜로 만들어 확실히 만료되게 한다"], "answer": 1, "explain": "경계 테스트는 경계 양쪽(기한 −1시간/+1시간)으로 둔다. 상대값이라 언제 돌려도 같은 결과가 나오고, 정확히 경계 한 점만 두면 비교 연산자(>와 >=) 실수를 못 잡는다."}, {"id": "q3", "type": "choice", "section": "패턴", "situation": "다음 중 고정 날짜 리터럴을 픽스처에 그대로 둬도 안전한 경우는?", "options": ["쿨다운 판정이 datetime.now와 비교하는 경우", "'오늘' 출석 여부를 실제 날짜로 판정하는 경우", "저장된 시즌 표시 값끼리만 비교해 '현재와 다르기만 하면 되는' 경우", "구독 만료일을 실제 시계로 판정하는 경우"], "answer": 2, "explain": "판정이 실제 시계를 읽지 않고 저장된 값끼리 비교하면 날짜가 지나도 결과가 변하지 않는다(poker_app의 season_marker). 실제 시계를 읽는 판정이 끼면 상대값 픽스처나 시계 주입이 필요하다."}, {"id": "q4", "type": "scenario", "section": "패턴", "situation": "기존 기능에 '쿨다운 24시간'을 새로 넣으려 한다. 이 변경으로 다른 테스트가 며칠 뒤 깨지지 않게 하려면 코드를 고치기 전에 무엇을 하고, 어떻게 바꿀지 쓰세요.", "rubric": ["새 판정을 거치게 될 기존 테스트 픽스처의 날짜 리터럴을 먼저 찾는다고 썼다(예: grep으로 20xx- 패턴 검색)", "픽스처를 now - timedelta(...) 같은 지금 기준 상대값으로 바꾼다고 썼다", "가능하면 시계를 now= 인자로 주입하거나, 부담이 크면 상대값 픽스처로 충분하다고 썼다"], "explain": "실제 시계를 읽는 판정을 넣는 순간 기존 픽스처의 고정 날짜가 시한폭탄이 된다. 넣는 쪽이 먼저 찾아 바꾸는 것이 가장 싸다."}]}, "앱계산_배지_테마팩_해금_서버없는_게임화_패턴": {"rule_id": "앱계산_배지_테마팩_해금_서버없는_게임화_패턴", "questions": [{"id": "q1", "type": "choice", "section": "규칙", "situation": "기록 앱에 배지를 붙인다. 서버 스키마를 바꾸지 않는 설계에서 기기에 저장하는 것은?", "options": ["배지별 현재 값 집계 표", "고른 팩과 '이미 알려 준 배지' 집합뿐 — 배지 값은 매번 기록에서 센다", "모든 기록의 사본", "아무것도 저장하지 않는다"], "answer": 1, "explain": "집계 표를 두지 않으면 이중 계산·불일치가 없다. 기기를 바꾸면 '봤다' 집합만 사라져 알림이 한 번 더 뜬다."}, {"id": "q2", "type": "spot", "section": "규칙", "situation": "해금된 테마 팩 목록을 계산한다. 사용자가 기록을 지웠을 때 쓰던 스킨이 갑자기 잠기게 만드는 줄을 고르세요.", "code": "def unlocked_packs(records, seen, now):\n    earned = compute_badges(records, now)\n    opened = earned\n    return [p for p in PACKS if p.unlocked_by is None or p.unlocked_by in opened]", "answer_lines": [3], "explain": "해금은 '지금 계산된 획득 ∪ 저장된 봤다 집합'이어야 한다(opened = earned | seen). 한 번 연 해금은 다시 잠그지 않는다."}, {"id": "q3", "type": "choice", "section": "규칙", "situation": "기록 조회 API가 최근 200개만 돌려준다. 배지 목표로 맞지 않는 것은?", "options": ["역산 10번", "역산 50번", "역산 500번", "7일 연속 기록"], "answer": 2, "explain": "목표는 서버 목록 상한보다 작아야 한다. 앱이 볼 수 있는 기록이 200개뿐이면 500번은 영영 열리지 않는다."}, {"id": "q4", "type": "choice", "section": "규칙", "situation": "팩마다 손글씨 한글 글꼴을 넣으려 한다. 맞는 적용 범위는?", "options": ["본문까지 모두 바꾼다", "제목 글꼴만 바꾸고, Regular 하나만 넣어 굵기는 합성하며 8MB급 글꼴은 뺀다", "글꼴은 굵기별로 모두 넣는다", "배경 무늬도 이미지 파일로 넣는다"], "answer": 1, "explain": "본문까지 바꾸면 긴 글을 못 읽는다. 한글 글꼴은 개당 2~8MB라 OFL을 확인하고 2~3MB급으로 고른다. 배경 무늬는 이미지 대신 CustomPainter로 그려 용량 0에 다크 토큰을 따르게 한다."}]}, "운영값_덮어쓰기_파일_새키_누락_기본값추락_함정": {"rule_id": "운영값_덮어쓰기_파일_새키_누락_기본값추락_함정", "questions": [{"id": "q1", "type": "choice", "section": "원인", "situation": "rules.py의 한도 표 `{\"free\": 10, \"paid\": 50}`에 `\"guest\": 2`를 추가했다. 서비스 폴더의 rules_values.py는 같은 이름의 표를 통째로 교체한다. 조회는 `표.get(등급, 표[\"free\"])`다. 운영에서 guest는 몇 회를 받나?", "options": ["2회", "10회", "50회", "KeyError로 서버가 멈춘다"], "answer": 1, "explain": "교체된 표에는 guest 키가 없어서 get이 에러 없이 free 값(10)으로 떨어진다. 개발 폴더 시험은 운영 값 파일을 못 보니 통과한다."}, {"id": "q2", "type": "spot", "section": "원인", "situation": "등급별 한도를 조회하는 코드다. 빠진 키를 조용히 다른 값으로 바꿔 버리는 줄을 고르세요.", "code": "def daily_limit(tier: str) -> int:\n    table = rules.DAILY_LIMIT\n    if tier not in KNOWN_TIERS:\n        raise ValueError(tier)\n    return table.get(tier, table[\"free\"])", "answer_lines": [5], "explain": "알려진 등급인데도 표에 키가 없으면 free 값으로 폴백한다. 운영 값 파일에 새 키가 빠진 사실이 숨는다. `table[tier]`로 바로 실패하게 하거나, 운영 값을 얹은 상태에서 짝 테스트를 돌려야 드러난다."}, {"id": "q3", "type": "choice", "section": "지침", "situation": "운영 값 적용 함수가 rules.py에 없는 이름을 거부(AttributeError)하게 만들었다. 이것만으로 막지 못하는 실수는?", "options": ["운영 값 파일에 오타 난 상수 이름", "rules.py에서 지운 상수를 운영 파일이 계속 설정", "rules.py에 새로 만든 키를 운영 값 파일에 넣지 않은 것", "운영 값 파일의 문법 오류"], "answer": 2, "explain": "이름 거부는 오타·삭제를 잡지만 '빠진 키'는 못 잡는다. 그래서 짝 테스트(기본값 단언)를 운영 값을 얹은 상태에서도 돌리는 게이트가 필요하다."}, {"id": "q4", "type": "scenario", "section": "지침", "situation": "새 등급과 새 상수를 추가하는 작업을 승격(개발 → 서비스) 전에 마무리하려 한다. 작업 안에서와 승격 게이트에서 각각 무엇을 해야 하는지 쓰세요.", "rubric": ["같은 작업 안에서 운영 값 파일에도 새 키·상수를 넣는다고 썼다", "grep으로 새 이름이 constraints의 두 파일에 모두 있는지 확인한다고 썼다", "짝 테스트를 서비스 폴더(운영 값을 얹은 상태)에서 한 번 더 돌린다고 썼다", "새 등급 전용 테스트에 '운영 값에서 그 등급 값이 기본 등급과 달라야 함'을 단언한다고 썼다"], "explain": "개발 폴더 테스트가 운영 값을 못 본다는 것 자체가 맹점이다. 서비스 폴더에서 한 번 더 도는 단계가 이 사례를 실제로 잡았다."}]}, "인프라_실제용량_맞춤_설계_패턴": {"rule_id": "인프라_실제용량_맞춤_설계_패턴", "questions": [{"id": "q1", "type": "choice", "section": "원칙 — 스택을 정하기 전에 실제 배포 대상부터 확인한다", "situation": "2코어/8GB 홈서버에 새 서비스를 올리려 한다. 가장 먼저 할 일은?", "options": ["Postgres+Redis+MinIO+자체 인증으로 '정석' 스택을 먼저 확정한다", "그 서버의 실제 여유 CPU·메모리와 이미 떠 있는 서비스 수를 실측한다", "일단 클라우드에 올리고 나중에 홈서버로 옮긴다", "부하 테스트는 배포 후에 한다"], "answer": 1, "explain": "스택을 먼저 정하고 배포 환경을 나중에 맞추면 '이 서버에는 못 올린다'를 뒤늦게 깨닫고 되돌리게 된다. '이 정도면 되겠지'가 아니라 실측이 먼저다."}, {"id": "q2", "type": "choice", "section": "원칙 — 스택을 정하기 전에 실제 배포 대상부터 확인한다", "situation": "형제 프로젝트가 같은 서버에서 DB·인증·파일저장을 한 프로세스로 묶는 올인원 도구를 이미 쓰고 있다. 새 프로젝트의 선택으로 맞는 것은?", "options": ["같은 도구로 새 인스턴스를 하나 더 띄운다", "기존 인스턴스를 재사용하고 접두사 같은 네임스페이스로 구분한다", "새 프로젝트 전용으로 Postgres를 따로 띄운다", "다른 서버를 새로 마련한다"], "answer": 1, "explain": "그 환경에서 이미 돌아간다는 것 자체가 검증된 사실이다. 자원이 제한될수록 '일단 합쳐 두고 필요해지면 나눈다'가 더 싸다."}, {"id": "q3", "type": "scenario", "section": "재검토 트리거를 명시적으로 남긴다", "situation": "두 프로젝트가 인스턴스 하나를 공유하기로 결정했다. 결정 문서에 무엇을 남겨야 하는지 쓰세요.", "rubric": ["이 결정을 다시 열어 볼 구체적인 조건을 적는다고 썼다(예: 두 프로젝트의 실사용 트래픽이 모두 유의미하게 늘면 분리 재검토)", "'나중에 문제되면 보자'처럼 조건 없는 문구는 아무도 다시 열지 않는다는 점을 짚었다", "재검토 조건을 결정 자체와 같은 문서에 함께 기록한다고 썼다"], "explain": "언제 다시 열어 봐야 하는지 신호를 미리 정해 두는 것이 공유 결정을 안전하게 만드는 핵심이다."}, {"id": "q4", "type": "spot", "section": "여러 독립 서비스를 하나로 흡수할 때(반대 방향의 같은 원칙)", "situation": "별도 FastAPI 앱이던 notes 서비스를 메인 서버의 라우터로 흡수했다. 메인 앱은 이미 /health와 인증을 갖고 있다. 재감사해서 제거해야 할 줄을 고르세요.", "code": "router = APIRouter(prefix=\"/notes\")\nrouter.add_api_route(\"/health\", lambda: {\"ok\": True})\nrouter.add_api_route(\"/items\", list_items, dependencies=[Depends(main_auth)])\napp.include_router(router)", "answer_lines": [2], "explain": "흡수한 서비스의 자체 헬스체크·인증·루트 라우트 중 메인 앱이 이미 커버하는 것은 들고 오지 않는다. 중복이 남으면 나중에 어느 쪽이 진짜인지 헷갈린다. /items는 메인 인증(main_auth)을 쓰므로 그대로 둔다."}]}, "자동로드_문서_비대화_파일단위_이관_패턴": {"rule_id": "자동로드_문서_비대화_파일단위_이관_패턴", "questions": [{"id": "q1", "type": "choice", "section": "왜 줄 수 기준만으로는 안 되는가", "situation": "자동 로드되는 CLAUDE.md가 너무 커져, 같은 파일 안에서 오래된 절을 맨 아래 '레거시' 섹션으로 옮겼다. 이 조치의 효과는?", "options": ["로드 비용이 레거시 섹션만큼 줄어든다", "총량이 그대로라 매 세션 컨텍스트 비용도 그대로다", "Read 툴의 한 번 읽기 한도 문제가 해소된다", "레거시 섹션은 자동 로드에서 제외된다"], "answer": 1, "explain": "같은 파일 안에서 헤더만 옮기면 총량이 줄지 않는다. 자동 로드 문서에서는 총량이 곧 매 세션 비용이라, 구간을 별도 파일로 옮겨야 한다."}, {"id": "q2", "type": "choice", "section": "절차 요약", "situation": "결정이력 문서의 크기 한도를 프로젝트 README에 적으려 한다. 한도의 단위로 맞는 것은?", "options": ["줄 수", "바이트 수", "글자 수", "섹션 수"], "answer": 2, "explain": "한글 문서는 줄 수보다 글자 수가 먼저 Read 한도(약 25,000토큰)에 닿는다. 한도는 글자 수로 정하고, 절이나 결정을 추가한 작업 끝에 측정한다."}, {"id": "q3", "type": "choice", "section": "절차 요약", "situation": "ADR-21~76 구간을 별도 파일로 옮기는 스크립트의 단계 순서로 맞는 것은?", "options": ["원본에서 구간 삭제 → 새 파일 작성 → 내용 검사", "새 파일에 원문 그대로 복사(줄바꿈 보존) → 복사본에 원문 구간이 그대로 들어갔는지 검사 → 원본에서 삭제", "구간 요약을 새로 써서 새 파일에 저장 → 원본 삭제", "새 파일에 복사 → 원본에서 삭제 → 다음 세션에 검사"], "answer": 1, "explain": "검사 전에 원본을 지우면 복사 오류가 곧 원문 유실이다. 복사는 Python newline=''로 줄바꿈을 보존하고, 한글이면 PYTHONUTF8=1을 쓴다."}, {"id": "q4", "type": "scenario", "section": "함정", "situation": "결정이력 이관 계획을 세운다. 이관 뒤에 생기기 쉬운 문제를 피하려고 계획에 넣어야 할 것을 쓰세요.", "rubric": ["이관 전에 블록별 글자 수를 재서 한도 아래로 내려갈 구간을 한꺼번에 정한다고 썼다", "다른 문서가 줄 번호로 인용하는 곳은 ADR 같은 번호 인용으로 바꾼다고 썼다", "요약 절에는 원문에 있는 규칙만 출처를 달아 옮기고, 새 규칙을 만들지 않는다고 썼다", "구현 서술만 옮기고 현행 규칙(금지 사항 등)은 자동 로드 문서에 남긴다고 썼다"], "explain": "ADR 본문만 옮기면 OPEN 서술·오래된 변경이력이 덩어리로 남아 다시 한도를 넘고, 현행 규칙까지 빠지면 그 규칙이 로드되지 않는다."}]}, "자율에이전트_행동루프_안전장치_패턴": {"rule_id": "자율에이전트_행동루프_안전장치_패턴", "questions": [{"id": "q1", "type": "choice", "section": "체크리스트 4가지", "situation": "사용자가 '신뢰 모드'를 켠 상태에서 자동조작 에이전트가 결제 버튼을 누르려 한다. 맞는 동작은?", "options": ["신뢰 모드이므로 확인 없이 진행한다", "결제·삭제·발송 같은 되돌릴 수 없는 행동은 모드와 무관하게 항상 확인 다이얼로그를 거친다", "첫 결제만 확인하고 이후는 자동으로 진행한다", "금액이 작으면 확인 없이 진행한다"], "answer": 1, "explain": "되돌릴 수 없는 행동의 확인 게이트는 예외 없이 거치고, 우회 경로 자체를 만들지 않는다. 모드·금액 같은 조건으로 예외를 두는 순간 그것이 우회 경로가 된다."}, {"id": "q2", "type": "spot", "section": "체크리스트 4가지", "situation": "사용자가 지켜보지 않을 때 같은 행동이 계속 실패하는 사고를 막으려 한다. 체크리스트를 어기는 줄을 고르세요.", "code": "MAX_SAME_FAILURES = None  # 실패해도 끝까지 시도\n\ndef run_loop(agent):\n    fails = 0\n    while not agent.stop_requested:\n        ok = agent.step()\n        fails = 0 if ok else fails + 1\n        if MAX_SAME_FAILURES and fails >= MAX_SAME_FAILURES:\n            break", "answer_lines": [1], "explain": "임계값을 비워 두면 기본값이 '무한 재시도'가 된다. 같은 행동이 N회(기본 3회) 연속 실패하면 사람 개입 없이 루프가 스스로 멈춰야 한다. 5번 줄의 stop_requested 확인은 '언제든 멈추기' 버튼 쪽 요건이다."}, {"id": "q3", "type": "choice", "section": "체크리스트 4가지", "situation": "화면 요소 트리 분석(저렴)과 비전 모델 호출(비쌈) 두 경로가 있다. 별도 동의 화면 없이도 비싼 경로가 opt-in이 되게 하는 설계는?", "options": ["비전 모델을 기본으로 쓰고 설정에서 끌 수 있게 한다", "트리 분석을 기본으로 하고, 비전 경로는 사용자가 그 기능의 자격증명을 등록해야만 켜지게 한다", "비전 호출 때마다 비용 안내 팝업을 띄운다", "정확도가 높은 쪽을 항상 쓴다"], "answer": 1, "explain": "자격증명 등록 자체가 '이 비싼 경로를 써도 된다'는 동의 신호를 겸하게 하면 opt-in이 구조적으로 보장된다."}, {"id": "q4", "type": "scenario", "section": "개발 측 부가 원칙 — 한 라운드 = 한 기능 = 한 커밋", "situation": "이번 작업에서 재시도 로직, 중단 버튼 위치, 새 액션 종류 추가를 한꺼번에 바꾸려 한다. 어떻게 나눌지와 그 이유를 쓰세요.", "rubric": ["한 라운드에 기능 하나만 바꾸고 기능마다 커밋을 따로 한다고 썼다", "이상행동이 생겼을 때 어느 변경 때문인지 역추적하기 쉬워진다고 썼다", "문제가 생기면 커밋 하나만 되돌려 직전의 안전한 상태로 돌아갈 수 있다고 썼다", "자율 루프는 실제 사용자 환경에 부작용을 남겨 '일단 배포 후 수정'의 대가가 크다고 짚었다"], "explain": "되돌리기 쉬운 단위로 쪼개 두는 것이 사후 디버깅 비용을 줄이는 것보다 더 중요한 안전장치다."}]}, "적립장부만_먼저_만들고_지급을_사용처몫으로_미루면_영영_미지급_함정": {"rule_id": "적립장부만_먼저_만들고_지급을_사용처몫으로_미루면_영영_미지급_함정", "questions": [{"id": "q1", "type": "spot", "section": "패턴", "situation": "부스트 카드가 '이긴 팟 × 10%'를 세션의 보너스 장부에 쌓는다. 이 테스트는 늘 통과했지만, 실제로는 아무도 보너스를 받지 못했다. 그 사실을 가린 줄을 고르세요.", "code": "def test_boost_card_pays_bonus(session):\n    equip(session, \"boost_10\")\n    win_pot(session, 1000)\n    finish_match(session)\n    assert session.bonus_chips == 100", "answer_lines": [5], "explain": "'장부에 쌓인다'까지만 확인한다. 판이 끝나면 장부는 세션과 함께 사라지므로, '끝나면 어딘가의 잔액이 그만큼 늘었다'까지 단언해야 지급 누락이 드러난다."}, {"id": "q2", "type": "choice", "section": "패턴", "situation": "적립 장부 층을 만들며 헤더에 '지급은 콘텐츠 정산 몫'이라고 적었다. 이 장부를 쓰는 첫 콘텐츠를 만들 때 맞는 것은?", "options": ["헤더에 적었으니 콘텐츠 담당이 알아서 지급한다", "지급까지 같은 작업 단위로 넣고, 지급 방식을 못 정하면 그 콘텐츠에서는 장부를 아예 켜지 않는다", "지급은 나중에 몰아서 한 번에 구현한다", "장부를 테이블 칩과 합쳐 버린다"], "answer": 1, "explain": "지급 책임을 '나중에 누군가'로 두면 첫 사용처가 구현하지 않는 순간 에러도 실패 테스트도 없이 증발한다. 적립과 지급을 층으로 나누는 것 자체는 괜찮은 분리다."}, {"id": "q3", "type": "choice", "section": "패턴", "situation": "장부를 만드는 쪽에서 지급 누락을 조기에 알아챌 수 있는 장치로 맞는 것은?", "options": ["장부 크기에 상한을 둔다", "세션 종료(정산) 지점에 '장부가 비어 있지 않은데 지급 경로가 없다'는 경고·로그를 둔다", "장부를 매일 초기화한다", "장부 값을 화면에 표시한다"], "answer": 1, "explain": "조용한 증발을 시끄럽게 만드는 장치다. 프로젝트 규칙 파일에 '이 장부를 쓰는 새 콘텐츠는 정산에서 지급할 것'을 한 줄 남기는 것도 함께 한다."}, {"id": "q4", "type": "choice", "section": "실측 사례 (poker_app/server, 2026-09-28 → 09-29, ADR-190 → ADR-197)", "situation": "실측 사례에서 지급 누락이 하루 동안 발견되지 않은 직접적 이유는?", "options": ["장부 코드에 예외가 발생했지만 로그가 꺼져 있었다", "첫 사용처(보스전)의 정산이 체력 피해만 계산했고, 테스트는 '장부에 쌓인다'까지만 확인해 초록불이었다", "부스트 카드를 산 사용자가 없었다", "서버 배포가 늦었다"], "answer": 1, "explain": "에러도 실패 테스트도 없었다. 인수인계 목록의 '지급 방식 미정'을 다시 보고서야 발견했고, '판을 친 회사 자금으로' 지급하기로 닫았다."}]}, "전역_값풀_개인정보_화이트리스트_k명노출_자동완성_패턴": {"rule_id": "전역_값풀_개인정보_화이트리스트_k명노출_자동완성_패턴", "questions": [{"id": "q1", "type": "spot", "section": "패턴", "situation": "다른 사용자들이 쓴 값을 자동완성 후보로 보여 줄 '풀 허용 칸' 목록이다. 기본 제외 원칙을 어기는 줄을 고르세요.", "code": "POOL_FIELDS = {\n    \"traits.keywords\",\n    \"skills.names\",\n    \"profile.region\",\n    \"routines.names\",\n}", "answer_lines": [4], "explain": "지역은 이름·건강·메모·일정과 함께 기본 제외 대상이다. 풀 칸은 짧고 범용적인 값(성향 키워드, 기술 이름 등)만 화이트리스트로 두고, 새 항목은 '풀 허용'을 명시적으로 켜야 들어가게 한다."}, {"id": "q2", "type": "choice", "section": "패턴", "situation": "어떤 값을 한 사용자만 썼다. 이 값은 누구의 자동완성에 보여야 하나? (k = 3)", "options": ["모든 사용자", "그 값을 쓴 사용자 본인에게만", "아무에게도 보이지 않는다", "관리자에게만"], "answer": 1, "explain": "다른 사용자에게는 서로 다른 사용자 k명 이상이 쓴 값만 보인다. 본인에게는 '내가 쓴 값'으로 바로 보여야, 풀이 빈 초기에도 기능이 동작한다고 느낀다."}, {"id": "q3", "type": "choice", "section": "패턴", "situation": "사용자가 프로필에서 '신중함'을 지우고 저장했다. 풀 기여는 어떻게 처리해야 하나?", "options": ["풀은 누적 기록이므로 그대로 둔다", "저장할 때마다 그 사용자의 풀 행을 지우고 지금 값으로 다시 넣어, 지운 값이 빠지게 한다", "다음 날 배치로 정리한다", "다른 사용자 k명이 쓰고 있으면 남긴다"], "answer": 1, "explain": "기여는 현재 프로필과 같아야 한다. 계정 삭제 때도 그 사용자 행을 지우며, 이 삭제 훅은 풀 모듈이 스스로 등록한다."}, {"id": "q4", "type": "choice", "section": "패턴", "situation": "사용자가 풀 허용 칸에 '010-1234-5678'을 입력하고 저장했다. 맞는 처리는?", "options": ["저장 자체를 거부하고 오류를 띄운다", "프로필 저장은 막지 않고, 연락처 꼴이므로 풀에만 넣지 않는다", "풀에 넣되 k명 조건으로 가려지니 괜찮다", "하이픈을 지우고 풀에 넣는다"], "answer": 1, "explain": "값 검증(@, URL, 4자리 이상 숫자, 전화번호 꼴, 길이 제한)은 '풀에 넣을지'의 문제다. 사용자 본인의 저장은 막지 않는다."}]}, "코드기반_인프라분석_라이브검증_패턴": {"rule_id": "코드기반_인프라분석_라이브검증_패턴", "questions": [{"id": "q1", "type": "choice", "section": "함정 — \"코드에 없음\" = \"인프라에 없음\"으로 성급히 결론", "situation": "Railway에 배포된 앱의 저장소에 railway.toml도 볼륨 선언도 없다. 'High 리스크: 재배포 시 데이터 유실'로 보고하기 전에 할 일은?", "options": ["코드 근거가 명확하므로 그대로 보고한다", "railway status, railway volume list 같은 CLI로 실제 상태를 먼저 조회한다", "볼륨 선언을 추가하는 PR부터 올린다", "심각도를 Medium으로 낮춰 보고한다"], "answer": 1, "explain": "플랫폼은 볼륨·환경변수·도메인을 대시보드나 CLI로만 설정하고 저장소에 흔적을 남기지 않는 경우가 흔하다. 실측 사례에서도 볼륨이 이미 정확한 경로에 붙어 데이터가 쌓이고 있었다."}, {"id": "q2", "type": "choice", "section": "원칙 — CLI/API로 확인 가능한 건 코드 근거만으로 리스크를 확정하지 않는다", "situation": "리스크 목록에 '빌드 산출물(dist/)이 git에 추적되는지 미확인'이 올라 있다. 맞는 처리는?", "options": ["'미확인'으로 그대로 두고 사용자에게 넘긴다", "git ls-files -- dist/ build/ 로 바로 확정한다", "안전하게 dist/를 .gitignore에 추가하는 커밋을 먼저 한다", "다음 분석 회차로 미룬다"], "answer": 1, "explain": "명령 하나로 끝나는 확인을 '미확인'으로 남기면, 나중에 그 리스크를 근거로 불필요한 작업을 벌이게 된다. 실측에서는 10초 만에 이미 gitignore로 빠져 있음을 확정할 수 있었다."}, {"id": "q3", "type": "choice", "section": "원칙 — CLI/API로 확인 가능한 건 코드 근거만으로 리스크를 확정하지 않는다", "situation": "어떤 플랫폼은 CLI가 없고 대시보드 접근 권한도 없다. 그 플랫폼의 스토리지 설정에 대한 보고 표현으로 맞는 것은?", "options": ["'High 리스크 — 영구 스토리지 없음'", "'코드로는 확인 안 됨 — 대시보드에서 직접 확인 필요'로 적고 사용자에게 확인을 요청한다", "확인할 수 없으니 보고서에서 뺀다", "'문제 없음 — 플랫폼 기본값이 안전하다'"], "answer": 1, "explain": "확인이 불가능한 항목만 '확인 필요'로 남기고, '리스크가 있다'와 표현을 구분한다. 확인 결과가 앞선 결론을 뒤집으면 그 자리에서 정정해 알린다."}, {"id": "q4", "type": "scenario", "section": "분석을 직접 실행으로 돌릴 때의 함정 (6개 앱 정밀 분석, 2026-10-11 실측)", "situation": "다른 사람이 작업 중인 저장소의 테스트를 직접 돌려 품질을 평가하려 한다. 저장소에는 실제 키가 든 .env도 있다. 안전하게 돌리는 방법을 쓰세요.", "rubric": ["git archive HEAD로 임시 폴더에 풀어 커밋된 코드를 따로 돌리고, 작업 트리 결과와 구분한다고 썼다", "CI가 쓰는 더미 환경값을 명령에 직접 지정해 실제 외부 서비스에 닿지 않게 한다고 썼다", "실행 전후 git status를 비교해 흔적을 찾고, 생긴 파일은 지우지 않고 보고한다고 썼다", "끝까지 못 기다린 긴 테스트는 확인한 범위만 적고 '통과'로 단정하지 않는다고 썼다"], "explain": "실측에서 작업 트리는 661개 중 8개 실패, 커밋 코드는 598개 전부 통과였다. dotenv는 이미 설정된 환경변수를 덮어쓰지 않으므로 더미 값을 직접 지정하는 것이 효과가 있다."}]}, "크로스런타임_계약_동기화_위험": {"rule_id": "크로스런타임_계약_동기화_위험", "questions": [{"id": "q1", "type": "choice", "section": "문제", "situation": "Dart 클라이언트와 Python 서버가 레이즈 범위 상한을 각자 상수로 선언한다. 서버 쪽만 바꿨을 때 어긋남이 드러나는 시점은?", "options": ["양쪽 컴파일 시점", "CI의 타입 검사 단계", "실제로 그 값에 의존하는 경로가 실행될 때(잘못된 판정·'알 수 없는 값')", "서버 시작 시점"], "answer": 2, "explain": "언어가 달라 코드를 공유할 수 없고, 양쪽 모두 각자 문법적으로 유효해 컴파일 타임에도 런타임 초기에도 걸리지 않는다."}, {"id": "q2", "type": "choice", "section": "지금 수준에서 할 수 있는 것 — 완전 자동화는 안 되니 최소한이라도", "situation": "양쪽에 같은 값을 둬야 하는 계약이 두세 개뿐인 초기 프로젝트다. 가장 적절한 대응은?", "options": ["JSON Schema 단일 소스에서 양쪽 코드를 생성하는 파이프라인을 지금 만든다", "결정 문서와 양쪽 파일에 서로의 경로를 교차로 적은 '문서화된 수동 동기화'와, 이름 존재 여부 정도의 CI 린트를 둔다", "클라이언트 상수를 지우고 서버만 믿는다", "아무것도 하지 않는다 — 어긋나면 그때 고친다"], "answer": 1, "explain": "코드 생성은 완전한 해결이지만 초기엔 과하다. 계약이 늘거나 실제로 어긋난 사고가 한 번이라도 나면 그때 도입을 검토한다."}, {"id": "q3", "type": "choice", "section": "실측 후속 (poker_app, 2026-09-19) — 값의 성격에 따라 \"복제\"가 아니라 \"원본 조회\"를 택한다", "situation": "랜덤박스 확률 고지를 클라이언트 화면에 보여 줘야 한다. 맞는 설계는?", "options": ["서버 확률표를 클라이언트에 복제하고 CI로 일치를 검사한다", "서버가 실제 추첨에 쓰는 원본 표를 조회 API로 그대로 내려 주고, 클라이언트는 복제본을 두지 않는다", "클라이언트에 대략적인 확률만 적어 둔다", "가격 견적처럼 미러링하고 실제 추첨은 서버 값을 쓴다"], "answer": 1, "explain": "판단 기준은 어긋났을 때의 비용이다. 견적은 화면 오차로 끝나지만 확률 고지는 한 글자만 달라도 법적·신뢰 문제라, 복제를 아예 만들지 않아 동기화 대상 자체를 없앤다."}, {"id": "q4", "type": "scenario", "section": "새 크로스런타임 계약을 추가할 때 미리 할 일", "situation": "새 기능 때문에 클라이언트와 서버 양쪽에 '표본 크기 임계값'이 필요해졌다. 만드는 순간 할 일을 쓰세요.", "rubric": ["결정 문서에 '이 값은 두 곳에 있다'를 바로 기록한다고 썼다", "두 파일 경로를 서로 교차 언급해 한쪽만 보고 고치는 실수를 줄인다고 썼다", "어긋났을 때 비용이 큰 값이면 복제 대신 서버 원본 조회로 설계할지 먼저 판단한다고 썼다"], "explain": "'여기 있는 줄 몰랐다'를 막는 가장 싼 방법은 처음 만든 순간에 남겨 두는 것이다."}]}, "타입체커_ORM쿼리결과_오탐_패턴": {"rule_id": "타입체커_ORM쿼리결과_오탐_패턴", "questions": [{"id": "q1", "type": "choice", "section": "패턴 1 — 같은 이름의 루프 변수를 한 함수 안에서 재사용", "situation": "mypy가 두 번째 루프 줄에서 'ModelA has no attribute field_only_on_b'를 낸다. 그 줄은 query_b_rows를 순회한다. 맞는 판단과 수정은?", "options": ["ModelA에 field_only_on_b를 추가한다", "두 루프가 같은 변수 r을 써서 타입체커가 첫 루프의 ModelA를 들고 간 오탐일 수 있다 — 실제 순회 모델에 속성이 있으면 루프 변수 이름을 다르게 짓는다", "그 줄에 # type: ignore를 단다", "두 번째 루프를 별도 함수로 옮기고 Any로 선언한다"], "answer": 1, "explain": "오류 메시지의 모델 이름이 아니라 그 줄이 실제로 도는 이터러블을 본다. 억제 주석은 나중에 그 자리에 진짜 버그가 생겨도 묻어 버리므로 이름 분리가 가장 싸고 확실하다."}, {"id": "q2", "type": "choice", "section": "좁게(또는 대충) 선언해뒀다", "situation": "yield를 쓰면서 마지막에 return (count, errors)로 결과를 실어 보내는 함수를 Iterator[Row]로 선언했다. 그 함수 안 여러 줄에서 '타입을 정할 수 없다'류 오류가 한꺼번에 난다. 맞는 수정은?", "options": ["오류가 난 줄마다 억제 주석을 단다", "시그니처를 Generator[Row, None, tuple[int, list[str]]]처럼 세 타입 인자 모두 정확히 선언한다", "return 값을 없애고 전역 변수로 넘긴다", "Iterator[Any]로 바꾼다"], "answer": 1, "explain": "Iterator나 Generator[T, None, None]은 '반환값 없음'이라 반환값을 만드는 지역변수 추론이 줄줄이 깨진다. 로직은 그대로 두고 타입 힌트만 정확히 하면 한 번에 해소된다."}, {"id": "q3", "type": "spot", "section": "변수가 딕셔너리 리터럴 안에서 다른 값의 타입으로 잘못 통합 추론된다", "situation": "mypy가 5번 줄에서 \"Generator has incompatible item type 'object'; expected 'bool'\"을 낸다. 근본 원인을 고칠 줄을 고르세요.", "code": "def summarize(rows):\n    steps = []\n    for r in rows:\n        steps.append({\"stage\": r.stage, \"ms\": r.ms})\n    return {\"ok\": True, \"totalMs\": round(sum(s.get(\"ms\", 0) for s in steps), 2)}", "answer_lines": [2], "explain": "타입 힌트 없는 빈 리스트로 시작한 변수가 같은 딕셔너리 리터럴 안의 bool과 잘못 통합됐다. 선언부를 steps: list[dict] = []로 정확히 하면 이 변수를 참조하는 모든 지점의 오류가 사라진다. 오류가 난 줄에 억제 주석을 달지 않는다."}, {"id": "q4", "type": "scenario", "section": "CI 게이트 도입 초기에 특히 조심할 것", "situation": "타입체커를 advisory로 처음 켰더니 미해결 오류 120개가 나왔다. 이 목록을 어떻게 다룰지 쓰세요.", "rubric": ["'미해결 오류 = 잠재 버그 목록'으로 그대로 믿지 않는다고 썼다", "오류가 ORM 루프 근처·제너레이터 함수 하나·무관한 예상 타입 같은 오탐 신호에 해당하는지 먼저 본다고 썼다", "미루더라도 한 번은 확인 순서를 거쳐 '진짜 버그 후보'와 '오탐'을 나눠 기록한다고 썼다"], "explain": "나눠 둔 기록이 있어야 나중에 목록을 다시 볼 사람이나 세션이 처음부터 다시 조사하지 않는다."}]}, "파이썬_패키지_getattr_monkeypatch_고정_함정": {"rule_id": "파이썬_패키지_getattr_monkeypatch_고정_함정", "questions": [{"id": "q1", "type": "choice", "section": "원인", "situation": "패키지가 `__getattr__(name)`으로 현재 구현(rules|noop)의 같은 이름을 돌려준다. 한 시험에서 `monkeypatch.setattr(constraints, \"guest_trial_enabled\", ...)`를 한 뒤, 다른 시험의 `constraints.use(\"noop\")` 전환이 그 이름에만 안 먹는다. 원인은?", "options": ["monkeypatch가 시험 끝에 복원을 안 해서", "패키지 객체에 setattr하면 모듈 __dict__에 그 이름이 실제로 생겨, 이후 접근이 __getattr__까지 가지 않아서", "use(\"noop\")가 비동기라서", "시험 순서가 무작위라서"], "answer": 1, "explain": "__getattr__는 이름을 못 찾을 때만 불린다. 패키지에 이름이 실제로 생기면 그 값(또는 복원 흔적)에 고정된다. 단독 실행은 통과하고 전체 실행에서만 깨지는 이유다."}, {"id": "q2", "type": "spot", "section": "지침", "situation": "같은 함정을 다시 만드는 시험 코드 줄을 고르세요.", "code": "def test_guest_pool(monkeypatch):\n    constraints.use(\"rules\")\n    monkeypatch.setattr(constraints.rules, \"_GUEST_POOL_DAILY\", 20)\n    monkeypatch.setattr(constraints, \"guest_trial_enabled\", lambda: True)\n    assert constraints.guest_pool_left() == 20", "answer_lines": [4], "explain": "구현 모듈(`constraints.rules`)을 패치한 3번 줄은 맞다. 4번 줄은 패키지 객체에 직접 setattr해서 이름을 고정시킨다. `constraints.rules.guest_trial_enabled`를 패치해야 한다."}, {"id": "q3", "type": "scenario", "section": "지침", "situation": "이 구조의 패키지(구현 전환을 __getattr__로 하는)를 새로 만든다. 같은 함정을 막으려면 무엇을 해 두어야 하는지 쓰세요.", "rubric": ["패치는 패키지가 아니라 구현 모듈에 한다고 정했다", "값 전환은 패키지가 주는 공식 스위치(use 등)로 하고, 시험 끝에 autouse 픽스처로 원복한다고 썼다", "README나 주석에 '패치는 구현 모듈에 한다'를 한 줄 적어 둔다고 썼다"], "explain": "구조가 낯설면 다음 사람이 같은 setattr을 쓴다. 규칙을 정하고 문서에 한 줄 남겨야 반복되지 않는다."}]}, "파일유형_매직바이트_검증_패턴": {"rule_id": "파일유형_매직바이트_검증_패턴", "questions": [{"id": "q1", "type": "choice", "section": "문제 — 확장자는 사용자가 마음대로 붙인 라벨일 뿐", "situation": "업로드 API가 파일 이름의 확장자로 처리기를 고른다. 이 설계의 위험은?", "options": ["확장자가 대문자면 처리기를 못 찾는다", "실행 파일에 .jpg를 붙이면 이미지 처리 파이프라인에 그대로 들어간다", "확장자가 없는 파일만 위험하다", "위험은 없다 — 운영체제가 확장자와 내용을 맞춰 준다"], "answer": 1, "explain": "확장자는 내용과 무관하게 얼마든지 바꿔 붙일 수 있는 라벨이다. 실제 유형은 파일 헤더의 매직바이트로 판별하고 확장자와 대조한다."}, {"id": "q2", "type": "spot", "section": "해법 — 파일 헤더(매직바이트)로 실제 유형을 판별하고, 확장자와 대조", "situation": "업로드 처리 함수다. 이 패턴의 핵심을 어기는 줄을 고르세요.", "code": "def handle_upload(filename, data):\n    ext = filename.rsplit('.', 1)[-1].lower()\n    actual = detect_real_type(data)\n    if ext != actual:\n        actual = ext\n    return PROCESSORS[actual](data)", "answer_lines": [5], "explain": "불일치를 발견하고도 조용히 확장자 쪽으로 맞춰 버린다. 불일치 자체를 보안 이벤트로 로그에 남기고, 거부할지 실제 유형 기준으로만 처리할지를 기능의 위험도에 따라 정한다."}, {"id": "q3", "type": "choice", "section": "해법 — 파일 헤더(매직바이트)로 실제 유형을 판별하고, 확장자와 대조", "situation": "업로드된 파일의 첫 바이트가 89 50 4E 47 0D 0A 1A 0A다. 이 파일의 실제 유형은?", "options": ["JPEG", "PNG", "PDF", "MP4"], "answer": 1, "explain": "PNG 시그니처는 \\x89PNG\\r\\n\\x1a\\n이다. JPEG는 FF D8 FF, PDF는 %PDF, MP4/MOV 계열은 4~8번째 바이트가 ftyp다."}, {"id": "q4", "type": "choice", "section": "적용 범위", "situation": "다음 중 매직바이트 검증의 우선순위가 가장 낮은 곳은?", "options": ["외부 사용자가 이미지를 올리는 커뮤니티 업로드", "이메일 첨부파일 처리 서버", "외부 업로드 없이 자기 컴퓨터 안 파일만 여는 개인 로컬 도구", "문서를 받아 변환해 주는 웹 서비스"], "answer": 2, "explain": "확장자 위조가 실제 보안 문제로 이어지는 곳은 외부에서 파일이 들어오는 기능이다. 외부 입력이 없는 개인 로컬 도구는 상대적으로 우선순위가 낮다."}]}, "포크_앱_공유파일_갈라짐_점검_패턴": {"rule_id": "포크_앱_공유파일_갈라짐_점검_패턴", "questions": [{"id": "q1", "type": "choice", "section": "패턴", "situation": "앱 A를 포크해 앱 B를 만들었다. 공유 파일의 갈라짐 점검 스크립트가 경고를 내는 조건은?", "options": ["두 앱의 공유 파일이 한 줄이라도 다를 때", "기준 이후 상대 앱에서 그 파일들을 건드린 커밋이 있거나, 파일별 차이 수가 기준과 달라졌을 때", "포크 이후 하루가 지났을 때", "두 앱의 테스트 수가 다를 때"], "answer": 1, "explain": "'다름'이 아니라 '다름이 변했을 때'만 알린다. 의도적으로 다른 부분은 처음 기준에 이미 들어 있어 오탐 없이 계속 켜 둘 수 있다."}, {"id": "q2", "type": "choice", "section": "하지 말 것", "situation": "기준 파일(fork_drift_baseline.json)의 '상대 앱 커밋 해시'로 맞는 것은?", "options": ["포크한 시점의 커밋", "마지막으로 사람이 검토한 시점의 커밋", "상대 앱의 최신 커밋(매 실행마다 자동 갱신)", "첫 배포 커밋"], "answer": 1, "explain": "기준 갱신(--update-baseline)은 필요한 수정을 옮기거나 안 옮기기로 정한 뒤 사람이 검토하고 나서만 한다. 자동으로 갱신하면 놓친 변경이 사라진다."}, {"id": "q3", "type": "choice", "section": "하지 말 것", "situation": "포크한 앱 B의 공유 서버 파일에 앱 A 이름의 로거('judgecal.*')가 남아 있다. 맞는 처리는?", "options": ["잔재이므로 B 이름으로 바꾼다", "공유 목록 안 파일이므로 그대로 두고, '포크 유산이라 둔다'고 설계 문서에 적는다", "공유 목록에서 그 파일을 뺀다", "공용 패키지로 뽑는다"], "answer": 1, "explain": "차이 0줄이던 파일에 의미 없는 차이가 생기면 이후 진짜 변경이 묻힌다. 이름 정리는 공유 목록 밖 파일에서만 한다."}, {"id": "q4", "type": "scenario", "section": "하지 말 것", "situation": "팀원이 '공유 파일이 갈라지니 처음부터 공용 패키지로 뽑자'고 한다. 어떻게 판단할지 쓰세요.", "rubric": ["두 앱의 배포·의존성이 달라 공용 패키지가 오히려 결합을 만들 수 있다고 짚었다", "파일 수가 적고 갈라지는 방향이 한쪽 우세한 동안은 점검 스크립트가 훨씬 싸다고 썼다", "갈라짐 경고가 자주 울리면 그때 공용화를 검토한다고 썼다"], "explain": "공유 목록에는 한쪽 변경이 다른 쪽에 의미 있는 파일만 넣고, 처음부터 수백 줄 다른 파일은 뺀다."}]}, "폴더명_레이어명_불일치_사각지대_패턴": {"rule_id": "폴더명_레이어명_불일치_사각지대_패턴", "questions": [{"id": "q1", "type": "choice", "section": "문제", "situation": "프로젝트 폴더가 hooks/(UX), services/(API 호출), contracts/(계약)로 레이어 이름과 맞춰져 있다. 리뷰에서 생기기 쉬운 착각은?", "options": ["폴더가 너무 많아 찾기 어렵다", "이름이 맞으니 실제 import 방향도 맞겠지라고 안심하고 import 그래프를 재확인하지 않는다", "레이어 이름이 영어라 한국어 문서와 안 맞는다", "폴더를 합쳐야 한다고 판단한다"], "answer": 1, "explain": "'이름이 달라도 책임만 맞으면 된다'의 반대쪽 함정이다. 이름을 맞췄다고 책임까지 자동 보장되지 않고, 위반은 import 몇 줄 속에서 조용히 쌓인다."}, {"id": "q2", "type": "choice", "section": "완화책", "situation": "이름과 실제 의존 방향의 불일치를 가장 확실하게 막는 방법은?", "options": ["코드 리뷰 체크리스트에 '폴더명 확인'을 넣는다", "import 경계 lint(dependency-cruiser, import-linter 등)로 '이 폴더는 저 폴더만 import 가능'을 강제한다", "폴더 이름을 더 구체적으로 짓는다", "레이어마다 저장소를 나눈다"], "answer": 1, "explain": "기계적 장치가 없으면 위반이 하나씩 쌓인다. 처음부터 못 두면 주기적 레이어 감사 표에 '이름-실제 방향 일치' 항목을 넣는다."}, {"id": "q3", "type": "scenario", "section": "완화책", "situation": "lint 장치 없이 레이어 감사를 하고 있다. 감사가 반복될수록 효과가 쌓이게 하려면 무엇을 할지 쓰세요.", "rubric": ["감사 결과를 1회성 리포트로 흘려보내지 않고 프로젝트 설계도 const $ = s => document.querySelector(s);

// ---------- 진도 저장 (브라우저에만, 실패해도 화면은 동작) ----------
function loadProg(){ try { return JSON.parse(localStorage.getItem("playbook-progress") || "{}"); } catch { return {}; } }
function saveProg(p){ try { localStorage.setItem("playbook-progress", JSON.stringify(p)); } catch {} }
let PROG = loadProg();
function mark(ruleId, qid, val){ (PROG[ruleId] ||= {})[qid] = val; saveProg(PROG); }

// ---------- 마크다운 (본문을 먼저 이스케이프한 뒤 최소 문법만) ----------
function inline(s){
  const codes = [];
  s = esc(s).replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return "\u0000" + (codes.length - 1) + "\u0000"; });
  s = s.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
       .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/\u0000(\d+)\u0000/g, (_, i) => {
    const c = codes[+i], id = c.replace(/^.*[\/\\]/, "").replace(/\.md$/, "");
    return byId[id] && id !== c ? `<a href="#rule/${encodeURIComponent(id)}"><code>${c}</code></a>` : `<code>${c}</code>`;
  });
  return s.replace(/([^\s<>`"/\\(]+)\.md\b/g, (m, id) => byId[id] ? `<a href="#rule/${encodeURIComponent(id)}">${m}</a>` : m);
}
function md(src){
  const L = String(src || "").replace(/\r/g, "").split("\n"); let out = "", i = 0;
  while (i < L.length){
    const l = L[i];
    if (/^\s*```/.test(l)){ const b = []; i++; while (i < L.length && !/^\s*```/.test(L[i])) b.push(L[i++]); i++;
      out += `<pre><code>${esc(b.join("\n"))}</code></pre>`; continue; }
    if (/^\s*\|/.test(l)){ const rows = []; while (i < L.length && /^\s*\|/.test(L[i])) rows.push(L[i++]);
      const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      const body = rows.filter(r => !/^\s*\|[\s:|-]+\|\s*$/.test(r));
      out += "<table>" + body.map((r, n) => "<tr>" + cells(r).map(c => n ? `<td>${inline(c)}</td>` : `<th>${inline(c)}</th>`).join("") + "</tr>").join("") + "</table>"; continue; }
    let h = l.match(/^(#{3,6})\s+(.*)/); if (h){ out += `<h${Math.min(h[1].length, 4)}>${inline(h[2])}</h${Math.min(h[1].length, 4)}>`; i++; continue; }
    if (/^\s*>/.test(l)){ const b = []; while (i < L.length && /^\s*>/.test(L[i])) b.push(L[i++].replace(/^\s*>\s?/, ""));
      out += `<blockquote>${inline(b.join(" "))}</blockquote>`; continue; }
    if (/^\s*([-*]|\d+\.)\s+/.test(l)){ const ord = /^\s*\d+\./.test(l); const items = [];
      while (i < L.length && (/^\s*([-*]|\d+\.)\s+/.test(L[i]) || (/^\s{2,}\S/.test(L[i]) && items.length))){
        if (/^\s*([-*]|\d+\.)\s+/.test(L[i])) items.push(L[i].replace(/^\s*([-*]|\d+\.)\s+/, "")); else items[items.length - 1] += " " + L[i].trim(); i++; }
      out += (ord ? "<ol>" : "<ul>") + items.map(t => `<li>${inline(t)}</li>`).join("") + (ord ? "</ol>" : "</ul>"); continue; }
    if (!l.trim()){ i++; continue; }
    const p = []; while (i < L.length && L[i].trim() && !/^\s*(```|\||#{3,}|>|[-*]\s|\d+\.\s)/.test(L[i])) p.push(L[i++]);
    if (!p.length) p.push(L[i++]);
    out += `<p>${inline(p.join(" "))}</p>`;
  }
  return out;
}

function nav(v){ document.querySelectorAll("#nav a[data-v]").forEach(a => a.classList.toggle("on", a.dataset.v === v)); }
function quizState(id){ const qs = (DATA.quizzes[id] || {}).questions || []; const p = PROG[id] || {};
  const ok = qs.filter(q => p[q.id] === "ok").length, no = qs.filter(q => p[q.id] === "no").length;
  return {ok, no, n: qs.length, left: qs.length - ok - no}; }
function quizDone(id){ const s = quizState(id); return [s.ok, s.n]; }
// 퀴즈 화면 필터: 안 푼 문제가 있음 / 틀린 문제가 있음 / 다 맞힘
const QF = {"": "전체", todo: "안 푼 문제", wrong: "틀린 문제", done: "다 맞힘"};
const qfPass = id => { const s = quizState(id);
  return !state.qf || (state.qf === "todo" ? s.left > 0 : state.qf === "wrong" ? s.no > 0 : s.ok === s.n); };
function filtered(mode){
  const q = state.q.trim().toLowerCase();
  return DATA.rules.filter(r => (!q || (short(r) + " " + r.title + " " + r.id + " " + r.intro).toLowerCase().includes(q))
    && (mode === "quiz" ? DATA.quizzes[r.id] && qfPass(r.id) : !state.kind || r.sections.some(s => s.kind === state.kind))
    && (!state.project || r.projects.includes(state.project))
    && (!state.tag || (r.tags || []).includes(state.tag)))
    .sort((a, b) => short(a).localeCompare(short(b), "ko"));
}

let finderOpen = null, sideCtx = {cur: "", mode: "rules"};
const filtering = () => !!(state.q || state.kind || state.project || state.tag || state.qf);
function listItems(cur, mode){
  const rows = filtered(mode);
  return [rows.length, rows.map(r => { const [d, n] = quizDone(r.id); return `<a class="item ${r.id === cur ? "on" : ""}"

function bindSide(){

  $("#q").oninput = e => { state.q = e.target.value;
    const [count, items] = listItems(sideCtx.cur, sideCtx.mode);
    $(".list").innerHTML = items; document.querySelectorAll(".fcount").forEach(x => x.textContent = count); };
  const f = $(".finder"), t = $(".ftoggle");
  t.onclick = () => { const open = f.classList.toggle("closed") === false; finderOpen = open;
    t.setAttribute("aria-expanded", open); t.querySelector(".fa").textContent = open ? "접기 ▴" : "펼치기 ▾"; };
  document.querySelectorAll(".side .chip").forEach(c => c.onclick = () => {
    if (c.dataset.qf !== undefined) state.qf = c.dataset.qf; else state.kind = c.dataset.k; route(); });
  $("#proj").onchange = e => { state.project = e.target.value; route(); };
  $("#tagsel").onchange = e => { state.tag = e.target.value; route(); };
}
// ---------- 용어: 본문에서 처음 나오는 곳에 점선 밑줄 + 뜻 ----------
const TERMS = DATA.terms || [];
const termById = Object.fromEntries(TERMS.map(t => [t.id, t]));
const TERM_WORDS = TERMS.flatMap(t => [t.term, ...t.aliases].map(w => [w, t])).sort((a, b) => b[0].length - a[0].length);
function glossify(root){
  const used = new Set(), skip = "code,pre,a,h1,h2,h3,button,textarea,.term";
  for (const [word, t] of TERM_WORDS){
    if (used.has(t.id)) continue;
    const ascii = /^[\x00-\x7f]+$/.test(word), lw = word.toLowerCase();
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {acceptNode: n =>
      n.parentElement.closest(skip) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT});
    let node;
    while ((node = walker.nextNode())){
      const text = ascii ? node.data.toLowerCase() : node.data;
      let i = text.indexOf(ascii ? lw : word);
      // 영문 용어는 단어 경계에서만(BOM이 BOMB 안에서 잡히지 않게)
      while (i >= 0 && ascii && (/\w/.test(text[i - 1] || "") || /\w/.test(text[i + word.length] || ""))) i = text.indexOf(lw, i + 1);
      if (i < 0) continue;
      const mid = node.splitText(i); mid.splitText(word.length);
      const a = document.createElement("a");
      a.className = "term"; a.href = "#term/" + enc(t.id); a.dataset.tip = `${t.term} — ${t.short}`;
      mid.replaceWith(a); a.appendChild(mid); used.add(t.id); break;
    }
  }
}
// 마우스가 없는 기기: 첫 번째 누름은 뜻만 보여 주고, 같은 단어를 한 번 더 누르면 용어 페이지로 간다.
document.addEventListener("click", e => {
  const a = e.target.closest && e.target.closest("a.term");
  document.querySelectorAll("a.term.tip").forEach(x => { if (x !== a) x.classList.remove("tip"); });
  if (!a || !matchMedia("(hover: none)").matches) return;
  if (!a.classList.contains("tip")){ e.preventDefault(); a.classList.add("tip"); }
});

function tocLabel(h, max = 22){
  const s = h.replace(/\*\*/g, "").replace(/^\d+(-\d+)?\.\s*/, "").split(" — ")[0].trim();
  if (s.length <= max) return s;
  const cut = s.lastIndexOf(" ", max);
  return (cut > max / 2 ? s.slice(0, cut) : s.slice(0, max)).replace(/[\s,·(]+$/, "") + "…";
}

    ${done === "ok" ? "· ✓ 맞힘" : done === "no" ? "· 다시 풀어 보기" : ""}</div><p class="sit">${inline(q.situation)}</p>`;
  if (q.type === "choice") return `<div class="q" data-q="${q.id}">${head}${q.options.map((o, i) =>
    `<button class="opt" data-i="${i}">${inline(o)}</button>`).join("")}<div class="out"></div></div>`;
  if (q.type === "spot") return `<div class="q" data-q="${q.id}">${head}<div class="code">${q.code.split("\n").map((l, i) =>

    <div class="row"><button class="btn show">기준표 보기</button></div><div class="out"></div></div>`;
}

      <a class="btn" id="nextq" href="#quiz">다음 퀴즈 →</a></div></article></div>`;
  bindSide();
  // 점수 요약 + 왼쪽 목록의 "퀴즈 n/m"을 답할 때마다 갱신(화면 전체는 다시 그리지 않는다)
  const paint = () => { const s = quizState(r.id);
    $("#qsum").innerHTML = `<div class="bars"><span style="width:${s.ok / s.n * 100}%;background:var(--ok)"></span><span style="width:${s.no / s.n * 100}%;background:var(--bad)"></span></div>
      <span>맞힘 <b>${s.ok}</b></span><span>틀림 <b>${s.no}</b></span><span>남음 <b>${s.left}</b></span><span>/ ${s.n}문제</span>`;
    $(".list").innerHTML = listItems(r.id, "quiz")[1]; };
  const answer = (qid, val) => { mark(r.id, qid, val); paint(); };
  const order = filtered("quiz"), at = order.findIndex(x => x.id === r.id), nx = order[(at + 1) % order.length];
  if (nx && nx.id !== r.id) $("#nextq").href = "#quiz/" + enc(nx.id); else $("#nextq").remove();
  $("#retry").onclick = () => { delete PROG[r.id]; saveProg(PROG); quizView(r.id); };
  paint();
  qs.forEach(q => {
    const box = document.querySelector(`.q[data-q="${q.id}"]`), out = box.querySelector(".out");
    const explain = ok => `<div class="exp">${ok === null ? "" : ok ? '<b class="ok">맞았습니다.</b> ' : '<b class="bad">아닙니다.</b> '}${inline(q.explain)}
      ${q.section ? `<div class="prog" style="margin-top:6px">근거: ${inline(q.section)}</div>` : ""}</div>`;
    if (q.type === "choice") box.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      const ok = +b.dataset.i === q.answer;
      box.querySelectorAll(".opt").forEach(x => x.classList.remove("ok", "bad"));
      b.classList.add(ok ? "ok" : "bad"); if (!ok) box.querySelector(`.opt[data-i="${q.answer}"]`).classList.add("ok");
      out.innerHTML = explain(ok); answer(q.id, ok ? "ok" : "no");
    });
    if (q.type === "spot"){
      box.querySelectorAll(".ln").forEach(l => {
        l.onclick = () => l.setAttribute("aria-pressed", l.classList.toggle("pick"));
        l.onkeydown = e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); l.click(); } }; });
      box.querySelector(".chk").onclick = () => {
        const picked = [...box.querySelectorAll(".ln.pick")].map(l => +l.dataset.l).sort((a, b) => a - b);
        const ans = [...q.answer_lines].sort((a, b) => a - b), ok = JSON.stringify(picked) === JSON.stringify(ans);
        box.querySelectorAll(".ln").forEach(l => { l.classList.remove("ok", "bad");
          if (ans.includes(+l.dataset.l)) l.classList.add("ok"); else if (l.classList.contains("pick")) l.classList.add("bad"); });
        out.innerHTML = explain(ok); answer(q.id, ok ? "ok" : "no");
      };
    }
    if (q.type === "scenario") box.querySelector(".show").onclick = () => {
      out.innerHTML = `<div class="exp rub"><b>내 답이 이 기준을 채웠나요?</b>${q.rubric.map((c, i) =>
        `<label><input type="checkbox" data-i="${i}"> ${inline(c)}</label>`).join("")}<div class="tail"></div></div>`;
      const boxes = out.querySelectorAll("input"), tail = out.querySelector(".tail");
      const upd = () => { const n = [...boxes].filter(b => b.checked).length; const ok = n === boxes.length;
        tail.innerHTML = `<div class="prog" style="margin:8px 0">${n}/${boxes.length} 충족</div>${inline(q.explain)}`;
        answer(q.id, ok ? "ok" : "no"); };
      boxes.forEach(b => b.onchange = upd); upd();
    };
  });
  window.scrollTo(0, 0);
}
// ---------- 프로젝트 (강좌_v2 "만들어본 것들"과 같은 등급제) ----------
const GRADE = {1: "입문", 2: "초중급", 3: "중급", 4: "고급", 5: "운영 설계"};
const stars = g => "★".repeat(g) + "☆".repeat(5 - g);
const GRADE_WHY = [
  "흐름 하나(A → B)에 기억할 상태가 없다. 실패해도 다시 돌리면 끝난다.",
  "조건 분기와 자기 상태(설정·이력, 중복 실행 방지)가 생긴다. 상태를 기억하는 순간 꼬일 곳이 생긴다.",
  "독립된 부분 둘 이상(워커·스케줄·스레드·다른 앱 조작)이 협력하고 사람 없이 돈다. 경계와 안전장치를 설계해야 한다.",
  "클라이언트·서버·워커·저장까지 전체 시스템에 동시성과 테스트 체계가 붙는다. 한 곳을 고치면 다른 진입점이 흔들린다.",
  "고급에 더해 배포 · 클라이언트 2종 이상이 같은 서버 규칙 공유 · 돈과 한도 · 인증과 개인정보 · 되돌리기 어려운 변경(DB 이전·롤아웃) 중 셋 이상을 설계로 다룬다. 틀리면 남의 데이터나 돈이 상한다."
];
const projById = Object.fromEntries((DATA.projects || []).map(p => [p.id, p]));
const pstate = {cat: "", grade: 0};
const ruleLink = id => byId[id] ? `<a href="#rule/${enc(id)}" title="${esc(byId[id].title)}">${esc(short(byId[id]))}</a>` : "";
function projectsView(cat){
  nav("projects");
  if (cat !== undefined) pstate.cat = cat;
  const P = DATA.projects || [];
  // 카테고리는 "AI 응용 · 서버"처럼 두 단계 — 필터는 앞 단계(큰 묶음)로만 고른다.
  const group = c => c.split(" · ")[0];
  const cats = [...new Set(P.map(p => group(p.category)))].sort();
  const shown = P.filter(p => (!pstate.cat || group(p.category) === pstate.cat) && (!pstate.grade || p.grade === pstate.grade))
    .sort((a, b) => b.grade - a.grade || a.name.localeCompare(b.name));
  const carded = new Set(P.map(p => p.id));
  const others = {}; DATA.rules.forEach(r => r.projects.forEach(p => { if (!carded.has(p)) (others[p] ||= []).push(r); }));
  $("#app").innerHTML = `<div class="hero"><div class="eyebrow">PROJECTS · 만들어본 것들</div><h2>프로젝트와 설계 판단</h2>
      <p>카테고리와 설계 난이도로 좁히고, 카드를 누르면 전환점(큰 결정)과 이 프로젝트에 걸리는 규칙을 볼 수 있어요.</p></div>
    ${DATA.method ? `<details class="card method"><summary><span class="eyebrow">HOW · 결정 기록 방식</span>
      <b>모든 결정은 D·H·P·O 번호로 남깁니다</b><span class="more">펼치기</span></summary><div class="md">${md(DATA.method)}</div></details>` : ""}
    <div class="pfilter"><span class="flabel">카테고리</span><div class="chips">${["", ...cats].map(c =>
      `<button type="button" class="chip ${pstate.cat === c ? "on" : ""}" data-c="${esc(c)}" aria-pressed="${pstate.cat === c}">${c ? esc(c) : "전체"}</button>`).join("")}</div>
      <span class="flabel">설계 난이도</span><div class="chips">${[0, 1, 2, 3, 4, 5].map(g =>
      `<button type="button" class="chip ${pstate.grade === g ? "on" : ""}" data-g="${g}" aria-pressed="${pstate.grade === g}">${g ? stars(g) + " " + GRADE[g] : "전체"}</button>`).join("")}</div></div>
    <details class="card method"><summary><span class="eyebrow">HOW · 설계 난이도 기준</span>
      <b>줄 수나 기술 이름이 아니라, 설계할 때 동시에 다뤄야 하는 것으로 잽니다</b><span class="more">펼치기</span></summary>
      <ol class="md glv">${GRADE_WHY.map((w, i) => `<li><b>${stars(i + 1)} ${GRADE[i + 1]}</b> — ${w}</li>`).join("")}</ol></details>
    <div class="grid">${shown.map(p => `<a class="card pc pcard" href="#project/${encodeURIComponent(p.id)}">
      <div class="pg"><span class="stars">${stars(p.grade)}</span><span>${GRADE[p.grade]}</span>${p.public ? "" : `<span class="tag warn">비공개</span>`}</div>
      <h3>${esc(p.name)}</h3><div class="n">${esc(p.category)} · ${esc(p.status)}</div>
      <p class="sum">${esc(p.summary)}</p>
      <div class="stack">${p.stack.slice(0, 6).map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
      <div class="pfoot"><span><b>${p.milestones.length}</b> 전환점</span><span><b>${p.rules_real.length}</b> 실측 규칙</span>
        <span><b>${p.rules_applicable.length}</b> 적용 가능</span></div></a>`).join("") || `<div class="empty">조건에 맞는 프로젝트가 없어요.</div>`}</div>
    ${Object.keys(others).length ? `<div class="hero" style="margin-top:28px"><div class="eyebrow">ALSO · 카드 준비 중</div>
      <h2 style="font-size:18px">규칙에만 등장하는 프로젝트</h2></div><div class="grid">${Object.keys(others).sort().map(p =>
      `<div class="card pc"><h3>${esc(p)}</h3><div class="n">실측 규칙 ${others[p].length}개</div>
      <ul>${others[p].map(r => `<li>${ruleLink(r.id)}</li>`).join("")}</ul></div>`).join("")}</div>` : ""}`;
  document.querySelectorAll(".pfilter .chip").forEach(c => c.onclick = () => {
    if (c.dataset.c !== undefined) pstate.cat = c.dataset.c; else pstate.grade = +c.dataset.g; projectsView(); });
  window.scrollTo(0, 0);
}
// 전환점 하나 — 프로젝트 화면과 결정 화면이 같이 쓴다. p를 주면 프로젝트 이름을 머리에 붙인다.
function msItem(m, p){
  const rej = m.rejected || [];
  return `<li><div class="tlh"><span class="ref">${esc(m.ref)}</span><span class="date">${esc(m.date || "")}</span>${m.reverses ? `<span class="rev" title="예전 결정을 고치지 않고 새 번호로 뒤집음">${esc(m.reverses)} 뒤집음</span>` : ""}
      ${p ? `<a class="tag" href="#project/${enc(p.id)}">${esc(p.name)}</a>` : ""}</div>
    <div class="tlt">${inline(m.title)}</div>
    <div class="tlr"><span class="lbl">왜</span>${inline(m.why)}</div>
    <div class="tlr"><span class="lbl">바뀐 것</span>${inline(m.changed)}</div>
    ${rej.length || m.verified ? `<details class="tld"><summary>어떻게 정했나 — ${[rej.length ? `버린 대안 ${rej.length}개` : "", m.verified ? "검증" : ""].filter(Boolean).join(" · ")}</summary>
      ${rej.length ? `<div class="tlr"><span class="lbl">버린 대안</span></div><ul>${rej.map(x => `<li>${inline(x)}</li>`).join("")}</ul>` : ""}
      ${m.verified ? `<div class="tlr"><span class="lbl">검증</span>${inline(m.verified)}</div>` : ""}</details>` : ""}
    ${m.rules.length ? `<div class="tlr"><span class="lbl">관련 규칙</span>${m.rules.map(ruleLink).join(" · ")}</div>` : ""}</li>`;
}
// ---------- 결정 (모든 프로젝트의 전환점을 날짜순으로) ----------
const DF = {"": "전체", rev: "뒤집은 결정", rej: "버린 대안 있음", ver: "검증 있음"};
const dstate = {f: "", p: ""};
function decisionsView(){
  nav("decisions");
  const all = (DATA.projects || []).flatMap(p => p.milestones.map(m => ({m, p})));
  const pass = ({m, p}) => (!dstate.p || p.id === dstate.p) &&
    (dstate.f === "rev" ? !!m.reverses : dstate.f === "rej" ? (m.rejected || []).length > 0 : dstate.f === "ver" ? !!m.verified : true);
  const shown = all.filter(pass).sort((a, b) => (b.m.date || "").localeCompare(a.m.date || ""));
  const cnt = f => all.filter(x => f === "rev" ? x.m.reverses : f === "rej" ? (x.m.rejected || []).length : f === "ver" ? x.m.verified : true).length;
  const projs = (DATA.projects || []).filter(p => p.milestones.length);
  $("#app").innerHTML = `<div class="hero"><div class="eyebrow">DECISIONS · 결정 기록</div><h2>무엇을 왜 정했고, 무엇을 버렸나</h2>
      <p>프로젝트 ${projs.length}개의 큰 결정 ${all.length}건을 최신순으로 모았어요. 결정은 지우지 않고 새 번호로 뒤집고, 버린 대안과 검증을 같이 남깁니다.</p></div>
    <div class="pfilter"><span class="flabel">보기</span><div class="chips">${Object.entries(DF).map(([k, l]) =>
      `<button type="button" class="chip ${dstate.f === k ? "on" : ""}" data-f="${k}" aria-pressed="${dstate.f === k}">${l} <b>${cnt(k)}</b></button>`).join("")}</div>
      <span class="flabel">프로젝트</span><div class="chips">${[{id: "", name: "전체"}, ...projs].map(p =>
      `<button type="button" class="chip ${dstate.p === p.id ? "on" : ""}" data-p="${esc(p.id)}" aria-pressed="${dstate.p === p.id}">${esc(p.name)}</button>`).join("")}</div></div>
    <section class="card s plain">${shown.length ? `<ol class="tl">${shown.map(x => msItem(x.m, x.p)).join("")}</ol>` : `<p class="hint">조건에 맞는 결정이 없어요.</p>`}</section>`;
  document.querySelectorAll(".pfilter .chip").forEach(c => c.onclick = () => {
    if (c.dataset.f !== undefined) dstate.f = c.dataset.f; else dstate.p = c.dataset.p; decisionsView(); });
}
function projectView(id){
  nav("projects");
  const p = projById[id];
  if (!p){ projectsView(); return; }
  const appl = p.rules_applicable;
  $("#app").innerHTML = `<article class="card pdetail">
    <div class="meta"><a class="tag" href="#projects">← 프로젝트 목록</a>
      ${DATA.course_link && p.course_card ? `<a class="tag" href="${esc(DATA.course_link)}" target="_blank" rel="noopener">기초 강좌 샘플 카드: ${esc(p.course_card)} ↗</a>` : ""}</div>
    <div class="pg big"><span class="stars">${stars(p.grade)}</span><span>설계 난이도 · ${GRADE[p.grade]}</span>${p.public ? "" : `<span class="tag warn">비공개</span>`}</div>
    <h1 class="t">${esc(p.name)}</h1>
    <div class="meta"><a class="tag" href="#projects/${enc(p.category.split(" · ")[0])}" title="같은 분류의 프로젝트 보기">${esc(p.category)}</a><span class="tag">${esc(p.status)}</span>
      ${p.stack.map(t => `<a class="tag" href="#tag/${enc(t)}" title="이 기술 태그의 규칙 보기">${esc(t)}</a>`).join("")}</div>
    <div class="intro">${esc(p.summary)}</div>
    <div class="two"><div class="box"><div class="eyebrow">🎯 설계 포인트</div><ul>${p.design_points.map(x => `<li>${inline(x)}</li>`).join("")}</ul></div>
      <div class="box"><div class="eyebrow">✅ 확인 항목</div><ul>${p.checks.map(x => `<li>${inline(x)}</li>`).join("")}</ul></div></div>
    <section class="s plain"><h2>전환점 <span class="hint">결정 기록에서 고른 큰 결정 · 원래 번호 그대로</span></h2>
      <ol class="tl">${p.milestones.map(m => msItem(m)).join("")}</ol></section>
    <section class="s plain"><h2>실측 규칙 <span class="hint">이 프로젝트에서 실제로 겪고 정리한 규칙</span></h2>
      ${p.rules_real.length ? `<ul class="rl">${p.rules_real.map(r => `<li>${ruleLink(r)}</li>`).join("")}</ul>` : `<p class="hint">아직 없음</p>`}</section>
    <section class="s plain"><h2>적용 가능 규칙 <span class="hint">기술 스택이 겹치는 다른 프로젝트의 규칙 · 많이 겹치는 순</span></h2>
      <ul class="rl">${appl.map((r, i) => `<li class="${i >= 8 ? "fold" : ""}">${ruleLink(r.id)} ${r.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</li>`).join("")}</ul>
      ${appl.length > 8 ? `<button class="btn ghost" id="more">${appl.length - 8}개 더 보기</button>` : ""}</section>
  </article>`;
  const more = $("#more"); if (more) more.onclick = () => { document.querySelectorAll(".rl .fold").forEach(x => x.classList.remove("fold")); more.remove(); };
  window.scrollTo(0, 0);
}
function route(){
  const [v, raw] = location.hash.slice(1).split("/"); const id = raw ? decodeURIComponent(raw) : "";
  if (v === "quiz") quizView(id); else if (v === "projects") projectsView(raw === undefined ? undefined : id);
  else if (v === "project") projectView(id);
  else if (v === "decisions") decisionsView();
  else if (v === "terms" || v === "term") termsView(id);
  else if (v === "tag"){ Object.assign(state, {tag: id, q: "", kind: "", project: "", qf: ""}); ruleView(""); }
  else ruleView(id);
}
if (DATA.course_link){ const c = $("#course"); c.href = DATA.course_link; c.hidden = false; }
window.addEventListener("hashchange", () => route());
route();
</script>
</body>
