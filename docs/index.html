(값)만 암호화돼 있다", "대화 요약(값)은 보이고, 전화번호(키)만 암호화돼 있다", "앱이 실행 중일 때만 평문으로 보인다"], "answer": 1, "explain": "Hive 암호화는 값만 암호화하고 키는 평문으로 남긴다. 개인정보를 키로 쓰면 암호화를 켜도 노출된다. 키를 해시로 바꿔 저장한다."}, {"id": "q2", "type": "spot", "section": "함정 2. 이전 버전이 만든 평문 박스를 그냥 암호화 모드로 열면 깨진다", "situation": "이미 설치된 앱에 암호화를 추가하면서, 기존 평문 박스를 한 번 옮기는 코드다. 순서가 잘못돼 데이터를 잃을 수 있는 줄은?", "code": "final plain = await Hive.openBox(name);\nfinal data = Map.of(plain.toMap());\nawait plain.close();\nawait secrets.write('hive_box_encrypted.$name', '1');\nawait Hive.deleteBoxFromDisk(name);\nfinal box = await Hive.openBox(name, encryptionCipher: cipher);\nawait box.putAll(data);", "answer_lines": [4], "explain": "'암호화 완료' 표식은 맨 마지막에 써야 한다. 표식을 먼저 쓰고 putAll 전에 앱이 죽으면, 다음 실행은 이미 옮겼다고 믿고 빈 암호화 박스를 연다. 평문 파일은 지워졌으므로 데이터가 사라진다."}, {"id": "q3", "type": "scenario", "section": "주의 — 복구 정책이 데이터 손실이다", "situation": "암호화 키를 잃었거나 박스 파일이 깨졌을 때 '박스를 비우고 새로 시작'하는 복구 코드를 넣으려 한다. 이 정책을 모든 박스에 똑같이 적용해도 되는가? 어떤 박스에는 되고 어떤 박스에는 안 되는지 답하라.", "rubric": ["모든 박스에 똑같이 적용하면 안 된다고 답했다", "다시 만들 수 있는 데이터(캐시, 알림 원문)는 비워도 된다고 구분했다", "사용자 대화 기록·설정은 백업하거나 사용자에게 알린 뒤 비워야 한다고 썼다"], "explain": "'비우고 새로 시작'은 앱이 죽는 것보다 낫지만 그 박스의 기록이 전부 사라진다. 다시 만들 수 있는 박스인지가 기준이다."}]}, "Linux_홈서버_Docker_운영_함정": {"rule_id": "Linux_홈서버_Docker_운영_함정", "questions": [{"id": "q1", "type": "choice", "section": "함정 1 — UFW로 포트를 막아도 Docker가 `-p host:port`로 발행한 포트는 안 막힘", "situation": "Postgres 컨테이너를 -p 5432:5432로 띄웠다. sudo ufw delete allow 5432로 규칙을 지웠는데 외부에서 여전히 접속된다. 원인과 해결로 맞는 것은?", "options": ["UFW를 reload하지 않아서다 — sudo ufw reload로 해결된다", "Docker가 FORWARD/DOCKER 체인에 자기 규칙을 넣고 UFW는 INPUT 체인만 다룬다 — 컨테이너를 -p 127.0.0.1:5432:5432로 재생성한다", "ufw deny 5432 규칙을 추가로 넣으면 막힌다", "컨테이너를 재시작하면 UFW 규칙이 적용된다"], "answer": 1, "explain": "포워딩된 트래픽은 FORWARD 체인을 타서 UFW 규칙이 아예 적용되지 않는다. 설정 실수가 아니라 구조 문제라, 호스트 바인딩을 로컬로 제한하는 것이 해결이다. 볼륨을 그대로 쓰면 재생성해도 데이터는 남는다."}, {"id": "q2", "type": "spot", "section": "함정 1 — UFW로 포트를 막아도 Docker가 `-p host:port`로 발행한 포트는 안 막힘", "situation": "같은 볼륨을 유지한 채 컨테이너를 로컬 전용으로 재생성하려는 명령이다. 의도와 다르게 여전히 외부에 열리게 만드는 줄을 고르세요.", "code": "docker rm -f pg\ndocker run -d --name pg \\\n  -p 5432:5432 \\\n  -v pgdata:/var/lib/postgresql/data \\\n  postgres:16", "answer_lines": [3], "explain": "호스트 주소를 생략하면 모든 인터페이스에 바인딩된다. -p 127.0.0.1:5432:5432로 써야 외부에서 물리적으로 접근할 수 없다. 원격 접속이 필요하면 SSH 역터널로 우회한다."}, {"id": "q3", "type": "choice", "section": "함정 1 — UFW로 포트를 막아도 Docker가 `-p host:port`로 발행한 포트는 안 막힘", "situation": "같은 서버에 --network host로 띄운 컨테이너도 있다. 이 컨테이너에 대한 UFW 규칙은?", "options": ["-p 컨테이너와 똑같이 UFW가 적용되지 않는다", "일반 프로세스처럼 INPUT 체인을 타므로 UFW 규칙이 그대로 적용된다", "host 모드 컨테이너는 외부에서 아예 접근할 수 없다", "DOCKER 체인을 직접 수정해야만 막힌다"], "answer": 1, "explain": "UFW 우회는 포트 발행(-p) 방식에만 해당한다. 방화벽이 정상 작동하는지는 컨테이너의 네트워크 모드에 따라 다르므로 모드를 먼저 확인하고 판단한다."}, {"id": "q4", "type": "choice", "section": "함정 2 — `docker run -e PASSWORD='...'`에서 `!`가 든 비밀번호가 bash 히스토리 확장으로 깨짐", "situation": "대화형 bash 터미널에서 docker run -e POSTGRES_PASSWORD=...에 비밀번호를 직접 넣는다. 히스토리 확장 문제와 접속 URL 구분자 충돌을 함께 피하는 방법은?", "options": ["비밀번호를 큰따옴표로 감싼다", "비밀번호를 영숫자(hex 문자열 등)로만 정한다", "비밀번호 앞에 공백을 하나 넣는다", "같은 명령을 두 번 실행한다"], "answer": 1, "explain": "큰따옴표 안에서도 대화형 bash는 !를 히스토리 확장으로 해석한다. 영숫자만 쓰면 이 함정과 postgresql://user:pass@host/db의 #·@ 충돌을 함께 피한다. 그 밖에 set +H로 그 세션만 끄거나, 컨테이너 안 psql에서 ALTER USER로 재설정하는 방법이 있다."}]}, "LLM_JSON응답_간헐해석실패_JSON모드_내용없는_진단로그_패턴": {"rule_id": "LLM_JSON응답_간헐해석실패_JSON모드_내용없는_진단로그_패턴", "questions": [{"id": "q1", "type": "choice", "section": "흔한 원인(모양으로 가른다)", "situation": "LLM 응답 파싱이 가끔 실패한다. 진단 로그: 길이 1373, `{`로 시작 True, `}`로 끝 True, `JSONDecodeError: Expecting ',' delimiter`. 가장 유력한 원인은?", "options": ["코드 펜스(```json)로 감싸져서", "앞에 설명 문장이 붙어서", "문자열 안의 큰따옴표가 이스케이프되지 않아서", "길이 한도로 응답이 잘려서"], "answer": 2, "explain": "모양(시작·끝)은 멀쩡한데 디코드 오류가 나면 문자열 안 미이스케이프 큰따옴표나 끝 쉼표다. 한국어 결과는 인용(\"…라고 했다\")이 잦아 특히 흔하다. 펜스·머리말은 첫 `{`~마지막 `}` 잘라 읽기로 견디고, 잘림은 `}`로 끝나지 않는다."}, {"id": "q2", "type": "spot", "section": "해결", "situation": "파서 실패 지점의 진단 로그 코드다. 개인정보 원칙(원문을 남기지 않음)을 깨는 줄을 고르세요.", "code": "except json.JSONDecodeError as e:\n    log.warning(\n        \"json_error len=%d start_brace=%s end_brace=%s err=%s@%d doc=%s\",\n        len(raw), raw.lstrip().startswith(\"{\"), raw.rstrip().endswith(\"}\"),\n        e.msg, e.pos, e.doc[:200],\n    )", "answer_lines": [5], "explain": "`e.doc`은 응답 원문 그 자체다. 로그에는 길이·시작/끝 모양·오류 종류(`e.msg`)·위치(`e.pos`)만 남긴다. 원문 조각이 로그에 없는지 caplog로 시험을 고정해 둔다."}, {"id": "q3", "type": "choice", "section": "해결", "situation": "JSON 모드를 도입하려 한다. 공용 호출 함수 하나를 여러 기능(구조화 결과, 평문 해설, 검색 그라운딩 호출)이 같이 쓴다. 가장 맞는 도입 방법은?", "options": ["공용 함수의 기본값을 JSON 모드로 바꾼다", "선택 인자(json_mode=False)로 넣고, 실패가 확인된 호출부터 켠다. 검색 도구를 쓰는 호출에서는 끈다", "프롬프트에 'JSON으로만' 문구가 있으면 자동으로 JSON 모드를 켠다", "JSON 모드를 켜고 프롬프트의 JSON 지시와 파서는 지운다"], "answer": 1, "explain": "기본값을 바꾸면 평문 응답이 깨지고, Gemini는 검색 그라운딩과 JSON 모드를 같이 못 쓴다. 문구 감지는 호출마다 문구가 달라 깨지기 쉽다. 프롬프트 지시와 파서는 이중 안전으로 남긴다."}, {"id": "q4", "type": "scenario", "section": "함정", "situation": "호출부에 `json_mode=True`를 더했더니 시험 21개가 TypeError로 깨졌다. 그리고 예비 모델로 돌려 보니 9번 모두 잘 돼서 '해결됨'으로 닫으려 한다. 무엇을 고치고 어떻게 기록해야 하는지 쓰세요.", "rubric": ["monkeypatch로 끼운 가짜 함수가 새 인자를 못 받아서이며, 가짜는 처음부터 `**_kw`로 받게 써야 한다고 썼다", "예비 모델에서 된다고 실패한 모델에서 해결됐다는 증거가 아니라고 썼다", "실패 모델로 다시 확인하기 전까지는 '실모델 확인 대기'로 남긴다고 썼다"], "explain": "가짜 함수를 좁게 받으면 인자 하나 추가에 시험 수십 개가 깨진다. 모델마다 버릇이 달라서 확인은 실패가 난 모델로, 한도가 풀린 날 다시 해야 한다."}]}, "LLM_블라인드_서브에이전트_자기일관성_측정_패턴": {"rule_id": "LLM_블라인드_서브에이전트_자기일관성_측정_패턴", "questions": [{"id": "q1", "type": "choice", "section": "핵심 함정 — \"반복 호출\"의 대부분은 진짜 독립이 아니다", "situation": "같은 프롬프트에 대한 LLM 답의 안정성을 재려고 결과 5개를 받으려 한다. 서로 독립인 표본이 되는 방법은?", "options": ["같은 세션에서 '다시 만들어봐'를 다섯 번 요청한다", "fork 서브에이전트 5개를 띄운다", "컨텍스트를 공유하지 않는 새 서브에이전트 5개에 자기완결적인 같은 프롬프트만 준다", "같은 세션에서 온도만 올려 다섯 번 요청한다"], "answer": 2, "explain": "같은 세션은 방금 쓴 답을 대화 이력에서 보고 살짝 바꿔 베끼는 쪽으로 쏠리고, fork는 호출자의 전체 대화를 물려받아 독립이라는 전제부터 깨진다. 프롬프트에 '이전 시도는 없다'를 명시한 새 에이전트만 독립 표본이 된다."}, {"id": "q2", "type": "choice", "section": "측정한 값이 의미하는 것 — 정확도가 아니라 결정공간의 안정성", "situation": "독립 생성 5개가 전부 같은 답으로 수렴했다. 이 결과의 맞는 활용은?", "options": ["답이 맞다는 근거이므로 자동 승격 게이트로 쓴다", "정답 보증이 아니므로 참고용 배지나 검수 우선순위 정렬에만 쓴다", "수렴률이 낮은 항목을 자동 차단한다", "프롬프트가 완벽하다는 뜻이므로 더 고칠 필요가 없다"], "answer": 1, "explain": "일관성은 정답 여부가 아니라 '모델이 같은 편향을 재생산하는가'일 수 있다. 낮은 수렴률도 애매한 상황인지 프롬프트 노이즈인지 코드로는 구분할 수 없어, 실사용 결과와 대조한 불일치만 신뢰할 신호로 삼는다."}, {"id": "q3", "type": "choice", "section": "자동 점수화의 함정 — 임베딩 없이 키워드/자카드로 대체하면 값이 왜곡된다", "situation": "임베딩 API 키 없이 한국어 결과 25개를 단어 겹침(자카드)으로 클러스터링해 일관성 점수를 냈다. 이 점수는 어느 쪽으로 틀리기 쉬운가?", "options": ["의미가 같은 문장도 조사·어미 때문에 겹치는 단어가 적어 클러스터가 잘게 쪼개지고, 일관성이 실제보다 낮게 나온다", "표면 단어가 많이 겹쳐 일관성이 실제보다 높게 나온다", "한국어에서는 자카드가 임베딩과 같은 결과를 낸다", "클러스터 수와는 무관하게 점수가 무작위로 흔들린다"], "answer": 0, "explain": "실측에서 자카드가 0.3이라 낸 상황을 사람이 읽어 보니 5번 중 4번이 같은 전략이었다. 키가 없으면 사람이나 LLM이 직접 읽어 의미 단위로 묶되, 그 값이 주관적 추정임을 consistency_score_method 같은 출처 필드로 표시한다."}, {"id": "q4", "type": "scenario", "section": "비용 감", "situation": "팀원이 '모든 사용자 요청마다 블라인드 생성 5회를 돌려 일관성 점수를 같이 보여 주자'고 제안한다. 받아들일지와 대안을 쓰세요.", "rubric": ["호출 1회가 수만 토큰·수 초 이상이라 실사용 요청 경로에 넣기엔 비싸다고 짚었다", "콘텐츠 저작·큐레이션 시점에 한 번만 계산해 저장하고, 서비스 요청에서는 저장된 값을 재사용한다고 썼다", "한꺼번에 병렬로 띄우면 대기 시간은 한 호출의 지연 수준으로 끝난다고 썼다"], "explain": "측정은 1회성 저작 작업에 두고 결과값을 재사용하는 구조여야 비용이 감당된다. 상황 10개면 50회 호출이지만 병렬이면 수십 초다."}]}, "LLM_파이프라인_안정성_패턴": {"rule_id": "LLM_파이프라인_안정성_패턴", "questions": [{"id": "q1", "type": "choice", "section": "1. 원문은 LLM 호출과 무관하게 먼저, 별도로 저장한다", "situation": "사용자가 쓴 일기를 LLM으로 요약해 저장하는 기능을 만든다. 저장 순서로 맞는 것은?", "options": ["요약 결과만 저장한다 — 원문은 요약에 다 들어 있다", "원문을 LLM 호출 전에(또는 별개 트랜잭션으로) 먼저 커밋하고, 요약은 그 뒤에 따로 저장한다", "원문과 요약을 한 트랜잭션으로 묶어 LLM이 성공했을 때만 함께 커밋한다", "LLM이 실패했을 때만 원문을 저장한다"], "answer": 1, "explain": "원문을 LLM 성공에 묶으면 호출 실패 시 사용자 입력이 사라지고, 나중에 더 나은 모델로 재처리하려 해도 재입력을 요구해야 한다. 원문 저장은 LLM과 완전히 독립된 단계다."}, {"id": "q2", "type": "choice", "section": "3. 실패를 유형별로 나눠서 다르게 대응한다 — 하나로 뭉쳐 처리하지 않는다", "situation": "LLM 호출이 '쿼터 초과'로 실패했다. 이 유형에 맞는 반응은?", "options": ["지수 백오프로 N회 재시도한다", "재시도 없이 즉시 폴백 결과로 넘어간다", "같은 요청을 대체 모델 후보 목록으로 순회한다", "응답 원문을 로그에 남기고 같은 프롬프트로 다시 보낸다"], "answer": 1, "explain": "쿼터 초과는 재시도해 봐야 똑같이 실패한다. 재시도는 일시적 오류(네트워크·5xx)에, 모델 순회는 '모델 미지원'에, 원문 로그는 '파싱 실패'에 맞는 반응이다. 하나로 뭉치면 쓸데없는 재시도로 지연만 늘어난다."}, {"id": "q3", "type": "spot", "section": "9. 모델 폴백의 \"진행 위치\"를 클라이언트 인스턴스에 남기지 않는다", "situation": "여러 모델을 순서대로 시도하는 클라이언트를 배치 처리에서 재사용했더니, 첫 건에서 모든 모델이 과부하로 실패한 뒤로는 나머지 건이 에러 없이 전부 None이 됐다. 원인이 되는 줄을 고르세요.", "code": "class LlmClient:\n    def __init__(self, models):\n        self.models = models\n        self.start = 0\n\n    def generate(self, prompt):\n        for i in range(self.start, len(self.models)):\n            out = try_model(self.models[i], prompt)\n            if out is not None:\n                return out\n            self.start = i + 1\n        return None", "answer_lines": [11], "explain": "진행 위치를 인스턴스 필드에 써 두면 한 번 끝까지 소진된 뒤 start가 목록 끝에 머물러, 모델이 복구돼도 반복문이 한 번도 돌지 않는다. 진행 위치는 호출마다 0부터 시작하는 지역 변수로 두고, 비싼 모델 목록 조회만 따로 캐시한다."}, {"id": "q4", "type": "choice", "section": "10. 실패 분류(§3)의 상태 코드는 실제 응답으로 확인하고, 체감 경로 앞의 LLM엔 전체 시간 상한을 둔다", "situation": "'키 문제면 재시도하지 않는다'를 구현한다. Gemini REST가 잘못되거나 폐기된 키에 실제로 돌려주는 응답은?", "options": ["401 Unauthorized", "400 INVALID_ARGUMENT, 본문 사유 API_KEY_INVALID", "500 Internal Server Error", "429 Too Many Requests"], "answer": 1, "explain": "상식대로 401만 보고 중단하면 폐기된 키로 매 호출 재시도와 백오프를 다 쓴다(키 헤더가 아예 없을 때는 403). 테스트의 가짜 응답 상태 코드는 실제 API를 한 번 직접 불러 본 값으로 고정한다."}, {"id": "q5", "type": "choice", "section": "11. 임베딩 모델을 바꿀 때 — 차원이 같아도 벡터 공간은 다르다. 저장분에 모델 태그를 박고, 불일치는 키워드 폴백으로", "situation": "임베딩 모델이 종료돼 같은 768차원의 새 모델로 바꿨다. 코사인 함수는 len(a) != len(b)면 0을 돌려준다. 기존에 저장된 벡터와 새 벡터를 비교하면 어떻게 되나?", "options": ["길이 검사가 막아 주므로 0이 나오고 안전하다", "길이 검사를 통과해 서로 다른 벡터 공간의 값이 오류 없이 비교되고, 틀린 유사도가 나온다", "새 모델이 옛 벡터를 자동으로 변환해 정상 비교된다", "차원이 같으면 두 모델의 벡터 공간도 같다"], "answer": 1, "explain": "길이 검사는 차원이 다를 때만 막는다. 저장 시 '모델명@차원' 태그를 같이 저장하고, 비교 쪽에서 태그가 일치하는 후보만 벡터 신호로 쓰며 불일치는 키워드 폴백으로 보낸다."}, {"id": "q6", "type": "scenario", "section": "7. 이 원칙을 파이프라인 안 일부 진입점에만 적용하면, 다른 진입점(특히", "situation": "턴 판정 단계에는 이미 LLM 실패 폴백을 넣었다. 그런데 사용자는 'AI가 막힌 날엔 캐릭터 입장 자체가 안 된다'고 한다. 무엇을 어떤 순서로 점검할지 쓰세요.", "rubric": ["LLM 클라이언트 함수를 호출하는 모든 지점을 grep으로 한 번에 나열한다고 썼다", "각 지점이 실패 시 무엇을 반환하거나 던지는지 표로 정리한다고 썼다", "예외를 그대로 500으로 올리는 지점이 파이프라인의 첫 진입점인지 먼저 확인하고, 진입점부터 폴백을 넣는다고 썼다"], "explain": "일부 단계에만 폴백이 있으면 '전체에 적용돼 있다'고 착각하기 쉽다. 진입점이 막히면 뒤 단계의 폴백은 도달조차 못 해 기능 전체가 죽은 것처럼 보인다."}, {"id": "q7", "type": "choice", "section": "19. 429에는 두 종류가 있다 — 분당 과부하는 재시도, **하루 한도는 그 모델을 응답이 알려 준 시간만큼 막는다**", "situation": "무료 키로 임베딩을 많이 쓴 뒤 모든 호출이 429를 받는다. 이것이 분당 과부하가 아니라 하루 한도라는 것을 확인하는 방법은?", "options": ["65초씩 세 번 기다렸다가 다시 불러 본다", "429 응답 본문의 QuotaFailure quotaId에 PerDay가 들어 있는지, RetryInfo.retryDelay가 얼마인지 읽는다", "공식 문서의 무료 등급 한도표를 확인한다", "다른 모델로 바꿔 같은 요청을 보내 본다"], "answer": 1, "explain": "하루 한도는 몇 분 기다려도 안 풀리므로, 응답이 알려 준 대기 시간만큼 그 모델을 막고 HTTP 없이 건너뛰어야 매 요청이 실패 호출만큼 느려지지 않는다. 한도의 실제 값도 문서가 아니라 응답(quotaValue)으로 확인한다."}]}, "LLM_하루예산_단위당실측_절대상한_무료총량_패턴": {"rule_id": "LLM_하루예산_단위당실측_절대상한_무료총량_패턴", "questions": [{"id": "q1", "type": "choice", "section": "순서", "situation": "하루 예산 5,000원, 실측한 단위당 실비 20원. 연동 계정 300명 × 계정당 무료 1단위 × 여유 1.1 + 게스트 몫 30단위로 자동 총량을 계산했다. 오늘 모든 무료 사용의 합계 상한은 몇 단위인가?", "options": ["250단위", "330단위", "360단위", "5,000단위"], "answer": 0, "explain": "절대 상한 = 하루 예산 ÷ 단위당 실비 = 5,000 ÷ 20 = 250단위. 자동 총량(300×1×1.1+30=360)이 얼마로 나오든 min으로 상한을 넘지 못한다. 상한이 없으면 사용자 수만큼 비용이 따라 오른다."}, {"id": "q2", "type": "choice", "section": "순서", "situation": "같은 기능도 한 번 쓸 때 모델 호출이 재시도·병렬 때문에 1~14번으로 들쭉날쭉하다. 단위당 실비는 어떻게 구해야 하나?", "options": ["격리한 서버 복사본에서 실제 모델로 몇 번 돌리고, 공급자 콘솔의 사용량×단가로 총비용을 낸 뒤 소모된 과금 단위 수로 나눈다", "모델 단가표의 1회 호출 가격을 그대로 단위당 실비로 쓴다", "호출 1번당 평균 비용을 구해 단위당 실비로 쓴다", "무료 등급 키로 수백 번 돌려 평균을 낸다"], "answer": 0, "explain": "단위는 서버가 차감하는 과금 단위라서 호출 수가 아니라 '총비용 ÷ 소모된 단위'로 센다. 추정하지 않고 실측하며, 콘솔 집계는 지연·오차가 있어 한참 뒤에 읽는다. 무료 등급 키는 한도에 걸려 평균이 왜곡된다."}, {"id": "q3", "type": "spot", "section": "순서", "situation": "무료 총량을 계산하는 코드다. 비용 상한이 지켜지지 않는 줄을 고르세요.", "code": "DAILY_BUDGET_WON = 5000\nUNIT_COST_WON = 20\nHARD_CAP = DAILY_BUDGET_WON // UNIT_COST_WON\n\ndef free_pool_total(linked, per_account, guest_share):\n    auto = linked * per_account * 1.1 + guest_share\n    return auto", "answer_lines": [7], "explain": "자동 총량을 그대로 돌려주면 가입자가 늘수록 무료 사용 합계가 예산을 넘는다. `return min(auto, HARD_CAP)`처럼 절대 상한으로 눌러야 한다. 결제로 산 지갑 횟수는 이 총량 밖에서 따로 센다."}, {"id": "q4", "type": "scenario", "section": "함정", "situation": "무료 체험을 열기 전에 단위당 실비를 재려고 한다. 팀원이 '돈 아끼게 무료 등급 키로 실측하고, 월 지출 한도는 예전에 만든 프로젝트에 걸어 두었으니 됐다'고 한다. 무엇을 확인·반대해야 하는지 쓰세요.", "rubric": ["무료 등급은 요청 수·토큰 한도에 걸려 실측 평균이 왜곡된다고 짚었다", "무료 등급은 입력이 제품 개선에 쓰일 수 있어, 사용자 개인 문장이 들어가는 서비스는 유료 등급부터 연결해야 한다고 썼다", "월 한도를 건 프로젝트가 실제 키가 속한 프로젝트인지 확인해야 한다고 썼다"], "explain": "함정 세 가지가 모두 '설정해 뒀다고 믿었는데 실제로는 다른 곳에 걸려 있는' 종류다. 특히 한도 화면의 Project를 키가 속한 곳으로 바꿔 보지 않으면 한도가 아무 호출도 막지 못한다."}]}, "MCP_Tool_Prompt_선택_completion_활용_패턴": {"rule_id": "MCP_Tool_Prompt_선택_completion_활용_패턴", "questions": [{"id": "q1", "type": "choice", "section": "원인", "situation": "MCP 서버에 '사용자가 /이름으로 등록된 스니펫을 직접 골라 쓰고, 타이핑하면 후보가 뜨는' 기능을 만들려 한다. 써야 할 프리미티브는?", "options": ["Tool — 설명(description)을 자세히 쓰면 메뉴로 보인다", "Prompt — 클라이언트가 슬래시커맨드로 노출하고, 인자 자동완성(completion/complete)도 Prompt 전용이다", "Tool에 completion 핸들러를 붙인다", "Resource만 등록하면 슬래시커맨드가 생긴다"], "answer": 1, "explain": "Tool은 에이전트가 스스로 판단해 부르는 대상이라 사용자 메뉴로 보이지 않고 자동완성 메커니즘도 없다. '사용자가 직접 고르는가, 에이전트가 판단하는가'로 먼저 나누면 프리미티브가 정해진다."}, {"id": "q2", "type": "spot", "section": "부가 — 인자 없이도 호출되게: 파라미터 기본값으로 \"필수 아님\"을 스키마에 반영", "situation": "Claude Code CLI에서 인자 없이 /서버:snippet을 부르면 'Missing required argument'로 막힌다. 인자 없이도 '등록 목록 보기'로 동작하게 하려면 고칠 줄을 고르세요.", "code": "@server.prompt()\ndef snippet(name: str) -> str:\n    \"\"\"등록된 스니펫을 꺼낸다. \"0\"은 등록 목록.\"\"\"\n    if name == \"0\":\n        return list_snippets()\n    return load_snippet(name)", "answer_lines": [2], "explain": "SDK는 파이썬 파라미터에 기본값이 있는지로 스키마의 required를 정한다. name: str = \"0\"으로 바꾸면 required에서 빠져 무인자 호출이 통과하고, 기본값은 '인자 없이 부르면 기대하는 의미'(목록 보기)에 맞춘다."}, {"id": "q3", "type": "choice", "section": "중요한 단서(2026-09-08) — Claude Code CLI는 아직 completion/complete를 안 부른다", "situation": "서버에 completion() 핸들러를 스펙대로 구현했는데 CLI에서 인자를 칠 때 후보가 전혀 뜨지 않는다. 가장 맞는 판단은?", "options": ["서버 구현 버그이므로 핸들러를 다시 고친다", "CLI 클라이언트가 completion/complete 요청 자체를 보내지 않는다 — 서버를 고쳐서는 해결되지 않는다", "/mcp의 Reconnect를 누르면 새 코드가 반영돼 해결된다", "Tool로 바꾸면 자동완성이 뜬다"], "answer": 1, "explain": "스펙 기능이 서버에 있어도 클라이언트가 부르는지는 별개다(관련 이슈는 not planned로 종료). Reconnect는 이미 뜬 로컬 stdio 프로세스에 다시 붙을 뿐이라 코드 변경을 반영하려면 세션을 재시작해야 한다."}, {"id": "q4", "type": "choice", "section": "부가 — 무인 트리거의 비용을 2단계로 분리하기", "situation": "스케줄러가 60분마다 '무거운 LLM 세션을 열지' 결정한다. 사람이 응답하지 않을 때의 비용을 줄이는 구조는?", "options": ["매 주기 세션을 바로 열고, 응답이 없으면 닫는다", "먼저 저비용 알림(OS 토스트)만 띄우고, 사람이 정해진 시간 안에 응답한 주기에만 세션을 연다", "세션을 상시 띄워 두고 주기마다 질문만 보낸다", "스케줄러를 없애고 사람이 기억해서 연다"], "answer": 1, "explain": "저비용 게이트 뒤에 무거운 실행을 숨긴다. win11toast의 toast()는 블로킹이고 자체 타임아웃이 없어, 별도 스레드에서 돌리고 thread.join(timeout=N)으로 기다리는 식으로 감싸야 '응답 없으면 포기'가 된다."}]}, "PowerShell_5_1_조용히_틀리는_함정_모음": {"rule_id": "PowerShell_5_1_조용히_틀리는_함정_모음", "questions": [{"id": "q1", "type": "choice", "section": "함정 1 — 함수가 1요소 배열을 반환하면 스칼라로 풀려서 `(함수)[0]`이 \"첫 글자\"가 된다", "situation": "function L($f) { @(Get-Content $f) } 를 만들고 (L 'pw.txt')[0]으로 첫 줄을 읽는다. 여러 줄 파일에서는 맞는데 한 줄짜리 파일에서만 값이 한 글자로 잘린다. 고치는 방법은?", "options": ["Get-Content에 -Raw를 붙인다", "반환형을 [string[]]로 고정하거나 호출부에서 @(L $f)로 감싼다", "함수 안의 @()를 한 번 더 감싼다", "[0] 대신 .Substring(0)을 쓴다"], "answer": 1, "explain": "파이프라인 출력은 항상 열거되므로 함수 안 @()는 호출 결과를 보호하지 못한다. 한 줄짜리 입력을 일부러 테스트 데이터에 넣어야 잡힌다(실측: 비밀번호 3개가 한 글자로 저장됨)."}, {"id": "q2", "type": "spot", "section": "함정 3 — `\"…$변수한글…\"`에서 한글이 변수 이름의 일부가 된다", "situation": "오류 없이 실행되지만 출력에서 숫자가 사라지는 줄을 고르세요.", "code": "$count = $items.Count\n$fail = 0\nWrite-Host \"총 ${count}건 확인\"\nWrite-Host \"$count개 생성 완료\"\nWrite-Host \"실패: ${fail}건\"", "answer_lines": [4], "explain": "PowerShell은 한글도 식별자 문자로 봐서 $count가 아니라 없는 변수 $count개를 읽고 빈 문자열이 된다. 한글 조사·단위가 붙는 보간은 전부 ${count}로 쓰고, \\$[A-Za-z_][A-Za-z0-9_]*[가-힣] 패턴으로 점검한다."}, {"id": "q3", "type": "choice", "section": "함정 4 — `@( … )`는 splat이 아니다", "situation": "$line = 'git status -s'를 나눠 명령으로 실행하려 한다. 인자가 제대로 나뉘어 전달되는 것은?", "options": ["& git @($line -split ' ')", "$parts = $line -split ' '; & $parts[0] @($parts)", "$parts = @($line -split ' ' | Select-Object -Skip 1); & git @parts", "& git \"$($line -split ' ')\""], "answer": 2, "explain": "@( … ) 식은 배열 하나를 인자 하나로 넘긴다. splat(@이름)은 변수에만 쓴다. 문자열 변수를 splat하면 글자 단위로 풀리므로, 단일 요소여도 @()로 감싼 배열 변수여야 한다."}, {"id": "q4", "type": "choice", "section": "함정 10 — `git commit -F -`에 here-string을 파이프하면 메시지가 \"파일 경로\"로 읽힌다 (RVS_App 2026-11-16)", "situation": "PowerShell 5.1에서 여러 줄 커밋 메시지를 안전하게 남기는 방법은?", "options": ["@'…'@ | git commit -F -", "git commit -q -F - @'…'@", "메시지를 BOM 없는 UTF-8 파일로 쓰고 git commit -F 파일, 직후 git log --oneline -1과 git status --short로 확인", "메시지를 Set-Content 기본 인코딩으로 파일에 쓰고 -F로 넘긴다"], "answer": 2, "explain": "here-string을 stdin이 아니라 인자로 넘겨 pathspec 오류가 나고, 커밋은 안 된 채 스테이징만 남아 다음 커밋에 섞일 수 있다. Set-Content 기본값은 시스템 코드페이지라 한글이 깨진다."}, {"id": "q5", "type": "scenario", "section": "작성 직후 습관 (스크립트 하나 만들 때마다)", "situation": "새 PowerShell 5.1 스크립트를 방금 만들었다. 실행하기 전과 처음 실행할 때 할 일을 쓰세요.", "rubric": ["UTF-8 BOM으로 저장됐는지 확인한다고 썼다", "Parser.ParseFile로 정적 구문 검사를 먼저 돌린다고 썼다", "한 줄짜리·빈 파일·요소 1개 배열 같은 경계 입력으로 한 번 돌려 본다고 썼다", "가짜 데이터·임시 폴더에서 실행하고, 비밀 값 대신 길이·일치 여부만 출력한다고 썼다"], "explain": "이 함정들은 에러 없이 틀린 결과를 내므로, 작성 직후 습관으로 미리 걸러야 한다."}]}, "Python_stdlib_이름충돌_함정": {"rule_id": "Python_stdlib_이름충돌_함정", "questions": [{"id": "q1", "type": "choice", "section": "함정", "situation": "프로젝트 루트에서 `python server/main.py`로 실행하면 enum·functools 초기화 단계에서 이상한 크래시가 나는데, pytest로는 재현되지 않는다. 최근 `server/types.py`를 추가했다. 가장 유력한 원인은?", "options": ["types.py 안에 문법 오류가 있어서", "stdlib의 types 대신 프로젝트의 types.py가 먼저 잡혀 인터프리터 초기화가 깨져서", "pytest가 다른 Python 버전을 써서", "enum 모듈이 손상돼서"], "answer": 1, "explain": "sys.path 앞쪽에 프로젝트 디렉터리가 오는 실행 경로에서 내부 stdlib의 `from types import ...`가 프로젝트 파일로 잘못 연결된다. 실행 위치에 따라 재현 여부가 갈려 '내 컴퓨터에선 되는데'가 된다."}, {"id": "q2", "type": "choice", "section": "함정", "situation": "새 파일 이름으로 이 함정을 부를 위험이 있는 것은?", "options": ["server/schemas.py", "server/queue.py", "server/routes.py", "server/models.py"], "answer": 1, "explain": "queue는 stdlib 모듈 이름이다. types·io·email·calendar·token 등도 같다. 파일을 새로 만들 때 stdlib 이름과 겹치는지 한 번 확인하는 것이 가장 싸다."}, {"id": "q3", "type": "spot", "section": "해법", "situation": "이미 types.py를 여러 곳에서 import해서 이름을 못 바꾸고, 우회 코드를 넣었다. 이 우회가 진짜 stdlib을 가져오지 못하게 만드는 줄을 고르세요.", "code": "import sys\n_saved = sys.path[0]\nsys.path.insert(0, _saved)\nimport types as _real_types\nsys.path.insert(0, _saved)", "answer_lines": [3], "explain": "프로젝트 경로를 잠깐 빼야(`sys.path.pop(0)`) stdlib의 types가 잡힌다. 다시 넣으면 그대로 프로젝트 파일이 잡힌다. 이 우회는 증상만 피하는 것이라, 가능하면 파일 이름을 바꾸는 쪽을 우선한다."}]}, "Qt_외부스레드_UI스레드_릴레이_패턴": {"rule_id": "Qt_외부스레드_UI스레드_릴레이_패턴", "questions": [{"id": "q1", "type": "spot", "section": "함정", "situation": "pystray 트레이 메뉴를 누르면 런처 창을 띄운다. 가끔만 크래시하는 원인이 되는 줄을 모두 고르세요.", "code": "relay = TrayRelay()\nrelay.show_launcher.connect(show_launcher_widget)\n\ndef on_tray_click(icon, item):    # pystray 스레드에서 호출됨\n    win = LauncherWidget()\n    win.show()", "answer_lines": [5, 6], "explain": "외부 라이브러리 스레드에서 위젯을 직접 만들고 조작하면 Qt 스레드 원칙을 어긴다. 콜백은 relay.show_launcher.emit()만 하고, 위젯 생성은 GUI 스레드에서 도는 슬롯(show_launcher_widget)에 둔다."}, {"id": "q2", "type": "choice", "section": "해법 — 콜백은 신호만 emit, 위젯 생성/조작은 슬롯에서", "situation": "외부 스레드에서 emit한 신호의 슬롯이 GUI 스레드에서 안전하게 실행되는 이유는?", "options": ["Qt가 emit한 스레드를 잠시 멈추고 GUI 스레드로 바꾸기 때문", "스레드 간 연결은 기본적으로 QueuedConnection이라 슬롯 실행이 GUI 스레드 이벤트 루프에 큐잉되기 때문", "Signal 객체가 자체 락을 갖기 때문", "daemon 스레드는 Qt가 자동으로 GUI 스레드로 취급하기 때문"], "answer": 1, "explain": "이 성질 덕분에 위젯 코드를 전부 슬롯에만 두면 스레드 위반이 구조적으로 불가능해진다."}, {"id": "q3", "type": "choice", "section": "부수 설정 — 트레이 모드면 창 닫기 ≠ 앱 종료", "situation": "트레이 상주 앱에서 메인 창을 닫았더니 트레이 아이콘까지 함께 사라지고 앱이 종료됐다. 원인은?", "options": ["pystray 스레드를 daemon으로 띄워서", "QApplication의 quitOnLastWindowClosed 기본값이 True라 마지막 창이 닫히면 앱이 끝나서 — setQuitOnLastWindowClosed(False)를 명시한다", "relay 객체가 가비지 컬렉션돼서", "트레이 아이콘을 GUI 스레드에서 만들지 않아서"], "answer": 1, "explain": "트레이 앱은 창을 닫아도 계속 떠 있어야 하는 경우가 많아 기본값을 명시적으로 꺼야 한다."}, {"id": "q4", "type": "choice", "section": "이미 있는 \"QThread 워커\" 패턴과의 차이", "situation": "이 릴레이 패턴과 'QThread 워커' 패턴의 차이로 맞는 것은?", "options": ["릴레이는 GUI 스레드에서 위젯을 만들지 않아도 된다", "QThread 워커는 Qt가 스레드를 직접 만들고, 릴레이는 외부 라이브러리가 이미 가진 스레드가 Qt 쪽으로 들어오는 경우다", "QThread 워커는 신호를 쓰지 않는다", "둘은 같은 패턴의 다른 이름이다"], "answer": 1, "explain": "둘 다 '위젯 조작은 GUI 스레드에서만'을 지키지만, 스레드를 누가 만들었는지가 다르다."}]}, "Riverpod_autoDispose_initState_read_로드_즉시폐기_함정": {"rule_id": "Riverpod_autoDispose_initState_read_로드_즉시폐기_함정", "questions": [{"id": "q1", "type": "choice", "section": "원인", "situation": "TabBarView의 두 번째 탭이 무한 로딩이다. 서버 응답·파싱은 단독으로 정상이고 오류 로그도 없다. 부모 화면 initState의 postFrame에서 `ref.read(statsProvider.notifier).load()`를 부르고, statsProvider는 `StateNotifierProvider.autoDispose`다. 원인은?", "options": ["load()가 await되지 않아서", "read는 구독이 아니어서 읽은 직후 리스너가 0개가 되고, autoDispose가 notifier를 버린 뒤 load()가 버려진 notifier에 값을 써서", "TabBarView가 두 번째 탭을 너무 늦게 만들어서", "서버 응답이 느려서"], "answer": 1, "explain": "그 시점에 statsProvider를 watch하는 위젯이 없었다(TabBarView는 보이는 탭만 만든다). 나중에 탭을 열면 watch가 새 notifier를 만들어 초기값(null) — 로딩이 영원히 계속된다."}, {"id": "q2", "type": "spot", "section": "해결", "situation": "부모 화면 코드다. 이 provider를 살려 두는 장치가 빠져서 로드 결과가 버려지는 원인이 되는 줄을 고르세요.", "code": "@override\nvoid initState() {\n  super.initState();\n  WidgetsBinding.instance.addPostFrameCallback((_) {\n    ref.read(statsProvider.notifier).load();\n  });\n}", "answer_lines": [5], "explain": "로드를 거는 화면이 그 provider를 `ref.watch(statsProvider)`로 붙잡거나, 데이터를 쓰는 탭 자신이 load하게 해야 한다. watch가 곧 로드인 `FutureProvider.autoDispose`로 바꾸는 것도 방법이다. autoDispose를 빼는 건 마지막 수단이다."}, {"id": "q3", "type": "choice", "section": "해결", "situation": "이 문제를 고치는 방법 중 '마지막 수단'으로 미뤄야 하는 것은?", "options": ["로드를 거는 화면에서 그 provider를 ref.watch로 붙잡는다", "데이터를 쓰는 탭 위젯 자신이 initState에서 load한다", "FutureProvider.autoDispose처럼 watch가 곧 로드인 형태로 바꾼다", "provider에서 autoDispose를 뺀다"], "answer": 3, "explain": "autoDispose를 빼면 증상은 사라지지만 화면을 닫아도 상태가 메모리에 남는다. 구독 구조를 바로잡는 쪽이 원인을 고치는 방법이다."}, {"id": "q4", "type": "scenario", "section": "점검 grep", "situation": "같은 함정이 코드베이스 다른 곳에도 있는지 한 번에 찾고 싶다. 검색 방법과 판정 기준을 쓰세요.", "rubric": ["`ref.read(`로 `.load(`를 부르는 곳을 찾는다고 썼다", "그중 대상 provider가 `.autoDispose`인 것만 추린다고 썼다", "같은 화면에 그 provider의 `ref.watch`가 있는지 확인한다고 썼다"], "explain": "증상이 '조용한 무한 로딩'이라 로그로는 안 잡힌다. 세 조건(read로 load, autoDispose, watch 없음)이 겹치는 곳이 위험 지점이다."}]}, "Windows_DPAPI_로컬_비밀저장소_마스터비번_엔트로피_복원경로_패턴": {"rule_id": "Windows_DPAPI_로컬_비밀저장소_마스터비번_엔트로피_복원경로_패턴", "questions": [{"id": "q1", "type": "choice", "section": "1. DPAPI 단독의 한계 두 가지", "situation": "평문 비밀번호 txt를 ConvertFrom-SecureString(키 없이, DPAPI)으로 암호화해 바꿨다. 이 방식이 막지 못하는 것은?", "options": ["디스크 파일만 복사해 다른 PC로 가져간 사람", "로그인된 채 방치된 PC에서 같은 Windows 계정으로 실행한 다른 프로세스", "백업 USB를 주운 사람", "다른 Windows 계정의 사용자"], "answer": 1, "explain": "DPAPI 단독은 '현재 사용자' 키로만 묶여, 같은 계정의 모든 프로세스가 비밀번호 없이 풀 수 있다. 또 계정·PC에 묶여 재설치나 이전 시 영영 안 열린다. 이 두 한계를 마스터 비밀번호 파생 엔트로피와 평문 복원 경로로 메운다."}, {"id": "q2", "type": "spot", "section": "2. 해결 구조 — 마스터 비밀번호에서 만든 키를 DPAPI의 추가 엔트로피로", "situation": "마스터 비밀번호에서 만든 $key를 받아 값을 암호화하는 함수다. 마스터 비밀번호 없이도 같은 계정이면 풀리게 만드는 줄을 고르세요.", "code": "function Enc([string]$s, [byte[]]$key) {\n    [Convert]::ToBase64String([Security.Cryptography.ProtectedData]::Protect(\n        [Text.Encoding]::UTF8.GetBytes($s), $null, 'CurrentUser'))\n}", "answer_lines": [3], "explain": "Protect의 두 번째 인자(optionalEntropy)에 $key 대신 $null을 넘겨, 받은 키가 전혀 쓰이지 않는다. 엔트로피 없이 만든 값은 DPAPI만으로 풀리므로, '마스터 없이 DPAPI만으로 푸는 시도가 실패하는가'를 테스트에 넣어야 이런 실수를 잡는다."}, {"id": "q3", "type": "choice", "section": "3. 해제된 키의 수명 — 터미널 세션에 남기지 않는다", "situation": "허브 스크립트가 해제한 키를 $global:VaultEntropy에 담아 하위 스크립트에 넘긴다. PowerShell 창에서 직접 실행하고 끝낸 뒤 같은 창에서 다시 실행하면 비밀번호를 묻지 않는다. 고치는 방법은?", "options": ["키를 $script: 범위로 옮긴다", "허브 본문을 try로 감싸고 finally에서 $global:VaultEntropy = $null로 폐기한다", "실행할 때마다 창을 새로 열라고 안내한다", "키를 파일에 임시 저장했다가 지운다"], "answer": 1, "explain": "직접 실행하면 종료 후에도 터미널 세션에 전역 변수가 남는다. .cmd 래퍼로 새 powershell.exe를 띄우는 경로는 자동 소멸하므로, 두 경로를 모두 '두 번째 실행이 비번을 다시 묻는가'로 테스트한다."}, {"id": "q4", "type": "scenario", "section": "4. 형식 이전 · 비번 변경은 \"전부 검증한 뒤에만 쓰기\"", "situation": "마스터 비밀번호 변경 기능을 만든다. 중간에 실패해도 저장소를 잃지 않는 절차를 쓰세요.", "rubric": ["메모리에서 전 항목 복호화 → 새 키로 재암호화 → 각 항목을 다시 복호화해 원문과 같은지 확인한다고 썼다", "하나라도 틀리면 파일에 아무것도 쓰지 않고 중단한다고 썼다", "통과하면 .tmp 파일에 먼저 쓰고 Move-Item -Force로 교체한다고 썼다", "옛 형식 파일(.bak)을 남기지 않는다 — 남기면 마스터 없이 풀린다고 썼다"], "explain": "형식 이전과 비번 변경은 같은 규칙이다. 전부 검증한 뒤에만 쓰고, 교체는 tmp를 거쳐 중간 실패 시 기존 파일이 유지되게 한다."}, {"id": "q5", "type": "choice", "section": "6. 테스트 함정", "situation": "'\"비번\" | powershell -File vault.ps1'로 잠금 해제를 자동 테스트했더니 끝나지 않고 멈춘다. 원인과 맞는 대응은?", "options": ["파이프 인코딩 문제다 — -Encoding utf8을 붙인다", "Read-Host -AsSecureString은 파이프를 읽지 않고 실제 콘솔을 기다린다 — 격리 복사본에서 입력 함수 한 줄만 치환해 돌린다", "프로덕션 코드에 '환경변수가 있으면 그 값을 비번으로 쓰는' 테스트 훅을 넣는다", "타임아웃을 늘린다"], "answer": 1, "explain": "일반 Read-Host는 파이프 입력을 먹지만 -AsSecureString은 콘솔을 기다린다. 프로덕션에 테스트 훅을 넣으면 그 자체가 우회 경로가 되므로, 복사본에서만 치환한다."}]}, "Windows_배치파일_한글_유니코드_인코딩_함정": {"rule_id": "Windows_배치파일_한글_유니코드_인코딩_함정", "questions": [{"id": "q1", "type": "spot", "section": "함정 1 — cmd.exe 배치 파서가 파일 앞쪽 줄 개수에 따라 뒤 줄의 멀티바이트 텍스트를 깨뜨림", "situation": "UTF-8로 저장한 .cmd 파일이다(콘솔 코드페이지 65001). 실행하면 엉뚱한 명령 실행 시도와 '경로를 찾을 수 없습니다'가 난다. 원인이 되는 줄을 모두 고르세요.", "code": "@echo off\nREM 저장소 루트로 이동 && 세션 열기\ncd /d C:\\작업\\한글_폴더\nclaude", "answer_lines": [2, 3], "explain": "REM 줄 안의 &&는 무해화되지 않아 뒤 텍스트가 명령으로 실행된다. 또 한글 줄 앞에 다른 줄이 하나라도 있으면 cmd 파서가 그 한글을 깨뜨린다. .cmd는 ASCII 위임자로만 두고 한글 경로는 BOM 있는 .ps1에서 Start-Process -WorkingDirectory로 넘긴다."}, {"id": "q2", "type": "choice", "section": "함정 2 — Windows PowerShell 5.1이 BOM 없는 UTF-8 `.ps1`을 시스템 코드페이지로 오독", "situation": "도구로 만든 .ps1이 실행하자마자 \"Unexpected token '?덉씪?…'\" 파싱 오류를 낸다. 같은 작업의 다른 스크립트는 멀쩡하다. 먼저 확인할 것은?", "options": ["PowerShell 실행 정책", "파일 첫 3바이트가 EF BB BF(UTF-8 BOM)인지", "스크립트의 줄바꿈이 CRLF인지", "PowerShell 버전이 7인지"], "answer": 1, "explain": "BOM 없는 UTF-8을 5.1이 949로 읽으면 깨진 한글 바이트 안에 따옴표 역할 문자가 섞여 문자열 경계가 어긋난다. 증상이 ?가 아니라 구문 오류로 나올 수 있다."}, {"id": "q3", "type": "choice", "section": "함정 5 — CSV를 그냥 UTF-8로 저장하면 Excel이 한글을 깨뜨림(BOM 필요)", "situation": "사람이 Excel로 열어 볼 수 있는 CSV 내보내기를 Python으로 만든다. 맞는 인코딩은?", "options": ["utf-8", "utf-8-sig", "cp949", "utf-16-le"], "answer": 1, "explain": "utf-8-sig는 맨 앞에 BOM을 붙여 Excel이 UTF-8로 인식하게 한다. 다른 프로그램만 읽는 파이프라인이면 문제없을 수 있지만, Excel로 열 가능성이 있으면 기본값으로 둔다. csv.writer는 newline=''도 함께 준다."}, {"id": "q4", "type": "choice", "section": "함정 6 — Git Bash(MSYS2) curl→python 파이프가 멀쩡한 서버 응답을 깨뜨려 오탐을 유발", "situation": "Git Bash에서 curl … | python -c 'json.load(sys.stdin)'로 로컬 API의 한글 응답을 봤더니 \\udcXX로 깨져 보인다. 결론을 내리기 전에 할 일은?", "options": ["서버 인코딩 버그로 보고 응답 코드를 고친다", "관찰 채널을 바꿔 재현한다 — DB를 앱 없이 직접 열어 보거나, 같은 요청을 Python httpx로 다시 보낸다", "curl에 --compressed를 붙인다", "PYTHONIOENCODING만 바꾸고 같은 파이프로 다시 본다"], "answer": 1, "explain": "실측에서 서버와 DB는 멀쩡했고 curl→Git Bash 파이프→python 경로가 손상 원인이었다. 앱이 깨진 것과 관찰 도구가 깨진 것을 구분하려면 채널 하나만 바꿔 봐도 된다."}]}, "개발_서비스_폴더_분리_운영_패턴": {"rule_id": "개발_서비스_폴더_분리_운영_패턴", "questions": [{"id": "q1", "type": "choice", "section": "구조", "situation": "기존 프로젝트를 개발용과 서비스용으로 나눈다. 원본 폴더를 어느 쪽으로 두나?", "options": ["원본을 개발용으로 쓰고 서비스용을 새로 복사한다", "원본을 서비스용으로 두고, 새로 이름이 생기는 쪽(복사본)을 개발용으로 한다", "둘 다 새로 clone한다", "원본을 지우고 둘을 새로 만든다"], "answer": 1, "explain": "원본 경로에는 레지스트리·예약 작업·설정·venv·빌드 캐시가 묶여 있어, 이름을 바꾸거나 옮기면 전부 고쳐야 한다."}, {"id": "q2", "type": "choice", "section": "함정 (원 사례에서 실제로 겪은 것)", "situation": "개발 쪽에서 실수로라도 GitHub에 푸시되지 않게 하려 한다. 가장 단순하고 확실한 방법은?", "options": ["git worktree로 개발 작업 폴더를 만든다", "개발용을 별도 clone으로 만들고 개발 쪽 remote를 아예 제거한다", "pre-push 훅으로 개발 브랜치 푸시를 막는다", "GitHub에 dev 브랜치를 따로 둔다"], "answer": 1, "explain": "worktree는 같은 .git을 공유해 remote 설정도 같이 보인다. 훅은 git에 포함되지 않는 로컬 파일이라 clone마다 다시 만들어야 한다. remote를 지우면 'No configured push destination'으로 확실히 실패한다."}, {"id": "q3", "type": "choice", "section": "함정 (원 사례에서 실제로 겪은 것)", "situation": "PS 5.1 promote 스크립트에서 $ErrorActionPreference = \"Stop\" 아래 git remote get-url dev 2>$null로 remote 존재를 확인하다 스크립트가 중단된다. 맞는 수정은?", "options": ["2>$null을 2>&1로 바꾼다", "조회 대신 (git remote) 목록에 이름이 있는지 -notcontains로 확인한다", "$ErrorActionPreference를 지운다", "try/catch 없이 그대로 둔다"], "answer": 1, "explain": "PS 5.1은 네이티브 명령의 stderr를 오류 레코드로 바꿔 Stop 아래에서 중단한다. 이미 옮긴 커밋을 다시 cherry-pick하면 빈 커밋 상태로 멈추는데, 이때는 --skip으로 건너뛴다."}, {"id": "q4", "type": "choice", "section": "개발/서비스를 \"다르게 동작\"시키기 — 제약 모음 + git 밖 스위치 (2026-10-19 추가)", "situation": "개발 폴더는 하루 한도 같은 제약 없이 화면을 시험하고, 서비스용은 실제 제약을 건다. promote가 계속 충돌 없이 돌게 하는 설계는?", "options": ["개발 브랜치에서 제약 코드를 지운다", "제약을 rules/noop 한곳에 모으고, 어느 쪽을 쓸지는 .gitignore된 스위치 파일 하나로 폴더마다 다르게 둔다", "환경마다 다른 코드 갈래를 유지한다", "서비스 폴더에서만 제약 코드를 커밋한다"], "answer": 1, "explain": "두 폴더에 같은 것은 rules·noop·오케스트레이션·호출 한 줄이고, 다른 것은 git 밖 스위치 하나뿐이라 커밋 이동 대상이 아니다. 스위치가 없으면 제약이 걸린 쪽이 기본이다."}, {"id": "q5", "type": "scenario", "section": "검증 체크리스트", "situation": "개발/서비스 폴더 분리를 마쳤다. 제대로 됐는지 확인할 항목을 쓰세요.", "rubric": ["개발 폴더에서 git remote가 비어 있고 git push가 실패하는지 본다고 썼다", "서비스용 폴더에 GitHub과 push가 막힌 dev remote가 있는지 본다고 썼다", "두 폴더의 포트가 달라 두 서버를 동시에 띄워 둘 다 응답하는지 본다고 썼다", "더미 커밋을 promote로 옮겨 서비스용에 같은 변경이 생기는지 본다고 썼다"], "explain": "첫 푸시 전에는 올라갈 커밋 목록, 추가된 줄의 비밀값 패턴, .env·.db 미추적, 저장소 비공개 여부도 확인한다."}]}, "개발자콘솔_정적셸_세션토큰_로테이션_원문비포함_패턴": {"rule_id": "개발자콘솔_정적셸_세션토큰_로테이션_원문비포함_패턴", "questions": [{"id": "q1", "type": "choice", "section": "1. 구조 — 껍데기는 공개, 데이터는 잠금", "situation": "개발자 콘솔의 마스터 비밀 환경변수가 비어 있는 배포 환경이다. 콘솔 화면·로그인·데이터 라우트는 무엇을 돌려줘야 하나?", "options": ["401 Unauthorized", "404 Not Found", "200과 빈 화면", "500 설정 오류"], "answer": 1, "explain": "값을 넣기 전까지는 존재 자체를 알리지 않는다. 라우터는 항상 등록하고 라우트마다 '켜져 있는가' 의존성을 걸면 시험도 쉽다."}, {"id": "q2", "type": "choice", "section": "2. 토큰 — 마스터 비밀은 로그인에만, 세션 토큰은 수시로 바뀐다", "situation": "통과한 응답마다 X-Dev-Token-Next로 새 토큰을 주고 쓴 토큰을 즉시 죽였다. 콘솔 화면이 요청 두 개를 동시에 보내면 무슨 일이 생기나?", "options": ["두 요청 모두 성공한다", "늦게 도착한 요청이 이미 죽은 토큰을 써서 401을 맞는다", "서버가 두 토큰을 합친다", "마스터 비밀로 자동 재로그인된다"], "answer": 1, "explain": "쓴 토큰은 유예 시간(30초) 뒤에 죽게 해야 동시 요청이 깨지지 않는다. 동시에 유휴 만료(15분)와 절대 수명(8시간)을 함께 두고, 교체해도 로그인 시각은 물려받는다."}, {"id": "q3", "type": "spot", "section": "2. 토큰 — 마스터 비밀은 로그인에만, 세션 토큰은 수시로 바뀐다", "situation": "데이터 라우트의 인증 의존성이다. 토큰 교체(로테이션)를 무의미하게 만드는 줄을 고르세요.", "code": "def require_dev(x_dev_token: str = Header(\"\")):\n    if not console_enabled():\n        raise HTTPException(404)\n    if x_dev_token == MASTER_SECRET:\n        return \"master\"\n    if not sessions.valid(x_dev_token):\n        raise HTTPException(401)\n    return sessions.rotate(x_dev_token)", "answer_lines": [4], "explain": "마스터 비밀은 POST /login에서만 쓴다. 데이터 라우트가 마스터 비밀을 받아 주면 고정 토큰 하나로 영구히 통과할 수 있어 로테이션이 의미를 잃는다. 이 경로가 없음을 시험으로 고정한다."}, {"id": "q4", "type": "scenario", "section": "3. 응답에 사용자 원문을 넣지 않는다", "situation": "콘솔에 '최근 사건' 목록과 사용량 집계를 추가했다. 사용자 글이 콘솔 응답에 섞이지 않는다는 것을 어떻게 보장할지 쓰세요.", "rubric": ["집계 쿼리가 원문 컬럼(상황 문장·프로필·이메일)을 SELECT하지 않게 한다고 썼다", "최근 사건 기록 함수가 종류와 숫자 필드만 받게(문자열은 거름) 한다고 썼다", "특이한 문자열로 데이터를 만들고 모든 콘솔 응답을 합쳐 그 문자열이 없는지 assert하는 시험을 둔다고 썼다"], "explain": "운영자 도구라도 사용자 글을 볼 이유는 없다. 건수·비율·지연·분포만 낸다. 시험으로 고정해야 나중에 필드를 추가할 때도 지켜진다."}]}, "개인용_로컬도구_상용화전환_패턴": {"rule_id": "개인용_로컬도구_상용화전환_패턴", "questions": [{"id": "q1", "type": "choice", "section": "핵심 원칙", "situation": "1인 로컬 데스크톱 도구를 팀 배포로 전환한다. 이 전환이 근본적으로 깨는 전제는?", "options": ["코드가 잘 짜여 있다는 전제", "'제작자 = 유일한 사용자 = 유일한 신뢰 주체'라는 전제 — 아무도 이 파일을 안 보고, 안 고친다", "로컬 파일 시스템이 빠르다는 전제", "인터넷 연결이 없다는 전제"], "answer": 1, "explain": "어느 전제가 깨지는지에 따라 손볼 지점이 갈린다. 처음 걸리는 두 구멍은 코드 리뷰로는 안 잡히고 git·파일 감사로만 잡힌다."}, {"id": "q2", "type": "choice", "section": "체크리스트 (7가지 — 실제로 걸리는 지점)", "situation": "앱이 실행 중 채워 나가는 config.json·usage_history.json에 실제 사용자명과 절대 경로가 담긴 채 커밋돼 있었다. 원격은 아직 없다. 맞는 조치는?", "options": [".gitignore에 추가하면 끝난다", "git rm --cached + .gitignore로 지금부터 막고, 첫 공개 push 전에 과거 커밋까지 이력 정리를 필수 항목으로 남긴다", "파일 내용을 지우고 다시 커밋한다", "원격이 없으니 아무것도 안 해도 된다"], "answer": 1, "explain": ".gitignore는 '지금부터'만 막고 과거 커밋 속 내용은 그대로다. 최초 커밋 때는 그 파일이 비어 있어 아무도 ignore에 넣지 않았다가 실사용 뒤에야 드러난다."}, {"id": "q3", "type": "choice", "section": "체크리스트 (7가지 — 실제로 걸리는 지점)", "situation": "명령어별 허용/확인/차단 규칙이 평문 execution_policy.json에 있다. '팀원이 몰래 정책을 못 바꾼다'를 판매 근거로 삼으려면 서버 없이 할 수 있는 조치는?", "options": ["파일을 숨김 속성으로 바꾼다", "관리자 개인키로 정책에 서명하고 앱은 공개키로 검증한다(비대칭키 서명)", "파일 이름을 바꾼다", "JSON 대신 YAML로 저장한다"], "answer": 1, "explain": "개인용일 땐 평문 편집이 편의지만 팀 배포에서는 그대로 취약점이다. 실측에서는 Ed25519 서명 검증과 관리자 전용 서명 CLI를 만들었다."}, {"id": "q4", "type": "scenario", "section": "관련 문서와 구분", "situation": "'개인 경로가 git 이력에 남은 문제'와 'API 키가 빌드 산출물(APK)에 번들된 문제'는 어떻게 다른지 쓰세요.", "rubric": ["하나는 git 커밋 이력, 하나는 빌드 결과물에 노출된다고 구분했다", "발견 경로가 git log/status 감사 vs 산출물 리버싱으로 다르다고 썼다", "조치가 .gitignore + 이력 정리 vs 빌드 설정 전환으로 다르다고 썼다"], "explain": "또 '처음부터 안 새게 짜는 법'(환경변수 우선+폴백)과 '이미 실사용 중인 도구에서 사후에 무엇을 감사할지'도 다른 문제다."}]}, "게이트_실패시_열림_패턴": {"rule_id": "게이트_실패시_열림_패턴", "questions": [{"id": "q1", "type": "choice", "section": "언제 반대로(fail-closed) 가야 하는가", "situation": "무료 사용자의 하루 AI 호출을 50회로 제한하는 게이트가 있다. 호출 횟수를 읽는 DB가 30초 동안 응답하지 않았다. 이 30초 동안 들어온 요청은 어떻게 처리해야 하는가?", "options": ["막는다 — 확인하지 못했으니 안전하게 거절한다", "통과시킨다 — 남용 방지용 한도라 정상 사용자를 막는 비용이 더 크다", "DB가 돌아올 때까지 요청을 대기열에 쌓아 둔다", "사용자에게 다시 시도하라고 안내하고 거절한다"], "answer": 1, "explain": "남용 방지용 소프트 리밋은 '정상 요청을 잘못 막는 비용'이 '어쩌다 한도를 조금 넘는 비용'보다 크다. 그래서 게이트 자신의 인프라 장애는 열림(fail-open)으로 넘어진다."}, {"id": "q2", "type": "spot", "section": "언제 반대로(fail-closed) 가야 하는가", "situation": "앱이 사용자 대신 다른 서비스에 메시지를 보낸다. 하루 20건 한도 게이트다. 이 코드에서 원칙을 어긴 줄은?", "code": "def can_send(user_id):\n    try:\n        sent_today = read_sent_count(user_id)\n    except StorageError:\n        sent_today = 0\n    return sent_today < DAILY_LIMIT", "answer_lines": [5], "explain": "메시지 전송은 되돌릴 수 없고, 잘못 보내면 상대 서비스의 스팸 판정이나 계정 정지로 이어진다. 읽기 실패를 '0건'으로 취급하면 한도를 확인하지 못한 채 보내게 된다. 되돌릴 수 없는 행동의 게이트는 fail-closed다. 읽기 실패 시 전송을 막고, 원인을 로그에 남기고, 사용자에게 안전을 위해 보내지 않았다고 알린다."}, {"id": "q3", "type": "scenario", "section": "언제 반대로(fail-closed) 가야 하는가", "situation": "유료 구독자만 쓸 수 있는 기능이 있다. 구독 여부를 확인하는 결제 서버 조회가 실패했다. 통과시킬지 막을지 정하고, 그 판단 기준을 한두 문장으로 설명하라.", "rubric": ["막는다(fail-closed)고 답
